<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">锁的作用范围</title><desc id="desc">错误做法在持有 Mutex 期间 await 网络发送，其他连接只能等待；mini-redis 的做法是加锁、找到值、克隆 Bytes 句柄后立即解锁，再在锁外 await 网络发送。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="440" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">锁只覆盖内存操作，网络等待放在锁外</text><text x="40" y="120" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="start">不合适的顺序</text><rect x="230" y="90" width="80" height="46" rx="6" fill="#fde68a" stroke="#cbd5e1"/><text x="270.0" y="119" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">加锁</text><rect x="310" y="90" width="90" height="46" rx="6" fill="#fde68a" stroke="#cbd5e1"/><text x="355.0" y="119" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">找到值</text><rect x="400" y="90" width="330" height="46" rx="6" fill="#fde68a" stroke="#cbd5e1"/><text x="565.0" y="119" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">await 网络发送 ……</text><rect x="730" y="90" width="80" height="46" rx="6" fill="#fde68a" stroke="#cbd5e1"/><text x="770.0" y="119" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">解锁</text><path d="M230 150 H810" stroke="#b91c1c" stroke-width="3" fill="none"/><text x="520" y="176" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="middle">整段都持锁：其他连接的 GET/SET 只能排队，慢客户端拖住所有人</text><text x="40" y="255" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">本地实际顺序</text><rect x="230" y="225" width="80" height="46" rx="6" fill="#fde68a" stroke="#cbd5e1"/><text x="270.0" y="254" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">加锁</text><rect x="310" y="225" width="90" height="46" rx="6" fill="#fde68a" stroke="#cbd5e1"/><text x="355.0" y="254" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">找到值</text><rect x="400" y="225" width="140" height="46" rx="6" fill="#fde68a" stroke="#cbd5e1"/><text x="470.0" y="254" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">克隆 Bytes 句柄</text><rect x="540" y="225" width="80" height="46" rx="6" fill="#fde68a" stroke="#cbd5e1"/><text x="580.0" y="254" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">解锁</text><rect x="620" y="225" width="280" height="46" rx="6" fill="#bfdbfe" stroke="#cbd5e1"/><text x="760.0" y="254" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">await 网络发送 ……</text><path d="M230 285 H620" stroke="#0f766e" stroke-width="3" fill="none"/><text x="425" y="311" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="middle">持锁时间很短</text><text x="760" y="311" font-size="15" fill="#2563eb" font-weight="normal" text-anchor="middle">等待网络时不占锁</text><rect x="230" y="350" width="22" height="16" fill="#fde68a" stroke="#cbd5e1"/><text x="262" y="364" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">持有 Mutex</text><rect x="380" y="350" width="22" height="16" fill="#bfdbfe" stroke="#cbd5e1"/><text x="412" y="364" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">等待 TCP</text><text x="480" y="410" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">Bytes 克隆只增加引用计数，不复制数据；这是“先取出，再离开锁去等”能成立的前提。</text></g></svg>
