<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">读缓冲区中的帧边界</title><desc id="desc">第一次只读到 *2\r\n$3\r\nGE，判断为不完整并全部保留；第二次追加后缓冲区里有完整的 25 字节 GET 帧和一个 PING 帧，只消费 GET 的 25 字节；剩下的 PING 在下一次 read_frame 时直接解析。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="510" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">read_frame：不完整就保留，完整就只消费一帧</text><text x="40" y="124" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">第 1 次读取后</text><rect x="170" y="90" width="204" height="52" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="272.0" y="123" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>*2\r\n$3\r\nGE</text><text x="170" y="172" font-size="15" fill="#b45309" font-weight="normal" text-anchor="start">Frame::check → Incomplete：一个字节也不消费，继续 read_buf</text><text x="40" y="254" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">第 2 次追加后</text><rect x="170" y="220" width="425" height="52" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="382.5" y="253" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>*2\r\n$3\r\nGET\r\n$6\r\ncourse\r\n</text><rect x="599" y="220" width="238" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="718.0" y="253" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>*1\r\n$4\r\nPING\r\n</text><text x="170" y="302" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="start">check 通过 → parse 出 GET，advance 25 字节</text><text x="40" y="384" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">交付 GET 之后</text><rect x="170" y="350" width="238" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="289.0" y="383" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>*1\r\n$4\r\nPING\r\n</text><text x="170" y="432" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="start">下一次 read_frame 直接解析 PING，不必等网络</text><text x="480" y="485" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">buffer 是 Connection 自己持有的 BytesMut；TCP 不保留消息边界，边界由 RESP 的长度前缀决定。</text></g></svg>
