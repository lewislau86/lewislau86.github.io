<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">服务端的任务结构</title><desc id="desc">main 调用 server::run，后者用 select 同时等待 Listener::run 和关闭信号；Listener 循环取得配额、accept 并为每个连接 spawn 一个 Handler 任务，Handler A、B、C 各自循环读帧、执行命令、写回响应。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">一个主流程，一个接入循环，每个连接一个任务</text><rect x="40" y="90" width="150" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="115.0" y="121.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>main</text><rect x="240" y="90" width="170" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="325.0" y="121.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>server::run</text><path d="M190 115L236 115" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460" y="70" width="460" height="92" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="96" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">tokio::select! 同时等待两件事，先完成者胜出</text><rect x="480" y="108" width="200" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="580.0" y="136.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Listener::run</text><rect x="700" y="108" width="200" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="800.0" y="136.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">关闭信号（Ctrl+C）</text><path d="M410 115L456 115" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M580 152 V205" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><rect x="380" y="210" width="400" height="56" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="580" y="244" font-size="15.5" fill="#b45309" font-weight="bold" text-anchor="middle">loop { acquire → accept → spawn }</text><path d="M580 266 C580 300 180 290 180 322" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)" stroke-dasharray="7 5"/><rect x="80" y="325" width="200" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180" y="352" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Handler A::run</text><text x="180" y="382" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>read_frame</text><text x="180" y="408" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ Command::apply</text><text x="180" y="434" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ write_frame</text><text x="180" y="460" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">任务 A：只服务一个连接</text><path d="M580 266 C580 300 480 290 480 322" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)" stroke-dasharray="7 5"/><rect x="380" y="325" width="200" height="150" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="352" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Handler B::run</text><text x="480" y="382" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>read_frame</text><text x="480" y="408" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ Command::apply</text><text x="480" y="434" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ write_frame</text><text x="480" y="460" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">任务 B：只服务一个连接</text><path d="M580 266 C580 300 780 290 780 322" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)" stroke-dasharray="7 5"/><rect x="680" y="325" width="200" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="780" y="352" font-size="15" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Handler C::run</text><text x="780" y="382" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>read_frame</text><text x="780" y="408" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ Command::apply</text><text x="780" y="434" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ write_frame</text><text x="780" y="460" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">任务 C：只服务一个连接</text><text x="792" y="236" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">spawn：新任务</text><text x="480" y="512" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">一个 Handler 在 .await 上等待某个客户端时，运行时会去推进其他任务，所以服务器能同时服务多人。</text></g></svg>
