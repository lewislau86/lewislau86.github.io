<svg xmlns="http://www.w3.org/2000/svg" width="960" height="445" viewBox="0 0 960 445" role="img" aria-labelledby="title desc">
<title id="title">三种客户端的关系</title><desc id="desc">异步业务直接调用 Client::get；多任务业务调用 BufferedClient::get，经 mpsc 交给后台 run 任务再调用 Client；同步代码调用 BlockingClient::get，经 runtime.block_on 调用 Client。三者最终都通过 Client 和 Connection 访问 TCP。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="445" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">三种客户端 API，最后都落到同一个 Client</text><text x="40" y="121" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">异步业务</text><rect x="180" y="91" width="210" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="285.0" y="122.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client::get</text><path d="M390 116 C560 116 620 191 676 191" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="40" y="226" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">多任务共用连接</text><rect x="180" y="196" width="210" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="285.0" y="227.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>BufferedClient::get</text><rect x="420" y="196" width="200" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="520.0" y="227.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">mpsc → 后台 run 任务</text><path d="M390 221L416 221" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><path d="M620 221 C660 221 650 191 676 191" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><text x="40" y="331" font-size="16" fill="#7c3aed" font-weight="bold" text-anchor="start">同步代码</text><rect x="180" y="301" width="210" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="285.0" y="332.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>BlockingClient::get</text><rect x="420" y="301" width="200" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="520.0" y="332.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">runtime.block_on</text><path d="M390 326L416 326" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><path d="M620 326 C660 326 650 191 676 191" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><rect x="680" y="166" width="120" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="740.0" y="197.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client</text><rect x="680" y="246" width="120" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="740.0" y="277.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Connection</text><path d="M740 216L740 242" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="820" y="246" width="110" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="875.0" y="268.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>TCP</text><text x="875.0" y="289.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">→ 服务端</text><path d="M800 271L816 271" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="480" y="420" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">BufferedClient 解决“多个任务共用一个连接”，BlockingClient 解决“同步代码调用异步实现”；两者都不重写协议。</text></g></svg>
