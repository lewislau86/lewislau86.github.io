<svg xmlns="http://www.w3.org/2000/svg" width="960" height="445" viewBox="0 0 960 445" role="img" aria-labelledby="title desc">
<title id="title">覆盖写入时的过期时间线</title><desc id="desc">0 毫秒 SET a old PX 1000，索引记录 (1000, a)；100 毫秒 SET a new PX 10000，删除旧索引并插入 (10100, a)；1000 毫秒旧的等待醒来，检查当前索引后不删除 a；10100 毫秒清理任务删除 a 及其索引。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="445" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">覆盖写入会替换过期索引：旧的等待醒来也不会误删</text><path d="M80 140 H900" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M80 130 V150" stroke="#64748b" stroke-width="2" fill="none"/><text x="80" y="120" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0 ms</text><path d="M200 130 V150" stroke="#64748b" stroke-width="2" fill="none"/><text x="200" y="120" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>100 ms</text><path d="M420 130 V150" stroke="#64748b" stroke-width="2" fill="none"/><text x="420" y="120" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>1000 ms</text><path d="M820 130 V150" stroke="#64748b" stroke-width="2" fill="none"/><text x="820" y="120" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>10100 ms</text><text x="640" y="158" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">（时间轴未按比例）</text><path d="M80 145 V190" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M200 145 V300" stroke="#b45309" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M420 145 V190" stroke="#0f766e" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M820 145 V300" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="7 5"/><rect x="20" y="190" width="260" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="220" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SET a old PX 1000</text><text x="150" y="246" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">索引 {(1000, a)}</text><rect x="70" y="300" width="260" height="76" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="200" y="330" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SET a new PX 10000</text><text x="200" y="356" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">删 (1000, a)，插 (10100, a)</text><rect x="290" y="190" width="260" height="76" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="420" y="220" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">旧的等待醒来</text><text x="420" y="246" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">按当前索引检查：a 未到期，不删</text><rect x="680" y="300" width="260" height="76" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="810" y="330" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">清理任务被调度</text><text x="810" y="356" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">删除 a 及 (10100, a)</text><text x="480" y="420" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">删除前总是重新读取共享状态，所以过期决定只取决于“当前”索引，而不是当初是谁在等待。</text></g></svg>
