<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" aria-labelledby="title desc">
<title id="title">BufferedClient 的消息流</title><desc id="desc">调用者 A、B、C 各自把命令和一个 oneshot 回信地址发进同一个有界 mpsc 队列；后台 run 任务持有唯一的 Client，按顺序执行请求，再通过各自的 oneshot 把结果送回对应调用者。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="425" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">BufferedClient：请求排进一条队列，回复各走各的 oneshot</text><rect x="40" y="95" width="150" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115.0" y="120.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">调用者 A</text><text x="115.0" y="141.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">命令 Get + 回信地址</text><path d="M192 123 C280 123 300 223 356 223" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="40" y="195" width="150" height="56" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="115.0" y="220.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">调用者 B</text><text x="115.0" y="241.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">命令 Set + 回信地址</text><path d="M192 223 C280 223 300 223 356 223" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><rect x="40" y="295" width="150" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="115.0" y="320.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">调用者 C</text><text x="115.0" y="341.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">命令 Get + 回信地址</text><path d="M192 323 C280 323 300 223 356 223" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><rect x="360" y="195" width="190" height="56" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="455" y="222" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">有界 mpsc 队列</text><text x="455" y="242" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">排队、限流</text><path d="M550 223L596 223" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><rect x="600" y="190" width="200" height="66" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="700.0" y="220.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>run(client, rx)</text><text x="700.0" y="241.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">逐个执行请求</text><rect x="820" y="190" width="110" height="66" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="875.0" y="220.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client</text><text x="875.0" y="241.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">一条连接</text><path d="M660 188 C600 110 320 141 194 141" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)" stroke-dasharray="7 5"/><path d="M680 258 C620 290 320 245 194 245" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)" stroke-dasharray="7 5"/><path d="M720 258 C690 350 320 345 194 345" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrow-7c3aed)" stroke-dasharray="7 5"/><text x="560" y="112" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">oneshot 回复</text><path d="M800 223L816 223" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="480" y="400" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">实线：请求进入同一队列，顺序执行，响应不会错配；虚线：每个请求自带的 oneshot 把结果送回原调用者。</text></g></svg>
