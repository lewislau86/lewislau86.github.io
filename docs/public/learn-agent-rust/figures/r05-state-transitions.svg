<svg xmlns="http://www.w3.org/2000/svg" width="960" height="554" viewBox="0 0 960 554" role="img" aria-labelledby="title desc"><title id="title">清单条目怎样迁移？</title><desc id="desc">本章允许开始、完成和让出步骤，已完成条目保留，整批通过才提交。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="554" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">清单条目怎样迁移？</text><rect x="40" y="105" width="240" height="115" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="137" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">pending</text><text x="160.0" y="170" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已列入计划，尚未开始</text><rect x="360" y="105" width="240" height="115" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="137" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">in_progress</text><text x="480.0" y="170" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">当前正在推进的步骤</text><rect x="680" y="105" width="240" height="115" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="800.0" y="137" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">completed</text><text x="800.0" y="170" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留记录，终态</text><path d="M280 160 H350" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 160 H670" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="139" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">开始</text><text x="640" y="139" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">完成</text><path d="M480 220 V270 H160 V230" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="300" text-anchor="middle" font-size="18" fill="#b45309" font-weight="400">让出当前步骤：回到 pending</text><rect x="40" y="340" width="880" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="372" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">整份候选清单一起校验</text><text x="480.0" y="405" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">新增条目从 pending 开始；每份快照最多一个 in_progress。</text><text x="480.0" y="434" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">ID 唯一、内容不变、历史保留、版本匹配；全部通过才替换当前清单。</text><text x="480" y="522" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">示意图：每个状态也允许保持原状；这些是本章的应用规则。</text></g></svg>
