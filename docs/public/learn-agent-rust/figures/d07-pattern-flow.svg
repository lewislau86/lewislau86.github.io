<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">挂起、决定、恢复，以及撤回旧批准</title><desc id="desc">左边是三个进程：第一个运行到发布并挂起，第二个读出等待中的请求并记下决定，第三个从发布这一步恢复，写作者不再运行；右边是批准以后需求变了：不撤回时旧批准被用掉、发布旧内容，先撤回再重新请求才发布新内容。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="540" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">挂起、决定、恢复，以及撤回旧批准</text><text x="240" y="72" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">挂起—决定—恢复（每步可以是独立进程）</text><rect x="30" y="90" width="420" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">步骤 1：运行到发布</text><text x="240.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">writer → version_check → publisher</text><text x="240.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">发布调用被挂起，运行结束</text><rect x="30" y="218" width="420" height="108" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="250" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">步骤 2：审批人决定</text><text x="240.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">从 SQLite 读出等待中的请求</text><text x="240.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">批准 / 拒绝 / 改参数批准</text><path d="M240 200 V216" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="346" width="420" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="378" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">步骤 3：恢复</text><text x="240.0" y="411" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">从 publisher 这一步继续</text><text x="240.0" y="440" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">writer 不再运行</text><path d="M240 328 V344" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="488" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">approve：写作者运行 1 次，发布 3.0.md</text><text x="240" y="512" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">clarify：问人以后从头再来，写作者运行 2 次</text><text x="720" y="72" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">批准绑定调用，不绑定意图</text><rect x="510" y="90" width="420" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">批准以后，需求变了</text><text x="720.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">用户：“改成 3.1 再发”</text><rect x="510" y="218" width="420" height="108" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="720.0" y="250" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">不撤回：旧批准被用掉</text><text x="720.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">恢复挂起的调用，发布旧内容</text><path d="M720 200 V216" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="346" width="420" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="378" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">先撤回：改成拒绝</text><text x="720.0" y="411" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">了结挂起的一步，再写 3.1、再批准</text><path d="M930 145 H950 V401 H934" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="488" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">changed-mind → 发布 3.0.md</text><text x="720" y="512" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">changed-mind-revoked → 发布 3.1.md</text></g></svg>
