<svg xmlns="http://www.w3.org/2000/svg" width="960" height="785" viewBox="0 0 960 785" role="img" aria-labelledby="title desc"><title id="title">从资料到有来源的回答</title><desc id="desc">检索、范围过滤、版本核对与引用检查真实执行；生成器采用固定摘录夹具。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="785" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">从资料到有来源的回答</text><rect x="40" y="85" width="420" height="155" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">索引阶段：真实 Markdown</text><text x="250.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">段落切块 + 标题 + 来源行号</text><text x="250.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">范围、完整快照与显示指纹</text><rect x="500" y="85" width="420" height="155" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">查询阶段：宿主给定范围</text><text x="710.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先过滤，再统计词频并排序</text><text x="710.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">BM25 → top-k</text><path d="M460 165 H495" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 240 V285 H480 V320" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="330" width="640" height="155" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="362" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">证据组装与检查</text><text x="480.0" y="395" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">逐条核对来源仍然存在且内容未变</text><text x="480.0" y="424" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按序装入字符预算；过期或无证据则停止</text><path d="M480 485 V530" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="540" width="420" height="145" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="250.0" y="572" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">生成边界：固定摘录夹具</text><text x="250.0" y="605" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">原文 + citation</text><text x="250.0" y="634" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">真实模型请求在这里替换</text><path d="M460 610 H495" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="540" width="420" height="145" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="572" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">宿主独立校验</text><text x="710.0" y="605" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">引用属于本次证据集合</text><text x="710.0" y="634" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">摘录确实出现在原文中</text><text x="480" y="740" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">更新或删除来源后重建索引；本例索引只在当前进程保存。</text></g></svg>
