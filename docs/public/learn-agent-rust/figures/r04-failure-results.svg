<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724" viewBox="0 0 960 724" role="img" aria-labelledby="title desc"><title id="title">在哪个阶段失败，决定了已经发生什么</title><desc id="desc">实际运行显示：执行前的回调拦下或超时都没有写入；执行后的回调出错时文件已写入但结果被扣下；结束回调出错时运行以错误结束。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="724" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">在哪个阶段失败，决定了已经发生什么</text><text x="480" y="85" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件结果、模型看到的结果、任务结果分开核对。</text><text x="155" y="133" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">场景</text><text x="367" y="133" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">写入尝试 / 成功</text><text x="585" y="133" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">结果状态</text><text x="815" y="133" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">任务通过</text><rect x="28" y="149" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="178" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">normal</text><text x="367" y="178" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="178" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ok</text><text x="815" y="178" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">是</text><text x="155" y="227" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">permission-deny</text><text x="367" y="227" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0 / 0</text><text x="585" y="227" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">refused</text><text x="815" y="227" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><rect x="28" y="247" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="276" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">pre-block</text><text x="367" y="276" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0 / 0</text><text x="585" y="276" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">not_run</text><text x="815" y="276" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><text x="155" y="325" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">pre-timeout</text><text x="367" y="325" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0 / 0</text><text x="585" y="325" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">not_run</text><text x="815" y="325" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><rect x="28" y="345" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="374" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">post-error</text><text x="367" y="374" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="374" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">withheld</text><text x="815" y="374" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><text x="155" y="423" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">post-rewrite</text><text x="367" y="423" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="423" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ok</text><text x="815" y="423" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">是</text><rect x="28" y="443" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="472" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">tool-error</text><text x="367" y="472" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 0</text><text x="585" y="472" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">failed</text><text x="815" y="472" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><text x="155" y="521" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">stop-error</text><text x="367" y="521" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="521" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ok</text><text x="815" y="521" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><rect x="28" y="541" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="570" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">prompt-error</text><text x="367" y="570" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0 / 0</text><text x="585" y="570" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">—</text><text x="815" y="570" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><text x="480" y="655" text-anchor="middle" font-size="17" fill="#b45309" font-weight="700">after_tool 出错：文件已写入，模型只看到 withheld；after_agent 出错：运行以错误结束。</text><text x="480" y="693" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">数据来自真实文件实验；模型请求为固定脚本。</text></g></svg>
