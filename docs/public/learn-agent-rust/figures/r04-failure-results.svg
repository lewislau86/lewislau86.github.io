<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724" viewBox="0 0 960 724" role="img" aria-labelledby="title desc"><title id="title">在哪个阶段失败，决定了文件已经发生什么</title><desc id="desc">实际运行显示前置阻止与超时均未写入；后置和停止回调失败保留文件与工具结果，但任务未通过。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="724" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">在哪个阶段失败，决定了文件已经发生什么</text><text x="480" y="85" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件结果与任务结果分开核对；各场景的 Stop 均只触发一次。</text><text x="155" y="133" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">场景</text><text x="367" y="133" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">尝试 / 成功</text><text x="585" y="133" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">工具结果</text><text x="815" y="133" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">任务通过</text><rect x="28" y="149" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="178" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">normal</text><text x="367" y="178" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="178" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ok</text><text x="815" y="178" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">是</text><text x="155" y="227" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">permission-deny</text><text x="367" y="227" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0 / 0</text><text x="585" y="227" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">permission_denied</text><text x="815" y="227" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><rect x="28" y="247" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="276" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">pre-block</text><text x="367" y="276" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0 / 0</text><text x="585" y="276" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">hook_blocked</text><text x="815" y="276" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><text x="155" y="325" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">pre-timeout</text><text x="367" y="325" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0 / 0</text><text x="585" y="325" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">hook_error</text><text x="815" y="325" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><rect x="28" y="345" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="374" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">post-error</text><text x="367" y="374" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="374" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ok</text><text x="815" y="374" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><text x="155" y="423" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">post-timeout</text><text x="367" y="423" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="423" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ok</text><text x="815" y="423" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><rect x="28" y="443" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="472" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">tool-error</text><text x="367" y="472" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 0</text><text x="585" y="472" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">tool_error</text><text x="815" y="472" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><text x="155" y="521" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">stop-error</text><text x="367" y="521" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="521" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ok</text><text x="815" y="521" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><rect x="28" y="541" width="904" height="46" rx="6" fill="#e2e8f0"/><text x="155" y="570" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">stop-timeout</text><text x="367" y="570" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1 / 1</text><text x="585" y="570" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ok</text><text x="815" y="570" text-anchor="middle" font-size="20" fill="#b91c1c" font-weight="700">否</text><text x="480" y="655" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">后置或停止回调失败：文件已经写入，工具的 ok 结果仍然保留。</text><text x="480" y="693" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">数据来自真实文件实验；固定请求与既有批准由可信测试入口提供。</text></g></svg>
