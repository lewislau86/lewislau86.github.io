<svg xmlns="http://www.w3.org/2000/svg" width="960" height="622" viewBox="0 0 960 622" role="img" aria-labelledby="title desc"><title id="title">一次文件读取，经过两轮模型调用</title><desc id="desc">请求和结果通过 read-1 关联。正常路径产生四条消息、两轮模型调用和一次工具执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="622" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次文件读取，经过两轮模型调用</text><rect x="40" y="80" width="620" height="88" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="350.0" y="112" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">user</text><text x="350.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取 README，告诉我启动命令</text><path d="M350 168 V187" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="192" width="620" height="88" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="350.0" y="224" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">assistant · 请求</text><text x="350.0" y="257" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read-1 / read_file(&quot;README.md&quot;)</text><path d="M350 280 V299" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="620" height="88" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="350.0" y="336" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">tool · 结果</text><text x="350.0" y="369" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read-1 / 启动命令：cargo run</text><path d="M350 392 V411" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="416" width="620" height="88" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="350.0" y="448" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">assistant · 回答</text><text x="350.0" y="481" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">README 里的启动命令是：cargo run</text><rect x="704" y="108" width="216" height="128" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="812.0" y="140" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">模型轮次</text><text x="812.0" y="173" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">2</text><rect x="704" y="266" width="216" height="128" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="812.0" y="298" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">工具执行</text><text x="812.0" y="331" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">1</text><rect x="704" y="424" width="216" height="128" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="812.0" y="456" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">历史消息</text><text x="812.0" y="489" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">4</text><text x="480" y="594" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">计数与调用 ID 来自 normal 场景实际运行；模型为固定规则替身。</text></g></svg>
