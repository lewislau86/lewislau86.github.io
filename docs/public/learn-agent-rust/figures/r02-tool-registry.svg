<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">工具描述与执行入口来自同一份注册表</title><desc id="desc">注册表向模型导出描述，并按模型返回名称查找处理函数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="650" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">工具描述与执行入口来自同一份注册表</text><rect x="48" y="82" width="864" height="128" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="114" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">模型：看到可用工具的描述</text><text x="480.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">名称 · 说明 · 参数 schema</text><text x="480.0" y="176" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本例由脚本模型返回固定调用；真实服务另验收</text><path d="M480 272 V218" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="681" y="247" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="400">definitions() 导出</text><rect x="48" y="280" width="864" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="312" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">Registry：同一条目保存描述与处理函数</text><text x="480.0" y="345" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">list_files → list_files(root, args)</text><text x="480.0" y="374" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read_file → read_file(root, args)</text><path d="M480 420 V470" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="705" y="452" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="400">dispatch() 按名称查找</text><rect x="48" y="478" width="864" height="100" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="510" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">程序：解析参数，运行处理函数</text><text x="480.0" y="543" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成功返回 data，失败返回 error；都保留调用 ID。</text><text x="480" y="621" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">示意图：新增工具修改注册条目，循环继续使用共同入口。</text></g></svg>
