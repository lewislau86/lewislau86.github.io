<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">一次工具往返，两次 HTTP 请求</title><desc id="desc">normal 实际请求先返回 read-1，宿主读取后以相同身份回传，再独立核对最终答案。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="730" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次工具往返，两次 HTTP 请求</text><rect x="30" y="82" width="420" height="103" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="114" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">Rust 宿主 · 两库循环</text><text x="240.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">system 策略 + user 目标 + tools</text><rect x="510" y="82" width="420" height="103" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="114" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">独立本地 HTTP 服务</text><text x="720.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">确定性响应夹具 · 非真实模型</text><path d="M190 185 V222 H720 V253" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="213" text-anchor="middle" font-size="19" fill="#2563eb" font-weight="700">① POST：固定配置与首轮消息</text><rect x="510" y="262" width="420" height="95" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="294" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">② 响应：read_file</text><text x="720.0" y="327" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">id=read-1 · path=README.md</text><path d="M510 309 H455" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="262" width="420" height="124" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="294" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">宿主执行实际读取</text><text x="240.0" y="327" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只读本次任务目录的 README</text><text x="240.0" y="356" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件错误也变成配对结果</text><path d="M240 386 V427 H720 V460" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="418" text-anchor="middle" font-size="19" fill="#2563eb" font-weight="700">③ POST：assistant 请求 + tool 结果</text><rect x="510" y="470" width="420" height="95" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="502" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">④ 响应：最终答案</text><text x="720.0" y="535" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结束原因 stop · 两字段 JSON</text><path d="M510 519 H455" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="470" width="420" height="124" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="502" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">独立判分器</text><text x="240.0" y="535" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">expected 标签从未发给模型</text><text x="240.0" y="564" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">答案、实际读取与正常停止共同验收</text><text x="480" y="645" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">请求与响应由服务端记录，再与客户端保存记录逐字段核对。</text><text x="480" y="688" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">第二轮 tool_call_id=read-1，关联第一轮真实工具请求。</text></g></svg>
