<svg xmlns="http://www.w3.org/2000/svg" width="960" height="608" viewBox="0 0 960 608" role="img" aria-labelledby="title desc"><title id="title">从一句请求，到一次真实的文件读取</title><desc id="desc">模型提出工具请求，应用检查策略并读取文件，结果交回模型形成回答。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="608" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">从一句请求，到一次真实的文件读取</text><rect x="48" y="78" width="864" height="86" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="110" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">用户提出目标</text><text x="480.0" y="143" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取 README.md，告诉我如何启动项目。</text><path d="M245 164 V207" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="214" width="390" height="142" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="243.0" y="246" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">模型返回：行动请求</text><text x="243.0" y="279" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read_file(&quot;README.md&quot;)</text><text x="243.0" y="308" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">此时只有名称、参数和调用 ID。</text><path d="M438 284 H513" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="522" y="214" width="390" height="142" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="717.0" y="246" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">程序执行：真实读取</text><text x="717.0" y="279" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检查策略，再调用 std::fs。</text><text x="717.0" y="308" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件内容或错误成为工具结果。</text><path d="M717 356 V398 H245 V438" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="425" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="400">工具结果写回消息历史</text><rect x="48" y="446" width="864" height="92" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="478" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">模型再次获得上下文</text><text x="480.0" y="511" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">看到 README 的内容后，才能据此生成回答。</text><text x="480" y="579" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">示意图：请求动作、允许动作与执行动作是不同的步骤。</text></g></svg>
