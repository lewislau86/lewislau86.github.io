<svg xmlns="http://www.w3.org/2000/svg" width="960" height="538" viewBox="0 0 960 538" role="img" aria-labelledby="title desc"><title id="title">先预测三次尝试分别在什么时候开始</title><desc id="desc">backoff 场景开始时间为 0、110、320 毫秒，含每次尝试注入的十毫秒与一百、二百毫秒等待。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="538" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">先预测三次尝试分别在什么时候开始</text><rect x="50" y="92" width="250" height="140" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="175.0" y="124" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">尝试 1</text><text x="175.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">开始 0 ms</text><text x="175.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">失败</text><path d="M300 162 H346" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="326" y="268" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">100 ms</text><rect x="355" y="92" width="250" height="140" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="124" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">尝试 2</text><text x="480.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">开始 110 ms</text><text x="480.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">失败</text><path d="M605 162 H651" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="631" y="268" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">200 ms</text><rect x="660" y="92" width="250" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="785.0" y="124" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">尝试 3</text><text x="785.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">开始 320 ms</text><text x="785.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">真实读取成功</text><rect x="70" y="318" width="820" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="350" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">累计账本来自 backoff 实际运行</text><text x="480.0" y="383" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">尝试 3 次；等待 300 ms；虚拟时钟到 330 ms</text><text x="480.0" y="412" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每次尝试注入 10 ms；两次退避合计 300 ms。</text><text x="480" y="498" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">虚拟时间用于验证顺序与预算；本实验不 sleep，也不测真实网络延迟。</text></g></svg>
