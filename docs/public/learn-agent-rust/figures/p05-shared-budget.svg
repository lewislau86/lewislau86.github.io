<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565" role="img" aria-labelledby="title desc"><title id="title">继续与交接都沿用同一份累计账本</title><desc id="desc">修复成功总计五次调用；三次调用用尽的场景在第二段新调用前停止并保存交接。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="565" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">继续与交接都沿用同一份累计账本</text><rect x="40" y="95" width="400" height="170" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="127" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">continue-success</text><text x="240.0" y="160" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">2 段 · 5 次调用</text><text x="240.0" y="189" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">3 次工具 · 45 字节预留</text><text x="240.0" y="218" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同一账本累计到完成</text><rect x="520" y="95" width="400" height="170" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="127" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">model-budget</text><text x="720.0" y="160" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用上限 = 3</text><text x="720.0" y="189" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">第 2 段前仍已用 3 次</text><text x="720.0" y="218" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用前拒绝，保留部分报告</text><rect x="40" y="325" width="880" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="357" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">交接保留什么？</text><text x="480.0" y="390" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">冻结输入与期望值 · 原累计用量与额度</text><text x="480.0" y="419" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">停止原因 · 最近验收 · 已有动作计数</text><text x="480" y="520" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">继续复用预算；handoff.json 不授予新预算，也不自动恢复。</text></g></svg>
