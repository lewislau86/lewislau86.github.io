<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-labelledby="title desc"><title id="title">把发现、加载与使用分成可观察的步骤</title><desc id="desc">启动时建索引；模型先用 list_skills 看目录，再用 load_skill 取 rust-review 正文，需要时读附带资源，随后读取代码。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="624" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">把发现、加载与使用分成可观察的步骤</text><rect x="40" y="82" width="420" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="114" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">启动：load_skill_index</text><text x="250.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">扫描 .skills/，解析 frontmatter</text><text x="250.0" y="176" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">索引保存元信息、正文与内容摘要</text><rect x="500" y="82" width="420" height="130" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="710.0" y="114" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">每次请求前：SkillToolset</text><text x="710.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">加一条技能使用说明（不入会话）</text><text x="710.0" y="176" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具：list_skills / load_skill / load_skill_resource</text><path d="M250 212 V254" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="262" width="420" height="116" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="294" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">L1：list_skills</text><text x="250.0" y="327" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">名称、说明、摘要</text><text x="250.0" y="356" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">目录里 2 份技能</text><path d="M460 320 H494" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="262" width="420" height="116" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="294" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">L2：load_skill(rust-review)</text><text x="710.0" y="327" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正文作为工具结果进入会话</text><text x="710.0" y="356" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">激活记录写进会话状态</text><path d="M710 378 V420" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="428" width="420" height="116" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="460" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">L3：load_skill_resource（需要时）</text><text x="710.0" y="493" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只读 references/ assets/ scripts/</text><text x="710.0" y="522" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">路径不出技能目录</text><rect x="40" y="428" width="420" height="116" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="460" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">读取 src/lib.rs，给出审查</text><text x="250.0" y="493" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">sql-style 正文没有进入会话</text><text x="250.0" y="522" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">进入会话的正文：276 字节</text><path d="M500 486 H466" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="594" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">目录、正文、资源分三层进入；每一层都是一次工具往返。</text></g></svg>
