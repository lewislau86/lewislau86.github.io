<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-labelledby="title desc"><title id="title">把发现、加载与使用分成可观察的步骤</title><desc id="desc">启动时只展示两份技能的元信息，模型请求后按调用 ID 加载 rust-review 正文，随后读取代码。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="624" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">把发现、加载与使用分成可观察的步骤</text><rect x="40" y="82" width="420" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="114" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">启动：发现技能目录</text><text x="250.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">rust-review@1.0.0</text><text x="250.0" y="176" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">sql-style@1.0.0</text><text x="250.0" y="205" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只向模型展示名称、说明与版本</text><rect x="500" y="82" width="420" height="130" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="710.0" y="114" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">SKILL.md 留在本地</text><text x="710.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">YAML 元信息 + Markdown 正文</text><text x="710.0" y="176" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保存内容摘要，按需重新核对</text><path d="M250 212 V254" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="262" width="420" height="116" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="294" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">模型提出 load_skill 请求</text><text x="250.0" y="327" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">call-1 → rust-review</text><text x="250.0" y="356" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">经 ExecuteTools 分派</text><path d="M460 320 H494" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="262" width="420" height="116" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="294" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">应用：校验、核对与限额</text><text x="710.0" y="327" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">注册名称 · SHA-256 · 注入预算</text><text x="710.0" y="356" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按调用 ID 返回来源和正文</text><path d="M710 378 V420" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="428" width="420" height="116" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="460" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">tool_result 进入消息历史</text><text x="710.0" y="493" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">完整正文进入当前会话</text><text x="710.0" y="522" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">sql-style 正文没有进入上下文</text><rect x="40" y="428" width="420" height="116" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="460" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">下一轮读取目标代码</text><text x="250.0" y="493" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">再给出固定规则的审查回答</text><text x="250.0" y="522" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型轮次：3；加载正文：1 份</text><path d="M500 486 H466" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="594" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">目录先出现，正文后进入；工具循环与调用 ID 契约沿用 R02。</text></g></svg>
