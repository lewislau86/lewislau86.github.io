<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">恢复到另一个集群，再说明丢了什么</title><desc id="desc">源库停止后将备份恢复到另一个 PostgreSQL 实例，核对逻辑基线并报告备份后的一条缺失提交。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="550" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">恢复到另一个集群，再说明丢了什么</text><rect x="40" y="90" width="400" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">源集群：阻断接单后备份</text><text x="240.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">active = 0 · recovery = true</text><text x="240.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">2 会话 / 4 完成作业 / 1 结果</text><path d="M440 160 H510" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="90" width="400" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="122" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">独立目标：pg_restore</text><text x="720.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先拒绝损坏归档，再恢复正确备份</text><text x="720.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结构、数据和预算逐值核对</text><path d="M240 230 V266" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="274" width="400" height="140" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="306" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">备份之后：又提交一次</text><text x="240.0" y="339" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">随后源数据库停止</text><text x="240.0" y="368" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">目标中缺少 1 条提交</text><path d="M720 230 V266" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="274" width="400" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="306" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">目标先不接单</text><text x="720.0" y="339" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">recovery 仍为 true</text><text x="720.0" y="368" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">完成本地核对后由操作员放行</text><text x="480" y="469" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">恢复基线一致 ≠ 没有数据缺口；外部业务需要另行对账。</text><text x="480" y="511" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本地恢复步骤计时不包含故障发现、环境准备与流量切换。</text></g></svg>
