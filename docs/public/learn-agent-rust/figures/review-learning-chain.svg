<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="title desc"><title id="title">让章节成为一次可迁移的推理练习</title><desc id="desc">先预测，再实验，改变单一条件构造反例，界定边界，再把机制迁移到新的业务问题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="780" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">让章节成为一次可迁移的推理练习</text><rect x="95" y="88" width="770" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="120" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">先预测</text><text x="480.0" y="153" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写下会发生什么</text><path d="M480 178 V197" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="204" width="770" height="90" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="236" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">再运行</text><text x="480.0" y="269" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">核对轨迹与产物</text><path d="M480 294 V313" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="320" width="770" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="352" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">造反例</text><text x="480.0" y="385" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只破坏一个条件</text><path d="M480 410 V429" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="436" width="770" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="468" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">说边界</text><text x="480.0" y="501" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结论到哪里为止</text><path d="M480 526 V545" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="552" width="770" height="90" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="584" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">做迁移</text><text x="480.0" y="617" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">换业务后如何判断</text><text x="480" y="735" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">“理解”表现为能解释反例、设计验证，并在新问题中作出有依据的选择。</text></g></svg>
