<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">正常返回、产物达标与业务终态分别核对</title><desc id="desc">声称完成两次仍没有产物；正常写入后可完成；产物合格但模型异常仍转人工。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="570" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">正常返回、产物达标与业务终态分别核对</text><rect x="40" y="95" width="400" height="185" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="127" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">只声称完成</text><text x="240.0" y="160" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正常返回 = 2 次</text><text x="240.0" y="189" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">产物达标 = false</text><text x="240.0" y="218" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终状态 = needs_human</text><rect x="520" y="95" width="400" height="185" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="127" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">实际写出合格文件</text><text x="720.0" y="160" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正常返回 = 1 次</text><text x="720.0" y="189" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">产物达标 = true</text><text x="720.0" y="218" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终状态 = completed</text><rect x="40" y="335" width="880" height="135" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="367" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">产物达标与运行终态还要分开记录</text><text x="480.0" y="400" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">valid-then-model-error：goal_verified = true</text><text x="480.0" y="429" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型阶段异常，status = needs_human</text><text x="480" y="525" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">判断器只读冻结合同与实际文件，不读取“我已完成”的声明。</text></g></svg>
