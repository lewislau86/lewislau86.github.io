<svg xmlns="http://www.w3.org/2000/svg" width="960" height="637" viewBox="0 0 960 637" role="img" aria-labelledby="title desc"><title id="title">同意之前，先确定谁在回复哪次请求</title><desc id="desc">请求表固定原申请者与预期回复者，config 伪造批准被拒绝，计划保持 pending。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="637" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">同意之前，先确定谁在回复哪次请求</text><rect x="40" y="85" width="880" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">① Core 提交 PlanRequest</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">request_id = plan-1</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Endpoint 绑定发送者；正文只携带业务字段</text><path d="M480 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="247" width="880" height="144" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="279" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">② 请求表保存预期关系</text><text x="480.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">kind = plan · requester = core · responder = lead</text><text x="480.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">deadline = 10 tick · 原计划快照 + SHA-256</text><text x="480.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">回复必须匹配 ID、类型、双方身份与 Pending</text><path d="M270 391 V433" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 391 V433" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="441" width="420" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="473" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">Lead → Core</text><text x="250.0" y="506" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">有效 PlanResponse</text><text x="250.0" y="535" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Approve / Reject 决定状态</text><rect x="500" y="441" width="420" height="112" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="710.0" y="473" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">Config → Core</text><text x="710.0" y="506" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">wrong_identity</text><text x="710.0" y="535" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">plan-1 仍为 pending</text><text x="480" y="603" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">Progress 仅记日志；正文中的“同意”不会进入审批分支。</text></g></svg>
