<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="title desc"><title id="title">看过的内容、控制进度与恢复记录，分别放在哪里？</title><desc id="desc">消息历史和控制状态可以存放在内存。跨进程恢复需要成功保存恢复所需状态，本章不实现持久化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="468" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">看过的内容、控制进度与恢复记录，分别放在哪里？</text><rect x="32" y="92" width="280" height="186" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="172.0" y="124" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">消息历史</text><text x="172.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">用户说了什么？</text><text x="172.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">请求了哪个工具？</text><text x="172.0" y="215" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具返回了什么？</text><rect x="340" y="92" width="280" height="186" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="124" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">运行控制状态</text><text x="480.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已经调用几轮？</text><text x="480.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">是否允许读取？</text><text x="480.0" y="215" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">当前应该停止吗？</text><rect x="648" y="92" width="280" height="186" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="788.0" y="124" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">持久化检查点</text><text x="788.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保存恢复所需状态</text><text x="788.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">记录恢复位置与版本</text><text x="788.0" y="215" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成功写入存储才成立</text><path d="M48 326 H912" stroke="#94a3b8" stroke-dasharray="8 6" stroke-width="2"/><text x="480" y="320" text-anchor="middle" font-size="20" fill="#475569" font-weight="700">当前进程退出</text><text x="326" y="379" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="400">本章的内存状态随进程结束而丢失</text><text x="788" y="379" text-anchor="middle" font-size="18" fill="#b45309" font-weight="400">后续章节单独验证恢复</text><text x="480" y="436" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">示意图：消息放进 Vec，并不会自动成为数据库中的检查点。</text></g></svg>
