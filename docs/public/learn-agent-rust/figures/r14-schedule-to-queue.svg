<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">时间规则产生工作，队列保留待执行任务</title><desc id="desc">每日计划经程序轮询与时间换算，将任务和游标放进同一个事务，工作留在持久队列。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="630" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">时间规则产生工作，队列保留待执行任务</text><rect x="40" y="90" width="400" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">持久计划 · 配置不可变</text><text x="240.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Asia/Shanghai · 09:00</text><text x="240.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">计划 ID：report</text><path d="M440 155 H516" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="90" width="400" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="122" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">程序轮询 · 不依赖模型回合</text><text x="720.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">日历换算 → 扫描 (cursor, now]</text><text x="720.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按配置选择到期点</text><path d="M720 220 V260" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="268" width="880" height="130" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="300" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">一个 SQLite 写事务</text><text x="480.0" y="333" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">插入唯一触发任务 + 更新扫描游标</text><text x="480.0" y="362" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">全部成功，才 COMMIT</text><path d="M480 398 V438" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="446" width="880" height="100" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="478" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">持久队列 · 后续执行者的输入</text><text x="480.0" y="511" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正常场景最终保留 1 条 daily_report / queued</text><text x="480" y="594" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本章验证生产与入队；报告生成、模型调用和完成确认在消费阶段处理。</text></g></svg>
