<svg xmlns="http://www.w3.org/2000/svg" width="960" height="695" viewBox="0 0 960 695" role="img" aria-labelledby="title desc"><title id="title">固定业务步骤包住有边界的内部循环</title><desc id="desc">准备、验收和交接由程序决定，内部执行者提出动作，继续沿用原预算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="695" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">固定业务步骤包住有边界的内部循环</text><rect x="40" y="90" width="880" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">固定流程：准备数量合同与预检查</text><text x="480.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">冻结源数据、期望值与运行上限；已有合格结果可直接完成</text><path d="M240 190 V244" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="252" width="400" height="145" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="284" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">内部 episode</text><text x="240.0" y="317" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">提议读取、写入或返回</text><text x="240.0" y="346" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">程序检查策略后执行</text><path d="M440 324 H505" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="252" width="400" height="145" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="284" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">固定验收</text><text x="720.0" y="317" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">重读真实文件，核对合同</text><text x="720.0" y="346" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">答案不参与自我评分</text><path d="M720 397 V454 H240 V485" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 454 V485" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="493" width="400" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="525" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">完成</text><text x="240.0" y="558" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正常返回 + 产物达标</text><rect x="520" y="493" width="400" height="110" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="525" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">交接</text><text x="720.0" y="558" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">异常、阻塞或额度用完</text><path d="M720 252 V222 H240 V244" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="215" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="400">可修复且有额度：带反馈继续，共用原账本</text><text x="480" y="653" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">Final 只返回控制权；完成、继续与交接由外层决定。</text></g></svg>
