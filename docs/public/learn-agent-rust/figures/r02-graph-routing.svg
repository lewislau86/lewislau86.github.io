<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">把同一个 Agent 放进图节点</title><desc id="desc">图从 START 进入 assistant 节点，节点内部是 LlmAgent 完整的模型与工具往返；结束后进入 check_answer 函数节点核对回答，再到 END；Agent 出错时图停在 assistant。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">把同一个 Agent 放进图节点</text><rect x="38" y="96" width="250" height="112" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="163.0" y="128" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">START</text><text x="163.0" y="161" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">用户问题进入图状态</text><path d="M288 152 H345" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="354" y="86" width="300" height="270" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="504.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">assistant（AgentNode）</text><text x="504.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">整个 LlmAgent：</text><text x="504.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用模型 → 执行工具</text><text x="504.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">→ 再调用模型 …</text><text x="504.0" y="238" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">直到回答或达到上限</text><text x="504.0" y="267" text-anchor="middle" font-size="18" fill="#475569" font-weight="400"></text><text x="504.0" y="296" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">输出：answer · readme</text><path d="M654 152 H711" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="96" width="202" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="821.0" y="128" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">check_answer</text><text x="821.0" y="161" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">普通函数节点</text><text x="821.0" y="190" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写入 verified</text><path d="M821 208 V262" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="270" width="202" height="86" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="821.0" y="302" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">END</text><text x="821.0" y="335" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结论交回 Runner</text><path d="M504 356 V410" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="270" y="418" width="468" height="96" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="504.0" y="450" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">Agent 出错（预算、循环上限）</text><text x="504.0" y="483" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">图停在 assistant，check_answer 不运行</text><text x="480" y="556" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">图调度 Agent 和普通步骤；单次工具往返留在 LlmAgent 内部。</text></g></svg>
