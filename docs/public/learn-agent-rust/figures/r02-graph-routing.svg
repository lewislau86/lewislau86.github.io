<svg xmlns="http://www.w3.org/2000/svg" width="960" height="586" viewBox="0 0 960 586" role="img" aria-labelledby="title desc"><title id="title">把同一循环映射为两个图节点</title><desc id="desc">ModelTurn 与 ExecuteTools 通过 Continue 交回外层驱动器，停止时返回 End。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="586" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">把同一循环映射为两个图节点</text><rect x="38" y="96" width="400" height="142" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="238.0" y="128" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">ModelTurn</text><text x="238.0" y="161" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检查轮次 → 调用模型</text><text x="238.0" y="190" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">记录请求，或写入停止原因</text><path d="M438 164 H515" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="137" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="400">有调用</text><rect x="524" y="96" width="398" height="142" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="723.0" y="128" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">ExecuteTools</text><text x="723.0" y="161" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按返回顺序分发待处理调用</text><text x="723.0" y="190" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">追加工具结果，清空 pending</text><path d="M724 238 V301 H350 V245" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="289" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="400">Continue → Paused → 外层再次推进</text><path d="M238 238 V374" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/><text x="135" y="336" text-anchor="middle" font-size="17" fill="#b45309" font-weight="400">已有停止原因</text><rect x="38" y="382" width="400" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="238.0" y="414" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">End → Completed</text><text x="238.0" y="447" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">应用仍需读取 stop 判断业务结果</text><rect x="524" y="382" width="398" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="723.0" y="414" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">状态放在 Context 的 agent 键</text><text x="723.0" y="447" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">消息 · pending · ID 集合 · 预算</text><text x="480" y="552" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">两个节点共用 State；Session 记录当前位置。本例仅在内存中推进。</text></g></svg>
