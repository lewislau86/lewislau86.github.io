<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">一个本地时刻，可能没有或拥有两个 UTC 结果</title><desc id="desc">纽约春季缺失时刻不产生候选，秋季重复时刻只选择较早一次，两个场景实测分别排队零条与一条。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="630" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一个本地时刻，可能没有或拥有两个 UTC 结果</text><rect x="40" y="86" width="400" height="140" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">2026-03-08 · 02:30</text><text x="240.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">America/New_York</text><text x="240.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本地时刻缺失：gap</text><rect x="520" y="86" width="400" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">2026-11-01 · 01:30</text><text x="720.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">America/New_York</text><text x="720.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本地时刻重复：fold</text><path d="M240 226 V264" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 226 V264" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="272" width="400" height="128" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="304" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">UTC 候选为空</text><text x="240.0" y="337" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">候选数：0</text><text x="240.0" y="366" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">chosen=null</text><rect x="520" y="272" width="400" height="128" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="304" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">两个 UTC 候选</text><text x="720.0" y="337" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">05:30:00Z</text><text x="720.0" y="366" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">06:30:00Z</text><path d="M240 400 V438" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 400 V438" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="446" width="400" height="100" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="478" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">策略：该日跳过</text><text x="240.0" y="511" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终排队 0 条</text><rect x="520" y="446" width="400" height="100" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="478" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">策略：只选较早一次</text><text x="720.0" y="511" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">选中 05:30:00Z · 排队 1 条</text><text x="480" y="593" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">时间来自固定依赖中的 IANA 数据；换算结果和业务选择分别记录。</text></g></svg>
