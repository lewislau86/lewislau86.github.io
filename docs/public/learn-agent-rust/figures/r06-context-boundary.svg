<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title desc"><title id="title">只把任务交出去，只把最终回答带回来</title><desc id="desc">AgentTool 为子 Agent 建新会话：父模型的请求只包含委派和子 Agent 的最终回答，子模型的请求从自己的说明和任务开始，文件原文只在子 Agent 一侧。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="900" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">只把任务交出去，只把最终回答带回来</text><text x="240" y="85" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">父模型的请求（coordinator）</text><text x="720" y="85" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">子模型的请求（reader，新会话）</text><rect x="40" y="112" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="144" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">system</text><text x="240.0" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">PARENT_ONLY_NOTE</text><rect x="40" y="210" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="242" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">user</text><text x="240.0" y="275" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">项目怎么启动？</text><rect x="40" y="308" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="340" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">model：调用 reader</text><text x="240.0" y="373" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">parent/delegate-1 {request}</text><rect x="40" y="602" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="634" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">function：reader 的结果</text><text x="240.0" y="667" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">{&quot;response&quot;:&quot;启动命令：cargo run&quot;}</text><rect x="40" y="700" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="732" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">model：回答用户</text><text x="240.0" y="765" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">项目的启动命令：cargo run</text><rect x="520" y="112" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="144" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">system</text><text x="720.0" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">reader 的 instruction</text><rect x="520" y="210" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="242" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">user</text><text x="720.0" y="275" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">父模型给的 request 文字</text><rect x="520" y="308" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="340" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">model：调用 read_file</text><text x="720.0" y="373" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">child-1/read-1</text><rect x="520" y="406" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="438" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">function：文件原文</text><text x="720.0" y="471" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">含 CHILD_RAW_ONLY 标记</text><rect x="520" y="504" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="536" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">model：最终回答</text><text x="720.0" y="569" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">启动命令：cargo run</text><path d="M240 194 V206" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M240 292 V304" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M240 684 V696" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M240 390 V420 H64 V560 H240 V598" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 194 V206" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 292 V304" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 390 V402" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 488 V500" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M440 349 H478 V251 H516" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 545 H486 V643 H444" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="246" y="474" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">子事件只转发给宿主诊断</text><text x="480" y="834" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">实测：父模型请求 2 次 / 子模型请求 2 次；父请求里没有 CHILD_RAW_ONLY，子请求里没有 PARENT_ONLY_NOTE。</text><text x="480" y="872" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">标记只检查本实验的数据流；文件系统仍由工具自己限制。</text></g></svg>
