<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title desc"><title id="title">只把任务交出去，只把报告带回来</title><desc id="desc">父历史包含委派和报告，子历史从自己的规则和任务开始，文件原文仅保留在子诊断历史中。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="900" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">只把任务交出去，只把报告带回来</text><text x="240" y="85" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">父模型上下文</text><text x="720" y="85" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">子模型上下文</text><rect x="40" y="112" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="144" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">system</text><text x="240.0" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">PARENT_ONLY_NOTE</text><rect x="40" y="210" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="242" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">user</text><text x="240.0" y="275" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取项目启动命令</text><rect x="40" y="308" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="340" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">assistant：委派请求</text><text x="240.0" y="373" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">parent/delegate-1</text><rect x="40" y="602" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="634" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">tool：子任务报告</text><text x="240.0" y="667" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">状态 + 启动命令 + 用量</text><rect x="40" y="700" width="400" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="732" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">assistant：用户回答</text><text x="240.0" y="765" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">项目启动命令：cargo run</text><rect x="520" y="112" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="144" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">system</text><text x="720.0" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">子工具规则与返回要求</text><rect x="520" y="210" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="242" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">user</text><text x="720.0" y="275" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本次子任务说明</text><rect x="520" y="308" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="340" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">assistant：文件读取</text><text x="720.0" y="373" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">child-1/read-1</text><rect x="520" y="406" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="438" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">tool：文件原文</text><text x="720.0" y="471" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">含 CHILD_RAW_ONLY 标记</text><rect x="520" y="504" width="400" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="536" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">assistant：提取结果</text><text x="720.0" y="569" text-anchor="middle" fon