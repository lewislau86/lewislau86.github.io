<svg xmlns="http://www.w3.org/2000/svg" width="960" height="616" viewBox="0 0 960 616" role="img" aria-labelledby="title desc"><title id="title">同一轮两个调用，各自得到一个结果</title><desc id="desc">工具额度充足时读取两次，额度不足时整批拒绝且没有读取，两个结果都保留原调用 ID。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="616" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">同一轮两个调用，各自得到一个结果</text><rect x="40" y="86" width="420" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="118" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">工具额度充足</text><text x="250.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">一个 assistant 消息：read-1、read-2</text><path d="M250 196 V232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="240" width="420" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="272" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">两个 tool 结果</text><text x="250.0" y="305" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read-1 → 文件内容</text><text x="250.0" y="334" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read-2 → 文件内容</text><path d="M250 350 V386" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="394" width="420" height="142" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="426" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">FinalAnswer</text><text x="250.0" y="459" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取尝试：2；成功：2</text><text x="250.0" y="488" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型轮次：2；消息：5</text><rect x="500" y="86" width="420" height="110" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="710.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">只剩一次工具额度</text><text x="710.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">一个 assistant 消息：read-1、read-2</text><path d="M710 196 V232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="240" width="420" height="110" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="710.0" y="272" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">两个 tool 结果</text><text x="710.0" y="305" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read-1 → tool_budget 错误</text><text x="710.0" y="334" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read-2 → tool_budget 错误</text><path d="M710 350 V386" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="394" width="420" height="142" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="710.0" y="426" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">ToolBudget</text><text x="710.0" y="459" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取尝试：0；成功：0</text><text x="710.0" y="488" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型轮次：1；消息：4</text><text x="480" y="583" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用 ID 关联每份结果；整批预算检查先于任何工具执行。</text></g></svg>
