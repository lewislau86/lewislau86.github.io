<svg xmlns="http://www.w3.org/2000/svg" width="960" height="668" viewBox="0 0 960 668" role="img" aria-labelledby="title desc"><title id="title">未知结果需要保留，也需要可恢复的入口</title><desc id="desc">Outbox 从 pending 到 unknown，再由合法回执进入 acked 与 completed。未知结果通过幂等重放或对账处理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="668" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">未知结果需要保留，也需要可恢复的入口</text><rect x="40" y="85" width="420" height="112" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="250.0" y="117" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">pending</text><text x="250.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已保存意图，尚未尝试发送</text><path d="M460 141 H492" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="85" width="420" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="710.0" y="117" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">unknown</text><text x="710.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">发送前落盘；累计 attempts +1</text><path d="M710 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="247" width="420" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="279" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">acked</text><text x="710.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">验证身份、参数与摘要</text><text x="710.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">合法回执单独持久化</text><path d="M500 313 H468" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="247" width="420" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="279" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">completed</text><text x="250.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本地检查点事务已提交</text><text x="250.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">重启后无需再发 apply</text><rect x="40" y="445" width="880" height="144" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="477" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">unknown 的恢复选择</text><text x="480.0" y="510" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">有效幂等窗口内：原键重放，或先按业务引用查询</text><text x="480.0" y="539" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">唯一匹配：保存回执；无幂等且查不到：保持未知</text><text x="480.0" y="568" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">多条结果 / 查询不完整 / 不可用：停止自动重发</text><text x="480" y="635" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Outbox 保存发送意图；外部去重与对账分别处理业务结果。</text></g></svg>
