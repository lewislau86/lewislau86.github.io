<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc"><title id="title">组合发布流程与它的接缝</title><desc id="desc">左边是组合起来的发布流程：并行检查、归并、带接缝适配的修复循环、需批准的发布，每次运行共用一个预算；右边是主要场景停在哪里，不加适配时评估者的上报让整个流程在发布前结束。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="740" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">组合发布流程与它的接缝</text><text x="480" y="64" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">SequentialAgent：每次运行一个预算</text><rect x="30" y="82" width="540" height="128" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="114" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">checks（ParallelAgent）</text><text x="300.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">deps、docs 两个检查者同时运行</text><rect x="30" y="242" width="540" height="128" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="300.0" y="274" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">merge（CustomAgent）</text><text x="300.0" y="307" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成员、修订对得上才写证据</text><text x="300.0" y="336" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">否则上报，整个流程停下</text><path d="M300 212 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="402" width="540" height="128" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="300.0" y="434" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">refine（LoopAgent）+ 接缝适配</text><text x="300.0" y="467" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写作者 ↔ 评估者，最多 3 轮</text><text x="300.0" y="496" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">收住内层 escalate，只交出结果</text><path d="M300 372 V400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="562" width="540" height="128" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="300.0" y="594" text-anchor="middle" font-size="21" fill="#7c3aed" font-weight="700">publisher（需人批准）</text><text x="300.0" y="627" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">挂起 → 批准 → 恢复 → 发布</text><path d="M300 532 V560" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="600" y="82" width="330" height="100" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="765.0" y="114" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">naive</text><text x="765.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不加适配：escalated_by:evaluator</text><rect x="600" y="190" width="330" height="100" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="765.0" y="222" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">normal</text><text x="765.0" y="255" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">加适配，批准后发布：completed</text><rect x="600" y="298" width="330" height="100" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="765.0" y="330" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">stale-branch</text><text x="765.0" y="363" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">归并发现旧修订：merge:stale_result:deps@r1</text><rect x="600" y="406" width="330" height="100" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="765.0" y="438" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">never-accepted</text><text x="765.0" y="471" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">3 轮没有合格稿：refine:no_accepted_draft</text><rect x="600" y="514" width="330" height="100" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="765.0" y="546" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">branch-failed</text><text x="765.0" y="579" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">依赖检查出错：error:model.unavailable</text><rect x="600" y="622" width="330" height="100" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="765.0" y="654" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">budget</text><text x="765.0" y="687" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">预算只够 4 次调用：error:budget.model_calls</text></g></svg>
