<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">业务成功与快照成功之间存在窗口</title><desc id="desc">实测日志已经追加一行，数据库没有追加结果；恢复保留累计预算并进入对账。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="630" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">业务成功与快照成功之间存在窗口</text><rect x="40" y="95" width="880" height="105" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="127" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">① 动作前 · 数据库已提交</text><text x="480.0" y="160" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">tool_in_flight · 预留工具次数 = 2</text><path d="M480 200 V238" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="246" width="400" height="130" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="278" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">② 真实文件追加成功</text><text x="240.0" y="311" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">audit.log = 1 行</text><text x="240.0" y="340" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">随后进程以 75 退出</text><rect x="520" y="246" width="400" height="130" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="720.0" y="278" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">结果事务还未保存</text><text x="720.0" y="311" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已保存 read 结果 = 1</text><text x="720.0" y="340" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已保存 append 结果 = 0</text><path d="M240 376 V414 H480 V432" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 376 V414 H480" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="440" width="880" height="105" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="472" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">③ 新进程恢复 · reconcile</text><text x="480.0" y="505" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">额度保留，停止自动推进；再次 step 仍不追加日志</text><text x="480" y="592" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">相同标记也可能来自动作前退出；结果需要外部核对。</text></g></svg>
