<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">两种把工作交出去的方式</title><desc id="desc">AgentTool 让子 Agent 在新会话里运行并把最终回答交回父 Agent；transfer_to_agent 让子 Agent 在同一个会话里接手并直接回答用户。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">两种把工作交出去的方式</text><text x="240" y="86" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">当工具调用：AgentTool</text><text x="720" y="86" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">交接控制权：transfer_to_agent</text><rect x="40" y="112" width="400" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="144" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">父模型调用 reader 工具</text><text x="240.0" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">传一段任务文字</text><path d="M240 212 V248" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="256" width="400" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="288" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">reader 在新会话里运行</text><text x="240.0" y="321" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只看到自己的说明和任务</text><path d="M240 356 V392" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="400" width="400" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="432" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">最终回答作为工具结果返回</text><text x="240.0" y="465" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">父 Agent 继续，再回答用户</text><rect x="520" y="112" width="400" height="100" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="144" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">父模型调用 transfer_to_agent</text><text x="720.0" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">参数是 reader 的名字</text><path d="M720 212 V248" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="256" width="400" height="100" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="288" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">reader 在同一个会话里接手</text><text x="720.0" y="321" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">看到用户原话；可以再交回</text><path d="M720 356 V392" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="400" width="400" height="100" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="432" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">reader 直接回答用户</text><text x="720.0" y="465" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">父 Agent 不再继续</text><text x="480" y="552" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="700">实测 transfer：父模型请求 1 次，子模型 2 次，回答者 reader。</text></g></svg>
