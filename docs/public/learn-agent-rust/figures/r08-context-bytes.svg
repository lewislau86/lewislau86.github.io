<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">缩短请求，同时保留继续行动的依据</title><desc id="desc">估算 token 来自实际运行：normal 第二次运行的请求比第一次运行最后一次请求小得多；intra 读完第三份资料后历史超过阈值，压缩后的请求只剩摘要和最后一对调用与结果；naive-trim 的请求同样很短，却丢了目标文件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">缩短请求，同时保留继续行动的依据</text><text x="205" y="120" text-anchor="middle" font-size="17" fill="#64748b" font-weight="700">normal：第一次运行最后一次请求</text><rect x="420" y="96" width="440.0" height="34" rx="5" fill="#64748b"/><text x="906.0" y="120" text-anchor="middle" font-size="17" fill="#64748b" font-weight="700">1255</text><text x="205" y="206" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">normal：第二次运行第一次请求</text><rect x="420" y="182" width="45.92828685258964" height="34" rx="5" fill="#0f766e"/><text x="511.9282868525896" y="206" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">131</text><text x="205" y="292" text-anchor="middle" font-size="17" fill="#64748b" font-weight="700">intra：读第三份资料前</text><rect x="420" y="268" width="308.1752988047809" height="34" rx="5" fill="#64748b"/><text x="774.1752988047808" y="292" text-anchor="middle" font-size="17" fill="#64748b" font-weight="700">879</text><text x="205" y="378" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">intra：压缩后（含第三份资料）</text><rect x="420" y="354" width="184.76494023904382" height="34" rx="5" fill="#0f766e"/><text x="650.7649402390439" y="378" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">527</text><rect x="40" y="452" width="880" height="104" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="484" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">naive-trim：只装入最近 2 条事件</text><text x="480.0" y="517" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">请求同样很短，但目标文件不在其中：给出结论 = 否</text><text x="480.0" y="546" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">数值是框架的估算 token（约 4 个 UTF-8 字节 1 个），不是 tokenizer 计数</text></g></svg>
