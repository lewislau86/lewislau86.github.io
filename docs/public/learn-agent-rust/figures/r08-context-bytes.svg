<svg xmlns="http://www.w3.org/2000/svg" width="960" height="632" viewBox="0 0 960 632" role="img" aria-labelledby="title desc"><title id="title">控制输入体积，同时保留继续行动的依据</title><desc id="desc">柱长来自 normal 实际阶段字节数，naive-trim 的历史更短但丢失了目标路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="632" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">控制输入体积，同时保留继续行动的依据</text><text x="174" y="112" text-anchor="middle" font-size="20" fill="#64748b" font-weight="700">原始模型历史</text><rect x="350" y="88" width="455.0" height="34" rx="5" fill="#64748b"/><text x="851.0" y="112" text-anchor="middle" font-size="19" fill="#64748b" font-weight="700">11939</text><text x="174" y="194" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">大结果落盘后</text><rect x="350" y="170" width="190.93307647206635" height="34" rx="5" fill="#2563eb"/><text x="586.9330764720663" y="194" text-anchor="middle" font-size="19" fill="#2563eb" font-weight="700">5010</text><text x="174" y="276" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">旧结果占位后</text><rect x="350" y="252" width="184.1875366446101" height="34" rx="5" fill="#b45309"/><text x="580.1875366446101" y="276" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">4833</text><text x="174" y="358" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">事实摘要提交后</text><rect x="350" y="334" width="70.42800904598376" height="34" rx="5" fill="#0f766e"/><text x="466.42800904598374" y="358" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="700">1848</text><rect x="40" y="444" width="880" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="476" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">只看短不短，还不够</text><text x="480.0" y="509" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">normal：1848 字节，保留路径并完成源码重读。</text><text x="480.0" y="538" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">naive-trim：867 字节，丢失路径，停止于 missing_evidence。</text><text x="480" y="602" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">同一初始历史；单位为序列化 Message JSON 的 UTF-8 字节，不是 token。</text></g></svg>
