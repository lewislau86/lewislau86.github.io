<svg xmlns="http://www.w3.org/2000/svg" width="960" height="695" viewBox="0 0 960 695" role="img" aria-labelledby="title desc"><title id="title">任务变好，与更会寻找改进，是两个层次</title><desc id="desc">外层修改改进方法，内层修改任务策略，宿主维护独立验收与发布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="695" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">任务变好，与更会寻找改进，是两个层次</text><rect x="45" y="90" width="870" height="120" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="122" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">外层：修改产生改进的方法（研究概念）</text><text x="480.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">候选如何生成 · 失败如何诊断 · 搜索额度如何分配</text><path d="M480 210 V257" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="265" width="770" height="150" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="297" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">内层：选择更好的任务策略（本章已运行）</text><text x="480.0" y="330" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">有限候选 → 开发 / 验证评分 → 接受或拒绝</text><text x="480.0" y="359" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">固定门控、固定预算，保留版本谱系</text><path d="M865 340 H910 V470 H480 V490" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="500" width="770" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="532" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">宿主边界：独立验收与发布</text><text x="480.0" y="565" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">评分合同与权限不由本轮候选改写</text><text x="480" y="655" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">图为概念分层；本实验没有运行外层元改进。</text></g></svg>
