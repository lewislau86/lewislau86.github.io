<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">身份分清，预算合并</title><desc id="desc">任务、逻辑工具调用、MCP 协议和审查请求使用各自身份，父子调用在同一账本中累计。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="730" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">身份分清，预算合并</text><rect x="32" y="85" width="896" height="105" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">持久任务：startup-1</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">固定触发身份去重；图会话 startup-1-run-1；归属 lead / epoch=1</text><path d="M248 190 V232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M712 190 V232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="242" width="440" height="156" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="252.0" y="274" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">父工具调用：task-1-c1</text><text x="252.0" y="307" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">5 次生成，4 次工具尝试</text><text x="252.0" y="336" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">MCP tools/call 协议 ID = 2</text><text x="252.0" y="365" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">重试保持逻辑 ID，协议请求各自编号</text><rect x="500" y="242" width="428" height="156" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="714.0" y="274" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">审查请求：review-1</text><text x="714.0" y="307" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">2 次生成，1 次工具尝试</text><text x="714.0" y="336" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">私有 read_file → reviewer 回执</text><text x="714.0" y="365" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只把核对结果交回父 Agent</text><path d="M248 398 V442 H360 V468" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M712 398 V442 H600 V468" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="100" y="477" width="760" height="125" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="509" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">同一个 Book：先扣款，再调用</text><text x="480.0" y="542" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">总计 7 次模型、5 次工具尝试</text><text x="480.0" y="571" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">运行事件字段：seq · actor · call_id · kind · detail</text><text x="480" y="644" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">read-retry：模型 7 次，工具尝试 6 次，重试 1 次。</text><text x="480" y="688" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">运行事件结束时导入 SQLite；不是逐事件持久化检查点。</text></g></svg>
