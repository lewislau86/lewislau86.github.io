<svg xmlns="http://www.w3.org/2000/svg" width="960" height="566" viewBox="0 0 960 566" role="img" aria-labelledby="title desc"><title id="title">D03 · 模式运行与验收</title><desc id="desc">四组节点展示本章的实际控制结构；循环与拒绝的真实次序见 trace。不是模型性能测量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="566" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">D03 · 模式运行与验收</text><text x="480" y="78" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">输入与版本 → 执行 → 验收；失败在当前合同处停止</text><rect x="30" y="112" width="435" height="156" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="247.5" y="144" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">dispatch</text><text x="247.5" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">三任务限并发二</text><rect x="495" y="112" width="435" height="156" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="712.5" y="144" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">JoinSet</text><text x="712.5" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">全部等待或取消</text><rect x="495" y="328" width="435" height="156" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="712.5" y="360" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">merge</text><text x="712.5" y="393" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成员与修订</text><rect x="30" y="328" width="435" height="156" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="247.5" y="360" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">report</text><text x="247.5" y="393" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">确定顺序</text><path d="M465 190 H490" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M712 270 V320" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M495 406 H470" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="534" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">示意图不表示耗时；真实轨迹与预算见章节保存输出。</text></g></svg>
