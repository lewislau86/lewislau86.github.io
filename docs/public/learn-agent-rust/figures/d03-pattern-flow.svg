<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">同时检查，按成员归并</title><desc id="desc">三个检查者由 ParallelAgent 同时运行，各写自己的状态键；分支出错时等兄弟分支做完再报错，分支上报时立刻停下其他分支；归并逐个核对成员与修订，按成员顺序写报告。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="500" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">同时检查，按成员归并</text><rect x="200" y="84" width="180" height="106" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="290.0" y="116" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">config_checker</text><text x="290.0" y="149" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写 check_config</text><path d="M290 190 V256" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="400" y="84" width="180" height="106" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="490.0" y="116" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">deps_checker</text><text x="490.0" y="149" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写 check_deps</text><path d="M490 190 V256" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="600" y="84" width="180" height="106" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="690.0" y="116" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">docs_checker</text><text x="690.0" y="149" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写 check_docs</text><path d="M690 190 V256" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="70" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="700">ParallelAgent：同时运行，peak_concurrent = 3</text><rect x="20" y="80" width="160" height="110" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="100.0" y="112" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">分支出错</text><text x="100.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">兄弟分支做完</text><text x="100.0" y="174" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">再整体报错</text><rect x="780" y="80" width="160" height="110" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="860.0" y="112" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">分支上报</text><text x="860.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">立刻停下</text><text x="860.0" y="174" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">其他分支</text><rect x="200" y="264" width="560" height="176" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="296" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">merge（CustomAgent）</text><text x="480.0" y="329" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按成员顺序读三个键，核对成员与修订</text><text x="480.0" y="358" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">stale：stale_result:deps@r1</text><text x="480.0" y="387" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">missing：member_mismatch:missing=docs</text><text x="480.0" y="416" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">key-collision：member_mismatch:missing=config+deps</text><text x="480" y="470" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">normal 与 reverse 完成顺序相反，报告指纹相同：396f74b4</text></g></svg>
