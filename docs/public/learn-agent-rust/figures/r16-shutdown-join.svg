<svg xmlns="http://www.w3.org/2000/svg" width="960" height="774" viewBox="0 0 960 774" role="img" aria-labelledby="title desc"><title id="title">队友同意退出之后，还要等到任务结束</title><desc id="desc">六个场景分别记录关闭协议与真实回收结果，批准但存活和 panic 无回复需要独立处理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="774" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">队友同意退出之后，还要等到任务结束</text><text x="200" y="96" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">实验场景</text><text x="525" y="96" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">关闭记录 · 清理前 → 后</text><text x="810" y="96" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">Core join</text><rect x="40" y="122" width="880" height="54" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="200" y="155" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">normal</text><text x="525" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">approved → approved</text><text x="810" y="155" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">graceful</text><rect x="40" y="188" width="880" height="54" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="200" y="221" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">shutdown-rejected</text><text x="525" y="221" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">rejected → rejected</text><text x="810" y="221" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">cancelled</text><rect x="40" y="254" width="880" height="54" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="200" y="287" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">shutdown-timeout</text><text x="525" y="287" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">expired → expired</text><text x="810" y="287" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">cancelled</text><rect x="40" y="320" width="880" height="54" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="200" y="353" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">shutdown-panic</text><text x="525" y="353" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">pending → failed</text><text x="810" y="353" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">panic</text><rect x="40" y="386" width="880" height="54" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="200" y="419" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">ack-without-exit</text><text x="525" y="419" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">approved → approved</text><text x="810" y="419" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">cancelled</text><rect x="40" y="452" width="880" height="54" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="200" y="485" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">abort-fallback</text><text x="525" y="485" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">approved → approved</text><text x="810" y="485" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">aborted</text><rect x="40" y="552" width="880" height="144" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="584" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">统一收尾：watch 取消 → 等待 JoinHandle</text><text x="480.0" y="617" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">忽略协作取消的异步任务：100ms 后 abort，继续 await</text><text x="480.0" y="646" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只有 abort-fallback 发生强制取消；panic 单独识别</text><text x="480.0" y="675" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">以上场景均 joined=2、active=0，随后删除临时目录</text><text x="480" y="739" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">协议决定与资源退出分别记录，Approved 不代替 join。</text></g></svg>
