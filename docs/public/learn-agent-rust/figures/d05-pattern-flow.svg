<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">委派交回结果，交接转移控制权</title><desc id="desc">左边是委派：lead 按清单派出工作者，结果交回 lead 汇总，每次委派记进执行回执；右边是交接：lead 先把交接说明写进会话状态，再把控制权交给 license，下一轮也由 license 回答，license 不能再交回 lead。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="540" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">委派交回结果，交接转移控制权</text><text x="240" y="72" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">委派（Delegate）：结果交回</text><rect x="30" y="90" width="420" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">lead（协调者）</text><text x="240.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按成员清单派出工作者</text><text x="240.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">拿回结果，接着汇总</text><rect x="30" y="218" width="420" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="250" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">member_check × 成员数</text><text x="240.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每个成员一次委派（AgentTool）</text><text x="240.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同时最多 2 个；isolated 时看不到 lead 的状态</text><path d="M240 200 V216" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="346" width="420" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="240.0" y="378" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">执行回执</text><text x="240.0" y="411" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每次委派一条记录</text><text x="240.0" y="440" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">失败、预算、中断都留在这里</text><path d="M240 328 V344" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="488" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">three：工作者 api,cli,core，同时进行 2</text><text x="240" y="512" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">budget → agent.team.budget_exceeded</text><text x="720" y="72" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">交接（Handoff）：控制权转移</text><rect x="510" y="90" width="420" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">lead 发现许可证问题</text><text x="720.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先写交接说明（会话状态）</text><text x="720.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">再 transfer_to_agent → license</text><rect x="510" y="218" width="420" height="108" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="250" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">license（专员）</text><text x="720.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只看用户的话和交接说明</text><text x="720.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">下一轮用户消息也由它回答</text><path d="M720 200 V216" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="346" width="420" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="720.0" y="378" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">不能“交回” lead</text><text x="720.0" y="411" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">license → lead 会让关系成环</text><text x="720.0" y="440" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">编译时就被拒绝</text><path d="M720 328 V344" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="488" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">handoff：第一轮 license，第二轮 license</text><text x="720" y="512" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">cycle → CyclicTopology</text></g></svg>
