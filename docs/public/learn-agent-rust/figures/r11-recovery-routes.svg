<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc"><title id="title">恢复前先回答：还能再做一次吗？</title><desc id="desc">R11 实现将临时只读失败送入有限退避，永久错误结束调用，写入结果不明要求核对。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="660" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">恢复前先回答：还能再做一次吗？</text><rect x="220" y="80" width="520" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="112" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">先检查输入、权限与取消</text><text x="480.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">通过后，先记账，再派发尝试。</text><path d="M480 184 V218" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="220" y="228" width="520" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="260" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">保留类型化失败</text><text x="480.0" y="293" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同时核对操作是否允许安全重试。</text><path d="M480 332 V365 H163 V396" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 332 V365 H480 V396" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 332 V365 H797 V396" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="405" width="286" height="172" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="163.0" y="437" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">临时错误 + 只读</text><text x="163.0" y="470" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检查次数与任务总预算</text><text x="163.0" y="499" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">安排有限退避</text><text x="163.0" y="528" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">恢复仍复用同一账本</text><rect x="337" y="405" width="286" height="172" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="437" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">输入 / 权限 / 永久错误</text><text x="480.0" y="470" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结束当前调用</text><text x="480.0" y="499" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回明确错误</text><text x="480.0" y="528" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">由上层决定修正方式</text><rect x="654" y="405" width="286" height="172" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="797.0" y="437" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">写入结果不明</text><text x="797.0" y="470" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留已发生的文件效果</text><text x="797.0" y="499" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">停止自动重放</text><text x="797.0" y="528" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">要求核对实际结果</text><text x="480" y="623" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">分类告诉程序下一步做什么；停止原因说明为什么结束。</text></g></svg>
