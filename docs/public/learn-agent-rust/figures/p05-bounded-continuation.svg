<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc"><title id="title">有动作不代表有进展，继续必须有上限</title><desc id="desc">连续三次验收正确字段均为二，累计调用三、五、七次，连续两次无提升后交接。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="670" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">有动作不代表有进展，继续必须有上限</text><rect x="40" y="105" width="268" height="160" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="174.0" y="137" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">episode 1</text><text x="174.0" y="170" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正确字段 = 2</text><text x="174.0" y="199" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">累计调用 = 3</text><text x="174.0" y="228" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">首次提高历史最佳</text><path d="M308 185 H336" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="346" y="105" width="268" height="160" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="137" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">episode 2</text><text x="480.0" y="170" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正确字段 = 2</text><text x="480.0" y="199" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">累计调用 = 5</text><text x="480.0" y="228" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">连续 1 次无提升</text><path d="M614 185 H642" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="652" y="105" width="268" height="160" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="786.0" y="137" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">episode 3</text><text x="786.0" y="170" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正确字段 = 2</text><text x="786.0" y="199" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">累计调用 = 7</text><text x="786.0" y="228" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">连续 2 次无提升</text><rect x="40" y="325" width="880" height="105" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="357" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">重复写入仍只有两个正确字段</text><text x="480.0" y="390" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">第一次有进展；随后连续 2 次不超过历史最佳，停止</text><rect x="40" y="475" width="880" height="100" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="507" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">保留部分报告与累计账本</text><text x="480.0" y="540" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">reason = no_progress · 写入 = 3 次</text><text x="480" y="623" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">进度来自业务合同；文件修改时间与答案长度不参与计分。</text></g></svg>
