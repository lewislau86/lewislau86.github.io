<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img" aria-labelledby="title desc"><title id="title">每位队友有自己的历史，共用受限工作区</title><desc id="desc">真实 normal 场景启动两个成员，各有容量为二的邮箱与五条私有消息，分别读取不同文件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="734" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">每位队友有自己的历史，共用受限工作区</text><rect x="40" y="82" width="880" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="114" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">Lead：应用编排</text><text x="480.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">创建成员 → 投递工作 → 等待回执 → 关闭团队</text><text x="480.0" y="176" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先分别入队，再等待两份报告</text><path d="M250 194 V236" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 194 V236" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="244" width="420" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="276" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">core 的独立邮箱</text><text x="250.0" y="309" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">容量：2 条；一个接收者</text><text x="250.0" y="338" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Work / Note；回执走 oneshot</text><path d="M250 356 V398" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="406" width="420" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="438" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">core 的私有历史</text><text x="250.0" y="471" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">normal：5 条消息</text><text x="250.0" y="500" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">ModelTurn ↔ ExecuteTools</text><path d="M250 518 V560" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="250" y="590" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">src/lib.rs</text><rect x="500" y="244" width="420" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="276" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">config 的独立邮箱</text><text x="710.0" y="309" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">容量：2 条；一个接收者</text><text x="710.0" y="338" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Work / Note；回执走 oneshot</text><path d="M710 356 V398" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="406" width="420" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="710.0" y="438" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">config 的私有历史</text><text x="710.0" y="471" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">normal：5 条消息</text><text x="710.0" y="500" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">ModelTurn ↔ ExecuteTools</text><path d="M710 518 V560" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="710" y="590" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">config.toml</text><rect x="40" y="550" width="880" height="78" rx="12" fill="none" stroke="#b45309" stroke-width="2"/><text x="480" y="662" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">同一个临时工作区 · 固定读取白名单 · 两位成员都没有写权限</text><text x="480" y="704" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">历史分别保存，文件视图共享；交流只传递明确的 Note。</text></g></svg>
