<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc"><title id="title">同一注册入口，两种执行位置</title><desc id="desc">本地工具在宿主执行，远端别名映射到 notes 服务的 read_note；两种调用身份分别保留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="670" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">同一注册入口，两种执行位置</text><rect x="32" y="85" width="896" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">宿主：固定调用脚本 → 统一工具入口</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本地 local_status + 远端 mcp_notes__read_note</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先校验参数、权限和次数，再选择处理路径</text><path d="M270 197 V246" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 197 V246" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="255" width="420" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="242.0" y="287" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">本地路径</text><text x="242.0" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">宿主函数直接返回</text><text x="242.0" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不产生 tools/call</text><rect x="508" y="255" width="420" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="718.0" y="287" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">远端路径</text><text x="718.0" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">namespace=notes · 原名 read_note</text><text x="718.0" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">应用 ID=call-1 · JSON-RPC ID=3</text><path d="M718 385 V436" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="481" y="418" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="400">真实 stdio 管道 · JSON-RPC</text><rect x="508" y="446" width="420" height="128" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="718.0" y="478" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">独立子进程：本地 MCP 服务</text><text x="718.0" y="511" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">实际读取练习 README.md</text><text x="718.0" y="540" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回 content + structuredContent</text><text x="253" y="481" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">两种结果都保留应用调用 ID</text><text x="253" y="525" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">模型接口与图节点接线在 R20 验收</text><text x="480" y="629" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">normal：1 次远端调用，1 个直属服务已回收。</text></g></svg>
