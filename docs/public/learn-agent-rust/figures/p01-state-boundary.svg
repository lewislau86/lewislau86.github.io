<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="title desc"><title id="title">检查点保留继续执行需要的数据</title><desc id="desc">旧进程将消息、位置与预算写入 PostgreSQL，新进程重新创建运行对象并恢复状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="515" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">检查点保留继续执行需要的数据</text><rect x="40" y="100" width="400" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="132" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">旧进程 · 运行中的应用</text><text x="240.0" y="165" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">消息与调用 ID · cursor · phase</text><text x="240.0" y="194" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型和工具对象 · 数据库连接</text><path d="M440 165 H510" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="100" width="400" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="132" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">PostgreSQL · 可序列化快照</text><text x="720.0" y="165" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">状态格式 + 工作流版本 + 修订</text><text x="720.0" y="194" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">当前状态与历史，在同一事务保存</text><path d="M720 230 V276" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="284" width="880" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="316" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">新进程 · 从快照重建</text><text x="480.0" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">连接与工具对象重新创建；从保存的推进位置继续</text><text x="480.0" y="378" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">完成态实测：2 次模型 / 2 次工具 / 5 条消息</text><text x="480" y="474" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">保存数据，而非旧进程的栈、句柄或线程。</text></g></svg>
