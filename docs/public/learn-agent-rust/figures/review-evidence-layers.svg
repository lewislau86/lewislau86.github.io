<svg xmlns="http://www.w3.org/2000/svg" width="960" height="795" viewBox="0 0 960 795" role="img" aria-labelledby="title desc"><title id="title">每项成功，都要指出它跨过了哪条真实边界</title><desc id="desc">受控输入、真实效果、恢复、集成和生产分别需要证据，不以一项通过替代其他项。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="795" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">每项成功，都要指出它跨过了哪条真实边界</text><rect x="45" y="85" width="870" height="95" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">受控输入</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">脚本模型 / 故障夹具：核对控制规则</text><path d="M480 180 V202" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="210" width="870" height="95" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="242" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">真实边界</text><text x="480.0" y="275" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件 / 线程 / stdio / 数据库：核对实际效果</text><path d="M480 305 V327" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="335" width="870" height="95" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="367" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">恢复与重放</text><text x="480.0" y="400" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">在指定故障窗口重启，核对身份与累计状态</text><path d="M480 430 V452" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="460" width="870" height="95" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="492" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">跨机制集成</text><text x="480.0" y="525" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">沿同一用户任务，核对模块之间的接缝</text><path d="M480 555 V577" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="585" width="870" height="95" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="617" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">真实模型与生产</text><text x="480.0" y="650" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">独立任务验收、成本、长期负载与事故恢复</text><text x="480" y="750" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">概念检查图：上层证据不自动推出下一层通过，也不构成难度排名。</text></g></svg>
