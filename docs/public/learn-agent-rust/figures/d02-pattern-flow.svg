<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">路由进入处理链，每一步只消费检查过的产物</title><desc id="desc">文件先经路由进入对应的处理链：模型标签按包含匹配、代码按文件名、类型化决定带置信度门槛；链里抽取受 schema 约束，质量门比对修订号，通过才写报告。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="460" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">路由进入处理链，每一步只消费检查过的产物</text><rect x="30" y="80" width="290" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="112" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">LlmConditionalAgent</text><text x="175.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型回标签，按包含匹配</text><text x="175.0" y="174" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">substring-trap → readme</text><path d="M175 210 L175 252" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="80" width="290" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="112" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">ConditionalAgent</text><text x="485.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">代码按文件名判断（嵌套两层）</text><text x="485.0" y="174" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">路由不调用模型</text><path d="M485 210 L175 252" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="80" width="290" height="130" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="795.0" y="112" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">DecisionAgent</text><text x="795.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">选项 + 置信度门槛 0.6</text><text x="795.0" y="174" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">low-confidence → needs_input</text><path d="M795 210 L175 252" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="260" width="290" height="130" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="175.0" y="292" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">抽取（output_schema）</text><text x="175.0" y="325" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">missing-field、substring-trap</text><text x="175.0" y="354" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">重试用完，以错误结束</text><rect x="340" y="260" width="290" height="130" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="485.0" y="292" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">质量门（CustomAgent）</text><text x="485.0" y="325" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件、修订、类别都对？</text><text x="485.0" y="354" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">stale：stale_artifact:r1</text><path d="M320 325 H338" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="260" width="290" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="795.0" y="292" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">写报告</text><text x="795.0" y="325" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读 {artifact}</text><text x="795.0" y="354" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">readme / cargo：写出报告</text><path d="M630 325 H648" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="430" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">SequentialAgent 串起一条处理链；escalate 或错误都会让链停在那一步。unknown、low-confidence、rule-router-other 进兜底。</text></g></svg>
