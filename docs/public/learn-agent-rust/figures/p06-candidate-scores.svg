<svg xmlns="http://www.w3.org/2000/svg" width="960" height="635" viewBox="0 0 960 635" role="img" aria-labelledby="title desc"><title id="title">用实际反例揭开“开发满分”的假象</title><desc id="desc">实际正常场景中 Trim 开发三验证二，Memorize 开发四验证一，Robust 两区均四。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="635" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">用实际反例揭开“开发满分”的假象</text><text x="480" y="95" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">候选实际评分；开发与验证各四题，最终测试未参与选择</text><rect x="45" y="130" width="220" height="104" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="155.0" y="162" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">Trim</text><text x="155.0" y="195" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">以验证增益决定</text><text x="430" y="158" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">开发 3/4</text><rect x="300" y="180" width="260" height="26" rx="5" fill="#e2e8f0"/><rect x="300" y="180" width="195" height="26" rx="5" fill="#2563eb"/><text x="745" y="158" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">验证 2/4</text><rect x="615" y="180" width="260" height="26" rx="5" fill="#e2e8f0"/><rect x="615" y="180" width="130" height="26" rx="5" fill="#0f766e"/><rect x="45" y="268" width="220" height="104" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="155.0" y="300" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">Memorize</text><text x="155.0" y="333" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">仅看左列会误判</text><text x="430" y="296" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">开发 4/4</text><rect x="300" y="318" width="260" height="26" rx="5" fill="#e2e8f0"/><rect x="300" y="318" width="260" height="26" rx="5" fill="#2563eb"/><text x="745" y="296" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">验证 1/4</text><rect x="615" y="318" width="260" height="26" rx="5" fill="#e2e8f0"/><rect x="615" y="318" width="65" height="26" rx="5" fill="#b45309"/><rect x="45" y="406" width="220" height="104" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="155.0" y="438" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">Robust</text><text x="155.0" y="471" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">以验证增益决定</text><text x="430" y="434" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">开发 4/4</text><rect x="300" y="456" width="260" height="26" rx="5" fill="#e2e8f0"/><rect x="300" y="456" width="260" height="26" rx="5" fill="#2563eb"/><text x="745" y="434" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">验证 4/4</text><rect x="615" y="456" width="260" height="26" rx="5" fill="#e2e8f0"/><rect x="615" y="456" width="260" height="26" rx="5" fill="#0f766e"/><text x="480" y="590" text-anchor="middle" font-size="20" fill="#b45309" font-weight="400">Memorize：开发满分，验证仍为 1/4，门控拒绝。</text></g></svg>
