<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">事实跨过进程边界，靠的是磁盘</title><desc id="desc">写入进程保存来源和事实，退出后新进程从同一存储召回，消息历史未传递。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="580" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">事实跨过进程边界，靠的是磁盘</text><rect x="40" y="90" width="390" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="235.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">会话 A · 写入进程</text><text x="235.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">显式要求：reply_language=中文</text><text x="235.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">来源：session-A</text><rect x="530" y="90" width="390" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="725.0" y="122" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">会话 B · 新进程</text><text x="725.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">输入只有目录、作用域、键</text><text x="725.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">召回值：中文</text><path d="M235 230 V314" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M725 318 V234" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="322" width="880" height="130" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="354" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">磁盘 · memory.json</text><text x="480.0" y="387" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">schema=1 · revision=1</text><text x="480.0" y="416" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">scope=project-a · key=reply_language</text><text x="480" y="280" text-anchor="middle" font-size="19" fill="#64748b" font-weight="700">写入退出后，才启动读取</text><text x="480" y="505" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="700">new-process 实测：2 次独立 CLI 调用，来源随事实一起恢复。</text><text x="480" y="545" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">两个进程不共享 Rust 对象；未恢复消息、审批或任务检查点。</text></g></svg>
