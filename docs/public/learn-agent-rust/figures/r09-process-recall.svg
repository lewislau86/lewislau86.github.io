<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">跨过进程边界的是文件，不是会话</title><desc id="desc">进程 1 核对用户原话后把偏好写进 SQLite 文件并退出；进程 2 的消息历史是空的，按键从同一个文件召回中文偏好和来源会话。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="540" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">跨过进程边界的是文件，不是会话</text><rect x="40" y="86" width="390" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="235.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">进程 1 · 会话 A</text><text x="235.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">“请记住：reply_language=中文”</text><text x="235.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">remember 核对原话后写入</text><text x="235.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结果：remember:saved</text><rect x="530" y="86" width="390" height="150" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="725.0" y="118" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">进程 2 · 会话 B</text><text x="725.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">“以后请用什么语言回答？”</text><text x="725.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">消息历史为空：system,user</text><text x="725.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">recall_memory 按键取最新</text><path d="M235 236 V300" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M725 300 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="306" width="880" height="120" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="338" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">SQLite 文件 · SqliteMemoryService</text><text x="480.0" y="371" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">app=workspace-assistant · user=user-1 · project=project-a</text><text x="480.0" y="400" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">reply_language=中文 · 来源 session-A 与原话</text><text x="480" y="470" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">进程 2 的结果：recall:found 中文 from session-A versions=1 answer=中文</text><text x="480" y="506" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">会话服务在进程内存里，进程退出就没了；留到下一个进程的只有这个文件。</text></g></svg>
