<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">一条任务贯穿循环与运行资源</title><desc id="desc">固定任务在 SQLite 领取，三节点循环调用真实 MCP 与私有审查，报告经宿主验收后提交终态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="800" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一条任务贯穿循环与运行资源</text><rect x="110" y="85" width="740" height="98" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">SQLite：固定到期身份 → startup-1 → CAS 领取</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">重复触发新增 0 条；owner=lead · epoch=1</text><path d="M480 183 V208 H160 V229" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="235" width="260" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="267" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">Prepare</text><text x="160.0" y="300" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">来源 · 历史 · 当前证据</text><rect x="350" y="235" width="260" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="267" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">ModelTurn</text><text x="480.0" y="300" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">LLM 消息与动作请求</text><rect x="670" y="235" width="260" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="800.0" y="267" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">ExecuteTools</text><text x="800.0" y="300" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">批准 · 派发 · 配对结果</text><path d="M290 282 H344" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M610 282 H664" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800 335 V365 H160 V341" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="392" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">graph-flow 推进会话；langchain-rust 承载消息与脚本 LLM</text><path d="M800 335 V419 H708 V440" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800 419 H252 V440" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="448" width="440" height="125" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="252.0" y="480" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">MCP：另一个直属进程</text><text x="252.0" y="513" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">stdio 握手 → 发现 → read_startup</text><text x="252.0" y="542" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">实际读取本次 worktree 的 README</text><rect x="500" y="448" width="428" height="125" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="714.0" y="480" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">reviewer：私有 Tokio 任务</text><text x="714.0" y="513" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">自己的 LLM 历史与只读动作</text><text x="714.0" y="542" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">request_id → 来源核对 → 回执</text><text x="480" y="608" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">两条路径绑定同一 worktree，共用父子预算账本。</text><rect x="110" y="638" width="740" height="125" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="670" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">写报告 → 独立验收 → 清理资源 → 提交终态与记忆</text><text x="480.0" y="703" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正常：7 次模型 / 5 次工具尝试；1 个审查句柄已回收</text><text x="480.0" y="732" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">主检出未改；报告工作区保留；MCP 已回收</text></g></svg>
