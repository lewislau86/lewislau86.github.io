<svg xmlns="http://www.w3.org/2000/svg" width="960" height="685" viewBox="0 0 960 685" role="img" aria-labelledby="title desc"><title id="title">先检查边界，再判断候选是否有增益</title><desc id="desc">宿主先检查修订与能力，再按固定额度运行开发和验证评分，符合门控才发布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="685" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">先检查边界，再判断候选是否有增益</text><rect x="45" y="90" width="870" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">候选提案</text><text x="480.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">策略 · 父修订 · 评分器标志 · 权限标志 · 固定成本</text><path d="M480 194 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="248" width="405" height="170" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="247.5" y="280" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">评估前检查</text><text x="247.5" y="313" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">父修订一致 · 评分器未变</text><text x="247.5" y="342" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">权限不扩大 · 成本合法</text><text x="247.5" y="371" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">搜索额度足够</text><path d="M450 330 H505" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="248" width="395" height="170" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="717.5" y="280" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">扣额度，再评分</text><text x="717.5" y="313" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">开发不退步</text><text x="717.5" y="342" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">验证严格提高</text><text x="717.5" y="371" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">没有增益也计一次尝试</text><path d="M718 418 V460 H480 V482" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="490" width="770" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="522" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">通过后发布；失败保留当前版本</text><text x="480.0" y="555" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终测试只在选择结束后审计一次</text><text x="480" y="645" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">有限策略与结构化标志的测试，不是恶意代码检测器。</text></g></svg>
