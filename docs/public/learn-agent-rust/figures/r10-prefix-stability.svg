<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">技能放在哪里，请求开头才不变</title><desc id="desc">两个问题选中不同的技能：技能放在用户这一轮时，系统消息与工具声明组成的前缀相同；放进系统消息时，前缀随技能变化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="540" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">技能放在哪里，请求开头才不变</text><text x="480" y="82" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同样两个问题：第一个选中 startup，第二个选中 sql-style</text><rect x="40" y="106" width="420" height="220" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="138" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">技能在用户这一轮</text><text x="250.0" y="171" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">with_skills</text><text x="250.0" y="200" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">前缀（system + 工具）：相同</text><text x="250.0" y="229" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">用户这一轮：不同</text><rect x="500" y="106" width="420" height="220" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="710.0" y="138" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">技能在系统消息</text><text x="710.0" y="171" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">global_instruction_provider</text><text x="710.0" y="200" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">前缀（system + 工具）：不同</text><text x="710.0" y="229" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">用户这一轮：不同</text><rect x="40" y="360" width="880" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="392" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">skill-update：技能发布新版本</text><text x="480.0" y="425" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">前缀：相同；用户这一轮：不同</text><text x="480" y="510" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">服务商的前缀缓存按请求开头匹配；会变的内容放在后面，开头才能保持不变。</text></g></svg>
