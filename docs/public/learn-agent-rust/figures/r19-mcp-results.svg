<svg xmlns="http://www.w3.org/2000/svg" width="960" height="676" viewBox="0 0 960 676" role="img" aria-labelledby="title desc"><title id="title">协议请求结束后，实际效果还需要核对</title><desc id="desc">七个实际场景对照权限拦截、成功写入、超时与断连；超时不代表没有业务效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="676" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">协议请求结束后，实际效果还需要核对</text><text x="480" y="89" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用数由服务日志与 tools/call 帧交叉核对；写入行数直接读文件。</text><text x="175" y="139" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">场景</text><text x="400" y="139" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">远端调用</text><text x="546" y="139" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">写入行数</text><text x="776" y="139" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">首个结果</text><rect x="25" y="159" width="910" height="45" rx="6" fill="#e2e8f0"/><text x="175" y="188" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">denied-write</text><text x="400" y="188" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">0</text><text x="546" y="188" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="776" y="188" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">approval_required</text><text x="175" y="239" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">approved-write</text><text x="400" y="239" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="546" y="239" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">1</text><text x="776" y="239" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">ok</text><rect x="25" y="261" width="910" height="45" rx="6" fill="#e2e8f0"/><text x="175" y="290" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">approval-mismatch</text><text x="400" y="290" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">0</text><text x="546" y="290" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="776" y="290" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">approval_required</text><text x="175" y="341" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">timeout</text><text x="400" y="341" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="546" y="341" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="776" y="341" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">timeout</text><rect x="25" y="363" width="910" height="45" rx="6" fill="#e2e8f0"/><text x="175" y="392" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">write-timeout</text><text x="400" y="392" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="546" y="392" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">1</text><text x="776" y="392" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">outcome_unknown</text><text x="175" y="443" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">server-crash</text><text x="400" y="443" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="546" y="443" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="776" y="443" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">transport_error</text><rect x="25" y="465" width="910" height="45" rx="6" fill="#e2e8f0"/><text x="175" y="494" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">result-limit</text><text x="400" y="494" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="546" y="494" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="776" y="494" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">result_limit</text><text x="480" y="592" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">write-timeout：已写一行，回复未完成；保留效果，停止自动重放。</text><text x="480" y="637" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">25 个场景共启动并核对回收 26 个直属子进程。</text></g></svg>
