<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="title desc"><title id="title">检查点位置决定从哪个工具继续</title><desc id="desc">相同两次读取在整批模式合并保存，逐工具模式保留第一条独立结果与游标。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="515" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">检查点位置决定从哪个工具继续</text><text x="480" y="90" text-anchor="middle" font-size="21" fill="#475569" font-weight="400">同样的两条读取：read-1 → read-2</text><rect x="40" y="120" width="400" height="120" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="152" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">batch · 一次结果提交</text><text x="240.0" y="185" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先执行 read-1，再执行 read-2</text><text x="240.0" y="214" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">执行中断：批次 in-flight</text><path d="M440 180 H510" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="120" width="400" height="120" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="152" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">一次工具步骤后</text><text x="720.0" y="185" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已保存 2 条结果</text><text x="720.0" y="214" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">cursor = 2</text><rect x="40" y="300" width="400" height="120" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="332" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">tool · 每条结果提交</text><text x="240.0" y="365" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">执行 read-1 → 保存结果与游标</text><text x="240.0" y="394" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">下次进程执行 read-2</text><path d="M440 360 H510" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="300" width="400" height="120" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="332" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">一次工具步骤后</text><text x="720.0" y="365" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已保存 1 条结果</text><text x="720.0" y="394" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">cursor = 1</text><text x="480" y="474" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">两种模式都先预留额度；保存边界决定可恢复的位置。</text></g></svg>
