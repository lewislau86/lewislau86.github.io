<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">三种召回方式，检索词从哪里来、谁挑结果</title><desc id="desc">应用的 recall_memory 按键取最新一条；LoadMemoryTool 返回检索到的两条，相关度相同时旧的排在前面，模型用了它；PreloadMemoryTool 用用户原话检索，自然语言问句检索不到。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="440" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">三种召回方式，检索词从哪里来、谁挑结果</text><text x="480" y="80" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同一个文件里有两条 reply_language：先写的中文，后写的 English</text><rect x="40" y="106" width="280" height="220" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="180.0" y="138" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">应用的 recall_memory</text><text x="180.0" y="171" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检索词：键名</text><text x="180.0" y="200" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按时间取最新一条</text><text x="180.0" y="229" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">共 2 个版本</text><text x="180.0" y="258" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结果：English（session-C）</text><rect x="340" y="106" width="280" height="220" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="138" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">LoadMemoryTool</text><text x="480.0" y="171" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检索词：模型自己写</text><text x="480.0" y="200" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">相关度相同，按写入顺序</text><text x="480.0" y="229" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回 2 条</text><text x="480.0" y="258" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型用了第一条：中文</text><rect x="640" y="106" width="280" height="220" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="780.0" y="138" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">PreloadMemoryTool</text><text x="780.0" y="171" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检索词：用户原话</text><text x="780.0" y="200" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">注入系统消息</text><text x="780.0" y="229" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">自然语言问句：注入 0 条</text><text x="780.0" y="258" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">含键名的问句：注入 1 条</text><text x="480" y="372" text-anchor="middle" font-size="18" fill="#b91c1c" font-weight="700">naive-load：模型用了第一条，答成中文——过期的偏好</text><text x="480" y="408" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">preload：一串汉字是一个词，问句里没有记录里的词，检索为空</text></g></svg>
