<svg xmlns="http://www.w3.org/2000/svg" width="960" height="644" viewBox="0 0 960 644" role="img" aria-labelledby="title desc"><title id="title">一次工具调用经过的几站，以及每站失败的后果</title><desc id="desc">before_tool 回调在策略之前运行，失败时调用不执行；策略拒绝的调用不执行也不触发 after_tool；工具失败时 after 回调照常运行；after_tool 回调失败时结果被扣下。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="644" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次工具调用经过的几站，以及每站失败的后果</text><rect x="120" y="80" width="720" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="112" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">before_tool 回调</text><text x="480.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">出错 / panic / 超时 → not_run（失败即关闭）</text><path d="M480 180 V201" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="208" width="720" height="100" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="240" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">策略检查（ToolPolicy）</text><text x="480.0" y="273" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">拒绝 → refused；回调无法放行被拒绝的调用</text><path d="M480 308 V329" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="336" width="720" height="100" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="368" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">执行工具</text><text x="480.0" y="401" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">失败 → failed；after 回调照常运行</text><path d="M480 436 V457" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="464" width="720" height="100" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="496" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">after_tool 回调</text><text x="480.0" y="529" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">出错 → withheld：结果扣下，后面的回调不再运行</text><text x="480" y="612" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">框架不给回调限时：本章的回调用 tokio::time::timeout 自己设上限。</text></g></svg>
