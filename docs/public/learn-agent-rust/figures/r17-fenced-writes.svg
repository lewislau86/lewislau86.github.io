<svg xmlns="http://www.w3.org/2000/svg" width="960" height="655" viewBox="0 0 960 655" role="img" aria-labelledby="title desc"><title id="title">名字可以复用，领取代次不能混用</title><desc id="desc">相同执行者名字的新旧领取依代次区分，旧代次完成与续租均被任务表拒绝。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="655" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">名字可以复用，领取代次不能混用</text><rect x="40" y="92" width="400" height="130" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="124" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">旧请求 · owner 相同</text><text x="240.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">owner = worker-a</text><text x="240.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">token = 1</text><rect x="520" y="92" width="400" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="124" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">数据库 · 当前领取</text><text x="720.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">owner = worker-a</text><text x="720.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">token = 2</text><path d="M240 222 V262 H480 V283" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 222 V262 H480" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="291" width="880" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="323" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">完成与续租：条件必须全部成立</text><text x="480.0" y="356" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">state = running · owner 相同 · token 相同</text><text x="480.0" y="385" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">now &lt; lease_until；续租还须严格延长截止时间</text><path d="M480 421 V461" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="469" width="880" height="100" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="501" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">同名仍无法绕过代次检查</text><text x="480.0" y="534" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">旧代次完成 + 旧代次续租：2 次 lease_rejected</text><text x="480" y="615" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">代次保护实际核验凭证的存储端；此处保护的是任务表。</text></g></svg>
