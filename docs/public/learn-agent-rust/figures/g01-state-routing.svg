<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">一次审查如何经过分支与修复回路</title><desc id="desc">准备后进行检查，达到要求则接受，否则在有界预算内修复并跳回检查，耗尽则交接。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="650" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次审查如何经过分支与修复回路</text><rect x="40" y="85" width="240" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">prepare</text><text x="160.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">draft = 1</text><path d="M280 140 H355" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="365" y="85" width="240" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">check</text><text x="485.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">等级达到 required？</text><path d="M605 140 H675" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="685" y="85" width="235" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="802.5" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">accept</text><text x="802.5" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">记录 accepted → End</text><path d="M480 195 V265" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="275" width="260" height="145" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="485.0" y="307" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">repair</text><text x="485.0" y="340" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未超额度：draft + 1</text><text x="485.0" y="369" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">GoTo(check)</text><path d="M355 345 H315 V140 H355" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M615 345 H675" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="685" y="275" width="235" height="145" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="802.5" y="307" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">handoff</text><text x="802.5" y="340" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">额度耗尽</text><text x="802.5" y="369" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">needs_human → End</text><rect x="75" y="485" width="810" height="120" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="480.0" y="517" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">状态在 Context，游标在 Session</text><text x="480.0" y="550" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">review：draft / required / repairs / outcome / trace</text><text x="480.0" y="579" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Continue 返回宿主；ContinueAndExecute 可在同一次调用继续</text></g></svg>
