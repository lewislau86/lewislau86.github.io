<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img" aria-labelledby="title desc"><title id="title">Rust Agent 的课程目标架构</title><desc id="desc">应用策略和 graph-flow 推进模型与工具节点。模型接口连接模型提供方，工具操作限定工作区，会话通过存储保存。目标模块将逐章实现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="750" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="38" text-anchor="middle" font-size="24" fill="#172033" font-weight="700">Rust Agent 的目标架构：模型、工具与状态如何连接</text><rect x="24" y="68" width="624" height="608" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="7 5"/><text x="336" y="98" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="700">一个 Rust 进程 · 一个 Tokio runtime</text><rect x="74" y="116" width="524" height="76" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="336.0" y="147" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">入口与应用策略</text><text x="336.0" y="173" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">CLI · 权限 · 预算 · 审批 · 停止条件</text><path d="M336 192 V222" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="74" y="226" width="524" height="76" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="336.0" y="257" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">graph-flow：图执行与会话</text><text x="336.0" y="283" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">Task · 路由 · Session · Storage</text><path d="M336 302 V332" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="74" y="336" width="524" height="76" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="336.0" y="367" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">应用节点与消息状态</text><text x="336.0" y="393" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">ModelTurn · ExecuteTools · 调用 ID · 结果回传</text><path d="M336 412 V444" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M74 374 H44 V612 H70" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="74" y="448" width="524" height="84" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="336.0" y="479" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">langchain-rust</text><text x="336.0" y="505" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">模型 trait · 消息 · 结构化调用结果</text><rect x="74" y="570" width="524" height="84" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="336.0" y="601" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">工具注册与执行</text><text x="336.0" y="627" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">参数校验 · 权限与超时 · 有界结果</text><path d="M598 493 H690" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="694" y="448" width="238" height="84" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="813.0" y="479" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">模型提供方</text><text x="813.0" y="505" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">假模型或外部服务</text><path d="M598 264 H690" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="694" y="226" width="238" height="90" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="813.0" y="257" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">会话存储</text><text x="813.0" y="283" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">内存 / 后续 PostgreSQL</text><text x="806" y="344" text-anchor="middle" font-size="16" fill="#b45309" font-weight="400">成功保存形成检查点</text><path d="M598 612 H690" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="694" y="570" width="238" height="84" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="813.0" y="601" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">限定工作区</text><text x="813.0" y="627" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">练习文件 / 外部工具</text><text x="480" y="726" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">示意图：模块按章节逐步实现；外部服务与恢复能力分别验收。</text></g></svg>
