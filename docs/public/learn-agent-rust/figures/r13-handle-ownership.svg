<svg xmlns="http://www.w3.org/2000/svg" width="960" height="574" viewBox="0 0 960 574" role="img" aria-labelledby="title desc"><title id="title">后台执行的句柄由谁保管？</title><desc id="desc">前台使用 ID，管理器持有有界线程与状态，worker 分块执行，退出时统一取消并回收。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="574" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">后台执行的句柄由谁保管？</text><rect x="32" y="88" width="250" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="157.0" y="120" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">前台 / 宿主</text><text x="157.0" y="153" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">启动后取得 job_id</text><text x="157.0" y="182" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">查询 · 取消 · 继续处理</text><path d="M282 150 H330" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="88" width="280" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="120" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">进程内管理器</text><text x="480.0" y="153" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">状态快照 + 线程句柄</text><text x="480.0" y="182" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最多 2 个未回收线程</text><path d="M620 150 H668" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="678" y="88" width="250" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="803.0" y="120" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">后台 worker</text><text x="803.0" y="153" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">分块写入半成品</text><text x="803.0" y="182" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检查取消后发布结果</text><path d="M803 220 V273 H480 V308" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="644" y="264" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="400">结束后由宿主收集</text><rect x="340" y="316" width="280" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="348" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">join → 终态 → 通知</text><text x="480.0" y="381" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">历史保留 4 条</text><text x="480.0" y="410" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">通知缓冲 1 条 ID</text><path d="M340 382 H157 V220" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="678" y="316" width="250" height="132" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="803.0" y="348" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">业务任务持久化</text><text x="803.0" y="381" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">业务 ID 与执行尝试</text><text x="803.0" y="410" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">R12 职责 · 本章未接入</text><text x="480" y="498" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">退出顺序：关闭准入 → 取消并唤醒所有 worker → 逐一 join</text><text x="480" y="538" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">job_id 供前台使用；JoinHandle 的所有权始终属于管理器。</text></g></svg>
