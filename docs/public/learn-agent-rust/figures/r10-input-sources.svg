<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">一次请求由哪几部分组成</title><desc id="desc">应用策略与 AGENTS.md 进第一条系统消息，环境由模板读会话状态进第二条，选中的技能拼进用户这一轮，工具声明按注册顺序附在请求上；最后 before_model 回调可以检查整份请求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="730" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次请求由哪几部分组成</text><rect x="40" y="80" width="440" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="260.0" y="112" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">static_instruction</text><text x="260.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">应用策略 + AGENTS.md</text><text x="260.0" y="174" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">原样发送，构建时就定了</text><path d="M480 134 H532" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="204" width="440" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="260.0" y="236" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">instruction 模板</text><text x="260.0" y="269" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">环境 ← 会话状态</text><text x="260.0" y="298" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每次运行开始时渲染一次</text><path d="M480 258 H532" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="328" width="440" height="108" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="260.0" y="360" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">with_skills</text><text x="260.0" y="393" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按问题选一份技能</text><text x="260.0" y="422" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">拼在用户这一轮原话前面</text><path d="M480 382 H532" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="452" width="440" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="260.0" y="484" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">.tool(...)</text><text x="260.0" y="517" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具声明，按注册顺序</text><text x="260.0" y="546" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read_file · set_locale · write_file</text><path d="M480 506 H532" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="540" y="80" width="380" height="480" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="730" y="112" text-anchor="middle" font-size="20" fill="#475569" font-weight="700">一次请求（normal 的第一次）</text><text x="730" y="142" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">第 1 条 system</text><text x="730" y="266" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">第 2 条 system</text><text x="730" y="390" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">user：[skill:…] + 原话</text><text x="730" y="514" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">请求的 tools 字段</text><text x="730" y="548" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">roles = system,system,user</text><path d="M730 560 V596" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="604" width="880" height="96" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="636" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">before_model_callback</text><text x="480.0" y="669" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">看得到整份请求：本章在这里检查字节预算，超了就不调用模型</text></g></svg>
