<svg xmlns="http://www.w3.org/2000/svg" width="960" height="652" viewBox="0 0 960 652" role="img" aria-labelledby="title desc"><title id="title">一次模型输入，分别保留控制信息与参考来源</title><desc id="desc">策略、注册表和环境进入 system，选中的知识进入独立参考数据消息，再接入原始历史。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="652" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次模型输入，分别保留控制信息与参考来源</text><rect x="40" y="85" width="400" height="142" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">应用选择的控制信息</text><text x="240.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">policy/core · 版本与摘要</text><text x="240.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具注册表 · 环境白名单</text><rect x="520" y="85" width="400" height="142" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="117" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">本次选择的参考数据</text><text x="720.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">skill/startup-guide</text><text x="720.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">memory/project · 版本与摘要</text><path d="M240 227 V275" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 227 V275" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="285" width="400" height="116" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="317" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">system 消息</text><text x="240.0" y="350" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">策略 + 工具目录 + 环境</text><text x="240.0" y="379" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">组装器固定，历史中禁止混入 system</text><rect x="520" y="285" width="400" height="116" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="317" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">human / reference_data</text><text x="720.0" y="350" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">用 JSON 保留资料原文和来源</text><text x="720.0" y="379" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">资料内容不会创建新的消息角色</text><path d="M240 401 V460" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 401 V460" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="470" width="880" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="502" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">再追加原始对话历史 → 完整模型输入</text><text x="480.0" y="535" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留 user / assistant / tool 顺序与调用 ID；组装结果不追加回历史。</text><text x="480" y="620" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">示意图：角色与来源由应用确定；文字包装本身不能保证模型遵循策略。</text></g></svg>
