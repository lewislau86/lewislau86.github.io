<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img" aria-labelledby="title desc"><title id="title">把扩展放到边界，沿一次工具轮次观察</title><desc id="desc">四个事件与回调顺序来自 R04 normal 实际运行。批准检查在前置事件之前，工具执行在前置与后置事件之间。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="734" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">把扩展放到边界，沿一次工具轮次观察</text><rect x="80" y="78" width="800" height="118" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="110" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">UserPromptSubmit</text><text x="480.0" y="143" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">接收输入，之后生成固定工具请求</text><text x="480.0" y="172" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">input-log</text><path d="M480 196 V219" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="228" width="800" height="118" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="260" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">PreToolUse</text><text x="480.0" y="293" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已核对批准，再运行执行前检查</text><text x="480.0" y="322" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">before-check → before-log</text><path d="M480 346 V369" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="378" width="800" height="118" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="410" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">PostToolUse</text><text x="480.0" y="443" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已得到真实工具结果，再运行后置检查</text><text x="480.0" y="472" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">after-check → after-log</text><path d="M480 496 V519" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="528" width="800" height="118" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="560" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">Stop</text><text x="480.0" y="593" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">任务停止时统一收尾，保留停止原因</text><text x="480.0" y="622" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">stop-log</text><text x="480" y="702" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正常路径实测顺序；Pre 与 Post 之间发生一次真实文件写入。</text></g></svg>
