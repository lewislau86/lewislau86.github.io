<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img" aria-labelledby="title desc"><title id="title">四个位置，沿一次工具调用观察</title><desc id="desc">回调顺序来自 R04 normal 实际运行：before_agent、before_tool、策略与执行、after_tool、after_agent。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="734" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">四个位置，沿一次工具调用观察</text><rect x="80" y="78" width="800" height="118" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="110" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">before_agent · Agent 开始前</text><text x="480.0" y="143" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">input-log → input-check</text><path d="M480 196 V219" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="228" width="800" height="118" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="260" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">before_tool · 工具执行前（策略检查之前）</text><text x="480.0" y="293" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">before-check → before-log</text><path d="M480 346 V369" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="700" y="364" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">策略检查 → 执行 write_summary</text><rect x="80" y="378" width="800" height="118" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="410" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">after_tool · 工具执行后</text><text x="480.0" y="443" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">after-check → after-log</text><path d="M480 496 V519" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="528" width="800" height="118" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="560" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">after_agent · Agent 结束时</text><text x="480.0" y="593" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">stop-log</text><text x="480" y="702" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">回调顺序取自正常路径的回调日志；策略的位置依据框架的受控路径（策略本身不写日志）。</text></g></svg>
