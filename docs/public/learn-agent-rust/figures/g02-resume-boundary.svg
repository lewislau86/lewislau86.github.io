<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">暂停的是执行，保存的是整个会话</title><desc id="desc">不同进程通过真实 SQLite SessionStorage 保存和读取会话；等待节点恢复时重新执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">暂停的是执行，保存的是整个会话</text><rect x="40" y="85" width="260" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">进程 A：推进到审批</text><text x="170.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">draft → approve</text><text x="170.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">WaitForInput</text><text x="170.0" y="208" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">游标仍为 approve</text><path d="M300 155 H345" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="85" width="250" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">SQLite SessionStorage</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Session JSON + version</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">事务核对旧 version</text><text x="480.0" y="208" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成功后 version + 1</text><path d="M605 155 H650" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="660" y="85" width="260" height="140" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="790.0" y="117" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">进程 B：保存决定</text><text x="790.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">revision + yes/no</text><text x="790.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">校验当前方案修订</text><text x="790.0" y="208" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">CAS 保存</text><path d="M790 225 V290 H480 V325" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="335" width="640" height="150" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="480.0" y="367" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">进程 C：重新进入 approve</text><text x="480.0" y="400" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">节点从头运行，读取已保存的决定</text><text x="480.0" y="429" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">GoTo(render/reject) → 下次 step 执行终态节点</text><text x="480.0" y="458" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">应用保存 terminal，重复 step 直接返回</text><text x="480" y="545" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">FlowRunner：load → execute_session → save；外部效果不在此事务内。</text></g></svg>
