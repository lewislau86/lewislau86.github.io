<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">暂停的是执行，保存的是检查点</title><desc id="desc">不同进程通过 SQLite 检查点保存和读取图的状态；恢复时暂停的节点重新运行，并按暂停 ID 拿到回答。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">暂停的是执行，保存的是检查点</text><rect x="40" y="85" width="260" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">进程 A：init</text><text x="170.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">draft → approve</text><text x="170.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">approve 暂停</text><text x="170.0" y="208" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回暂停 ID</text><path d="M300 155 H345" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="85" width="250" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">SQLite 检查点</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">状态 + 步号 + 待运行节点</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">暂停 ID 与答案格式</text><text x="480.0" y="208" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">版本号只增不减</text><path d="M605 155 H650" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="660" y="85" width="260" height="140" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="790.0" y="117" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">进程 B：answer</text><text x="790.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">严格恢复：只认暂停 ID</text><text x="790.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">答案先按格式校验</text><text x="790.0" y="208" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">宿主先核对图版本</text><path d="M790 225 V290 H480 V325" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="335" width="640" height="150" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="480.0" y="367" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">恢复：重新运行 approve</text><text x="480.0" y="400" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">这次带着回答，with_goto 到 render / reject / draft</text><text x="480.0" y="429" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已保存的步骤不再运行；已完成的线程直接返回最终状态</text><text x="480.0" y="458" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">两个写入者同时保存：后者 CheckpointConflict</text><text x="480" y="545" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">默认每个超步结束保存；崩溃时未保存的一步整步重跑，节点可能运行不止一次。</text></g></svg>
