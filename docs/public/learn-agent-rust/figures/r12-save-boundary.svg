<svg xmlns="http://www.w3.org/2000/svg" width="960" height="632" viewBox="0 0 960 632" role="img" aria-labelledby="title desc"><title id="title">保存是否跨过替换边界，决定恢复时看见什么</title><desc id="desc">crash-before-rename 与 crash-after-commit 的独立进程读取结果；没有验证物理断电。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="632" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">保存是否跨过替换边界，决定恢复时看见什么</text><rect x="200" y="82" width="560" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="114" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">写候选 → sync_all → rename</text><text x="480.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同目录替换 tasks.json</text><text x="480.0" y="176" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Unix 再同步父目录，然后才应答</text><path d="M340 222 V260 H245 V294" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 222 V260 H715 V294" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="304" width="420" height="200" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="245.0" y="336" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">替换前终止并回收</text><text x="245.0" y="369" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正式 revision=1</text><text x="245.0" y="398" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">readme=pending#0</text><text x="245.0" y="427" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">遗留 .tasks.pending</text><text x="245.0" y="456" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读旧板；新保存被阻止</text><rect x="505" y="304" width="420" height="200" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="715.0" y="336" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">替换与目录同步后终止</text><text x="715.0" y="369" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正式 revision=2</text><text x="715.0" y="398" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">readme=running#1</text><text x="715.0" y="427" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">候选路径已被替换</text><text x="715.0" y="456" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">重启保留 Running，等待核对</text><text x="480" y="552" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">两个检查点均真实终止子进程，再由新进程检查文件。</text><text x="480" y="592" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未模拟物理断电；committed 仅表示已越过 rename 边界。</text></g></svg>
