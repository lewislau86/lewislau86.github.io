<svg xmlns="http://www.w3.org/2000/svg" width="960" height="663" viewBox="0 0 960 663" role="img" aria-labelledby="title desc"><title id="title">投递失败，请求表也保留原状</title><desc id="desc">满邮箱时丢弃候选状态，释放空间后可以用相同关闭 ID 重投。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="663" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">投递失败，请求表也保留原状</text><rect x="40" y="85" width="880" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">① clone 请求表 → 验证候选状态</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">候选：建立 stop-core，冻结成员，撤销未执行批准</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">权威表此时还保持原状</text><path d="M270 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="247" width="420" height="144" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="250.0" y="279" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">② 邮箱已满 · try_send 失败</text><text x="250.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">mailbox_full</text><text x="250.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">丢弃候选；不占关闭 ID</text><text x="250.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不冻结成员、不撤销原批准</text><rect x="500" y="247" width="420" height="144" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="279" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">② 邮箱有空间 · try_send 成功</text><text x="710.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">消息实际入队</text><text x="710.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">随后提交候选表</text><text x="710.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本地锁内无 await</text><path d="M270 391 V433 H480 V463" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="471" width="880" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="503" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">③ 满邮箱实验：释放空间，再用原 ID 发送</text><text x="480.0" y="536" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">回滚检查：true · 计划实际写入：1 次</text><text x="480.0" y="565" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">stop-core 最终收到合法关闭回复</text><text x="480" y="629" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">这是进程内投递与状态边界；内存候选不提供崩溃恢复。</text></g></svg>
