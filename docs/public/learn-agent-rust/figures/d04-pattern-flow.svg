<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">计划由谁提出、检查、批准、执行</title><desc id="desc">左边是规划—执行循环：规划者提出计划、应用检查、执行者执行并记账，读到新文件就重规划；右边是计划模式：只读调查、提交计划、人批准、步骤检查通过后，下一轮对话切到询问模式，改文件时再问一次人。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="540" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">计划由谁提出、检查、批准、执行</text><text x="240" y="72" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">LoopAgent：规划—执行—重规划</text><rect x="30" y="90" width="420" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">规划者（LlmAgent）</text><text x="240.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">提出完整的新计划</text><text x="240.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">write_plan / exit_loop</text><rect x="30" y="218" width="420" height="108" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="250" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">应用检查</text><text x="240.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">修订号 = 当前 + 1</text><text x="240.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已完成步骤一个不少</text><path d="M240 200 V216" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="346" width="420" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="378" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">执行者（CustomAgent）</text><text x="240.0" y="411" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">执行下一个待办步骤</text><text x="240.0" y="440" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结果记进账本</text><path d="M240 328 V344" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="488" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">discover：修订 1,2,3，账本 3 条</text><text x="240" y="512" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">missing-file → step_failed；stuck → loop_limit</text><text x="720" y="72" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">adk-harness：计划模式（Beta）</text><rect x="510" y="90" width="420" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">计划模式</text><text x="720.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只读调查；改文件被拒绝</text><rect x="510" y="218" width="420" height="108" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="250" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">exit_plan_mode</text><text x="720.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先问人（每次都问）</text><text x="720.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">再检查步骤 id 与依赖</text><path d="M720 200 V216" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="346" width="420" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="378" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">下一轮对话：询问模式</text><text x="720.0" y="411" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">默认进询问模式</text><text x="720.0" y="440" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">改文件时再问一次人</text><path d="M720 328 V344" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="488" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">plan-mode-approved：写出文件 = yes</text><text x="720" y="512" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">rejected / invalid：模式不变，写出文件 = no</text></g></svg>
