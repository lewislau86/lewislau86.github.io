<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">错过三次触发，补什么由策略决定</title><desc id="desc">同一输入下合并策略补最近一次并丢弃较早两次，跳过策略因最近一次也超宽限而不入队。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">错过三次触发，补什么由策略决定</text><text x="480" y="86" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">同一起点、时区、当地时分与扫描时刻，只改变策略。</text><rect x="40" y="114" width="880" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="146" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">扫描窗口中发现 3 个到期点</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">扫描 UTC：2026-11-08T01:05:00Z</text><circle cx="180" cy="266" r="22" fill="#64748b"/><text x="180" y="273" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">1</text><path d="M210 266 H450" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="480" cy="266" r="22" fill="#64748b"/><text x="480" y="273" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">2</text><path d="M510 266 H750" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="780" cy="266" r="22" fill="#0f766e"/><text x="780" y="273" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">3</text><text x="480" y="324" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="700">最近到期点 UTC：2026-11-08T01:00:00Z</text><rect x="40" y="366" width="400" height="145" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="398" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">coalesce · 合并补最近一次</text><text x="240.0" y="431" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">入队 1 条</text><text x="240.0" y="460" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">丢弃 2 个较早到期点</text><rect x="520" y="366" width="400" height="145" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="398" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">skip · 最近一次也已过期</text><text x="720.0" y="431" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">入队 0 条</text><text x="720.0" y="460" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">丢弃 3 个到期点</text><text x="480" y="565" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">两种策略都推进游标；丢弃的旧点不会在下一次重复补发。</text></g></svg>
