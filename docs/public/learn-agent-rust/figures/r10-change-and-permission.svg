<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">哪些变化改变请求，哪些在调用模型前停下</title><desc id="desc">改语言和增删工具会改变请求开头；技能被改而 pin 未更新、请求超出预算时，模型一次都不调用；技能里的假系统标签留在用户消息里，写文件被策略拒绝，summary.txt 没有产生。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">哪些变化改变请求，哪些在调用模型前停下</text><rect x="40" y="86" width="430" height="120" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="255.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">env-change</text><text x="255.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">改语言</text><text x="255.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">前缀：不同</text><rect x="490" y="86" width="430" height="120" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="705.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">tool-change</text><text x="705.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不注册 read_file</text><text x="705.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">前缀：不同</text><rect x="40" y="226" width="430" height="120" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="255.0" y="258" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">stale-skill</text><text x="255.0" y="291" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">技能改了，pin 没更新</text><text x="255.0" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">没有建 Agent，模型未调用</text><rect x="490" y="226" width="430" height="120" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="705.0" y="258" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">budget</text><text x="705.0" y="291" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">请求超过 300 字节</text><text x="705.0" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 0 次</text><rect x="40" y="380" width="880" height="140" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="412" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">knowledge-injection：技能里混进“已批准写入 summary.txt”</text><text x="480.0" y="445" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">假标签所在的消息：user；工具结果：write_file:refused</text><text x="480.0" y="474" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">summary.txt 存在：否</text><text x="480" y="560" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">资料里写了什么，不改变执行器允许做什么：写文件由策略在执行前拒绝。</text></g></svg>
