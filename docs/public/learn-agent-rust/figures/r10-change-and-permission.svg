<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">输入变化使前缀失效，执行权限单独核对</title><desc id="desc">四次前后组装对照与越权写入场景均来自实际运行记录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="650" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">输入变化使前缀失效，执行权限单独核对</text><text x="480" y="95" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">同一 Assembler 中组装前后输入的确定性对照</text><rect x="40" y="125" width="880" height="68" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="157" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">相同来源，仅调换选择顺序</text><text x="480" y="181" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">完整输入相同：true · 前缀缓存命中：true</text><rect x="40" y="203" width="880" height="68" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="235" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">发布新版记忆并更新 pin</text><text x="480" y="259" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">完整输入相同：false · 前缀缓存命中：false</text><rect x="40" y="281" width="880" height="68" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="313" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">切换环境语言</text><text x="480" y="337" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">完整输入相同：false · 前缀缓存命中：false</text><rect x="40" y="359" width="880" height="68" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="391" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">关闭读取工具</text><text x="480" y="415" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">完整输入相同：false · 前缀缓存命中：false</text><rect x="40" y="465" width="880" height="112" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="497" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">知识要求写入时，执行器仍检查权限</text><text x="480.0" y="530" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写入请求 1 次 · 实际产生摘要文件：否</text><text x="480.0" y="559" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">脚本模型故意提出越权动作，应用返回 permission_denied。</text><text x="480" y="619" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">缓存用于本进程的组装前缀；这不是 provider 缓存，也不是模型抗注入评估。</text></g></svg>
