<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc"><title id="title">规则是否生效，用文件调用次数核对</title><desc id="desc">实际运行的十个场景中，等待、拒绝和参数替换没有写入尝试；批准和重复批准只写一次；写入失败计一次尝试零次成功。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="710" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">规则是否生效，用文件调用次数核对</text><text x="480" y="84" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每个场景都先完成一次 README 读取；下表只比较写入与审批状态。</text><text x="155" y="135" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">场景</text><text x="390" y="135" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">写入尝试</text><text x="540" y="135" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">写入成功</text><text x="695" y="135" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">工具结果数</text><text x="845" y="135" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">仍在等待</text><rect x="28" y="143" width="904" height="42" rx="6" fill="#e2e8f0"/><text x="155" y="171" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">read</text><text x="390" y="171" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="540" y="171" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="695" y="171" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1</text><text x="845" y="171" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">否</text><text x="155" y="215" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">deny</text><text x="390" y="215" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="540" y="215" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="695" y="215" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">2</text><text x="845" y="215" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">否</text><rect x="28" y="231" width="904" height="42" rx="6" fill="#e2e8f0"/><text x="155" y="259" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">invalid-path</text><text x="390" y="259" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="540" y="259" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="695" y="259" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">2</text><text x="845" y="259" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">否</text><text x="155" y="303" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">unknown</text><text x="390" y="303" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="540" y="303" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="695" y="303" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">2</text><text x="845" y="303" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">否</text><rect x="28" y="319" width="904" height="42" rx="6" fill="#e2e8f0"/><text x="155" y="347" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">wait</text><text x="390" y="347" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="540" y="347" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="695" y="347" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1</text><text x="845" y="347" text-anchor="middle" font-size="19" fill="#b45309" font-weight="400">是</text><text x="155" y="391" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">approve</text><text x="390" y="391" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1</text><text x="540" y="391" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1</text><text x="695" y="391" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">2</text><text x="845" y="391" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">否</text><rect x="28" y="407" width="904" height="42" rx="6" fill="#e2e8f0"/><text x="155" y="435" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">decline</text><text x="390" y="435" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="540" y="435" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="695" y="435" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">2</text><text x="845" y="435" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">否</text><text x="155" y="479" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">tamper</text><text x="390" y="479" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="540" y="479" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="695" y="479" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1</text><text x="845" y="479" text-anchor="middle" font-size="19" fill="#b45309" font-weight="400">是</text><rect x="28" y="495" width="904" height="42" rx="6" fill="#e2e8f0"/><text x="155" y="523" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">replay</text><text x="390" y="523" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1</text><text x="540" y="523" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1</text><text x="695" y="523" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">2</text><text x="845" y="523" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">否</text><text x="155" y="567" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">write-error</text><text x="390" y="567" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">1</text><text x="540" y="567" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">0</text><text x="695" y="567" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">2</text><text x="845" y="567" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">否</text><text x="480" y="644" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具结果包含读取结果；审批错配和重复回复不会再生成工具结果。</text><text x="480" y="681" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">数据来自 R03 的真实文件实验；模型请求与人工回复为固定测试输入。</text></g></svg>
