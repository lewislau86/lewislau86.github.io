<svg xmlns="http://www.w3.org/2000/svg" width="960" height="636" viewBox="0 0 960 636" role="img" aria-labelledby="title desc"><title id="title">一次请求，在执行前分成三条路径</title><desc id="desc">只读请求直接执行，指定写入等待审批，其余请求直接拒绝；等待期间没有写入结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="636" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次请求，在执行前分成三条路径</text><rect x="180" y="78" width="600" height="100" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="110" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">模型提出 ToolCall</text><text x="480.0" y="143" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用 ID + 工具类型 + 完整参数</text><path d="M480 178 V210" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="180" y="218" width="600" height="95" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="250" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">应用执行 check_permission</text><text x="480.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按明确规则分类；未命中许可范围则拒绝</text><path d="M300 313 V343 H167 V373" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 313 V373" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660 313 V343 H793 V373" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="382" width="278" height="136" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="167.0" y="414" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">Allow</text><text x="167.0" y="447" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取 README.md</text><text x="167.0" y="476" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">直接调用文件工具</text><rect x="341" y="382" width="278" height="136" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="414" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">AskApproval</text><text x="480.0" y="447" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写入 notes/summary.txt</text><text x="480.0" y="476" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保存请求，返回等待</text><rect x="654" y="382" width="278" height="136" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="793.0" y="414" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">Deny</text><text x="793.0" y="447" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">其他动作或超长内容</text><text x="793.0" y="476" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">生成 denied 工具结果</text><text x="480" y="562" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">只有等待分支保留 pending；此时不生成写入工具结果。</text><text x="480" y="604" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">示意图：本章使用固定文件规则，应用自己决定动作权限。</text></g></svg>
