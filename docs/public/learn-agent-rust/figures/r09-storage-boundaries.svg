<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">把保存失败放在准确的提交位置</title><desc id="desc">写临时文件并同步后替换正式文件；替换前故障保留旧文件，替换后错误需重新确认状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="640" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">把保存失败放在准确的提交位置</text><rect x="40" y="88" width="880" height="92" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="120" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">持有写者锁，读取并校验当前版本</text><text x="480.0" y="153" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">过期版本 → revision_conflict；已有锁 → store_busy</text><path d="M480 180 V214" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="222" width="420" height="126" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="254" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">写同目录临时文件</text><text x="250.0" y="287" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">write_all → sync_all → close</text><text x="250.0" y="316" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">此时正式文件仍是旧字节</text><path d="M460 285 H526" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="222" width="390" height="126" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="725.0" y="254" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">替换前故障</text><text x="725.0" y="287" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">before_rename</text><text x="725.0" y="316" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">清理本次锁与临时文件</text><path d="M250 348 V382" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="390" width="420" height="126" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="422" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">rename 替换正式文件</text><text x="250.0" y="455" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Unix 再同步目录项</text><text x="250.0" y="484" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">此后报错须重新读盘确认</text><path d="M725 348 V382" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="390" width="390" height="126" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="725.0" y="422" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">新进程再读旧文件</text><text x="725.0" y="455" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">status=found</text><text x="725.0" y="484" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">值：中文</text><text x="480" y="562" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已验证：替换前故障保持旧字节；损坏记录拒读、拒写且保留原文件。</text><text x="480" y="602" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未演练：断电恢复、强制终止、高并发压力与网络盘。</text></g></svg>
