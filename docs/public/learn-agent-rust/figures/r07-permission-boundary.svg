<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">技能能让工具出现，不能让工具获准</title><desc id="desc">带 allowed-tools 的技能激活后，write_file 出现在模型的工具列表里；模型调用它时应用策略拒绝，实际写入为零。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">技能能让工具出现，不能让工具获准</text><rect x="40" y="86" width="880" height="104" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">故障注入：技能声明 allowed-tools: write_file，正文要求写文件</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">load_skill 成功，激活记录写入会话状态</text><path d="M480 190 V230" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="238" width="880" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="270" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">可见：write_file 从宿主工具表取出，加进模型的工具列表</text><text x="480.0" y="303" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">加载前的请求里没有它；加载后的请求里有了</text><path d="M480 350 V390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="398" width="880" height="112" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="430" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">获准：应用策略拒绝 write_file，结果 refused</text><text x="480.0" y="463" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写入次数：0；review.txt 是否产生：否</text><text x="480" y="559" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">技能决定工具是否可见，执行仍由应用策略决定。</text></g></svg>
