<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">技能内容进入上下文，执行权限仍由应用决定</title><desc id="desc">故障场景成功加载带写入要求的技能，但写入请求在应用入口被拒绝，实际写入次数为零。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">技能内容进入上下文，执行权限仍由应用决定</text><rect x="40" y="86" width="880" height="104" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">故障注入：技能声明 allowed-tools 并要求写文件</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">技能正文成功加载，模型随后提出 write_file 请求。</text><path d="M480 190 V230" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="238" width="880" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="270" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">应用策略仍是 allow_write = false</text><text x="480.0" y="303" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">World.dispatch 在文件写入入口检查权限</text><text x="480.0" y="332" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">加载代码没有修改策略字段</text><path d="M480 350 V390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="398" width="880" height="112" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="430" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">按原调用 ID 返回 permission_denied</text><text x="480.0" y="463" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写入尝试：0；review.txt 是否产生：否</text><text x="480.0" y="492" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">目标代码是否保持原样：是</text><text x="480" y="559" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">验证的是这一份应用的执行边界；技能内容质量与真实模型行为另行评估。</text></g></svg>
