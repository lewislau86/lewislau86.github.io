<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">恢复后的任务仍然有终点</title><desc id="desc">九个实际场景展示预算、截止时间、取消与结果不明的停止；源于二十一个场景的实验记录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="730" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">恢复后的任务仍然有终点</text><text x="480" y="86" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">累计尝试含失败；日志行数由验证器直接读取文件核对。</text><text x="170" y="132" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">场景</text><text x="418" y="132" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">总尝试</text><text x="592" y="132" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">日志行数</text><text x="805" y="132" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">停止原因</text><rect x="24" y="155" width="912" height="44" rx="6" fill="#e2e8f0"/><text x="170" y="183" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">normal</text><text x="418" y="183" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="592" y="183" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="805" y="183" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">completed</text><text x="170" y="231" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">attempt-limit</text><text x="418" y="231" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">3</text><text x="592" y="231" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="805" y="231" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">attempt_limit</text><rect x="24" y="251" width="912" height="44" rx="6" fill="#e2e8f0"/><text x="170" y="279" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">call-budget</text><text x="418" y="279" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">2</text><text x="592" y="279" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="805" y="279" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">call_budget</text><text x="170" y="327" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">wait-budget</text><text x="418" y="327" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">2</text><text x="592" y="327" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="805" y="327" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">wait_budget</text><rect x="24" y="347" width="912" height="44" rx="6" fill="#e2e8f0"/><text x="170" y="375" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">resume-budget</text><text x="418" y="375" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">2</text><text x="592" y="375" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="805" y="375" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">call_budget</text><text x="170" y="423" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">resume-expired</text><text x="418" y="423" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="592" y="423" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="805" y="423" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">deadline</text><rect x="24" y="443" width="912" height="44" rx="6" fill="#e2e8f0"/><text x="170" y="471" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">cancelled-backoff</text><text x="418" y="471" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="592" y="471" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="805" y="471" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">cancelled</text><text x="170" y="519" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">shared-budget</text><text x="418" y="519" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">3</text><text x="592" y="519" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">0</text><text x="805" y="519" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">call_budget</text><rect x="24" y="539" width="912" height="44" rx="6" fill="#e2e8f0"/><text x="170" y="567" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">append-unknown</text><text x="418" y="567" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="592" y="567" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">1</text><text x="805" y="567" text-anchor="middle" font-size="17" fill="#172033" font-weight="400">needs_reconciliation</text><text x="480" y="654" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">恢复保留总账；换一个 call_id 也不能越过任务额度。</text><text x="480" y="693" text-anchor="middle" font-size="18" fill="#b45309" font-weight="400">append-unknown：写入一行后丢弃回复，程序只执行一次。</text></g></svg>
