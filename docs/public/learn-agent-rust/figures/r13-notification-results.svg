<svg xmlns="http://www.w3.org/2000/svg" width="960" height="596" viewBox="0 0 960 596" role="img" aria-labelledby="title desc"><title id="title">通知是提醒，终态才是查询依据</title><desc id="desc">实测一个通知、两个已完成状态与两份完整报告。通知溢出不改变执行终态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="596" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">通知是提醒，终态才是查询依据</text><rect x="38" y="86" width="884" height="88" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">notifications 场景：两个 worker 都完成</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">管理器先写终态，再尝试投递通知。</text><text x="153" y="260" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">收到通知</text><rect x="260" y="236" width="245" height="38" rx="6" fill="#b45309"/><text x="539" y="262" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">1</text><text x="153" y="341" text-anchor="middle" font-size="20" fill="#2563eb" font-weight="700">可查询完成</text><rect x="260" y="317" width="490" height="38" rx="6" fill="#2563eb"/><text x="784" y="343" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">2</text><text x="153" y="422" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">完整报告</text><rect x="260" y="398" width="490" height="38" rx="6" fill="#0f766e"/><text x="784" y="424" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">2</text><text x="480" y="522" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">缓冲 1 条，丢弃 1 条提醒；查询与完整文件仍保留结果。</text><text x="480" y="561" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">状态保留期内可查询；长期事实另交持久化记录。</text></g></svg>
