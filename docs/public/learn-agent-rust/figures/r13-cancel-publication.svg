<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" role="img" aria-labelledby="title desc"><title id="title">取消与完成竞争：由同一处检查决定顺序</title><desc id="desc">实测取消先到时没有最终报告，发布先到时取消返回 TooLate 并保留完整报告。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="544" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">取消与完成竞争：由同一处检查决定顺序</text><rect x="32" y="86" width="430" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="247.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">顺序一：取消先获得锁</text><text x="247.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写入一段 → cancel = true</text><rect x="498" y="86" width="430" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="713.0" y="118" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">顺序二：发布先获得锁</text><text x="713.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">写完三段 → rename + published</text><path d="M247 198 V244" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M713 198 V244" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="254" width="430" height="142" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="247.0" y="286" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">worker 观察到取消</text><text x="247.0" y="319" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">停止后续写入，清理半成品</text><text x="247.0" y="348" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">join 后状态为 Cancelled</text><rect x="498" y="254" width="430" height="142" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="713.0" y="286" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">cancel 返回 TooLate</text><text x="713.0" y="319" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留完整报告</text><text x="713.0" y="348" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">join 后状态为 Completed</text><text x="247" y="442" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">实际报告 0 份 · 半成品 0 份</text><text x="713" y="442" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">实际报告 1 份 · 半成品 0 份</text><text x="480" y="503" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">发布与取消共用同一把锁，避免在接受取消后越过发布检查点。</text></g></svg>
