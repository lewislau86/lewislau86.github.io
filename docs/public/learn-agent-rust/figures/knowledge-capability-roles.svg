<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc"><title id="title">同一个任务里的四类职责</title><desc id="desc">方法与历史进入上下文，检索提供证据，MCP 连接外部能力；宿主控制权限与预算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="790" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">同一个任务里的四类职责</text><rect x="40" y="85" width="420" height="155" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">Skills：工作方法</text><text x="250.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按需读升级审查步骤</text><text x="250.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">指令、脚本与参考资源</text><rect x="500" y="85" width="420" height="155" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">Memory：历史事实</text><text x="710.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">召回语言偏好与项目约定</text><text x="710.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留来源、范围与修订</text><path d="M250 240 V290 H480 V322" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 240 V290 H480" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="220" y="330" width="520" height="135" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="480.0" y="362" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">Agent 宿主与模型循环</text><text x="480.0" y="395" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">组装输入，检查权限与预算</text><text x="480.0" y="424" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">根据工具结果继续或交回控制</text><path d="M320 465 V520" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640 465 V520" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="530" width="420" height="165" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="250.0" y="562" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">RAG：查当前证据</text><text x="250.0" y="595" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按问题检索资料，保留引用</text><text x="250.0" y="624" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">资料与可信策略分开处理</text><rect x="500" y="530" width="420" height="165" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="710.0" y="562" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">MCP：连接外部能力</text><text x="710.0" y="595" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Host → Client → Server</text><text x="710.0" y="624" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具、资源与提示模板</text><text x="480" y="747" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">检索可在本地运行，也可经 MCP 工具暴露；图示为设计关系。</text></g></svg>
