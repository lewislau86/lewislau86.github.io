<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">只有当前 owner，业务仍可能重复产生结果</title><desc id="desc">两个场景都发生两次业务调用，关闭去重产生两份报告，开启业务端稳定身份去重仅产生一份。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="640" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">只有当前 owner，业务仍可能重复产生结果</text><rect x="40" y="86" width="880" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">相同退出窗口与接管顺序</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">A 提交业务动作 → 退出；到期后 B 接管 → 再次调用</text><rect x="40" y="255" width="400" height="140" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="287" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">业务服务关闭去重</text><text x="240.0" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">calls = 2 · reports = 2</text><text x="240.0" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终任务 token = 2</text><path d="M240 196 V247" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="255" width="400" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="287" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">业务服务开启稳定身份去重</text><text x="720.0" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">calls = 2 · reports = 1</text><text x="720.0" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终任务 token = 2</text><path d="M720 196 V247" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="445" width="880" height="105" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="477" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">去重身份跨领取代次保持不变</text><text x="480.0" y="510" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">report:report；去重键与报告在业务库同一事务提交</text><text x="480" y="598" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">队列完成只有一次，业务调用仍有两次；两个边界分别核对。</text></g></svg>
