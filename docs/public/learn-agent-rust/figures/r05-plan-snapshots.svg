<svg xmlns="http://www.w3.org/2000/svg" width="960" height="638" viewBox="0 0 960 638" role="img" aria-labelledby="title desc"><title id="title">计划在每一轮输入中如何变化？</title><desc id="desc">七轮输入和版本来自 normal 实际运行记录，文件读取不会自动完成清单条目。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="638" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">计划在每一轮输入中如何变化？</text><text x="480" y="85" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">每次模型调用前，重新读取运行时的清单与历史</text><text x="95" y="133" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">模型轮次</text><text x="225" y="133" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">清单版本</text><text x="395" y="133" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">读取 README</text><text x="605" y="133" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">整理说明</text><text x="815" y="133" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">核对原文</text><rect x="40" y="156" width="880" height="44" rx="8" fill="#fff"/><text x="95" y="185" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">1</text><text x="225" y="185" text-anchor="middle" font-size="19" fill="#2563eb" font-weight="700">0</text><text x="395" y="185" text-anchor="middle" font-size="18" fill="#64748b" font-weight="400">尚未建单</text><text x="605" y="185" text-anchor="middle" font-size="18" fill="#64748b" font-weight="400">尚未建单</text><text x="815" y="185" text-anchor="middle" font-size="18" fill="#64748b" font-weight="400">尚未建单</text><rect x="40" y="208" width="880" height="44" rx="8" fill="#eff6ff"/><text x="95" y="237" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">2</text><text x="225"