<svg xmlns="http://www.w3.org/2000/svg" width="960" height="638" viewBox="0 0 960 638" role="img" aria-labelledby="title desc"><title id="title">批准绑定到哪一次动作？</title><desc id="desc">审批比较会话、序号、调用 ID、工具类型和全部参数；匹配后先消耗，再拒绝或执行保存的动作。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="638" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">批准绑定到哪一次动作？</text><rect x="30" y="86" width="420" height="226" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">pending 保存完整快照</text><text x="240.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">当前会话的工作区 scope</text><text x="240.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">审批序号 + call_id</text><text x="240.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具类型 + 路径 + 写入内容</text><text x="240.0" y="238" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每个字段都参与相等比较</text><rect x="510" y="86" width="420" height="226" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">可信入口提交人工决定</text><text x="720.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">展示快照后选择批准或拒绝</text><text x="720.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">回复必须匹配保存的快照</text><text x="720.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不匹配：保留等待状态</text><text x="720.0" y="238" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">批准身份由外层 UI 负责</text><path d="M450 200 H501" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 312 V363 H480 V378" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="347" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">匹配后先 take()，移走 pending</text><rect x="30" y="390" width="420" height="130" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="240.0" y="422" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">人工拒绝</text><text x="240.0" y="455" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不调用文件工具</text><text x="240.0" y="484" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回 declined + 原 call_id</text><rect x="510" y="390" width="420" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="422" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">人工批准</text><text x="720.0" y="455" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">执行保存的原始动作</text><text x="720.0" y="484" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回 ok 或 tool_error</text><text x="480" y="563" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">两条分支都消耗本次审批；执行失败也不恢复已用审批。</text><text x="480" y="606" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">示意图：状态只在当前进程；跨进程恢复与外部幂等在后续专题验证。</text></g></svg>
