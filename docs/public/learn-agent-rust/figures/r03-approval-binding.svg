<svg xmlns="http://www.w3.org/2000/svg" width="960" height="638" viewBox="0 0 960 638" role="img" aria-labelledby="title desc"><title id="title">批准绑定到哪一次调用？</title><desc id="desc">审批记录保存完整请求并合成指纹；决定按指纹记录，下一次运行取走决定后拒绝或执行原来那次调用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="638" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">批准绑定到哪一次调用？</text><rect x="30" y="86" width="420" height="226" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">审批记录保存完整请求</text><text x="240.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">会话范围：app / user / session</text><text x="240.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">指纹 = 执行的 Agent + 工具来源与声明</text><text x="240.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">+ 工具名 + 规范化参数</text><text x="240.0" y="238" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用 ID 不在指纹里</text><rect x="510" y="86" width="420" height="226" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">审批人按指纹记下决定</text><text x="720.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只对 pending() 里的指纹做决定</text><text x="720.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不一致：等待中的调用继续等待</text><text x="720.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">多出的决定会变成预先批准</text><text x="720.0" y="238" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">审批人的身份由外层系统负责</text><path d="M450 200 H501" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 312 V363 H480 V378" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="347" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">下一次运行开始时，取走决定（取走即用掉）</text><rect x="30" y="390" width="420" height="130" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="240.0" y="422" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">拒绝</text><text x="240.0" y="455" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具不执行</text><text x="240.0" y="484" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结果 refused，带原调用 ID</text><rect x="510" y="390" width="420" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="422" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">批准</text><text x="720.0" y="455" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">执行原来那次调用：同一调用 ID、同一参数</text><text x="720.0" y="484" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结果 ok 或 failed</text><text x="480" y="563" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">两条分支都用掉这次决定；执行失败也不退回。</text><text x="480" y="606" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">示意图：本章审批记录只在内存里；跨进程恢复在后续章节验证。</text></g></svg>
