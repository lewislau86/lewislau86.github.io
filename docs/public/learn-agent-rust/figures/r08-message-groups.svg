<svg xmlns="http://www.w3.org/2000/svg" width="960" height="654" viewBox="0 0 960 654" role="img" aria-labelledby="title desc"><title id="title">按完整消息组选择摘要切口</title><desc id="desc">同一 assistant 的两个工具调用必须分别匹配结果，再进入下一消息组；normal 保留最近两个完整组。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="654" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">按完整消息组选择摘要切口</text><rect x="40" y="86" width="880" height="118" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">m2：一条 assistant，两个调用</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">old-skill → load_skill</text><text x="480.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">old-source → read_file(src/first.rs)</text><path d="M260 204 V246" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 204 V246" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="254" width="420" height="114" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="286" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">m3：old-skill 的结果</text><text x="250.0" y="319" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">审查方法与版本</text><text x="250.0" y="348" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用 ID 对应 old-skill</text><rect x="500" y="254" width="420" height="114" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="286" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">m4：old-source 的结果</text><text x="710.0" y="319" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">目标路径与真实文件内容</text><text x="710.0" y="348" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用 ID 对应 old-source</text><text x="480" y="405" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">三个框共同构成一个完整消息组，不能从中间切开。</text><path d="M40 434 H920" stroke="#94a3b8" stroke-dasharray="8 6"/><rect x="40" y="466" width="880" height="114" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="498" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">normal 留下的最近两个完整组</text><text x="480.0" y="531" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">m8 + m9：recent-notes 请求与结果</text><text x="480.0" y="560" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">m10：用户要求继续；更早的完整组进入摘要范围</text><text x="480" y="626" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">数据来自同一起点的 archive-error 历史与 normal 压缩结果。</text></g></svg>
