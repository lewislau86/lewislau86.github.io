<svg xmlns="http://www.w3.org/2000/svg" width="960" height="802" viewBox="0 0 960 802" role="img" aria-labelledby="title desc"><title id="title">回收顺序：先证明可以删除，再交给 Git 检查</title><desc id="desc">回收依次检查身份、线程、文件和提交关系，只移除满足条件的目录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="802" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">回收顺序：先证明可以删除，再交给 Git 检查</text><rect x="160" y="84" width="640" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="116" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">核对任务、owner / epoch 与实际仓库</text><text x="480.0" y="149" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">身份或路径不符 → 拒绝操作，保留现场</text><path d="M480 166 V200" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="208" width="780" height="94" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="240" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">写线程已经 join？</text><text x="480.0" y="273" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未 join → busy</text><path d="M480 302 V336" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="344" width="780" height="94" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="376" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">文件与索引没有额外内容？</text><text x="480.0" y="409" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">包括未跟踪与忽略文件 → changes</text><path d="M480 438 V472" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="480" width="780" height="94" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="512" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">目标干净，HEAD 从 base 派生并进入 main？</text><text x="480.0" y="545" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">冲突 / 历史改变 / 未合入 → 保留</text><path d="M480 574 V612" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="622" width="640" height="96" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="654" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">请求 Git 移除目录，不加 --force</text><text x="480.0" y="687" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成功 → Removed；Git 拒绝 → git_refused</text><text x="480.0" y="716" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">分支引用保留，回收方法不执行合并</text><text x="480" y="764" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">clean：回收 1 个；unmerged：保留 1 个；locked：保留 1 个。</text></g></svg>
