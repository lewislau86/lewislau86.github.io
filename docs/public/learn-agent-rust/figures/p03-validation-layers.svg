<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">协议能接收，任务还要验收</title><desc id="desc">四个实际本地 HTTP 场景区分适配通过、真实读取与独立任务完成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="720" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">协议能接收，任务还要验收</text><rect x="32" y="90" width="270" height="138" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="167.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">① HTTP 与适配契约</text><text x="167.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">状态 · 正文 · 身份</text><text x="167.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具形状 · 结束原因</text><path d="M302 159 H337" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="347" y="90" width="270" height="138" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="482.0" y="122" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">② 宿主边界</text><text x="482.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具名 · 参数 · 权限</text><text x="482.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">调用 ID · 配对 · 预算</text><path d="M617 159 H652" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="662" y="90" width="266" height="138" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="795.0" y="122" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">③ 独立任务验收</text><text x="795.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">标签 · 输出字段</text><text x="795.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">实际读取是否发生</text><text x="480" y="284" text-anchor="middle" font-size="23" fill="#172033" font-weight="700">同一次任务，三个不同问题。</text><text x="194" y="344" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">场景</text><text x="450" y="344" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">适配通过</text><text x="644" y="344" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">实际读取</text><text x="820" y="344" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">任务完成</text><rect x="32" y="372" width="896" height="46" rx="7" fill="#e2e8f0"/><text x="194" y="402" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">normal</text><text x="450" y="402" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">是</text><text x="644" y="402" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="820" y="402" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">是</text><rect x="32" y="436" width="896" height="46" rx="7" fill="#fff"/><text x="194" y="466" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">wrong-answer</text><text x="450" y="466" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">是</text><text x="644" y="466" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">1</text><text x="820" y="466" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">否</text><rect x="32" y="500" width="896" height="46" rx="7" fill="#e2e8f0"/><text x="194" y="530" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">false-finish</text><text x="450" y="530" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">是</text><text x="644" y="530" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">0</text><text x="820" y="530" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">否</text><rect x="32" y="564" width="896" height="46" rx="7" fill="#fff"/><text x="194" y="594" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">path-escape</text><text x="450" y="594" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">是</text><text x="644" y="594" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">0</text><text x="820" y="594" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">否</text><text x="480" y="674" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">HTTP 200、合法回答与任务完成，分别保留证据。</text></g></svg>
