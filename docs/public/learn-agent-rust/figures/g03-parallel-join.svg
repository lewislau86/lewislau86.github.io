<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">并行执行需要显式归并契约</title><desc id="desc">plan 之后两项检查在同一个超步并行，merge 自动等待两项到齐后按业务规则归并；子图通过隔离的通道映射交换数据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="620" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">并行执行需要显式归并契约</text><rect x="45" y="85" width="240" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="165.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">plan</text><text x="165.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">两条出边</text><text x="165.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">下一个超步并行</text><path d="M285 150 H330 V110 H385" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330 150 V290 H385" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="395" y="65" width="230" height="125" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="510.0" y="97" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">security</text><text x="510.0" y="130" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只写 security 通道</text><text x="510.0" y="159" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">失败：完成的兄弟保留</text><rect x="395" y="245" width="230" height="125" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="510.0" y="277" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">license</text><text x="510.0" y="310" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只写 license 通道</text><text x="510.0" y="339" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">超时：失败或跳过</text><path d="M625 125 H665 V215 H700" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M625 305 H665 V215" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="710" y="150" width="210" height="160" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="815.0" y="182" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">merge</text><text x="815.0" y="215" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">自动等两项到齐</text><text x="815.0" y="244" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只运行一次</text><text x="815.0" y="273" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">ready / blocked / incomplete</text><rect x="80" y="440" width="800" height="135" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="480.0" y="472" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">并行边界与子图边界分别设计</text><text x="480.0" y="505" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同一步的更新按节点名顺序应用；覆盖通道上的“读后写回”会丢更新</text><text x="480.0" y="534" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">SubgraphNode 隔离通道：只交换声明的输入输出，映射错误在父图编译时发现</text><text x="480.0" y="563" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">超时跳过让缺失流进下游，归并规则要识别 incomplete</text></g></svg>
