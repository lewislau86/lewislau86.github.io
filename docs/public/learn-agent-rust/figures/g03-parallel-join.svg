<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">并行执行需要显式归并契约</title><desc id="desc">FanOutTask 等待并行子任务，归并节点核对结果；子图通过新会话与显式输入输出隔离。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="620" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">并行执行需要显式归并契约</text><rect x="45" y="85" width="240" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="165.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">图中的一个节点</text><text x="165.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">FanOutTask(checks)</text><text x="165.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">共享状态，等待全部孩子</text><path d="M285 150 H330 V110 H385" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330 150 V290 H385" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="395" y="65" width="230" height="125" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="510.0" y="97" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">compatibility</text><text x="510.0" y="130" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">独立 response</text><text x="510.0" y="159" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">子 NextAction = End</text><rect x="395" y="245" width="230" height="125" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="510.0" y="277" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">tests</text><text x="510.0" y="310" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">独立 response</text><text x="510.0" y="339" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">子 NextAction = End</text><path d="M625 125 H665 V215 H700" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M625 305 H665 V215" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="710" y="150" width="210" height="160" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="815.0" y="182" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">merge</text><text x="815.0" y="215" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检查全部结果</text><text x="815.0" y="244" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检查成员齐全</text><text x="815.0" y="273" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">固定 ID 顺序归并</text><rect x="80" y="440" width="800" height="135" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="480.0" y="472" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">并行边界与子图边界分别设计</text><text x="480.0" y="505" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">FanOut 子任务共享 Context：前缀只隔开自动归档键</text><text x="480.0" y="534" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">子图包装器创建新 Session：显式传入 request，取回 result</text><text x="480.0" y="563" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">子任务失败可留下局部数据；后续 merge 不运行</text></g></svg>
