<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">执行可以并行，成果仍需集成</title><desc id="desc">真实 Git 实验中，两个独立提交在合并时产生冲突，主索引和两个工作区全部保留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="650" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">执行可以并行，成果仍需集成</text><rect x="34" y="85" width="430" height="128" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="249.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">执行阶段：alpha</text><text x="249.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">独立目录写入 startup=alpha</text><text x="249.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">提交保留在 alpha 分支</text><rect x="496" y="85" width="430" height="128" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="711.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">执行阶段：beta</text><text x="711.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">独立目录写入 startup=beta</text><text x="711.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">提交保留在 beta 分支</text><path d="M249 213 V257 H480 V291" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M711 213 V257 H480" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="142" y="300" width="676" height="104" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="332" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">集成阶段：先接收 alpha，再合并 beta</text><text x="480.0" y="365" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同一行出现逻辑冲突，主索引为 UU README.md</text><path d="M480 404 V446" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="142" y="456" width="676" height="106" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="488" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">保留冲突与两份成果供评审</text><text x="480.0" y="521" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">关联 worktree：2 · 明确保留：2 · 回收：0</text><text x="480.0" y="550" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不自动选择一方，不删除分支或目录</text><text x="480" y="610" text-anchor="middle" font-size="21" fill="#172033" font-weight="700">隔离解决修改归属；最终内容仍由集成与评审确定。</text></g></svg>
