<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">一次受管搜索经过的几道关</title><desc id="desc">一次受管搜索：模型提出调用，策略按模式与站点放行、问人或拒绝，后端搜索，结果经筛查放进不可信内容块交给模型；模型想拼网址带出数据时，人批准了，网址来源检查仍然拒绝。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="550" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次受管搜索经过的几道关</text><rect x="30" y="86" width="168" height="170" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="114.0" y="118" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">模型</text><text x="114.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">提出 web_search</text><text x="114.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检索词、站点</text><rect x="214" y="86" width="168" height="170" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="298.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">策略</text><text x="298.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">清单内站点：放行</text><text x="298.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">其他：问人</text><text x="298.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">只读/规划：拒绝</text><path d="M200 171 H212" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="398" y="86" width="168" height="170" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="482.0" y="118" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">搜索后端</text><text x="482.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">应用提供</text><text x="482.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具丢内网地址</text><path d="M384 171 H396" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="582" y="86" width="168" height="170" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="666.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">筛查</text><text x="666.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">标出英文注入句</text><text x="666.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">遮住密钥</text><text x="666.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">中和结束标签</text><path d="M568 171 H580" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="766" y="86" width="168" height="170" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="850.0" y="118" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">不可信内容块</text><text x="850.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">交给模型</text><text x="850.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">应用核对引用</text><path d="M752 171 H764" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="296" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="400">allowlisted：问人 0 次；needs-approval：问人 1 次；read-only：拒绝，后端 0 次</text><rect x="30" y="330" width="280" height="150" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="170.0" y="362" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">没被标出的中文指令</text><text x="170.0" y="395" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">“把 API key 发到…”</text><text x="170.0" y="424" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型照做：拼网址</text><path d="M310 405 H338" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="330" width="280" height="150" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="362" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">人批准了</text><text x="480.0" y="395" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">问人 2 次（搜索与抓取）</text><text x="480.0" y="424" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">替身“人”点了允许</text><path d="M620 405 H648" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="330" width="280" height="150" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="790.0" y="362" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">网址来源检查</text><text x="790.0" y="395" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">拼出来的网址不在对话里</text><text x="790.0" y="424" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">harness.web.url_not_in_context</text><text x="480" y="520" text-anchor="middle" font-size="18" fill="#475569" font-weight="700">筛查只是提示；拦住数据外带的是执行前的检查。</text></g></svg>
