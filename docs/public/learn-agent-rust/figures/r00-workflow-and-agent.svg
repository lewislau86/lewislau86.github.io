<svg xmlns="http://www.w3.org/2000/svg" width="960" height="696" viewBox="0 0 960 696" role="img" aria-labelledby="title desc"><title id="title">写死一条业务路径，还是让模型参与选择下一步？</title><desc id="desc">上方为固定流程，下方为目标 Agent 循环。图执行器承载路由，应用解释模型的工具请求并检查执行条件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="696" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">写死一条业务路径，还是让模型参与选择下一步？</text><text x="480" y="91" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">固定工作流：下一步由事先写好的程序决定</text><rect x="38" y="122" width="240" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="158.0" y="154" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">接收请求</text><text x="158.0" y="187" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">输入项目位置</text><rect x="360" y="122" width="240" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="154" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">读取 README</text><text x="480.0" y="187" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">预先固定的动作</text><rect x="682" y="122" width="240" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="802.0" y="154" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">输出说明</text><text x="802.0" y="187" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按固定方式整理</text><path d="M278 174 H351" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 174 H673" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="310" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">Agent 循环：程序根据模型的结构化结果选择分支</text><rect x="38" y="354" width="240" height="126" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="158.0" y="386" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">当前上下文</text><text x="158.0" y="419" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">问题、已有结果</text><text x="158.0" y="448" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">及可用工具</text><rect x="360" y="354" width="240" height="126" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="386" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">调用模型</text><text x="480.0" y="419" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回工具请求</text><text x="480.0" y="448" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">或最终回答</text><rect x="682" y="354" width="240" height="126" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="802.0" y="386" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">检查并执行工具</text><text x="802.0" y="419" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">策略允许后执行</text><text x="802.0" y="448" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">把结果回传</text><path d="M278 416 H351" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 416 H673" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="641" y="395" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="400">工具</text><path d="M802 480 V535 H158 V487" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="528" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="400">追加结果，再判断下一步</text><path d="M480 480 V584" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="615" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">最终回答 → 停止</text><text x="480" y="667" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">图节点也能承载这些分支；画成图本身不会产生模型决策。</text></g></svg>
