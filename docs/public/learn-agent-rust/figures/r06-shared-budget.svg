<svg xmlns="http://www.w3.org/2000/svg" width="960" height="682" viewBox="0 0 960 682" role="img" aria-labelledby="title desc"><title id="title">每个子任务有限额，父子总账也有限额</title><desc id="desc">正常路径父子累计四轮模型和两次工具尝试，总模型额度为三时，子任务完成后父回答无法开始。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="682" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">每个子任务有限额，父子总账也有限额</text><rect x="40" y="90" width="540" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">正常路径：共享总用量</text><text x="310.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型 4 轮 / 工具 2 次</text><path d="M200 200 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 200 H600 V382 H310 V396" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="248" width="540" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="280" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">父侧分项</text><text x="310.0" y="313" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型 2 轮：委派、最终回答</text><text x="310.0" y="342" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具 1 次：delegate</text><rect x="40" y="400" width="540" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="310.0" y="432" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">子侧分项与局部额度</text><text x="310.0" y="465" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型 2 轮 / 工具 1 次</text><text x="310.0" y="494" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">实际文件读取 1 次</text><rect x="620" y="90" width="300" height="144" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="770.0" y="122" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">总模型额度只有 3</text><text x="770.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先用父侧 1 轮</text><text x="770.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">再用子侧 2 轮</text><path d="M770 234 V274" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="282" width="300" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="770.0" y="314" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">子任务已完成</text><text x="770.0" y="347" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Completed</text><path d="M770 394 V434" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="442" width="300" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="770.0" y="474" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">父最终回答被拦截</text><text x="770.0" y="507" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">GlobalModelBudget</text><text x="480" y="612" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">实际运行：总模型 3 / 总工具 2；子完成，练习目标仍为 false。</text><text x="480" y="650" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">次数在调用前扣除；局部或总账拒绝的动作不执行、不增加用量。</text></g></svg>
