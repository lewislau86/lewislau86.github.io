<svg xmlns="http://www.w3.org/2000/svg" width="960" height="682" viewBox="0 0 960 682" role="img" aria-labelledby="title desc"><title id="title">父子共用一份运行预算</title><desc id="desc">正常路径父子各两次模型请求、各一次工具调用，记在同一份运行预算上；总模型额度为 3 时，子 Agent 完成后父 Agent 的回答无法开始。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="682" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">父子共用一份运行预算</text><rect x="40" y="90" width="540" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">一份运行预算（Runner 上的 RunBudget）</text><text x="310.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">父子的模型请求、工具调用都记在这里</text><path d="M200 200 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 200 H600 V382 H310 V396" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="248" width="540" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="280" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">父 Agent</text><text x="310.0" y="313" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型 2 次：委派、回答</text><text x="310.0" y="342" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具 1 次：reader</text><rect x="40" y="400" width="540" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="310.0" y="432" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">子 Agent（AgentTool 新会话）</text><text x="310.0" y="465" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型 2 次：读取、提取</text><text x="310.0" y="494" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工具 1 次：read_file</text><rect x="620" y="90" width="300" height="144" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="770.0" y="122" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">总模型额度只有 3</text><text x="770.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">父 Agent 先用 1 次</text><text x="770.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">子 Agent 再用 2 次</text><path d="M770 234 V274" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="282" width="300" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="770.0" y="314" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">子 Agent 已完成</text><text x="770.0" y="347" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取 1 次，成功 1 次</text><path d="M770 394 V434" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="442" width="300" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="770.0" y="474" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">父 Agent 的回答被拦下</text><text x="770.0" y="507" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">budget.model_calls</text><text x="480" y="612" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">实测 parent-answer-budget：父 1 次 / 子 2 次；子任务完成，练习目标仍为 false。</text><text x="480" y="650" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">子 Agent 没有自己的一份新预算；局部上限只能用它自己的 max_iterations。</text></g></svg>
