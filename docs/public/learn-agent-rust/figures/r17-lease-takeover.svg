<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">到期边界与领取代次共同定义接管</title><desc id="desc">实验时间一百秒领取到一百一十秒，一百零九秒无法接管，一百一十秒接管得到代次二。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="630" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">到期边界与领取代次共同定义接管</text><rect x="40" y="92" width="400" height="125" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="124" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">worker-a · 首次领取</text><text x="240.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">now = 100 · token = 1</text><text x="240.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">lease_until = 110</text><rect x="520" y="92" width="400" height="125" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="124" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">worker-b · 尝试领取</text><text x="720.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">now = 109</text><text x="720.0" y="186" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">尚未到期 → empty</text><path d="M720 217 V263" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="271" width="400" height="125" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="303" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">worker-b · 到期接管</text><text x="720.0" y="336" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">now = 110 · token = 2</text><text x="720.0" y="365" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">lease_until = 120</text><path d="M240 217 V333 H505" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="442" width="880" height="100" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="474" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">业务任务身份始终相同</text><text x="480.0" y="507" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">id = report；接管更换 owner、增加代次并设置新截止时间</text><text x="480" y="588" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">租约到期允许接管；它不会自动终止旧进程。</text></g></svg>
