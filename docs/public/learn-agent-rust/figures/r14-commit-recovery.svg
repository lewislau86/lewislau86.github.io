<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">重启看到什么，取决于退出发生在提交哪一侧</title><desc id="desc">提交前退出时任务与游标回滚，提交后未返回确认时任务与游标已保存，重试两种路径最终均只有一条任务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="620" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">重启看到什么，取决于退出发生在提交哪一侧</text><rect x="40" y="92" width="400" height="110" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="124" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">插入后、提交前退出</text><text x="240.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">进程直接退出，code=73</text><path d="M240 202 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="248" width="400" height="130" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="280" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">新进程读取持久状态</text><text x="240.0" y="313" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">排队 0 条</text><text x="240.0" y="342" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">游标 00:59:00Z</text><path d="M240 378 V416" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="424" width="400" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="456" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">重试同一个扫描时刻</text><text x="240.0" y="489" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">新增 1 条 · 最终 1 条</text><rect x="520" y="92" width="400" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="124" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">提交后、返回确认前退出</text><text x="720.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">进程直接退出，code=74</text><path d="M720 202 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="248" width="400" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="280" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">新进程读取持久状态</text><text x="720.0" y="313" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">排队 1 条</text><text x="720.0" y="342" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">游标 01:00:00Z</text><path d="M720 378 V416" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="424" width="400" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="456" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">重试同一个扫描时刻</text><text x="720.0" y="489" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">新增 0 条 · 最终 1 条</text><text x="480" y="582" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">非零退出码不决定是否已提交；新进程先查状态，再决定后续动作。</text></g></svg>
