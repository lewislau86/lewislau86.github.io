<svg xmlns="http://www.w3.org/2000/svg" width="960" height="892" viewBox="0 0 960 892" role="img" aria-labelledby="title desc"><title id="title">从任务结构选择 Agent 设计模式</title><desc id="desc">八组任务结构的教学示意，包含基线、提示链路由、并行、规划、协调交接、评估修复、人工介入与组合。不是性能实验。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="892" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">从任务结构选择 Agent 设计模式</text><text x="480" y="78" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先确定控制权、输入输出与停止条件，再增加结构</text><rect x="30" y="108" width="435" height="156" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="247.5" y="140" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">先建立最小基线</text><text x="247.5" y="173" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">一次调用够用吗？步骤已知吗？</text><text x="247.5" y="202" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">单次调用 / 固定工作流 / 有界循环</text><rect x="495" y="108" width="435" height="156" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="712.5" y="140" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">已知步骤与输入类别</text><text x="712.5" y="173" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">提示链：抽取 → 校验 → 生成</text><text x="712.5" y="202" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">路由：分类 → 专门处理 / 兜底</text><rect x="30" y="288" width="435" height="156" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="247.5" y="320" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">独立子问题：并行归并</text><text x="247.5" y="353" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同一修订 → 独立检查 → 汇总</text><text x="247.5" y="382" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">约束成员、失败策略与结果冲突</text><rect x="495" y="288" width="435" height="156" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="712.5" y="320" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">新观察：规划与重规划</text><text x="712.5" y="353" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">计划 → 执行 → 观察 → 修订</text><text x="712.5" y="382" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留已确认效果与累计预算</text><rect x="30" y="468" width="435" height="156" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="247.5" y="500" text-anchor="middle" font-size="21" fill="#7c3aed" font-weight="700">动态分工与控制权</text><text x="247.5" y="533" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">协调者分派 → 工作者返回</text><text x="247.5" y="562" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">交接：明确下一轮由谁主导</text><rect x="495" y="468" width="435" height="156" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="712.5" y="500" text-anchor="middle" font-size="21" fill="#7c3aed" font-weight="700">明确反馈：评估与修复</text><text x="712.5" y="533" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">生成 → 检查 → 有限修复</text><text x="712.5" y="562" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">候选版本、固定准则与停止上限</text><rect x="30" y="648" width="435" height="156" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="247.5" y="680" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">缺信息或授权：人工介入</text><text x="247.5" y="713" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">澄清 / 编辑 / 审批 → 校验恢复</text><text x="247.5" y="742" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">批准绑定展示过的动作与修订</text><rect x="495" y="648" width="435" height="156" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="712.5" y="680" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">按需求组合，再验证接缝</text><text x="712.5" y="713" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">选择必要模式，统一全局账本</text><text x="712.5" y="742" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">分别验收流程、效果与模型质量</text><text x="480" y="862" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">控制结构示意 · 各章附独立 Rust 工程与故障复验</text></g></svg>
