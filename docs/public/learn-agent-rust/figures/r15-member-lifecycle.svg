<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">一次工作结束，队友回到等待</title><desc id="desc">同一 core 成员两次进入 busy，之间保留第一次历史并接收 followup，团队关闭后才退出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="760" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次工作结束，队友回到等待</text><rect x="40" y="86" width="420" height="104" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="250.0" y="118" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">等待</text><text x="250.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">idle</text><path d="M460 138 H494" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="86" width="420" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="710.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">第一次审查</text><text x="710.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">busy</text><path d="M710 190 V216 H250 V236" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="242" width="420" height="104" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="250.0" y="274" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">保留历史再等</text><text x="250.0" y="307" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">idle</text><path d="M460 294 H494" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="242" width="420" height="104" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="274" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">消费追问</text><text x="710.0" y="307" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">note:followup</text><path d="M710 346 V372 H250 V392" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="398" width="420" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="430" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">第二次审查</text><text x="250.0" y="463" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">busy</text><path d="M460 450 H494" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="398" width="420" height="104" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="710.0" y="430" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">等待新工作</text><text x="710.0" y="463" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">idle</text><rect x="40" y="576" width="880" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="608" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">团队退出才结束成员</text><text x="480.0" y="641" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">closing → closed；源码实际重读 2 次</text><text x="480.0" y="670" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">历史保留 10 条；config 未收到私有追问</text><text x="480" y="732" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">来自 persistent 成员内实际事件序列；框的位置表示先后，不表示时长。</text></g></svg>
