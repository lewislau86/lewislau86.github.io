<svg xmlns="http://www.w3.org/2000/svg" width="960" height="688" viewBox="0 0 960 688" role="img" aria-labelledby="title desc"><title id="title">一次往返，消息历史逐条增加</title><desc id="desc">消息顺序与读取计数来自 R00 实际运行记录。拒绝时读取次数为零，缺失文件时读取尝试失败。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="688" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次往返，消息历史逐条增加</text><rect x="48" y="80" width="864" height="62" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="255" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">1 · user</text><text x="638" y="118" text-anchor="middle" font-size="21" fill="#172033" font-weight="400">提出问题</text><path d="M480 142 V159" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="164" width="864" height="62" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="255" y="202" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">2 · assistant</text><text x="638" y="202" text-anchor="middle" font-size="21" fill="#172033" font-weight="400">请求读取 README</text><path d="M480 226 V243" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="248" width="864" height="62" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="255" y="286" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">3 · tool</text><text x="638" y="286" text-anchor="middle" font-size="21" fill="#172033" font-weight="400">回传文件内容</text><path d="M480 310 V327" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="332" width="864" height="62" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="255" y="370" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">4 · assistant</text><text x="638" y="370" text-anchor="middle" font-size="21" fill="#172033" font-weight="400">给出启动命令</text><text x="480" y="452" text-anchor="middle" font-size="22" fill="#172033" font-weight="700">真实运行对照：应用是否进行了文件读取？</text><text x="205" y="491" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">场景</text><text x="480" y="491" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取尝试 / 读取成功</text><text x="752" y="491" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">任务结果</text><text x="205" y="532" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">正常</text><text x="480" y="532" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">1 / 1</text><text x="752" y="532" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">completed</text><text x="205" y="571" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">策略拒绝</text><text x="480" y="571" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">0 / 0</text><text x="752" y="571" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">denied</text><text x="205" y="610" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">文件不存在</text><text x="480" y="610" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="700">1 / 0</text><text x="752" y="610" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">missing_file</text><text x="480" y="658" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">数据来自 R00 的固定规则模型与临时文件实验；未请求外部模型。</text></g></svg>
