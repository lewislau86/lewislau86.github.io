<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">检索不到，不等于文件里没有</title><desc id="desc">forget 和 delete_user 之后检索为空，但 SQLite 文件里仍能找到 English；合并全文索引并 VACUUM 之后，文件里才不再有这段文字。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="530" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">检索不到，不等于文件里没有</text><rect x="40" y="86" width="880" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">forget：delete_memory</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">删掉这个键的每个版本：removed=2</text><text x="480.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件里还找得到 English（原样或小写）：yes</text><rect x="40" y="218" width="880" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="250" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">erase：delete_user</text><text x="480.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">删掉用户的全部行</text><text x="480.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件里还找得到 English（原样或小写）：yes</text><rect x="40" y="350" width="880" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="382" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">erase --compact</text><text x="480.0" y="415" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">合并全文索引 + VACUUM</text><text x="480.0" y="444" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">文件里还找得到 English（原样或小写）：no</text><text x="480" y="498" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">三种做法之后检索都为空；只有第三种让文件里不再有原文。备份、日志与已发给模型的上下文不在其中。</text></g></svg>
