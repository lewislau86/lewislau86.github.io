<svg xmlns="http://www.w3.org/2000/svg" width="960" height="704" viewBox="0 0 960 704" role="img" aria-labelledby="title desc"><title id="title">发现完成后，再发布统一工具描述</title><desc id="desc">请求顺序来自 normal 实际协议帧；分页、工具总数与双服务命名来自实验输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="704" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">发现完成后，再发布统一工具描述</text><text x="480" y="89" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">本章固定 MCP 2025-11-25，显式使用 initialize 生命周期</text><rect x="120" y="123" width="720" height="65" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="155" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">initialize · 版本与能力</text><path d="M480 188 V208" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="214" width="720" height="65" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="246" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">notifications/initialized</text><path d="M480 279 V299" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="305" width="720" height="65" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="337" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">tools/list · 第一页</text><path d="M480 370 V390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="396" width="720" height="65" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="428" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">tools/list · cursor=second</text><path d="M480 461 V481" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="120" y="487" width="720" height="65" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="519" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">tools/call · read_note</text><text x="480" y="623" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">实际发现 2 页，注册 8 项（含 1 项本地工具）。</text><text x="480" y="665" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">双服务：15 项；同名工具分别使用 mcp_notes__ 与 mcp_other__。</text></g></svg>
