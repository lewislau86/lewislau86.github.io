<svg xmlns="http://www.w3.org/2000/svg" width="960" height="688" viewBox="0 0 960 688" role="img" aria-labelledby="title desc"><title id="title">工作区隔离：分开文件与索引，保留共同历史</title><desc id="desc">两个任务各自使用目录与分支，共享 Git 对象库；并行修改不改变练习主目录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="688" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">工作区隔离：分开文件与索引，保留共同历史</text><rect x="30" y="86" width="900" height="92" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">宿主保管任务绑定</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">task + attempt + owner / epoch + base + branch + path</text><path d="M252 178 V223" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M708 178 V223" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="232" width="442" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="251.0" y="264" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">alpha-a1</text><text x="251.0" y="297" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">README：startup=alpha</text><text x="251.0" y="326" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">独立 HEAD · 独立索引</text><text x="251.0" y="355" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">分支：codex/r18-alpha-a1</text><rect x="488" y="232" width="442" height="150" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="709.0" y="264" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">beta-a1</text><text x="709.0" y="297" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">README：startup=beta</text><text x="709.0" y="326" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">独立 HEAD · 独立索引</text><text x="709.0" y="355" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">分支：codex/r18-beta-a1</text><path d="M251 382 V424 H480 V450" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M709 382 V424 H480" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="122" y="460" width="716" height="106" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="492" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">共享：repository/.git</text><text x="480.0" y="525" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">对象库 · 普通分支引用 · worktree 登记</text><text x="480.0" y="554" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">主工作区 README 仍为 startup=cargo run</text><text x="480" y="614" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">实测：2 个关联 worktree，2 个因修改而保留的绑定。</text><text x="480" y="651" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">目录和索引隔离；进程、网络与文件访问权限仍由宿主控制。</text></g></svg>
