<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">评估修复循环与工具失败的反思</title><desc id="desc">左边是 LoopAgent 里的生成—评估—修复：写作者写稿，评估者按固定规则检查，通过或没有进展就上报，最多 3 轮；右边是 adk-retry-reflect：工具失败时用反思提示替换结果，同一参数最多 2 次、整次运行最多 3 次，超过后原始错误交给模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="540" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">评估修复循环与工具失败的反思</text><text x="240" y="72" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">LoopAgent：生成—评估—修复</text><rect x="30" y="90" width="420" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">写作者（LlmAgent）</text><text x="240.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">按反馈里没通过的规则改稿</text><text x="240.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">output_key → draft</text><rect x="30" y="218" width="420" height="108" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="250" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">评估者（固定规则）</text><text x="240.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正文非空、有来源、来源在允许列表</text><text x="240.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不看写作者的“已自查”</text><path d="M240 200 V216" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="346" width="420" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="378" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">通过 / 无进展 → 上报</text><text x="240.0" y="411" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">没通过：回到写作者再改一轮</text><text x="240.0" y="440" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最多 3 轮；第一稿留作基线</text><path d="M240 328 V344" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="488" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">new-error：r1:missing_source → r2:empty_text → r3:pass</text><text x="240" y="512" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">no-progress → no_progress；never-good → loop_limit</text><text x="720" y="72" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">adk-retry-reflect：工具失败后的反思</text><rect x="510" y="90" width="420" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="720.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">工具失败</text><text x="720.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read_file 路径写错</text><rect x="510" y="218" width="420" height="108" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="250" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">反思提示替换结果</text><text x="720.0" y="283" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同一参数最多 2 次</text><text x="720.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">整次运行最多 3 次</text><path d="M720 200 V216" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="346" width="420" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="720.0" y="378" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">超过上限</text><text x="720.0" y="411" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">原始错误交给模型</text><path d="M720 328 V344" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="488" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">tool-retry → read；exhausted → gave_up</text><text x="720" y="512" text-anchor="middle" font-size="15" fill="#475569" font-weight="400">wandering：第 4 次失败不再有提示</text></g></svg>
