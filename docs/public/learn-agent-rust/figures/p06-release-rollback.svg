<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">回滚动作与回滚后的能力分别记录</title><desc id="desc">回滚场景先发布验证四题均通过的 Robust，再注入告警，指针回到 Baseline，最终审计为六题通过二题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="560" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">回滚动作与回滚后的能力分别记录</text><rect x="45" y="115" width="260" height="155" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="175.0" y="147" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">revision-0</text><text x="175.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">已知基线 Baseline</text><text x="175.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终测试 2/6</text><path d="M305 195 H340" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="115" width="260" height="155" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="147" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">revision-1</text><text x="480.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">rollback 发布 Robust</text><text x="480.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">候选验证 4/4</text><path d="M610 195 H645" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="655" y="115" width="260" height="155" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="785.0" y="147" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">告警后回退</text><text x="785.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">rollback 指回基线</text><text x="785.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终测试 2/6</text><rect x="45" y="325" width="870" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="357" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">读取 CURRENT 后，按实际版本重新验收</text><text x="480.0" y="390" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">修订文件保持不变；回退替换的是发布指针</text><text x="480.0" y="419" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">恢复旧版本不会撤销已经发生的外部业务效果</text><text x="480" y="515" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同一次 rollback：发布 Robust，注入告警，最后审计 Baseline。</text></g></svg>
