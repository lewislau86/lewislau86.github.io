<svg xmlns="http://www.w3.org/2000/svg" width="960" height="612" viewBox="0 0 960 612" role="img" aria-labelledby="title desc"><title id="title">任务依赖决定谁先开始</title><desc id="desc">三个任务的依赖、可运行列表和版本来自 new-process-chain 实际响应。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="612" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">任务依赖决定谁先开始</text><text x="480" y="87" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">箭头：前置完成后，后继才允许开始</text><rect x="45" y="124" width="250" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="170.0" y="156" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">readme</text><text x="170.0" y="189" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">状态 pending</text><text x="170.0" y="218" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">前置 无</text><path d="M295 194 H347" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="124" width="250" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="156" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">check</text><text x="480.0" y="189" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">状态 pending</text><text x="480.0" y="218" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">前置 readme</text><path d="M605 194 H657" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="665" y="124" width="250" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="790.0" y="156" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">guide</text><text x="790.0" y="18