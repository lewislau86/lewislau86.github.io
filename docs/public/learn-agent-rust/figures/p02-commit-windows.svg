<svg xmlns="http://www.w3.org/2000/svg" width="960" height="642" viewBox="0 0 960 642" role="img" aria-labelledby="title desc"><title id="title">一次业务操作，三个阶段分别提交</title><desc id="desc">客户端与服务端位于独立进程，各自写入数据库。服务端提交与本地确认之间存在未知结果窗口；发送前标记与回执保存还有独立的本地提交。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="642" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">一次业务操作，三个阶段分别提交</text><rect x="40" y="85" width="880" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">① 客户端事务 · client.sqlite</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">actions + outbox 一起提交</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先保存稳定 operation ID 与冻结参数</text><path d="M480 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="247" width="880" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="279" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">② 服务端事务 · provider.sqlite</text><text x="480.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">tickets + keys + receipt 一起提交</text><text x="480.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">这里退出：外部已成功，客户端仍可能 unknown</text><path d="M480 359 V401" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="409" width="880" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="441" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">③ 客户端事务 · client.sqlite</text><text x="480.0" y="474" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">先保存合法回执为 acked</text><text x="480.0" y="503" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">checkpoints + actions + outbox 一起完成</text><text x="480" y="568" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">两份数据库独立提交；本地事务没有覆盖外部工单。</text><text x="480" y="608" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">图示三个阶段；unknown 标记与 acked 保存另有本地提交。</text></g></svg>
