<svg xmlns="http://www.w3.org/2000/svg" width="960" height="705" viewBox="0 0 960 705" role="img" aria-labelledby="title desc"><title id="title">三个时刻，分别验收</title><desc id="desc">实际四个场景显示文件效果、目标验收和数据库终态可能不同步；保存失败留下报告但任务仍运行中。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="705" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">三个时刻，分别验收</text><rect x="32" y="85" width="270" height="108" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="167.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">① 文件效果</text><text x="167.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">report.txt 实际字节</text><path d="M302 138 H339" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="347" y="85" width="270" height="108" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="482.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">② 目标验收</text><text x="482.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取 + 回执 + 写入 + 归属</text><path d="M617 138 H654" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="662" y="85" width="266" height="108" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="795.0" y="117" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">③ SQLite 事务</text><text x="795.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">终态 + 新记忆 + 终态事件</text><text x="210" y="252" text-anchor="middle" font-size="21" fill="#172033" font-weight="700">场景</text><text x="456" y="252" text-anchor="middle" font-size="21" fill="#172033" font-weight="700">报告存在</text><text x="632" y="252" text-anchor="middle" font-size="21" fill="#172033" font-weight="700">目标通过</text><text x="818" y="252" text-anchor="middle" font-size="21" fill="#172033" font-weight="700">任务状态</text><rect x="32" y="281" width="896" height="53" rx="8" fill="#e2e8f0"/><text x="210" y="314" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">normal</text><text x="456" y="314" text-anchor="middle" font-size="23" fill="#0f766e" font-weight="700">是</text><text x="632" y="314" text-anchor="middle" font-size="23" fill="#2563eb" font-weight="700">是</text><text x="818" y="314" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">completed</text><rect x="32" y="353" width="896" height="53" rx="8" fill="#fff"/><text x="210" y="386" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">post-hook</text><text x="456" y="386" text-anchor="middle" font-size="23" fill="#0f766e" font-weight="700">是</text><text x="632" y="386" text-anchor="middle" font-size="23" fill="#2563eb" font-weight="700">否</text><text x="818" y="386" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">failed</text><rect x="32" y="425" width="896" height="53" rx="8" fill="#e2e8f0"/><text x="210" y="458" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">write-unknown</text><text x="456" y="458" text-anchor="middle" font-size="23" fill="#0f766e" font-weight="700">是</text><text x="632" y="458" text-anchor="middle" font-size="23" fill="#2563eb" font-weight="700">否</text><text x="818" y="458" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">failed</text><rect x="32" y="497" width="896" height="53" rx="8" fill="#fff"/><text x="210" y="530" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">terminal-save-failed</text><text x="456" y="530" text-anchor="middle" font-size="23" fill="#0f766e" font-weight="700">是</text><text x="632" y="530" text-anchor="middle" font-size="23" fill="#2563eb" font-weight="700">是</text><text x="818" y="530" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">running</text><text x="480" y="620" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">数据库回滚不能撤销文件；写后错误要保留证据并对账。</text><text x="480" y="663" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">完成 = 目标验收通过，而且 completed 终态提交成功。</text></g></svg>
