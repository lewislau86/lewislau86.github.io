<svg xmlns="http://www.w3.org/2000/svg" width="960" height="615" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">提交发生在哪里，决定重启看到什么</title><desc id="desc">提交前退出回滚，提交后确认丢失可按原保存身份获得回执，两种路径最终均只有两份快照。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="615" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">提交发生在哪里，决定重启看到什么</text><rect x="40" y="95" width="400" height="105" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="127" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">提交前退出</text><text x="240.0" y="160" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">process exit = 73</text><path d="M240 200 V238" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="246" width="400" height="105" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="278" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">新进程读取</text><text x="240.0" y="311" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">当前 revision = 0</text><path d="M240 351 V389" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="397" width="400" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="429" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">原 save_id 重试</text><text x="240.0" y="462" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">replayed = false</text><text x="240.0" y="491" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终历史快照 = 2 份</text><rect x="520" y="95" width="400" height="105" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="127" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">提交后确认丢失</text><text x="720.0" y="160" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">process exit = 74</text><path d="M720 200 V238" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="246" width="400" height="105" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="278" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">新进程读取</text><text x="720.0" y="311" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">当前 revision = 1</text><path d="M720 351 V389" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="397" width="400" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="429" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">原 save_id 重试</text><text x="720.0" y="462" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">replayed = true</text><text x="720.0" y="491" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终历史快照 = 2 份</text><text x="480" y="577" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保存身份确认原提交；当前状态与历史在同一事务更新。</text></g></svg>
