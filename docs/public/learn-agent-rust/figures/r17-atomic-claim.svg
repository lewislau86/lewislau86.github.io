<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">选取与更新在一个事务中完成</title><desc id="desc">四个真实进程竞争同一任务，只有一个成功领取；其他进程返回空或忙，持久化代次仍为一。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="630" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">选取与更新在一个事务中完成</text><rect x="40" y="92" width="880" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="124" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">4 个独立进程 · 同一项 report</text><text x="480.0" y="157" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">全部到达管道门闩 → 放行，开始竞争写事务</text><path d="M480 202 V244" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="252" width="880" height="125" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="284" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">一个 BEGIN IMMEDIATE 写事务</text><text x="480.0" y="317" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">挑选候选 → 更新 owner / token / lease_until → COMMIT</text><text x="480.0" y="346" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">提交成功后才开始业务动作</text><path d="M480 377 V417" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="425" width="400" height="115" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="457" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">成功领取 1 个</text><text x="240.0" y="490" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">持久化 token = 1</text><rect x="520" y="425" width="400" height="115" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="457" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">其余 3 个</text><text x="720.0" y="490" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">empty 或 store_busy；由实际调度决定</text><text x="480" y="590" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">随后 4 次新进程领取均为 empty，有效租约没有被重复领取。</text></g></svg>
