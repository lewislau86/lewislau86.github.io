<svg xmlns="http://www.w3.org/2000/svg" width="960" height="665" viewBox="0 0 960 665" role="img" aria-labelledby="title desc"><title id="title">幂等识别同一意图，也拒绝身份被复用</title><desc id="desc">相同键和参数的两次提交只创建一张工单；同键不同参数冲突；不同操作键创建两张。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="665" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">幂等识别同一意图，也拒绝身份被复用</text><rect x="40" y="85" width="880" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">身份 = tenant + operation_id</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">冻结 title，计算完整请求摘要</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">客户意图跨重试保持；不使用新调用 ID 代替</text><path d="M180 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="247" width="270" height="174" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="175.0" y="279" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">同键 · 同参数</text><text x="175.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回原回执</text><text x="175.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">apply 提交：2</text><text x="175.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工单：1</text><rect x="345" y="247" width="270" height="174" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="279" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">同键 · 参数变化</text><text x="480.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">idempotency_conflict</text><text x="480.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">拒绝第二份内容</text><text x="480.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工单：1</text><rect x="650" y="247" width="270" height="174" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="785.0" y="279" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">新键 · 相同标题</text><text x="785.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">独立业务意图</text><text x="785.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">创建另一张工单</text><text x="785.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工单：2</text><rect x="40" y="475" width="880" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="507" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">并发也要在服务端保护</text><text x="480.0" y="540" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">4 个独立 provider 进程 → 1 张工单</text><text x="480.0" y="569" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">事务内检查键、创建工单与保存回执</text><text x="480" y="631" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">数量来自真实数据库；键作用域与保留期属于接口契约。</text></g></svg>
