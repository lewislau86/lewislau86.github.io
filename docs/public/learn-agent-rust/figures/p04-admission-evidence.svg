<svg xmlns="http://www.w3.org/2000/svg" width="960" height="655" viewBox="0 0 960 655" role="img" aria-labelledby="title desc"><title id="title">容量满时，拒绝也要留下证据</title><desc id="desc">接收、拒绝和排空计数来自十二个独立 Rust 客户端并发提交的实际结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="655" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">容量满时，拒绝也要留下证据</text><rect x="40" y="90" width="880" height="105" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">12 个独立进程并发提交</text><text x="480.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">所有准入回复后再结束任务；容量 = 4</text><path d="M480 195 V231" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="239" width="880" height="105" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="271" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">锁配置行，原子预留名额</text><text x="480.0" y="304" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">读取容量 + 插入作业 + active 增加，在同一事务内完成</text><path d="M280 344 V382 H240 V402" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M680 344 V382 H720 V402" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="410" width="400" height="115" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="442" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">接收 = 4</text><text x="240.0" y="475" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">active = 4，容量未超发</text><rect x="520" y="410" width="400" height="115" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="720.0" y="442" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">拒绝 = 8</text><text x="720.0" y="475" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回 Overloaded，保留拒绝计数</text><text x="480" y="576" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">停止接单后排空：active = 0 · finished = 4</text><text x="480" y="617" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">这是单轮容量边界演练，没有测模型延迟或长期吞吐。</text></g></svg>
