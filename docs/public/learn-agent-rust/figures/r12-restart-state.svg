<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">重启后保留状态，也保留已用次数</title><desc id="desc">running-restart 与 retry-budget 的实际状态迁移。失败与重试由可信调用者显式提交。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="560" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">重启后保留状态，也保留已用次数</text><rect x="70" y="84" width="820" height="115" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="116" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">新进程读取正式快照</text><text x="480.0" y="149" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">revision=2 · running · attempts=1</text><text x="480.0" y="178" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">reconcile=readme；不自动恢复为 Pending</text><path d="M165 199 V250" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="230" text-anchor="middle" font-size="18" fill="#b45309" font-weight="400">可信调用者先核对实际效果</text><rect x="35" y="258" width="260" height="166" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="165.0" y="290" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">显式 fail</text><text x="165.0" y="323" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">revision=3</text><text x="165.0" y="352" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">failed</text><text x="165.0" y="381" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">attempts=1</text><path d="M295 343 H343" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="258" width="260" height="166" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="290" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">显式 retry</text><text x="480.0" y="323" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">revision=4</text><text x="480.0" y="352" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">pending</text><text x="480.0" y="381" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">attempts=1</text><path d="M610 343 H658" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="665" y="258" width="260" height="166" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="795.0" y="290" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">再次 start</text><text x="795.0" y="323" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">revision=5</text><text x="795.0" y="352" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">running</text><text x="795.0" y="381" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">attempts=2</text><text x="480" y="479" text-anchor="middle" font-size="20" fill="#172033" font-weight="700">同一业务 ID 的次数一直保留；Pending 不代表尚未开始过。</text><text x="480" y="522" text-anchor="middle" font-size="18" fill="#b45309" font-weight="400">另一个场景：attempts=2 / max_attempts=2，retry 返回 attempt_limit。</text></g></svg>
