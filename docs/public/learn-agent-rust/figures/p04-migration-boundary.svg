<svg xmlns="http://www.w3.org/2000/svg" width="960" height="635" viewBox="0 0 960 635" role="img" aria-labelledby="title desc"><title id="title">旧会话升级，先验证失败后还剩什么</title><desc id="desc">真实 PostgreSQL 迁移事务失败后结构和数据回滚，成功后保留推进位置和累计预算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="635" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">旧会话升级，先验证失败后还剩什么</text><rect x="40" y="90" width="880" height="105" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">升级前先具备兼容读路径</text><text x="480.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">新 reader 能读格式 1 与 2；旧 reader 只接受格式 1</text><path d="M480 195 V231" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="239" width="880" height="105" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="271" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">迁移事务：检查 → DDL → 数据 → schema</text><text x="480.0" y="304" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">同一事务锁住配置行；执行 SQL 后、提交前注入失败</text><path d="M280 344 V382 H240 V402" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M680 344 V382 H720 V402" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="410" width="400" height="145" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="240.0" y="442" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">失败：事务回滚</text><text x="240.0" y="475" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">schema = 1 · 旧会话 = 2</text><text x="240.0" y="504" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">workflow 列 = 0</text><rect x="520" y="410" width="400" height="145" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="442" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">成功：格式切换</text><text x="720.0" y="475" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">schema = 2 · 新会话 = 2</text><text x="720.0" y="504" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">spent = 3 · status = paused</text><text x="480" y="598" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成功后旧 reader 明确拒绝；未验证在线迁移或反向迁移。</text></g></svg>
