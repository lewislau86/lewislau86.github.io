<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc"><title id="title">计划可见，执行证据仍要单独核对</title><desc id="desc">清单保存在会话状态里，before_model 回调每次请求前放入最新清单，todo_write 校验后经 state_delta 写回。完成标记和任务验收在对照实验中分离。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="690" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">计划可见，执行证据仍要单独核对</text><rect x="40" y="85" width="390" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="235.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">会话状态 plan + 事件历史</text><text x="235.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">before_model 回调读最新清单</text><text x="235.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">放进本次 LlmRequest</text><path d="M430 153 H520" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="85" width="390" height="140" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="725.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">PlanLlm 只看请求</text><text x="725.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">todo_read / todo_write</text><text x="725.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">read_file / write_file</text><path d="M725 225 V265" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="275" width="390" height="140" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="725.0" y="307" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">Runner：策略 → 工具</text><text x="725.0" y="340" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">todo_write：校验 → state_delta</text><text x="725.0" y="369" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">write_file：应用策略拒绝</text><path d="M530 345 H235 V235" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="267" y="382" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">事件产出时合并 state_delta</text><rect x="40" y="470" width="390" height="147" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="235.0" y="502" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">正常读取</text><text x="235.0" y="535" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">清单全部完成：true</text><text x="235.0" y="564" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成功读取 1 次 · 目标验收 true</text><rect x="530" y="470" width="390" height="147" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="725.0" y="502" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">只改完成标记</text><text x="725.0" y="535" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">清单全部完成：true</text><text x="725.0" y="564" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成功读取 0 次 · 目标验收 false</text><text x="480" y="659" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">上方是接线示意；下方来自 normal 与 claims-only 的实际输出。</text></g></svg>
