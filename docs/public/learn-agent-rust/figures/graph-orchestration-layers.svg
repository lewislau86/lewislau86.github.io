<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">两条教学主线：模型交互与图编排</title><desc id="desc">模型工具层产生请求与结果，图编排层管理执行顺序和状态；宿主应用连接两者。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">两条教学主线：模型交互与图编排</text><rect x="40" y="85" width="420" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">模型与工具层 · langchain-rust</text><text x="250.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">消息、模型请求、工具调用结果</text><text x="250.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">决定本轮提出什么内容与动作</text><rect x="500" y="85" width="420" height="150" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="117" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">图编排层 · graph-flow</text><text x="710.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">节点、状态、边与会话游标</text><text x="710.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">决定下一步执行哪段程序</text><path d="M250 235 V285 H480 V320" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 235 V285 H480" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="140" y="330" width="680" height="160" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="480.0" y="362" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">宿主应用：把两层接起来</text><text x="480.0" y="395" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">G01：状态与路由 → G02：等待与恢复 → G03：并行与子图</text><text x="480.0" y="424" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">节点可以调用模型，也可以只是校验、审批或归并</text><text x="480.0" y="453" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">权限、预算、终态与业务效果由明确契约约束</text><text x="480" y="545" text-anchor="middle" font-size="19" fill="#172033" font-weight="400">三章实验真实调用 graph-flow；固定业务规则，无模型服务。</text></g></svg>
