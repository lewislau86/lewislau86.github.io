<svg xmlns="http://www.w3.org/2000/svg" width="960" height="668" viewBox="0 0 960 668" role="img" aria-labelledby="title desc"><title id="title">只注入相关正文，重复加载不重复注入</title><desc id="desc">柱长来自真实 UTF-8 字节统计，重复加载与首次加载的正文累计字节相同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="668" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">只注入相关正文，重复加载不重复注入</text><text x="190" y="124" text-anchor="middle" font-size="19" fill="#2563eb" font-weight="700">两份技能的目录文本</text><rect x="390" y="100" width="119.07600596125187" height="36" rx="5" fill="#2563eb"/><text x="549.0760059612519" y="125" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">170</text><text x="190" y="220" text-anchor="middle" font-size="19" fill="#64748b" font-weight="700">两份技能的全部正文</text><rect x="390" y="196" width="470.0" height="36" rx="5" fill="#64748b"/><text x="900.0" y="221" text-anchor="middle" font-size="18" fill="#64748b" font-weight="700">671</text><text x="190" y="316" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="700">normal 注入的正文</text><rect x="390" y="292" width="193.32339791356185" height="36" rx="5" fill="#0f766e"/><text x="623.3233979135618" y="317" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">276</text><text x="190" y="412" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">repeat 累计注入的正文</text><rect x="390" y="388" width="193.32339791356185" height="36" rx="5" fill="#b45309"/><text x="623.3233979135618" y="413" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">276</text><rect x="40" y="494" width="880" height="102" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="526" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">同一份正文只累计一次</text><text x="480.0" y="559" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">repeat 实际请求加载 2 次，注入 1 份正文。</text><text x="480.0" y="588" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">比较的是 UTF-8 文本字节，不是 token；工具消息外壳仍有额外开销。</text><text x="480" y="639" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">数据来自 R07 实际运行；两份目录和两份正文是不同层次的文本，不能相加当总上下文。</text></g></svg>
