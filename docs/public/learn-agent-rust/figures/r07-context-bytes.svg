<svg xmlns="http://www.w3.org/2000/svg" width="960" height="668" viewBox="0 0 960 668" role="img" aria-labelledby="title desc"><title id="title">进入会话的技能正文有多少</title><desc id="desc">柱长来自真实 UTF-8 字节统计：重复加载使正文翻倍，截断只留下开头，自动注入把正文放进用户消息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="668" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">进入会话的技能正文有多少</text><text x="190" y="124" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="700">normal：加载 1 次</text><rect x="390" y="100" width="235.0" height="36" rx="5" fill="#0f766e"/><text x="665.0" y="125" text-anchor="middle" font-size="18" fill="#0f766e" font-weight="700">276</text><text x="190" y="220" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">repeat：加载 2 次</text><rect x="390" y="196" width="470.0" height="36" rx="5" fill="#b45309"/><text x="900.0" y="221" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">552</text><text x="190" y="316" text-anchor="middle" font-size="19" fill="#b91c1c" font-weight="700">truncated：12 字符上限</text><rect x="390" y="292" width="30.652173913043477" height="36" rx="5" fill="#b91c1c"/><text x="460.6521739130435" y="317" text-anchor="middle" font-size="18" fill="#b91c1c" font-weight="700">36</text><text x="190" y="412" text-anchor="middle" font-size="19" fill="#2563eb" font-weight="700">auto-inject：放进用户消息</text><rect x="390" y="388" width="261.3949275362319" height="36" rx="5" fill="#2563eb"/><text x="691.3949275362319" y="413" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">307</text><rect x="40" y="494" width="880" height="102" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="526" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">正文不去重，超长被截断</text><text x="480.0" y="559" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">repeat 加载 2 次，正文进入会话 552 字节，是一次的两倍。</text><text x="480.0" y="588" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">统计的是 UTF-8 字节，不是 token；工具结果的外壳另有开销。</text><text x="480" y="639" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">数据来自 R07 实际运行。</text></g></svg>
