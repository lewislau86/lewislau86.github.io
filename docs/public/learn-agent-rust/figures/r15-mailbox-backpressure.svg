<svg xmlns="http://www.w3.org/2000/svg" width="960" height="628" viewBox="0 0 960 628" role="img" aria-labelledby="title desc"><title id="title">邮箱容量要成为发送方可见的结果</title><desc id="desc">真实 mailbox-full 场景拒绝第三条消息，释放接收门后用相同 ID 重投，三条消息最终全部消费。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="628" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">邮箱容量要成为发送方可见的结果</text><rect x="40" y="82" width="880" height="102" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="480.0" y="114" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">测试门先暂停 core 的接收循环</text><text x="480.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">确定性地填队列，不靠 sleep 猜测时序</text><path d="M480 184 V226" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="234" width="420" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="250.0" y="266" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">容量 2：one + two</text><text x="250.0" y="299" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">两条 Note 已经成功入队</text><text x="250.0" y="328" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型尝试尚为零</text><rect x="500" y="234" width="420" height="132" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="710.0" y="266" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">第三条：three</text><text x="710.0" y="299" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">try_send → mailbox_full</text><text x="710.0" y="328" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未登记 ID，也未增加入队数</text><path d="M250 366 V410" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 366 V410" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="418" width="880" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="450" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">打开测试门，消费后重投原来的 three</text><text x="480.0" y="483" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">最终成功入队：3；接收端 notes：3</text><text x="480.0" y="512" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">三个回执均为 noted；模型尝试：0</text><text x="480" y="596" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">这次重投由实验控制器发起；运行时没有隐藏的自动重试。</text></g></svg>
