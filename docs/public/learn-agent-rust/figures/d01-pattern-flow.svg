<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc"><title id="title">同一个任务，三种结构</title><desc id="desc">同一个任务的三种结构：单次调用一次请求、资料由用户给全；固定工作流按代码写好的步骤读文件，多出的成员读不到；自主循环由模型按读到的内容补读，路径检查和调用上限由宿主守住。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="690" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">同一个任务，三种结构</text><rect x="30" y="80" width="290" height="96" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="112" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">单次调用</text><text x="175.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">一个 LlmAgent，无工具</text><rect x="30" y="196" width="290" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="228" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">single</text><text x="175.0" y="261" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 1 次，读 0 个文件</text><text x="175.0" y="290" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">通过</text><rect x="30" y="308" width="290" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="340" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">single-partial</text><text x="175.0" y="373" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 1 次，读 0 个文件</text><text x="175.0" y="402" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未通过：missing:member/README.md</text><rect x="340" y="80" width="290" height="96" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="112" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">固定工作流</text><text x="485.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">SequentialAgent：读 → 读 → 写</text><rect x="340" y="196" width="290" height="104" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="228" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">workflow</text><text x="485.0" y="261" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 1 次，读 2 个文件</text><text x="485.0" y="290" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">通过</text><rect x="340" y="308" width="290" height="104" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="340" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">workflow-new-member</text><text x="485.0" y="373" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 1 次，读 2 个文件</text><text x="485.0" y="402" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未通过：missing:plugin/README.md</text><rect x="340" y="420" width="290" height="104" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="452" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">workflow-missing</text><text x="485.0" y="485" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 0 次，读 1 个文件</text><text x="485.0" y="514" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未通过：escalated</text><rect x="340" y="532" width="290" height="104" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="564" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">workflow-silent</text><text x="485.0" y="597" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 1 次，读 1 个文件</text><text x="485.0" y="626" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未通过：missing:member/README.md</text><rect x="650" y="80" width="290" height="96" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="795.0" y="112" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">自主循环</text><text x="795.0" y="145" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">LlmAgent + read_file</text><rect x="650" y="196" width="290" height="104" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="795.0" y="228" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">adaptive</text><text x="795.0" y="261" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 4 次，读 3 个文件</text><text x="795.0" y="290" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">通过</text><rect x="650" y="308" width="290" height="104" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="795.0" y="340" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">forbidden</text><text x="795.0" y="373" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 3 次，读 1 个文件</text><text x="795.0" y="402" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未通过：no_report</text><rect x="650" y="420" width="290" height="104" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="795.0" y="452" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">budget</text><text x="795.0" y="485" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型调用 2 次，读 2 个文件</text><text x="795.0" y="514" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">未通过：max_iterations</text><text x="480" y="660" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">验收看报告是否引用了根 README 列出的每个成员；调用次数来自替身模型。</text></g></svg>
