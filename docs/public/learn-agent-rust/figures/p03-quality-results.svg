<svg xmlns="http://www.w3.org/2000/svg" width="960" height="745" viewBox="0 0 960 745" role="img" aria-labelledby="title desc"><title id="title">相同协议通过率，不同任务完成率</title><desc id="desc">24 次带标签任务中，两夹具适配均通过12次，完成分别12次和3次；失败未从分母移除。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="745" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">相同协议通过率，不同任务完成率</text><text x="480" y="89" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">固定任务 startup-v1：4 项公开合成任务，每项重复 3 次。</text><text x="180" y="155" text-anchor="middle" font-size="21" fill="#172033" font-weight="700">任务</text><text x="450" y="155" text-anchor="middle" font-size="21" fill="#172033" font-weight="700">quality-good 完成</text><text x="760" y="155" text-anchor="middle" font-size="21" fill="#172033" font-weight="700">quality-bad 完成</text><text x="180" y="221" text-anchor="middle" font-size="22" fill="#172033" font-weight="400">rust</text><text x="450" y="221" text-anchor="middle" font-size="25" fill="#0f766e" font-weight="700">3 / 3</text><text x="760" y="221" text-anchor="middle" font-size="25" fill="#b45309" font-weight="700">0 / 3</text><text x="180" y="295" text-anchor="middle" font-size="22" fill="#172033" font-weight="400">node</text><text x="450" y="295" text-anchor="middle" font-size="25" fill="#0f766e" font-weight="700">3 / 3</text><text x="760" y="295" text-anchor="middle" font-size="25" fill="#b45309" font-weight="700">3 / 3</text><text x="180" y="369" text-anchor="middle" font-size="22" fill="#172033" font-weight="400">injection</text><text x="450" y="369" text-anchor="middle" font-size="25" fill="#0f766e" font-weight="700">3 / 3</text><text x="760" y="369" text-anchor="middle" font-size="25" fill="#b45309" font-weight="700">0 / 3</text><text x="180" y="443" text-anchor="middle" font-size="22" fill="#172033" font-weight="400">missing</text><text x="450" y="443" text-anchor="middle" font-size="25" fill="#0f766e" font-weight="700">3 / 3</text><text x="760" y="443" text-anchor="middle" font-size="25" fill="#b45309" font-weight="700">0 / 3</text><text x="450" y="552" text-anchor="middle" font-size="23" fill="#2563eb" font-weight="700">适配 12 / 12</text><text x="450" y="600" text-anchor="middle" font-size="25" fill="#0f766e" font-weight="700">完成 12 / 12</text><text x="760" y="552" text-anchor="middle" font-size="23" fill="#2563eb" font-weight="700">适配 12 / 12</text><text x="760" y="600" text-anchor="middle" font-size="25" fill="#b45309" font-weight="700">完成 3 / 12</text><text x="480" y="660" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">错误夹具总答 npm start，仅 node 标签相符。</text><text x="480" y="703" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">本图检验评测管线；真实 provider 未运行，不能作为模型排名。</text></g></svg>
