<svg xmlns="http://www.w3.org/2000/svg" width="960" height="555" viewBox="0 0 960 555" role="img" aria-labelledby="title desc"><title id="title">缓存到期，重放保证也有边界</title><desc id="desc">幂等缓存到期后直接重放生成两张工单；客户端停止发送或按业务引用对账，仍保留一张工单。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="555" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">缓存到期，重放保证也有边界</text><rect x="40" y="85" width="880" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="117" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">幂等缓存只在保留期内保护原操作</text><text x="480.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">服务保留首次成功后的 100 tick；客户端从准备时起限制 100 tick</text><text x="480.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">now ≥ safe_until：客户端停止发送；tick 是实验逻辑输入</text><path d="M180 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 197 V239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="247" width="270" height="174" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="175.0" y="279" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">过期后直接重放</text><text x="175.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">旧键已经删除</text><text x="175.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">重复创建真实业务行</text><text x="175.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工单：2</text><rect x="345" y="247" width="270" height="174" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="279" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">客户端期限保护</text><text x="480.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">retry_window_expired</text><text x="480.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保持 unknown</text><text x="480.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">工单：1</text><rect x="650" y="247" width="270" height="174" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="785.0" y="279" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">按业务引用对账</text><text x="785.0" y="312" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">从工单表找回原回执</text><text x="785.0" y="341" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不增加业务工单</text><text x="785.0" y="370" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">检查点：1</text><text x="480" y="478" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">删除缓存键没有删除工单；对账依赖服务保留客户引用。</text><text x="480" y="518" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">真实服务的保留期、查询可见性与迟到请求需要单独核实。</text></g></svg>
