<svg xmlns="http://www.w3.org/2000/svg" width="960" height="722" viewBox="0 0 960 722" role="img" aria-labelledby="title desc"><title id="title">取消是请求，join 才确认执行者退出</title><desc id="desc">读取前通过通道确定取消顺序，子作用域释放资源，父侧等待退出后再删除工作区。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="722" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">取消是请求，join 才确认执行者退出</text><text x="240" y="86" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">父侧：句柄所有者</text><text x="720" y="86" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">子侧：协作退出</text><rect x="520" y="112" width="400" height="90" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="144" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">请求文件读取，发送 ready</text><text x="720.0" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">随后在放行通道等待</text><path d="M520 158 H444" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="112" width="400" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="144" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">收到控制点通知</text><text x="240.0" y="177" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">子模型已调用 1 轮</text><path d="M240 202 V238" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="246" width="400" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="278" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">设置取消标记，再唤醒</text><text x="240.0" y="311" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">或关闭发送端解除等待</text><path d="M440 291 H516" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="246" width="400" height="90" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="278" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">观察取消或通道断开</text><text x="720.0" y="311" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">补上取消结果，不读取文件</text><path d="M720 336 V372" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="380" width="400" height="90" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="720.0" y="412" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">离开子资源作用域</text><text x="720.0" y="445" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Drop 清理 scratch，返回报告</text><path d="M520 425 H444" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="380" width="400" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="412" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">join 等到线程结束</text><text x="240.0" y="445" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">确认没有继续运行的子线程</text><path d="M240 470 V506" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="514" width="880" height="90" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="546" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">再检查目录并清理父工作区</text><text x="480.0" y="579" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">实际检查子目录与根工作区均不存在</text><text x="480" y="652" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="700">cancel 实测：读取 0 次，剩余资源计数 0，子目录删除 true。</text><text x="480" y="690" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">本图验证读取前取消；已经开始的阻塞调用需要自己的中断协议。</text></g></svg>
