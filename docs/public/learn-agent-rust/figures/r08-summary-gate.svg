<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">摘要先核对，再进入历史</title><desc id="desc">漏写、虚构、格式错误和摘要模型出错都被拒绝，框架保留原历史，第二次运行照样给出结论；不核对时漏写的摘要被接受，任务无法继续。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">摘要先核对，再进入历史</text><rect x="40" y="86" width="880" height="96" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">摘要器逐项核对事实清单</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">键、值、顺序与清单一致，值能在被压缩的历史里找到</text><rect x="40" y="226" width="205" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="142.5" y="258" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">omit-fact</text><text x="142.5" y="291" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">漏写 target</text><text x="142.5" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">压缩事件：0</text><text x="142.5" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结论：是</text><path d="M142 182 V218" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="265" y="226" width="205" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="367.5" y="258" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">invent-fact</text><text x="367.5" y="291" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">测试通过</text><text x="367.5" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">压缩事件：0</text><text x="367.5" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结论：是</text><path d="M367 182 V218" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="490" y="226" width="205" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="592.5" y="258" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">bad-json</text><text x="592.5" y="291" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不是 JSON</text><text x="592.5" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">压缩事件：0</text><text x="592.5" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结论：是</text><path d="M592 182 V218" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="715" y="226" width="205" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="817.5" y="258" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">summary-error</text><text x="817.5" y="291" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">摘要模型出错</text><text x="817.5" y="320" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">压缩事件：0</text><text x="817.5" y="349" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">结论：是</text><path d="M817 182 V218" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="402" width="880" height="110" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="434" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">对照 omit-unchecked：同样漏写 target，但不核对</text><text x="480.0" y="467" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">摘要被接受（压缩事件 2），第二次运行找不到目标：结论 = 否</text><text x="480" y="560" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">核对不通过时框架保留原历史继续运行：代价是请求没变短，而不是任务做错。</text></g></svg>
