<svg xmlns="http://www.w3.org/2000/svg" width="960" height="642" viewBox="0 0 960 642" role="img" aria-labelledby="title desc"><title id="title">摘要先作为候选，再进入活跃历史</title><desc id="desc">遗漏目标路径或虚构测试通过均触发 summary_facts，Agent 调用数为零且原历史不变。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="642" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">摘要先作为候选，再进入活跃历史</text><rect x="40" y="86" width="880" height="114" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">应用记录的四项事实</text><text x="480.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">目标路径 · 源码发现 · 测试状态 · 技能线索</text><text x="480.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每项事实都指向原消息键与正文 SHA-256</text><path d="M480 200 V244" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="252" width="880" height="114" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="284" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">检查摘要候选</text><text x="480.0" y="317" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">严格 schema → 逐项比较事实 → 核对来源</text><text x="480.0" y="346" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">再检查消息配对与输入硬预算</text><path d="M260 366 V412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 366 V412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="420" width="420" height="142" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="250.0" y="452" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">遗漏 / 虚构：停止</text><text x="250.0" y="485" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Agent 调用：0 / 0</text><text x="250.0" y="514" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">原消息历史保持不变</text><text x="250.0" y="543" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">错误码：summary_facts</text><rect x="500" y="420" width="420" height="142" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="710.0" y="452" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">normal：提交</text><text x="710.0" y="485" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">摘要调用：1</text><text x="710.0" y="514" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">技能重载：1</text><text x="710.0" y="543" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">源码重读：1</text><text x="480" y="612" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">本例验证已知事实的保留；任意自然语言摘要的语义质量需另行评估。</text></g></svg>
