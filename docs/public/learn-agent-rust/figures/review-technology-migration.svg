<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">新技术经过对照实验，再成为可教学的实现</title><desc id="desc">查阅资料，提出迁移假设，在隔离实验中验证，然后统一更新课程基线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="590" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">新技术经过对照实验，再成为可教学的实现</text><rect x="45" y="100" width="260" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="132" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">一手资料</text><text x="175.0" y="165" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">日期与版本</text><text x="175.0" y="194" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">影响哪些章节</text><path d="M305 176 H343" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="100" width="260" height="150" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="132" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">迁移假设</text><text x="480.0" y="165" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">哪个旧合同会失效？</text><text x="480.0" y="194" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留基线和反例</text><path d="M610 176 H648" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="655" y="100" width="260" height="150" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="785.0" y="132" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">隔离验收</text><text x="785.0" y="165" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">相同任务与额度</text><text x="785.0" y="194" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">正常 + 故障路径</text><path d="M785 250 V315 H480 V348" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="95" y="356" width="770" height="135" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="388" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">进入课程基线</text><text x="480.0" y="421" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">代码、锁文件、输出、配图、文档与学习包共同更新</text><text x="480.0" y="450" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">没有运行的迁移，明确标为未验收</text><text x="480" y="548" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">追踪技术的目标：更新判断依据，并保留可复现的旧证据。</text></g></svg>
