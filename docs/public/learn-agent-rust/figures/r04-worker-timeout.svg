<svg xmlns="http://www.w3.org/2000/svg" width="960" height="616" viewBox="0 0 960 616" role="img" aria-labelledby="title desc"><title id="title">超时后，谁负责结束并回收回调？</title><desc id="desc">父进程启动固定 worker，检测时间预算，超时后终止并等待直属子进程，再返回类型化错误。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="616" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">超时后，谁负责结束并回收回调？</text><rect x="36" y="86" width="410" height="168" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="241.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">父进程：Agent 运行时</text><text x="241.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">启动本程序的固定 worker 模式</text><text x="241.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">try_wait 检查退出状态</text><text x="241.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Instant 检查本次时间预算</text><rect x="514" y="86" width="410" height="168" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="719.0" y="118" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">直属子进程：故障回调</text><text x="719.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">panic：异常退出</text><text x="719.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">hang：持续等待</text><text x="719.0" y="209" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本实验不创建后代进程</text><path d="M446 166 H505" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 254 V304 H480 V340" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="170" y="350" width="620" height="142" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="382" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">超过预算：kill 后继续 wait</text><text x="480.0" y="415" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">确认直属 worker 已结束并回收</text><text x="480.0" y="444" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">才返回 TimeoutReaped</text><text x="480" y="541" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">普通 Rust 回调仍在进程内；超时实验单独采用子进程边界。</text><text x="480" y="584" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">本图说明资源生命周期，不承诺通用进程树终止、沙箱或实时调度。</text></g></svg>
