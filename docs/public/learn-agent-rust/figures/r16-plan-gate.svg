<svg xmlns="http://www.w3.org/2000/svg" width="960" height="663" viewBox="0 0 960 663" role="img" aria-labelledby="title desc"><title id="title">批准具体内容，再消费一次执行机会</title><desc id="desc">被退回的旧请求保留，修订计划以新 ID 重新审批；执行端检查身份、期限、原计划和权限。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="663" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">批准具体内容，再消费一次执行机会</text><rect x="40" y="85" width="420" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="250.0" y="117" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">plan-1 · revision 1</text><text x="250.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Pending → rejected</text><text x="250.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留反馈；旧 ID 不能覆盖</text><path d="M460 141 H492" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="85" width="420" height="112" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="710.0" y="117" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">plan-2 · revision 2</text><text x="710.0" y="150" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">重新提交 → Approved</text><text x="710.0" y="179" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">冻结 revision / path / content</text><path d="M710 197 V239 H480 V269" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="277" width="880" height="144" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="309" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">执行入口逐项检查</text><text x="480.0" y="342" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">原申请者 + Approved + now &lt; deadline</text><text x="480.0" y="371" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">计划 SHA-256 一致 + 工具 ACL 独立允许</text><text x="480.0" y="400" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">仅 Core 创建 review.txt · create_new 保护已有路径</text><path d="M480 421 V463" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="471" width="880" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="503" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">Executing → Completed / Failed</text><text x="480.0" y="536" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">修订场景实际写入：1 次</text><text x="480.0" y="565" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">完成后不能重放；I/O 失败记 Failed，不自动重试</text><text x="480" y="629" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">摘要用于本实现的内容一致性；权限仍由执行端决定。</text></g></svg>
