<svg xmlns="http://www.w3.org/2000/svg" width="960" height="644" viewBox="0 0 960 644" role="img" aria-labelledby="title desc"><title id="title">循环由应用推进，预算在行动前检查</title><desc id="desc">模型预算在调用前检查，工具 ID 和整批额度在执行前检查，工具结果写回后继续下一轮。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="644" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">循环由应用推进，预算在行动前检查</text><rect x="40" y="82" width="550" height="88" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="315.0" y="114" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">检查模型预算</text><text x="315.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">model_turns 是否还有剩余额度？</text><path d="M590 126 H678" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="686" y="82" width="234" height="88" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="803.0" y="114" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">额度耗尽</text><text x="803.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">ModelBudget</text><path d="M315 170 V204" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="212" width="550" height="88" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="315.0" y="244" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">调用模型，记录响应</text><text x="315.0" y="277" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Final 文本 / ToolCalls 列表</text><path d="M590 256 H678" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="686" y="212" width="234" height="88" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="803.0" y="244" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">最终文本</text><text x="803.0" y="277" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">FinalAnswer</text><path d="M315 300 V334" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="342" width="550" height="88" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="315.0" y="374" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">校验调用 ID 与整批工具额度</text><text x="315.0" y="407" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">异常 ID 停止；超额整批拒绝</text><path d="M590 386 H678" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="686" y="342" width="234" height="88" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="803.0" y="374" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">入口拒绝</text><text x="803.0" y="407" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">InvalidCall / ToolBudget</text><path d="M315 430 V464" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="472" width="550" height="88" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="315.0" y="504" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">顺序执行工具，追加所有结果</text><text x="315.0" y="537" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">成功与错误都带原调用 ID</text><path d="M40 516 H20 V126 H36" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="612" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">循环箭头：追加结果后重新检查模型预算。模型接口错误另以 ModelError 停止。</text></g></svg>
