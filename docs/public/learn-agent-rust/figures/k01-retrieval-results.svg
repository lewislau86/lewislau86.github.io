<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc"><title id="title">检索命中与回答质量分别验收</title><desc id="desc">公开教学查询上的真实检索指标为 0.75；保留同义表达未召回案例，不代表泛化或真实模型正确率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="370" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">检索命中与回答质量分别验收</text><rect x="40" y="90" width="420" height="180" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="250.0" y="122" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">公开教学检索题</text><text x="250.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">题目数：4</text><text x="250.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Recall@2：0.75</text><text x="250.0" y="213" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">MRR@2：0.75</text><rect x="500" y="90" width="420" height="180" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="710.0" y="122" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">有意保留的失败</text><text x="710.0" y="155" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">revert disaster</text><text x="710.0" y="184" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">词面未命中 rollback</text><text x="710.0" y="213" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">返回无证据，保留失败记录</text><text x="480" y="325" text-anchor="middle" font-size="18" fill="#172033" font-weight="400">固定英文小语料、公开标签、无真实模型；这些数值只评价本次检索。</text></g></svg>
