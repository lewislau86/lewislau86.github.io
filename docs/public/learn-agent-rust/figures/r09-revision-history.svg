<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">同一个事实更新，旧来源仍可追溯</title><desc id="desc">设置、更新、遗忘依次成为三个事件；当前视图变化，遗忘后历史仍保留原话。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="680" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">同一个事实更新，旧来源仍可追溯</text><text x="255" y="88" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">持久事件 · 原记录继续保留</text><text x="720" y="88" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">当前召回视图</text><rect x="40" y="118" width="430" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="255.0" y="150" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">事件 revision=1</text><text x="255.0" y="183" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">set：中文</text><text x="255.0" y="212" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">来源：session-A</text><path d="M470 183 H526" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="118" width="390" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="725.0" y="150" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">存储 revision=1</text><text x="725.0" y="183" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">值：中文</text><text x="725.0" y="212" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">事实 revision=1</text><path d="M255 248 V291" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="296" width="430" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="255.0" y="328" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">事件 revision=2</text><text x="255.0" y="361" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">set：English</text><text x="255.0" y="390" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">来源：session-C</text><path d="M470 361 H526" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="296" width="390" height="130" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="725.0" y="328" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">存储 revision=2</text><text x="725.0" y="361" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">值：English</text><text x="725.0" y="390" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">事实 revision=2</text><path d="M255 426 V469" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="474" width="430" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="255.0" y="506" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">事件 revision=3</text><text x="255.0" y="539" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">forget：reply_language</text><text x="255.0" y="568" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">来源：session-D</text><path d="M470 539 H526" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="474" width="390" height="130" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="725.0" y="506" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">存储 revision=3</text><text x="725.0" y="539" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">missing：停止召回</text><text x="725.0" y="568" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">历史原话仍存在</text><text x="480" y="640" text-anchor="middle" font-size="19" 