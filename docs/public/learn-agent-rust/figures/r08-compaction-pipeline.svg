<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">框架决定何时压、切在哪里；应用决定摘要写什么</title><desc id="desc">运行之间与运行之内两种压缩都由框架决定切口，把旧历史交给应用的摘要器；核对通过才替换，不通过就保留原历史。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="760" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">框架决定何时压、切在哪里；应用决定摘要写什么</text><rect x="40" y="86" width="410" height="124" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="245.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">运行之间：EventsCompactionConfig</text><text x="245.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每完成 N 次运行</text><text x="245.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">旧事件 → 摘要器 → 压缩事件写进会话</text><rect x="510" y="86" width="410" height="124" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="715.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">运行之内：IntraCompactionConfig</text><text x="715.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每次请求模型前，估算超过阈值</text><text x="715.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">这次请求的历史 → 摘要器 → 替换</text><path d="M245 210 V250 H480 V280" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M715 210 V250 H480" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="288" width="640" height="116" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="480.0" y="320" text-anchor="middle" font-size="21" fill="#475569" font-weight="700">框架：决定切口</text><text x="480.0" y="353" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不分开工具调用与结果，不越过等待审批的调用</text><path d="M480 404 V440" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="448" width="640" height="116" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="480" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">应用：FactSummarizer</text><text x="480.0" y="513" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">摘要模型按事实清单写 JSON，逐项核对值和来源</text><path d="M320 564 V604" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640 564 V604" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="612" width="410" height="104" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="245.0" y="644" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">通过：用摘要替换</text><text x="245.0" y="677" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">摘要不比原文短时框架不用</text><rect x="510" y="612" width="410" height="104" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="715.0" y="644" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">不通过：返回错误</text><text x="715.0" y="677" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">框架保留原历史，继续运行</text></g></svg>
