<svg xmlns="http://www.w3.org/2000/svg" width="960" height="654" viewBox="0 0 960 654" role="img" aria-labelledby="title desc"><title id="title">先保留原文，再准备下一次模型输入</title><desc id="desc">应用归档后依次处理大结果、旧结果和历史摘要，候选通过校验后才进入下一次模型调用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="654" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">先保留原文，再准备下一次模型输入</text><rect x="40" y="86" width="410" height="114" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="245.0" y="118" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">准备模型请求</text><text x="245.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">核对工具调用与结果是否成组</text><text x="245.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保持当前历史不变</text><path d="M450 143 H503" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="86" width="410" height="114" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="715.0" y="118" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">先归档原始 JSONL</text><text x="715.0" y="151" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">每条消息都有稳定的来源键</text><text x="715.0" y="180" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保存大小与 SHA-256</text><path d="M715 200 V245" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="254" width="410" height="114" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="715.0" y="286" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">大结果先落盘</text><text x="715.0" y="319" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">注册引用 + 少量正文预览</text><text x="715.0" y="348" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">后续可以按字符分段读取</text><path d="M510 311 H457" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="254" width="410" height="114" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="245.0" y="286" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">旧结果再占位</text><text x="245.0" y="319" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">保留角色和工具调用 ID</text><text x="245.0" y="348" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">原始正文仍在归档中</text><path d="M245 368 V413" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="422" width="410" height="114" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="245.0" y="454" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">仍超触发线：生成摘要</text><text x="245.0" y="487" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">事实值 + 原消息键 + 内容摘要</text><text x="245.0" y="516" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">有独立的输入与调用预算</text><path d="M450 479 H503" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="422" width="410" height="114" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="715.0" y="454" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">验证后提交候选</text><text x="715.0" y="487" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">事实 · 来源 · 配对 · 硬预算</text><text x="715.0" y="516" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">失败则保留当前历史</text><text x="480" y="588" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="700">normal 后续：重新加载技能 → 重新读取源码 → 输出结论</text><text x="480" y="626" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">graph-flow 推进节点；压缩策略与预算由应用实现。</text></g></svg>
