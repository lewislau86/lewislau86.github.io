<svg xmlns="http://www.w3.org/2000/svg" width="960" height="618" viewBox="0 0 960 618" role="img" aria-labelledby="title desc"><title id="title">取消、回执和资源回收分别确认</title><desc id="desc">cancel-busy 场景的当前工作和排队工作分别收到取消状态，两位成员都已 join，活跃任务为零。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="618" rx="16" fill="#f8fafc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="480" y="40" text-anchor="middle" font-size="25" fill="#172033" font-weight="700">取消、回执和资源回收分别确认</text><rect x="40" y="82" width="880" height="112" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="480.0" y="114" text-anchor="middle" font-size="21" fill="#b45309" font-weight="700">取消通过独立 watch 信号</text><text x="480.0" y="147" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">不占用业务邮箱槽位</text><text x="480.0" y="176" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">模型异步等待可以被取消</text><path d="M250 194 V236" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 194 V236" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="244" width="420" height="112" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="250.0" y="276" text-anchor="middle" font-size="21" fill="#b91c1c" font-weight="700">当前 Work</text><text x="250.0" y="309" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">core-1 → cancelled</text><text x="250.0" y="338" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">实际文件读取：0</text><rect x="500" y="244" width="420" height="112" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="710.0" y="276" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">尚未开始的 Work</text><text x="710.0" y="309" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">queued → cancelled_queued</text><text x="710.0" y="338" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">为已接受消息补齐退出回执</text><path d="M250 356 V400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 356 V400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="408" width="880" height="132" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="440" text-anchor="middle" font-size="21" fill="#0f766e" font-weight="700">关闭接收端，等待全部 JoinHandle</text><text x="480.0" y="473" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">spawned=2 · joined=2 · active=0</text><text x="480.0" y="502" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">强制 abort=0；随后删除自建临时目录</text><text x="480" y="586" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">本例验证单进程资源回收；没有跨进程关闭握手或消息恢复。</text></g></svg>
