<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">延迟指标的时间线：TTFT、ITL、TPOT、E2EL</title><desc id="desc">请求发出后先做 prefill（红色括号是 TTFT，本例约 1.2 ms），之后每生成一个字做一次 decode（浅绿块，块与块之间的间隔是 ITL，约 1.4 ms）。decode 段的总时间除以生成的字数减一得到 TPOT；从发出请求到最后一个字是 E2EL（橙色括号）。三个数分别对应不同阶段，只看其中一个会误判。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="380" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">一次请求的延迟：TTFT、ITL、TPOT、E2EL 各覆盖哪一段</text><text x="155.0" y="104" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">prefill</text><rect x="90" y="120" width="130" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="155.0" y="156" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">一次前向</text><rect x="220" y="120" width="54" height="58" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="247.0" y="156" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">decode</text><rect x="282" y="120" width="54" height="58" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="309.0" y="156" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">decode</text><rect x="344" y="120" width="54" height="58" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="371.0" y="156" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">decode</text><rect x="406" y="120" width="54" height="58" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="433.0" y="156" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">decode</text><rect x="468" y="120" width="54" height="58" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="495.0" y="156" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">decode</text><line x1="90" y1="204" x2="522" y2="204" stroke="#b45309" stroke-width="2.5"/><line x1="90" y1="196" x2="90" y2="212" stroke="#b45309" stroke-width="2.5"/><line x1="522" y1="196" x2="522" y2="212" stroke="#b45309" stroke-width="2.5"/><text x="306.0" y="232" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">E2EL ≈ 22 ms（本例 16 个字）</text><line x1="90" y1="78" x2="220" y2="78" stroke="#b91c1c" stroke-width="2.5"/><line x1="90" y1="70" x2="90" y2="86" stroke="#b91c1c" stroke-width="2.5"/><line x1="220" y1="70" x2="220" y2="86" stroke="#b91c1c" stroke-width="2.5"/><text x="155.0" y="64" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">TTFT ≈ 1.2 ms</text><line x1="224" y1="248" x2="270" y2="248" stroke="#0f766e" stroke-width="2.5"/><text x="275.0" y="272" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">ITL ≈ 1.4 ms（相邻两个字之间）</text><text x="480" y="316" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">TPOT = (E2EL − TTFT) / (n − 1) ≈ 1.4 ms；单条请求上平均 ITL 就等于 TPOT，多条请求上两个平均口径不同。</text><text x="480" y="344" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">TTFT 由 prefill 决定，ITL / TPOT 由每一步 decode 决定——优化一个不一定改善另一个，所以三个数要一起报。</text><text x="480" y="368" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">为了画得下，decode 只画了 5 段；实际 16 个字有 15 段 ITL。</text></g></svg>
