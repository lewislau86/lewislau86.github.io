<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">CPU 与 GPU 的异步时间线</title><desc id="desc">上：CPU 依次发射每一步的计算，GPU 按顺序执行，两者互不等待，GPU 一直在忙。下：每步调用 loss.item() 时，CPU 必须等 GPU 算完并把数拷回来，之后才发射下一步，GPU 在两步之间空转。这是示意图，块的长短不代表实测时间。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="430" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">CPU 和 GPU 是两条时间线：CPU 只负责排队，GPU 慢慢执行</text><text x="480" y="80" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">好的写法：损失留在 GPU 上，每隔 N 步才取一次</text><text x="110" y="120" font-size="14.5" fill="#2563eb" font-weight="bold" text-anchor="end">CPU</text><rect x="130" y="96" width="70" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="165.0" y="119" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">发射 step1</text><rect x="200" y="96" width="70" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="235.0" y="119" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">发射 step2</text><rect x="270" y="96" width="70" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="305.0" y="119" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">发射 step3</text><rect x="340" y="96" width="70" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="375.0" y="119" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">发射 step4</text><rect x="410" y="96" width="360" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="590.0" y="119" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">可以去准备下一批数据</text><text x="110" y="166" font-size="14.5" fill="#0f766e" font-weight="bold" text-anchor="end">GPU</text><rect x="150" y="142" width="150" height="36" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="225.0" y="165" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">step1</text><rect x="300" y="142" width="150" height="36" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="375.0" y="165" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">step2</text><rect x="450" y="142" width="150" height="36" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="525.0" y="165" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">step3</text><rect x="600" y="142" width="150" height="36" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="675.0" y="165" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">step4</text><text x="480" y="210" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">GPU 一刻不停；CPU 远远跑在前面，只受队列长度限制</text><text x="480" y="254" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">坏的写法：每步都 loss.item()（或 print、.cpu()）</text><text x="110" y="294" font-size="14.5" fill="#2563eb" font-weight="bold" text-anchor="end">CPU</text><rect x="130" y="270" width="60" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="160.0" y="293" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">发射 1</text><rect x="190" y="270" width="120" height="36" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 4"/><text x="250.0" y="293" font-size="12" fill="#b91c1c" font-weight="normal" text-anchor="middle">item() 等 GPU</text><rect x="310" y="270" width="60" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="340.0" y="293" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">发射 2</text><rect x="370" y="270" width="120" height="36" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 4"/><text x="430.0" y="293" font-size="12" fill="#b91c1c" font-weight="normal" text-anchor="middle">item() 等 GPU</text><rect x="490" y="270" width="60" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="520.0" y="293" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">发射 3</text><text x="110" y="340" font-size="14.5" fill="#0f766e" font-weight="bold" text-anchor="end">GPU</text><rect x="150" y="316" width="150" height="36" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="225.0" y="339" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">step1</text><rect x="300" y="316" width="30" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="315.0" y="339" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">空</text><rect x="330" y="316" width="150" height="36" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="405.0" y="339" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">step2</text><rect x="480" y="316" width="30" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="495.0" y="339" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">空</text><rect x="510" y="316" width="150" height="36" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="585.0" y="339" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">step3</text><text x="480" y="384" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">每次 .item() 都要把数从 GPU 拷回 CPU，CPU 只能等 GPU 把队列里的活干完；</text><text x="480" y="406" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">等到以后才发射下一步，GPU 在两步之间空转。计时也一样：测 GPU 时间前要 torch.cuda.synchronize()</text></g></svg>
