<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">GRPO 的组内比较</title><desc id="desc">一条指令采样 8 个回答，程序判定奖励：两个回答得 1，其余得 0。组内平均 0.25、标准差约 0.46，得 1 的回答优势约 +1.62，得 0 的约 −0.54。每个回答里的每个 token 都用这个优势更新；全组奖励相同时优势为 0。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="410" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">GRPO：同一条指令采样一组回答，组内比高低，不需要价值模型</text><rect x="30" y="140" width="170" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115" y="166" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">一条指令</text><text x="115" y="187" font-size="12" fill="#172033" font-weight="normal" text-anchor="middle">写一首五言绝句。</text><path d="M202 170L260 78" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="262" y="66" width="300" height="26" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="272" y="84" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">回答 1</text><text x="600" y="84" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">奖励 1</text><text x="720" y="84" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle">优势 +1.62</text><path d="M202 170L260 112" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="262" y="100" width="300" height="26" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="272" y="118" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">回答 2</text><text x="600" y="118" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">奖励 0</text><text x="720" y="118" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">优势 -0.54</text><path d="M202 170L260 146" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="262" y="134" width="300" height="26" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="272" y="152" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">回答 3</text><text x="600" y="152" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">奖励 0</text><text x="720" y="152" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">优势 -0.54</text><path d="M202 170L260 180" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="262" y="168" width="300" height="26" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="272" y="186" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">回答 4</text><text x="600" y="186" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">奖励 1</text><text x="720" y="186" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle">优势 +1.62</text><path d="M202 170L260 214" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="262" y="202" width="300" height="26" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="272" y="220" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">回答 5</text><text x="600" y="220" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">奖励 0</text><text x="720" y="220" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">优势 -0.54</text><path d="M202 170L260 248" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="262" y="236" width="300" height="26" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="272" y="254" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">回答 6</text><text x="600" y="254" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">奖励 0</text><text x="720" y="254" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">优势 -0.54</text><path d="M202 170L260 282" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="262" y="270" width="300" height="26" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="272" y="288" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">回答 7</text><text x="600" y="288" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">奖励 0</text><text x="720" y="288" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">优势 -0.54</text><path d="M202 170L260 316" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="262" y="304" width="300" height="26" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="272" y="322" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">回答 8</text><text x="600" y="322" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">奖励 0</text><text x="720" y="322" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">优势 -0.54</text><text x="860" y="150" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">组内平均</text><text x="860" y="172" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">0.25</text><text x="860" y="210" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">组内标准差</text><text x="860" y="232" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">0.46</text><text x="480" y="368" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">优势 = (奖励 − 组内平均) ÷ 组内标准差：比同组其他回答好就加强，差就减弱；全组一样（全对或全错）时优势为 0，这组不起作用</text><text x="480" y="392" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">奖励由程序判定（押韵、格式），不需要奖励模型；每个 token 用同一个优势，另加 β·KL 拴住</text></g></svg>
