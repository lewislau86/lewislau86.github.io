<svg xmlns="http://www.w3.org/2000/svg" width="960" height="495" viewBox="0 0 960 495" role="img" aria-labelledby="title desc">
<title id="title">码点与 UTF-8 字节</title><desc id="desc">A 是 1 个码点 1 个字节；猫是 1 个码点 3 个字节；é 是 1 个码点 2 个字节；e 加组合重音是 2 个码点 3 个字节；女人加零宽连接符加电脑的 emoji 是 3 个码点 11 个字节。</desc>
