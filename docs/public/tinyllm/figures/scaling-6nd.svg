<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">训练算力 6ND 的来历</title><desc id="desc">一个权重 w_ij 遇到一个 token：前向时乘一次、加一次，共 2 次；反向时要把梯度传给输入（2 次），还要算这个权重自己的梯度（2 次）。合计每个参数每个 token 6 次，所以一次训练约 6ND 次浮点运算。用 FlopCounterMode 实测宽度 32、64、128 的一步训练，和 6 × 全部参数 × token 数的比值都在 0.997 以上；只算不含嵌入的参数会少算很多，因为共享权重的输出层也要乘一遍。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="400" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">一个权重、一个 token：前向 2 次运算，反向 4 次</text><rect x="40" y="70" width="190" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="135" y="98" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">前向</text><text x="135" y="136" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>y_j += x_i * w_ij</text><text x="135" y="166" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">乘 1 次、加 1 次</text><text x="135" y="202" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">2 次</text><rect x="250" y="70" width="190" height="150" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="345" y="98" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">反向：传给输入</text><text x="345" y="136" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>dx_i += dy_j * w_ij</text><text x="345" y="166" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">让梯度继续往前传</text><text x="345" y="202" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">2 次</text><rect x="460" y="70" width="190" height="150" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="555" y="98" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">反向：给权重</text><text x="555" y="136" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>dw_ij += x_i * dy_j</text><text x="555" y="166" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">优化器要用的梯度</text><text x="555" y="202" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">2 次</text><text x="355" y="254" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">每个参数、每个 token：2 + 2 + 2 = 6 次 → 一次训练约 6 × 参数量 N × token 数 D</text><rect x="680" y="70" width="250" height="150" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="805" y="96" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle">实测一步（1024 个 token）</text><text x="700" y="126" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">宽度 32</text><text x="910" y="126" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.9972</text><text x="700" y="156" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">宽度 64</text><text x="910" y="156" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.9980</text><text x="700" y="186" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">宽度 128</text><text x="910" y="186" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.9988</text><text x="805" y="210" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">实测 ÷ (6×全部参数×token)</text><rect x="40" y="282" width="890" height="96" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text x="60" y="310" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">N 要算哪些参数？</text><text x="60" y="336" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">词嵌入表的“查表”不做乘加，但 TinyLLM 的输出层和它共享同一张表（第 5 章），每个 token 都要乘一遍：</text><text x="60" y="360" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">所以全部参数都要算。只算不含嵌入的部分，宽度 32 时会少算 2.3 倍。注意力分数那部分运算和序列长度有关，在 64 个 token 时可以忽略。</text></g></svg>
