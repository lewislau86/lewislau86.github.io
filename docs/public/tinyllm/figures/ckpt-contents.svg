<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title desc">
<title id="title">检查点的组成与缺失的后果</title><desc id="desc">检查点由模型参数（646 KB）、优化器状态（1294 KB）、调度器状态、训练进度、随机数状态和配置组成。恢复时缺了优化器状态、调度器状态、数据位置或随机数状态中的任何一样，接着训练的参数都会偏离一口气训完的结果（最大差 0.52、0.29、0.42、0.33）；全部存齐时最大差为 0.0，逐位相同。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="556" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">一个能“接着训”的检查点里有什么</text><text x="130" y="78" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">组成</text><text x="470" y="78" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">内容</text><text x="800" y="78" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">恢复时缺了它</text><rect x="40" y="92" width="180" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="130" y="114" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">模型参数</text><text x="130" y="134" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">646 KB</text><text x="240" y="123" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">state_dict()：每个参数张量</text><text x="800" y="123" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">等于从头训练</text><rect x="40" y="152" width="180" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="130" y="174" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="middle">优化器状态</text><text x="130" y="194" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">1294 KB</text><text x="240" y="183" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">AdamW 的 m、v、步数，当前学习率</text><text x="800" y="174" font-size="14" fill="#b91c1c" font-weight="normal" text-anchor="middle">参数最大差 0.52</text><text x="800" y="194" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">最终验证 4.8560</text><rect x="40" y="212" width="180" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="130" y="234" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">调度器状态</text><text x="130" y="254" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">1.4 KB</text><text x="240" y="243" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">走到了第几步</text><text x="800" y="234" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">参数最大差 0.29</text><text x="800" y="254" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">最终验证 4.9149</text><rect x="40" y="272" width="180" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="130" y="294" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">训练进度</text><text x="130" y="314" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">1.3 KB</text><text x="240" y="303" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">step、epoch、这个 epoch 用掉几个 batch</text><text x="800" y="294" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">参数最大差 0.42</text><text x="800" y="314" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">最终验证 4.8677</text><rect x="40" y="332" width="180" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="130" y="354" font-size="16" fill="#7c3aed" font-weight="bold" text-anchor="middle">随机数状态</text><text x="130" y="374" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">6.5 KB</text><text x="240" y="363" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">全局 torch 随机数（dropout 用）</text><text x="800" y="354" font-size="14" fill="#7c3aed" font-weight="normal" text-anchor="middle">参数最大差 0.33</text><text x="800" y="374" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">最终验证 4.8660</text><rect x="40" y="392" width="180" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="130" y="414" font-size="16" fill="#64748b" font-weight="bold" text-anchor="middle">配置</text><text x="130" y="434" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">2.7 KB</text><text x="240" y="423" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">模型配置与训练配置，新进程先按它造对象</text><text x="800" y="423" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">造不出对象</text><rect x="40" y="460" width="880" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="489" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">全部存齐（再给 DataLoader 一个自己的 generator）：参数最大差 0.0，验证 4.8635，和一口气训完逐位相同</text><text x="480" y="536" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">另外和检查点放在一起：tokenizer.json。本例 163,904 个参数，优化器状态约是模型的 2 倍</text></g></svg>
