<svg xmlns="http://www.w3.org/2000/svg" width="960" height="312" viewBox="0 0 960 312" role="img" aria-labelledby="title desc">
<title id="title">DPO 与 RLHF 的对比</title><desc id="desc">左：RLHF 先用偏好对训练奖励模型，再让策略采样、打分，用 PPO 和价值模型更新，减去 β 乘 KL，需要四个模型和在线采样。右：DPO 把偏好对直接放进损失，只需要策略和冻住的参考模型，不采样；隐含奖励是 β 乘以策略和参考模型对数概率之差。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="312" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">DPO：把“训练奖励模型 + 强化学习”合成一步监督学习</text><rect x="30" y="70" width="420" height="150" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="240" y="98" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">RLHF（第 41 章）</text><text x="50" y="128" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 偏好对 → 训练奖励模型</text><text x="50" y="152" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 策略采样 → 奖励模型打分 → 价值模型估计优势</text><text x="50" y="176" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· PPO 更新策略和价值模型，减去 β·KL</text><text x="50" y="200" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 四个模型，要在线采样</text><rect x="510" y="70" width="420" height="150" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="720" y="98" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">DPO</text><text x="530" y="128" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 偏好对直接进损失，不训练奖励模型</text><text x="530" y="152" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 不采样：只算两个回答的对数概率</text><text x="530" y="176" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 隐含奖励 = β·(log π − log π_ref)</text><text x="530" y="200" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 两个模型（策略 + 冻住的参考），像 SFT 一样训练</text><text x="480" y="262" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">损失 = −log σ( β · [ (log π(选中) − log π_ref(选中)) − (log π(落选) − log π_ref(落选)) ] )</text><text x="480" y="292" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">它和“奖励模型 + KL 约束的最优策略”在数学上对应；β 越小，越容易偏离参考模型</text></g></svg>
