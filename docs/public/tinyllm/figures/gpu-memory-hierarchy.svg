<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
<title id="title">GPU 的存储层次</title><desc id="desc">从下往上：H100 SXM 的 HBM 显存 80 GB、带宽约 3.35 TB/s，存权重、KV cache 和激活；L2 缓存 50 MB，全卡共享；每个 SM 的共享内存最多 228 KB，共 132 个 SM，由程序显式管理，FlashAttention 把 Q、K、V 的块放在这里；寄存器每个 SM 256 KB。分块注意力让计算留在共享内存里，只把输出写回 HBM。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="456" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">GPU 的存储层次：越靠近计算单元越快，也越小（H100 SXM）</text><rect x="130.0" y="70" width="700" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="480" y="94" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">HBM 显存：80 GB</text><text x="480" y="116" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">约 3.35 TB/s；权重、KV cache、激活都在这里</text><rect x="180.0" y="144" width="600" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="480" y="168" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">L2 缓存：50 MB</text><text x="480" y="190" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">全卡共享；自动缓存，程序管不了</text><rect x="245.0" y="218" width="470" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="242" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">每个 SM 的共享内存 / L1：最多 228 KB（共 132 个 SM）</text><text x="480" y="264" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">程序显式管理；FlashAttention 把 Q、K、V 的块放在这里</text><rect x="320.0" y="292" width="320" height="62" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="316" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">寄存器：每个 SM 256 KB</text><text x="480" y="338" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">最快；正在算的那几个数</text><text x="480" y="384" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">朴素注意力把 T×T 的分数表写回 HBM 再读出来；分块内核让一个方块的计算从头到尾留在共享内存里，</text><text x="480" y="406" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">只把输出写回 HBM。块大小的上限就是这 228 KB（第 5 节）</text><text x="480" y="434" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">数据来自 NVIDIA Hopper 调优指南与 H100 产品说明；其他 GPU 的容量不同，A100 每个 SM 的共享内存最多 164 KB</text></g></svg>
