<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" role="img" aria-labelledby="title desc">
<title id="title">一个优化器步里的调用顺序</title><desc id="desc">一个优化器步从 zero_grad 开始；然后对每个 micro-batch 做前向和 (loss / accum).backward()，梯度在 .grad 里累加，期间不裁剪、不更新、不清零；累积完以后，FP16 先 unscale_ 缩回真实大小，再对累积完的梯度裁剪一次，然后 optimizer.step()（FP16 用 scaler.step，遇到 inf/nan 跳过），最后 scheduler.step()。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="604" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">一个优化器步：先累积，再缩回、裁剪、更新</text><rect x="330" y="78" width="300" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="480" y="104" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>optimizer.zero_grad()</text><text x="660" y="104" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">每个优化器步一次</text><path d="M480 118L480 144" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="200" y="146" width="560" height="196" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><text x="220" y="170" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">重复 accum 次（每个 micro-batch）</text><rect x="330" y="182" width="300" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="480" y="207" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">前向：算这个 micro-batch 的损失</text><path d="M480 220L480 236" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="330" y="238" width="300" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="480" y="263" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>(loss / accum).backward()</text><text x="640" y="263" font-size="13" fill="#b45309" font-weight="normal" text-anchor="start">FP16：scaler.scale(…)</text><path d="M480 276L480 292" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="480" y="314" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="middle">梯度在 .grad 里累加；这里不裁剪、不更新、不清零</text><path d="M480 342L480 368" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="300" y="370" width="360" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/><text x="480" y="395" font-size="15" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>scaler.unscale_(optimizer)</text><text x="680" y="395" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="start">只有 FP16：先缩回真实大小，再检查 inf/nan</text><path d="M480 408L480 424" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="300" y="426" width="360" height="38" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="480" y="451" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>clip_grad_norm_(params, 1.0)</text><text x="680" y="451" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">对累积完的梯度裁一次</text><path d="M480 464L480 480" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="300" y="482" width="360" height="38" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="480" y="507" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>optimizer.step()</text><text x="680" y="507" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">FP16 用 scaler.step(optimizer)，有 inf/nan 就跳过</text><path d="M480 520L480 536" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="300" y="538" width="360" height="38" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="480" y="563" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>scheduler.step()</text><text x="680" y="563" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">每个优化器步一次，不是每个 micro-batch</text></g></svg>
