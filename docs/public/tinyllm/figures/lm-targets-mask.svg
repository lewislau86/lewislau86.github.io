<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">错位出题与损失掩码</title><desc id="desc">上：一段窗口里，输入 x 是前 64 个 token，目标 y 是往后错一位的 64 个 token，第 t 道题看 x 的前 t 个、猜 y 的第 t 个。下：指令微调的一条样本里，提问部分和补齐的 &lt;pad&gt; 标成 -100、不算损失，回答和 &lt;eos&gt; 算损失；预训练的拼接流里所有位置都算。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="430" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">一段 65 个 token 出 64 道题；不是每道题都算进损失</text><text x="140" y="92" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end">窗口</text><rect x="160" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="187" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">春</text><rect x="220" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="247" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">眠</text><rect x="280" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="307" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">不</text><rect x="340" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="367" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">觉</text><rect x="400" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="427" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">晓</text><rect x="460" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="487" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">，</text><rect x="520" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="547" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">处</text><rect x="580" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="607" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">处</text><rect x="640" y="70" width="54" height="36" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="667" y="94" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">…</text><text x="140" y="146" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="end">输入 x</text><text x="140" y="196" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="end">目标 y</text><rect x="160" y="124" width="54" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="187" y="148" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">春</text><rect x="160" y="174" width="54" height="36" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="187" y="198" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">眠</text><path d="M187 160L187 172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow-64748b)"/><rect x="220" y="124" width="54" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="247" y="148" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">眠</text><rect x="220" y="174" width="54" height="36" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="247" y="198" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">不</text><path d="M247 160L247 172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow-64748b)"/><rect x="280" y="124" width="54" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="307" y="148" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">不</text><rect x="280" y="174" width="54" height="36" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="307" y="198" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">觉</text><path d="M307 160L307 172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow-64748b)"/><rect x="340" y="124" width="54" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="367" y="148" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">觉</text><rect x="340" y="174" width="54" height="36" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="367" y="198" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">晓</text><path d="M367 160L367 172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow-64748b)"/><rect x="400" y="124" width="54" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="427" y="148" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">晓</text><rect x="400" y="174" width="54" height="36" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="427" y="198" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">，</text><path d="M427 160L427 172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460" y="124" width="54" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="487" y="148" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">，</text><rect x="460" y="174" width="54" height="36" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="487" y="198" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">处</text><path d="M487 160L487 172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow-64748b)"/><rect x="520" y="124" width="54" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="547" y="148" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">处</text><rect x="520" y="174" width="54" height="36" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="547" y="198" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">处</text><path d="M547 160L547 172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow-64748b)"/><rect x="580" y="124" width="54" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="607" y="148" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">处</text><rect x="580" y="174" width="54" height="36" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="607" y="198" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">…</text><path d="M607 160L607 172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow-64748b)"/><text x="720" y="148" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">第 t 道题：看 x 的前 t 个，</text><text x="720" y="170" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">猜 y 的第 t 个</text><text x="720" y="196" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">因果掩码保证看不到答案</text><text x="480" y="262" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">哪些位置算损失（指令微调时的一条样本，补齐到同样长度）</text><rect x="100" y="280" width="244" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="222.0" y="305" font-size="13.5" fill="#64748b" font-weight="bold" text-anchor="middle">用户：写一句春天</text><text x="222.0" y="342" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">提问：-100，不算</text><rect x="348" y="280" width="244" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/><text x="470.0" y="305" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="middle">助手：春眠不觉晓</text><text x="470.0" y="342" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">回答：算</text><rect x="596" y="280" width="58" height="40" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="625.0" y="305" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">&lt;eos&gt;</text><text x="625.0" y="342" font-size="12.5" fill="#b45309" font-weight="normal" text-anchor="middle">结束：要算</text><rect x="658" y="280" width="120" height="40" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="718.0" y="305" font-size="13.5" fill="#64748b" font-weight="bold" text-anchor="middle">&lt;pad&gt;</text><text x="718.0" y="342" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">补齐：-100</text><text x="480" y="384" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">预训练（第 14 章的拼接流）没有提问和补齐，64 个位置全部算；&lt;eos&gt; 在两种情况下都要算</text><text x="480" y="406" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">平均时分母是“算了损失的位置数”，不是窗口长度（第 5 节）</text></g></svg>
