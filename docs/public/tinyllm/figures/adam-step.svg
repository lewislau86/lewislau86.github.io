<svg xmlns="http://www.w3.org/2000/svg" width="960" height="508" viewBox="0 0 960 508" role="img" aria-labelledby="title desc">
<title id="title">AdamW 一步的数据流与内存</title><desc id="desc">梯度 g 同时更新两个滑动平均：m 是梯度的平均方向（β1=0.9），v 是梯度平方的平均（β2=0.999）。偏差修正后用 m^ 除以 √v^ 加 ε 得到每个方向各自归一的步子，乘学习率后从参数里减掉；权重衰减直接作用在参数上。FP32 训练时每个参数要存参数、梯度、m、v 各 4 字节，共 16 字节。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="508" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">AdamW 的一步：每个参数带着两个“记忆” m、v</text><rect x="40" y="70" width="170" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="125.0" y="92.0" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">梯度 g</text><text x="125.0" y="110.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">backward 得到</text><rect x="260" y="70" width="230" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="375.0" y="92.0" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle">m ← β1·m + (1−β1)·g</text><text x="375.0" y="110.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">β1 = 0.9：梯度的平均方向</text><rect x="260" y="150" width="230" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="375.0" y="172.0" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="middle">v ← β2·v + (1−β2)·g^2</text><text x="375.0" y="190.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">β2 = 0.999：梯度的平均大小的平方</text><path d="M210 95L256 95" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M225 95 V175 H256" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="540" y="110" width="200" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="640.0" y="132.0" font-size="13.5" fill="#64748b" font-weight="bold" text-anchor="middle">偏差修正</text><text x="640.0" y="150.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">m^ = m/(1−β1ᵗ)，v^ 同理</text><path d="M490 95L536 125" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M490 175L536 145" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="540" y="200" width="200" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="640.0" y="222.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">方向 ÷ 大小</text><text x="640.0" y="240.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">m^ / (√v^ + ε)</text><path d="M640 160L640 196" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="540" y="290" width="200" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="640.0" y="312.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">乘学习率 η</text><text x="640.0" y="330.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">第 17 章的调度给出 η</text><path d="M640 250L640 286" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="800" y="290" width="140" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="870.0" y="320.0" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">w ← w − 更新</text><path d="M740 315L796 315" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="800" y="200" width="140" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="870.0" y="222.0" font-size="13.5" fill="#b91c1c" font-weight="bold" text-anchor="middle">衰减 η·λ·w</text><text x="870.0" y="240.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">直接作用在 w 上</text><path d="M870 250L870 286" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="870" y="186" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">AdamW 的“W”</text><text x="240" y="262" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">每个方向各自除以自己的 √v^：</text><text x="240" y="284" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">梯度一直很大的方向步子变小，</text><text x="240" y="306" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">一直很小的方向步子变大</text><text x="480" y="380" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">每个参数要多存几个数（FP32 训练）</text><rect x="240" y="398" width="110" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="295" y="423" font-size="13.5" fill="#7c3aed" font-weight="bold" text-anchor="middle">参数 w：4 字节</text><rect x="360" y="398" width="110" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="415" y="423" font-size="13.5" fill="#b91c1c" font-weight="bold" text-anchor="middle">梯度 g：4 字节</text><rect x="480" y="398" width="110" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="423" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle">m：4 字节</text><rect x="600" y="398" width="110" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/><text x="655" y="423" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="middle">v：4 字节</text><text x="480" y="464" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">合计 16 字节 / 参数：第 12 章 131 万参数约 21 MB；70 亿参数就是 112 GB（还没算激活）</text><text x="480" y="488" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">m 和 v 存在 optimizer.state 里，续训时必须一起保存（第 21 章）；Adafactor 把 v 压成行、列两个向量来省内存</text></g></svg>
