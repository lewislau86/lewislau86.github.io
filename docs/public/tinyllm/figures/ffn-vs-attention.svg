<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">注意力与前馈层的分工</title><desc id="desc">左：注意力里，每个位置的输出由它自己和前面所有位置加权混合而成，连线就是 T×T 的注意力表。右：前馈层对每个位置单独做同一个变换，5 个框共用同一组参数，位置之间没有连线。</desc>
