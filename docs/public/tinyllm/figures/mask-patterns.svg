<svg xmlns="http://www.w3.org/2000/svg" width="960" height="385" viewBox="0 0 960 385" role="img" aria-labelledby="title desc">
<title id="title">三种注意力的掩码</title><desc id="desc">左：编码器自注意力，5 个原文词互相都能看，25 个格子全部允许。中：解码器自注意力，4 个译词只能看自己和前面，是下三角，16 个格子里 10 个允许，这就是因果掩码。右：交叉注意力，每个译词能看全部 5 个原文词，20 个格子全部允许。</desc>
