ar", Menlo, Consolas, monospace'>+0.123</text><rect x="636" y="188" width="150" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="656" y="214" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-0.116</text><text x="718" y="214" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-0.033</text><text x="656" y="238" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.002</text><text x="718" y="238" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.117</text><rect x="798" y="188" width="150" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="818" y="214" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-0.079</text><text x="880" y="214" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.207</text><text x="818" y="238" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.009</text><text x="880" y="238" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.066</text><text x="128" y="270" font-size="22" fill="#64748b" font-weight="bold" text-anchor="middle">=</text><text x="20" y="310" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">输入向量</text><text x="20" y="332" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="start">两者逐个数相加</text><rect x="150" y="280" width="150" height="62" rx="10" fill="#ffffff" stroke="#172033" stroke-width="1.4"/><text x="170" y="306" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-0.009</text><text x="232" y="306" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-0.051</text><text x="170" y="330" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-0.006</text><text x="232" y="330" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.302</text><rect x="312" y="280" width="150" height="62" rx="10" fill="#ffffff" stroke="#172033" stroke-width="1.4"/><text x="332" y="306" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-0.044</text><text x="394" y="306" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.133</text><text x="332" y="330" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.039</text><text x="394" y="330" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.093</text><rect x="474" y="280" width="150" height="62" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2.4"/><text x="494" y="306" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>