<rect width="960" height="440" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">进模型的向量 = 字向量 + 位置向量（每格是前 4 个数）</text><text x="225.0" y="78" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">“床”· 第 0 位</text><text x="387.0" y="78" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">“前”· 第 1 位</text><text x="549.0" y="78" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">“明”· 第 2 位</text><text x="711.0" y="78" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">“月”· 第 3 位</text><text x="873.0" y="78" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">“光”· 第 4 位</text><text x="20" y="126" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">字向量</text><text x="20" y="148" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="start">查字表：第几个字</text><rect x="150" y="96" width="150" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="170" y="122" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.118</text><text x="232" y="122" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.038</text><text x="170" y="146" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.031</text><text x="232" y="146" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.119</text><rect x="312" y="96" width="150" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="332" y="122" font-size="12.5" fill="#256