ono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.075</text><text x="880" y="330" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+0.101</text><text x="480" y="392" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">以“明”为例，第 1 个数：(-0.263) + (-0.006) = -0.269；96 个数都这样逐个相加</text><text x="480" y="418" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">同一个字换到别的位置，加上的是另一行位置向量，进模型的向量就不一样了</text></g></svg>
