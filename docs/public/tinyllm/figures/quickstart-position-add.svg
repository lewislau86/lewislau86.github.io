<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">字向量加位置向量</title><desc id="desc">“床前明月光”五个字，每个字查字表得到字向量，再按它排在第几位查位置表得到位置向量，两者逐个数相加，就是进模型的向量。以第 2 位（从 0 数）的“明”为例，第一个数是 (-0.263) + (-0.006) = -0.269。</desc>
