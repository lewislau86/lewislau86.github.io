<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495" viewBox="0 0 1000 495" role="img" aria-labelledby="title desc">
<title id="title">稠密前馈层与 MoE 层</title><desc id="desc">左：稠密前馈层，每个 token 都经过同一个 SwiGLU。右：MoE 层，路由器给 8 个专家打分，每个 token 只选分数最高的 2 个专家，两个专家的输出按归一化后的分数加权相加；没被选中的专家不参与这次计算。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="495" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">把一个前馈层换成 8 个专家：每个 token 只用其中 2 个</text><text x="150" y="84" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle">稠密前馈层</text><text x="150" y="116" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">x（一个 token）</text><path d="M150 124L150 150" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="60" y="152" width="180" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="182" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">SwiGLU</text><text x="150" y="204" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">每个 token 都用全部参数</text><path d="M150 216L150 244" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="150" y="264" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">输出</text><line x1="300" y1="70" x2="300" y2="440" stroke="#e2e8f0" stroke-width="2"/><text x="650" y="84" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle">MoE 层（本章：8 个专家，每个 token 选 2 个）</text><text x="650" y="116" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">x（一个 token）</text><path d="M650 124L650 146" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="500" y="148" width="300" height="52" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="650" y="172" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">路由器：Linear(d → 8) + softmax</text><text x="650" y="192" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">给 8 个专家各打一个分，选最高的 2 个</text><line x1="650" y1="200" x2="359" y2="252" stroke="#cbd5e1" stroke-width="1.2"/><rect x="322" y="254" width="74" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="359" y="280" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">专家 0</text><text x="359" y="302" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">SwiGLU</text><path d="M650 200 L443 252" stroke="#0f766e" stroke-width="2.4" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="406" y="254" width="74" height="60" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.4"/><text x="443" y="280" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">专家 1</text><text x="443" y="302" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">SwiGLU</text><path d="M443 314 L650 360" stroke="#0f766e" stroke-width="2.4" fill="none" marker-end="url(#arrow-0f766e)"/><line x1="650" y1="200" x2="527" y2="252" stroke="#cbd5e1" stroke-width="1.2"/><rect x="490" y="254" width="74" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="527" y="280" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">专家 2</text><text x="527" y="302" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">SwiGLU</text><line x1="650" y1="200" x2="611" y2="252" stroke="#cbd5e1" stroke-width="1.2"/><rect x="574" y="254" width="74" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="611" y="280" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">专家 3</text><text x="611" y="302" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">SwiGLU</text><line x1="650" y1="200" x2="695" y2="252" stroke="#cbd5e1" stroke-width="1.2"/><rect x="658" y="254" width="74" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="695" y="280" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">专家 4</text><text x="695" y="302" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">SwiGLU</text><path d="M650 200 L779 252" stroke="#0f766e" stroke-width="2.4" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="742" y="254" width="74" height="60" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.4"/><text x="779" y="280" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">专家 5</text><text x="779" y="302" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">SwiGLU</text><path d="M779 314 L650 360" stroke="#0f766e" stroke-width="2.4" fill="none" marker-end="url(#arrow-0f766e)"/><line x1="650" y1="200" x2="863" y2="252" stroke="#cbd5e1" stroke-width="1.2"/><rect x="826" y="254" width="74" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="863" y="280" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">专家 6</text><text x="863" y="302" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">SwiGLU</text><line x1="650" y1="200" x2="947" y2="252" stroke="#cbd5e1" stroke-width="1.2"/><rect x="910" y="254" width="74" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="947" y="280" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">专家 7</text><text x="947" y="302" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">SwiGLU</text><text x="443" y="336" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">× 0.62</text><text x="779" y="336" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">× 0.38</text><circle cx="650" cy="374" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="650" y="381" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M650 389L650 410" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="650" y="428" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">输出 = 两个专家输出的加权和</text><text x="500" y="470" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">前馈层的参数变成 8 份，每个 token 只算其中 2 份；没被选中的 6 个专家这次完全不参与计算</text></g></svg>
