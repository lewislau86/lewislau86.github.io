<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">诊断清单的四个阶段</title><desc id="desc">训练前花几秒做三项检查：初始损失约等于 ln V、因果性测试、单 batch 过拟合。训练中记录训练与验证损失、梯度范数和学习率。训练后看固定提示词的生成样例和简单结构指标。比较两个模型时在同一验证集上做配对 bootstrap，并结合多个种子。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="380" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">诊断清单按时间排：越早的检查越便宜，越晚的越接近真实质量</text><rect x="30" y="70" width="225" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="142.5" y="92" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">训练前</text><text x="142.5" y="110" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">几秒</text><rect x="30" y="128" width="225" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="44" y="156" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 初始损失 ≈ ln V</text><text x="44" y="184" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 因果性：改后面的 token，</text><text x="44" y="212" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">  前面的输出不变</text><text x="44" y="240" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 单 batch 能过拟合</text><text x="44" y="268" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">  （用同一份训练代码）</text><path d="M255 93L269 93" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="271" y="70" width="225" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="383.5" y="92" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">训练中</text><text x="383.5" y="110" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">每隔几十步</text><rect x="271" y="128" width="225" height="170" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="285" y="156" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 训练损失和验证损失</text><text x="285" y="184" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 梯度范数（裁剪前）</text><text x="285" y="212" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 学习率是否按计划走</text><text x="285" y="240" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 有没有 NaN / inf</text><path d="M496 93L510 93" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="512" y="70" width="225" height="46" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="624.5" y="92" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">训练后</text><text x="624.5" y="110" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">一次</text><rect x="512" y="128" width="225" height="170" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="526" y="156" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 固定提示词的生成样例</text><text x="526" y="184" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 简单结构指标</text><text x="526" y="212" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">  （字数、标点、重复）</text><path d="M737 93L751 93" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="753" y="70" width="225" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="865.5" y="92" font-size="16" fill="#7c3aed" font-weight="bold" text-anchor="middle">比较两个模型</text><text x="865.5" y="110" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">每次对照</text><rect x="753" y="128" width="225" height="170" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/><text x="767" y="156" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 同一验证集、同一口径</text><text x="767" y="184" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 配对 bootstrap 求差的区间</text><text x="767" y="212" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 多个种子，报平均和范围</text><text x="767" y="240" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">• 测试集只报告一次</text><text x="500" y="334" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">第 4 节的矩阵说明：没有一项检查能抓住全部 6 个 bug，训练前的三项几秒内就抓住了其中 4 个</text><text x="500" y="358" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">有 bug 的模型验证损失可以比正确代码还低，所以“损失降得好”不能代替前面的检查</text></g></svg>
