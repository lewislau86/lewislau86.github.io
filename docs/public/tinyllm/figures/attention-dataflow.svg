<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">注意力的数据流</title><desc id="desc">输入 [T, d] 经三个投影得到 Q、K、V，各是 [T, d_h]。Q 乘 K 的转置再除以根号 d_h 得到 [T, T] 的分数，因果掩码把右上方置为负无穷，softmax 后每行加起来是 1，再对 V 加权求和得到 [T, d_h]。多个头的结果拼起来，经输出投影回到 [T, d]，加回残差流。分数、掩码、softmax 这三步都要一张 T×T 的表。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="660" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">一层注意力的数据流（T 个位置，每头 d_h 维）</text><rect x="380" y="64" width="200" height="48" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="480.0" y="85.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">输入 x</text><text x="480.0" y="103.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, d]</text><path d="M480 112 V134 H230 V156" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow-64748b)"/><rect x="130" y="160" width="200" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="230.0" y="181.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">Q = x·W_Q</text><text x="230.0" y="199.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, d_h]</text><path d="M480 112 V134 H480 V156" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow-64748b)"/><rect x="380" y="160" width="200" height="48" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480.0" y="181.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">K = x·W_K</text><text x="480.0" y="199.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, d_h]</text><path d="M480 112 V134 H730 V156" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow-64748b)"/><rect x="630" y="160" width="200" height="48" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="730.0" y="181.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">V = x·W_V</text><text x="730.0" y="199.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, d_h]</text><path d="M230 208 V244 H420 V266" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M480 208 V266" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#arrow-0f766e)"/><text x="500" y="244" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="start">Kᵀ</text><rect x="330" y="270" width="300" height="50" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/><text x="480.0" y="292.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">分数 S = Q·Kᵀ / √d_h</text><text x="480.0" y="310.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, T]</text><path d="M480 320L480 342" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="330" y="346" width="300" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="480.0" y="368.0" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">因果掩码：右上方置为 −∞</text><text x="480.0" y="386.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, T]</text><path d="M480 396L480 418" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="330" y="422" width="300" height="50" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/><text x="480.0" y="444.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">softmax：每行加起来是 1</text><text x="480.0" y="462.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">[T, T] 权重</text><path d="M480 472L480 494" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="330" y="498" width="300" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480.0" y="520.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">加权求和：权重 · V</text><text x="480.0" y="538.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, d_h]</text><path d="M480 548L480 570" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="330" y="574" width="300" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="480.0" y="596.0" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">多头拼接 → 输出投影 W_O</text><text x="480.0" y="614.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">[T, d]，加回残差流</text><path d="M730 208 V523 H634" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#arrow-b45309)"/><line x1="318" y1="274" x2="300" y2="274" stroke="#94a3b8" stroke-width="1.5"/><line x1="300" y1="274" x2="300" y2="468" stroke="#94a3b8" stroke-width="1.5"/><line x1="300" y1="468" x2="318" y2="468" stroke="#94a3b8" stroke-width="1.5"/><text x="288" y="346" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="end">这三步都要</text><text x="288" y="368" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="end">一张 T×T 的表：</text><text x="288" y="390" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="end">长度翻倍，表变 4 倍</text><text x="288" y="590" font-size="13.5" fill="#7c3aed" font-weight="normal" text-anchor="end">多头：d 拆成 H 份，每份 d_h = d/H 维，</text><text x="288" y="612" font-size="13.5" fill="#7c3aed" font-weight="normal" text-anchor="end">各自走中间这一列，在 W_O 处合并</text></g></svg>
