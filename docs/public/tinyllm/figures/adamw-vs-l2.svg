<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" aria-labelledby="title desc">
<title id="title">Adam 加 L2 与 AdamW 的区别</title><desc id="desc">Adam 加 L2 把 λw 加进梯度，衰减项随后被二阶矩缩放；AdamW 用原始梯度更新一、二阶矩，参数更新后再单独减去 ηλw，让所有参数按同一比例衰减。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="425" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">L2 正则与 AdamW：衰减项要不要经过自适应缩放</text><text x="250" y="90" font-size="18" fill="#b45309" font-weight="bold" text-anchor="middle">Adam + L2（把 λw 加进梯度）</text><rect x="40" y="110" width="420" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="250" y="142" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">g = ∇L + λ·w</text><rect x="40" y="182" width="420" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="250" y="214" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">m, v ← 用 g 更新</text><path d="M250 162L250 178" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><rect x="40" y="254" width="420" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="250" y="286" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">w ← w − η · m / (√v + ε)</text><path d="M250 234L250 250" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><text x="250" y="350" font-size="15" fill="#b45309" font-weight="normal" text-anchor="middle">衰减也被除以 √v：梯度大的参数，衰减反而变弱</text><text x="710" y="90" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle">AdamW（衰减单独做）</text><rect x="500" y="110" width="420" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="710" y="142" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">g = ∇L</text><rect x="500" y="182" width="420" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="710" y="214" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">m, v ← 用 g 更新</text><path d="M710 162L710 178" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="500" y="254" width="420" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="710" y="286" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">w ← w − η · m / (√v + ε) − η·λ·w</text><path d="M710 234L710 250" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><text x="710" y="350" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="middle">每个参数按同一比例 ηλ 收缩，与梯度大小无关</text><text x="480" y="395" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">m、v 为偏差校正后的一阶、二阶矩。对普通 SGD 两种写法等价；对 Adam 这类自适应优化器，它们是两种不同的算法。</text></g></svg>
