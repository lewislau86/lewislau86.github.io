<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">稀疏升级的过程</title><desc id="desc">稠密模型训练到第 120 步后，每层的前馈层复制成 8 个一模一样的专家，新加一个路由器，Adam 的状态也一起复制，然后作为 MoE 接着训练到第 240 步。升级那一刻输出和稠密模型完全相同。接着训练后，稀疏升级 4.742，稠密 4.748，从头训练的 MoE 4.721；专家之间的平均相似度，稀疏升级是 0.48，从头训练约为 0。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="350" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">稀疏升级：训练到一半的稠密模型，改成 MoE 接着训练</text><rect x="60" y="90" width="220" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170" y="120" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">稠密模型训练到第 120 步</text><text x="170" y="144" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">参数 + 优化器状态</text><path d="M280 125L340 125" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="345" y="82" width="300" height="86" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="495" y="108" font-size="14.5" fill="#b45309" font-weight="bold" text-anchor="middle">每层：前馈层复制 8 份 → 8 个专家</text><text x="495" y="130" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">新加路由器（随机、几乎均匀）</text><text x="495" y="152" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">Adam 的 m、v 也复制给每个专家</text><path d="M645 125L705 125" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="710" y="90" width="230" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="825" y="120" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">MoE 接着训练到第 240 步</text><text x="825" y="144" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">和稠密模型同样的数据与调度</text><rect x="60" y="196" width="880" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="222" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">升级那一刻：8 个专家一模一样，选哪 2 个、权重多少，加权和都等于原来的前馈层</text><text x="500" y="246" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">所以输出和稠密模型完全相同，验证损失一点不变：不用从头训练</text><text x="500" y="300" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">接着训练 120 步后（3 个种子）：稀疏升级 4.742，稠密 4.748，从头训练的 MoE 4.721</text><text x="500" y="328" font-size="15" fill="#b45309" font-weight="normal" text-anchor="middle">专家之间的平均相似度：稀疏升级 0.48，从头训练约为 0（-0.000）：从同一个起点出发，专家分化得慢</text></g></svg>
