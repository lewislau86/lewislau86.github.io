<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">二元组重合度与倒排索引</title><desc id="desc">两首几乎相同的诗各自去掉标点后拆成相邻两字的二元组，共有 14 个，重合度 0.74。倒排索引记录每个二元组出现在哪些诗里，查重时只和至少共享一个二元组的诗比较，不必两两比较全部 43 万对。例子来自第 14 章脚本的输出。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="490" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">近重复：拆成字二元组，数共有的比例（下面这两段的重合度 0.74）</text><text x="40" y="90" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">诗 甲：倡楼启曙扉，杨柳正依依。莺啼知岁隔，条变识春归。</text><rect x="40" y="106" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="61" y="125" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">倡楼</text><rect x="85" y="106" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="106" y="125" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">楼启</text><rect x="130" y="106" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="151" y="125" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">启曙</text><rect x="175" y="106" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="196" y="125" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">曙扉</text><rect x="220" y="106" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="241" y="125" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">扉杨</text><rect x="265" y="106" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="286" y="125" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">杨柳</text><rect x="310" y="106" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="331" y="125" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">柳正</text><rect x="355" y="106" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="376" y="125" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">正依</text><rect x="400" y="106" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="421" y="125" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">依依</text><rect x="445" y="106" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="466" y="125" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">依莺</text><rect x="40" y="140" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="61" y="159" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">莺啼</text><rect x="85" y="140" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="106" y="159" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">啼知</text><rect x="130" y="140" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="151" y="159" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">知岁</text><rect x="175" y="140" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="196" y="159" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">岁隔</text><rect x="220" y="140" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="241" y="159" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">隔条</text><rect x="265" y="140" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="286" y="159" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">条变</text><rect x="310" y="140" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="331" y="159" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">变识</text><rect x="355" y="140" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="376" y="159" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">识春</text><rect x="400" y="140" width="42" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="421" y="159" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">春归</text><text x="40" y="210" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">诗 乙：倡楼启曙扉，园柳正依依。鸟鸣知岁隔，条变识春归。</text><rect x="40" y="226" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="61" y="245" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">倡楼</text><rect x="85" y="226" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="106" y="245" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">楼启</text><rect x="130" y="226" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="151" y="245" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">启曙</text><rect x="175" y="226" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="196" y="245" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">曙扉</text><rect x="220" y="226" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="241" y="245" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">扉园</text><rect x="265" y="226" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="286" y="245" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">园柳</text><rect x="310" y="226" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="331" y="245" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">柳正</text><rect x="355" y="226" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="376" y="245" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">正依</text><rect x="400" y="226" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="421" y="245" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">依依</text><rect x="445" y="226" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="466" y="245" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">依鸟</text><rect x="40" y="260" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="61" y="279" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">鸟鸣</text><rect x="85" y="260" width="42" height="28" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/><text x="106" y="279" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">鸣知</text><rect x="130" y="260" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="151" y="279" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">知岁</text><rect x="175" y="260" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="196" y="279" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">岁隔</text><rect x="220" y="260" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="241" y="279" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">隔条</text><rect x="265" y="260" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="286" y="279" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">条变</text><rect x="310" y="260" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="331" y="279" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">变识</text><rect x="355" y="260" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="376" y="279" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">识春</text><rect x="400" y="260" width="42" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="421" y="279" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">春归</text><text x="500" y="326" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">共有 14 个（蓝绿框），不同的在红框里；重合度 = 共有数 ÷ 较短那首的二元组数 = 14/19 = 0.74</text><text x="500" y="350" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">逐句比较会因为每句差一个字而一句都对不上；二元组只丢掉含那个字的两三个</text><text x="500" y="388" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">倒排索引：从二元组查到含有它的诗，只和至少共享一个二元组的诗比较</text><rect x="70" y="406" width="70" height="30" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="105" y="426" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">倡楼</text><path d="M140 421L160 421" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><text x="164" y="426" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">诗甲、诗乙、……</text><rect x="295" y="406" width="70" height="30" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="330" y="426" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">正依</text><path d="M365 421L385 421" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><text x="389" y="426" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">诗甲、诗乙、……</text><rect x="520" y="406" width="70" height="30" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="555" y="426" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">岁隔</text><path d="M590 421L610 421" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><text x="614" y="426" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">诗甲、诗乙、……</text><rect x="745" y="406" width="70" height="30" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="780" y="426" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">杨柳</text><path d="M815 421L835 421" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><text x="839" y="426" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">诗甲、其他含“杨柳”的诗</text><text x="500" y="472" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">925 首两两比较要 43 万对；有了索引，大部分诗只和几十首候选比较</text></g></svg>
