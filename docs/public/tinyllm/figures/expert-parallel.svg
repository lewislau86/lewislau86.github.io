<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-labelledby="title desc">
<title id="title">专家并行与 all-to-all</title><desc id="desc">8 个专家分在 4 张卡上，每张卡两个。每张卡上的 token 先由路由器选出专家，第一次 all-to-all 把 token 发到专家所在的卡，各卡算完后第二次 all-to-all 把结果送回原来的卡。一层的时间由收到 token 最多的那张卡决定，这就是负载均衡要解决的问题。示意图，token 分配是举例。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="485" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="36" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">专家并行：8 个专家放在 4 张卡上，token 要去专家所在的卡算完再回来</text><text x="145" y="76" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">GPU 0：专家 0、1</text><rect x="40" y="88" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="48" y="96" width="44" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="70" y="115" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">→E0</text><rect x="98" y="96" width="44" height="28" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="120" y="115" font-size="12" fill="#b45309" font-weight="normal" text-anchor="middle">→E5</text><rect x="148" y="96" width="44" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="170" y="115" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">→E2</text><rect x="198" y="96" width="44" height="28" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="220" y="115" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle">→E7</text><rect x="40" y="230" width="210" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="145" y="252" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle">专家 0 和 1 计算</text><text x="145" y="271" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">收到 7 个 token</text><rect x="40" y="360" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145" y="387" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">结果回到原来的卡，按路由分数加权</text><text x="385" y="76" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">GPU 1：专家 2、3</text><rect x="280" y="88" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="288" y="96" width="44" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="310" y="115" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">→E1</text><rect x="338" y="96" width="44" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="360" y="115" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">→E1</text><rect x="388" y="96" width="44" height="28" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="410" y="115" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle">→E6</text><rect x="438" y="96" width="44" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="460" y="115" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">→E3</text><rect x="280" y="230" width="210" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text x="385" y="252" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="middle">专家 2 和 3 计算</text><text x="385" y="271" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">收到 3 个 token</text><rect x="280" y="360" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="385" y="387" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">结果回到原来的卡，按路由分数加权</text><text x="625" y="76" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">GPU 2：专家 4、5</text><rect x="520" y="88" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="528" y="96" width="44" height="28" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="550" y="115" font-size="12" fill="#b45309" font-weight="normal" text-anchor="middle">→E4</text><rect x="578" y="96" width="44" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="600" y="115" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">→E0</text><rect x="628" y="96" width="44" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="650" y="115" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">→E1</text><rect x="678" y="96" width="44" height="28" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="700" y="115" font-size="12" fill="#b45309" font-weight="normal" text-anchor="middle">→E5</text><rect x="520" y="230" width="210" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="625" y="252" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">专家 4 和 5 计算</text><text x="625" y="271" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">收到 3 个 token</text><rect x="520" y="360" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="625" y="387" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">结果回到原来的卡，按路由分数加权</text><text x="865" y="76" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">GPU 3：专家 6、7</text><rect x="760" y="88" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="768" y="96" width="44" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="790" y="115" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">→E1</text><rect x="818" y="96" width="44" height="28" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="840" y="115" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">→E2</text><rect x="868" y="96" width="44" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="890" y="115" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">→E1</text><rect x="918" y="96" width="44" height="28" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="940" y="115" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle">→E6</text><rect x="760" y="230" width="210" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="865" y="252" font-size="13.5" fill="#7c3aed" font-weight="bold" text-anchor="middle">专家 6 和 7 计算</text><text x="865" y="271" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">收到 3 个 token</text><rect x="760" y="360" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="865" y="387" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">结果回到原来的卡，按路由分数加权</text><rect x="40" y="160" width="920" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="500" y="186" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">all-to-all（分发）：每个 token 发到它选中的专家所在的卡</text><rect x="40" y="300" width="920" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="500" y="326" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">all-to-all（收回）：算完的结果发回 token 原来的卡</text><path d="M145 132L145 158" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M145 200L145 228" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M145 280L145 298" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M145 340L145 358" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M385 132L385 158" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M385 200L385 228" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M385 280L385 298" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M385 340L385 358" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M625 132L625 158" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M625 200L625 228" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M625 280L625 298" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M625 340L625 358" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M865 132L865 158" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M865 200L865 228" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M865 280L865 298" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M865 340L865 358" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><text x="500" y="440" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">这一层要等最慢的那张卡：GPU 0 收到 7 个 token，其余各 3 个。负载越不均，其他卡空等越久</text><text x="500" y="464" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">（示意：每张卡 4 个 token、每个 token 只画第一选择；实际是 top-2，通信量更大）</text></g></svg>
