<svg xmlns="http://www.w3.org/2000/svg" width="960" height="445" viewBox="0 0 960 445" role="img" aria-labelledby="title desc">
<title id="title">量化的数值映射</title><desc id="desc">上：对称 INT4 量化，把 −max|x| 到 max|x| 均匀分成 15 个刻度，0 正好落在刻度上。下：非对称量化按最小值和最大值定范围，用零点把 0 放到刻度上，16 个刻度都落在数据范围内。一个数 x 量化后还原成最近的刻度，误差最多半个刻度。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="445" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">量化是把一段实数映射到一排整数刻度上（INT4）</text><text x="120" y="84" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">对称：s = max|x| / 7，整数 −7…7</text><line x1="120" y1="110" x2="860" y2="110" stroke="#94a3b8" stroke-width="1.5"/><line x1="120.0" y1="101" x2="120.0" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="172.8571428571429" y1="101" x2="172.8571428571429" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="225.71428571428572" y1="101" x2="225.71428571428572" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="278.57142857142856" y1="101" x2="278.57142857142856" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="331.42857142857144" y1="101" x2="331.42857142857144" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="384.2857142857143" y1="101" x2="384.2857142857143" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="437.14285714285717" y1="101" x2="437.14285714285717" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="490.0" y1="101" x2="490.0" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="542.8571428571429" y1="101" x2="542.8571428571429" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="595.7142857142857" y1="101" x2="595.7142857142857" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="648.5714285714286" y1="101" x2="648.5714285714286" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="701.4285714285714" y1="101" x2="701.4285714285714" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="754.2857142857143" y1="101" x2="754.2857142857143" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="807.1428571428571" y1="101" x2="807.1428571428571" y2="119" stroke="#2563eb" stroke-width="1.6"/><line x1="860.0" y1="101" x2="860.0" y2="119" stroke="#2563eb" stroke-width="1.6"/><circle cx="686.1" cy="110" r="5" fill="#b45309" stroke="#b45309" stroke-width="2.5"/><text x="686.1" y="94" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">x</text><circle cx="701.4285714285714" cy="110" r="5" fill="#ffffff" stroke="#172033" stroke-width="2.5"/><text x="709.4285714285714" y="136" font-size="12.5" fill="#172033" font-weight="bold" text-anchor="start">还原值</text><text x="860" y="162" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="end">0 正好在刻度上；适合大致关于 0 对称的权重</text><text x="110" y="115" font-size="12" fill="#64748b" font-weight="normal" text-anchor="end">−1</text><text x="870" y="115" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">1</text><text x="120" y="234" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">非对称：s = (max − min) / 15，零点 z 把 0 放在刻度上，整数 0…15</text><line x1="120" y1="260" x2="860" y2="260" stroke="#94a3b8" stroke-width="1.5"/><line x1="379.0" y1="251" x2="379.0" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="411.06666666666666" y1="251" x2="411.06666666666666" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="443.1333333333333" y1="251" x2="443.1333333333333" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="475.2" y1="251" x2="475.2" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="507.26666666666665" y1="251" x2="507.26666666666665" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="539.3333333333333" y1="251" x2="539.3333333333333" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="571.4" y1="251" x2="571.4" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="603.4666666666667" y1="251" x2="603.4666666666667" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="635.5333333333333" y1="251" x2="635.5333333333333" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="667.6" y1="251" x2="667.6" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="699.6666666666666" y1="251" x2="699.6666666666666" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="731.7333333333333" y1="251" x2="731.7333333333333" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="763.8" y1="251" x2="763.8" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="795.8666666666667" y1="251" x2="795.8666666666667" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="827.9333333333333" y1="251" x2="827.9333333333333" y2="269" stroke="#0f766e" stroke-width="1.6"/><line x1="860.0" y1="251" x2="860.0" y2="269" stroke="#0f766e" stroke-width="1.6"/><rect x="379.0" y="256" width="481.0" height="8" fill="#ecfdf5" stroke="none"/><circle cx="686.1" cy="260" r="5" fill="#b45309" stroke="#b45309" stroke-width="2.5"/><text x="686.1" y="244" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">x</text><circle cx="699.6666666666666" cy="260" r="5" fill="#ffffff" stroke="#172033" stroke-width="2.5"/><text x="707.6666666666666" y="286" font-size="12.5" fill="#172033" font-weight="bold" text-anchor="start">还原值</text><text x="860" y="312" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="end">范围贴着数据：有偏的激活（比如 SiLU 输出）一个刻度也不浪费</text><text x="110" y="265" font-size="12" fill="#64748b" font-weight="normal" text-anchor="end"></text><text x="870" y="265" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">1</text><text x="480" y="400" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">x 先除以 s 再四舍五入成整数 q，存起来；用的时候还原成 s·(q − z)，落在最近的刻度上，误差最多半个刻度 s/2</text><text x="480" y="424" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">刻度间隔 s 决定误差：位数少一位，s 大一倍；一组里的最大值越大，s 越大（第 3 节为什么要分组）</text></g></svg>
