<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-labelledby="title desc">
<title id="title">chunked prefill 的调度</title><desc id="desc">上：不分块时，新请求 C 的 2000 个 token 一次前向做完，这段时间里正在生成的 A、B 一个字也出不来。下：把 C 的 prefill 切成 4 块，每次前向同时带上 A、B 的 decode，A、B 每次前向都能多出一个字，C 的首字稍晚。示意图，块的长短不代表实测时间。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="365" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">chunked prefill：长提示词切成几块，正在生成的请求可以插进来</text><text x="130" y="76" font-size="14.5" fill="#b91c1c" font-weight="bold" text-anchor="start">不分块：一次前向做完新请求 C 的 2000 个 token</text><text x="118" y="114" font-size="14" fill="#172033" font-weight="bold" text-anchor="end">每次前向</text><rect x="130" y="92" width="47" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="153.5" y="114" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">A、B</text><rect x="180" y="92" width="47" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="203.5" y="114" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">A、B</text><rect x="230" y="92" width="327" height="34" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/><text x="393.5" y="114" font-size="12" fill="#b45309" font-weight="normal" text-anchor="middle">C 的 prefill（2000 个 token）</text><rect x="560" y="92" width="67" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="593.5" y="114" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">A、B、C</text><rect x="630" y="92" width="67" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="663.5" y="114" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">A、B、C</text><text x="395" y="150" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">A、B 在这段时间里一个字也出不来：用户看到“卡了一下”</text><text x="130" y="196" font-size="14.5" fill="#0f766e" font-weight="bold" text-anchor="start">分块：C 的 prefill 切成 4 块，每次前向带上 A、B 的 decode</text><text x="118" y="234" font-size="14" fill="#172033" font-weight="bold" text-anchor="end">每次前向</text><rect x="130" y="212" width="47" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="153.5" y="234" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">A、B</text><rect x="180" y="212" width="107" height="34" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="233.5" y="234" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">C 第 1 块 + A、B</text><rect x="290" y="212" width="107" height="34" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="343.5" y="234" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">C 第 2 块 + A、B</text><rect x="400" y="212" width="107" height="34" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="453.5" y="234" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">C 第 3 块 + A、B</text><rect x="510" y="212" width="107" height="34" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="563.5" y="234" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">C 第 4 块 + A、B</text><rect x="620" y="212" width="67" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="653.5" y="234" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">A、B、C</text><text x="400" y="270" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle">A、B 每次前向都多出一个字；C 的第一个字反而晚一点出来</text><text x="480" y="320" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">分块不改变结果（本章第 9 节验证了误差为 0），改变的是谁等谁：别人的 ITL 变稳，C 自己的 TTFT 略长</text><text x="480" y="344" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">块越小，插得越勤，但每块都要重读一遍已经缓存的 KV，开销变大；块大小要按负载调</text></g></svg>
