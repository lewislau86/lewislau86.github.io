<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">生成循环的每一步</title><desc id="desc">模型前向得到最后一个位置的 logits，依次经过重复惩罚、约束掩码、除以温度后 softmax、top-k 或 top-p 截断，再按概率抽一个 token；贪心解码跳过后三步直接取最大值。如果抽到 &lt;eos&gt; 或达到最大长度就停止，否则把新 token 接到序列末尾再走一圈。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="410" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">生成循环：从最后一个位置的 logits 到下一个 token</text><rect x="20" y="80" width="146" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="93.0" y="106" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">模型前向</text><text x="93.0" y="126" font-size="11" fill="#172033" font-weight="normal" text-anchor="middle">最后一个位置的 logits</text><text x="93.0" y="143" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">第 12 章</text><path d="M166 115L180 115" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="180" y="80" width="146" height="70" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="253.0" y="106" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">重复惩罚</text><text x="253.0" y="126" font-size="11" fill="#172033" font-weight="normal" text-anchor="middle">改打分：出现过的 token 降分</text><text x="253.0" y="143" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">第 8 节</text><path d="M326 115L340 115" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="340" y="80" width="146" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="413.0" y="106" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">约束掩码</text><text x="413.0" y="126" font-size="11" fill="#172033" font-weight="normal" text-anchor="middle">不合格式的 token 置为 −∞</text><text x="413.0" y="143" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">第 9 节</text><path d="M486 115L500 115" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="500" y="80" width="146" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="573.0" y="106" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">÷ 温度 T，softmax</text><text x="573.0" y="126" font-size="11" fill="#172033" font-weight="normal" text-anchor="middle">T 小更尖，T 大更平</text><text x="573.0" y="143" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">第 1、5 节</text><path d="M646 115L660 115" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="660" y="80" width="146" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="733.0" y="106" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">top-k / top-p 截断</text><text x="733.0" y="126" font-size="11" fill="#172033" font-weight="normal" text-anchor="middle">砍掉长尾，重新归一化</text><text x="733.0" y="143" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">第 2 节</text><path d="M806 115L820 115" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="820" y="80" width="146" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="893.0" y="106" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">按概率抽一个</text><text x="893.0" y="126" font-size="11" fill="#172033" font-weight="normal" text-anchor="middle">multinomial，固定 generator</text><text x="893.0" y="143" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">第 6 节</text><rect x="560" y="180" width="410" height="40" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="7 5"/><text x="765" y="205" font-size="13" fill="#7c3aed" font-weight="normal" text-anchor="middle">贪心：跳过温度、截断和抽样，直接取 argmax</text><path d="M904 150 V178" stroke="#7c3aed" stroke-width="1.4" fill="none" marker-end="url(#arrow-7c3aed)" stroke-dasharray="7 5"/><rect x="380" y="250" width="240" height="50" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/><text x="500.0" y="280.0" font-size="13.5" fill="#172033" font-weight="bold" text-anchor="middle">是 &lt;eos&gt;，或到 max_new_tokens？</text><path d="M880 150 V170 H975 V275 H624" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M380 275 H20 V115 H26" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="200" y="266" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">否：新 token 接到末尾，再走一圈</text><path d="M500 300L500 330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="500" y="350" font-size="13.5" fill="#172033" font-weight="bold" text-anchor="middle">是：停止，把新 token 整段解码成文字</text><text x="500" y="390" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每一步都只改“这一次怎么选”，模型参数一个也不动；换采样方式不用重新训练</text></g></svg>
