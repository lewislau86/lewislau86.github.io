<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">MHA、GQA 与 MQA</title><desc id="desc">三行都有 8 个 Q 头。MHA 每个 Q 头各有一组 K、V，共 8 组；GQA 每 4 个 Q 头共用一组，共 2 组；MQA 所有 Q 头共用 1 组。KV cache 的大小正比于 K/V 的组数，分别是 MHA 的 8/8、2/8、1/8。</desc>
