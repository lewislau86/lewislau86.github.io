<svg xmlns="http://www.w3.org/2000/svg" width="960" height="502" viewBox="0 0 960 502" role="img" aria-labelledby="title desc">
<title id="title">从检查点分叉的退火</title><desc id="desc">横轴是训练步数，纵轴是学习率。稳定段用普通数据训练到第 480 步，在第 240、360、480 步存检查点；每个检查点接一段 120 步线性降到 0 的衰减。下方说明衰减段每个 batch 的 16 行里，每一行以概率 p 来自 100 首高质量诗，否则来自普通数据。比较 7 种配比，WSD 共 1320 步，余弦调度要 4200 步。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="502" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">稳定段只训一次，从检查点分叉出不同的退火：衰减段里换上一部分高质量数据</text><line x1="90" y1="290" x2="890" y2="290" stroke="#172033" stroke-width="1.5"/><line x1="90" y1="70" x2="90" y2="290" stroke="#172033" stroke-width="1.5"/><text x="890" y="314" font-size="13" fill="#64748b" font-weight="normal" text-anchor="end">训练步数 →</text><text x="90.0" y="314" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">0</text><text x="356.66666666666663" y="314" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">240</text><text x="490.0" y="314" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">360</text><text x="623.3333333333333" y="314" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">480</text><text x="756.6666666666667" y="314" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">600</text><text x="62" y="180.0" font-size="13" fill="#64748b" text-anchor="middle" transform="rotate(-90 62 180.0)">学习率</text><path d="M90 290 L123.33333333333333 96 L623.3333333333333 96" stroke="#64748b" stroke-width="4" fill="none"/><text x="223.33333333333331" y="84" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">稳定段：普通数据，峰值 1e-2</text><circle cx="356.66666666666663" cy="96" r="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><path d="M356.66666666666663 96 L490.0 287" stroke="#0f766e" stroke-width="2.6" fill="none" stroke-dasharray="7 4"/><text x="356.66666666666663" y="84" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">第 240 步检查点</text><circle cx="490.0" cy="96" r="6" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><path d="M490.0 96 L623.3333333333333 287" stroke="#b45309" stroke-width="2.6" fill="none" stroke-dasharray="7 4"/><text x="490.0" y="84" font-size="12" fill="#b45309" font-weight="normal" text-anchor="middle">第 360 步检查点</text><circle cx="623.3333333333333" cy="96" r="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><path d="M623.3333333333333 96 L756.6666666666667 287" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-dasharray="7 4"/><text x="623.3333333333333" y="84" font-size="12" fill="#2563eb" font-weight="normal" text-anchor="middle">第 480 步检查点</text><text x="627.3333333333333" y="230" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="start">衰减 120 步</text><text x="90" y="356" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">衰减段每个 batch 的 16 行：</text><rect x="90" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="105" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="120" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="135" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="150" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="165" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="180" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="195" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="210" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="225" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="240" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="255" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="270" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="285" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="300" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="315" y="376" width="12" height="18" rx="2" fill="#cbd5e1"/><text x="342" y="390" font-size="13" fill="#172033" font-weight="normal" text-anchor="start">p = 0%：全是普通数据</text><rect x="90" y="406" width="12" height="18" rx="2" fill="#b45309"/><rect x="105" y="406" width="12" height="18" rx="2" fill="#b45309"/><rect x="120" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="135" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="150" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="165" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="180" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="195" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="210" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="225" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="240" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="255" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="270" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="285" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="300" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="315" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><text x="342" y="420" font-size="13" fill="#172033" font-weight="normal" text-anchor="start">p = 10%：约 1.6 行来自高质量数据</text><rect x="90" y="436" width="12" height="18" rx="2" fill="#b45309"/><rect x="105" y="436" width="12" height="18" rx="2" fill="#b45309"/><rect x="120" y="436" width="12" height="18" rx="2" fill="#b45309"/><rect x="135" y="436" width="12" height="18" rx="2" fill="#b45309"/><rect x="150" y="436" width="12" height="18" rx="2" fill="#b45309"/><rect x="165" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="180" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="195" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="210" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="225" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="240" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="255" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="270" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="285" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="300" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><rect x="315" y="436" width="12" height="18" rx="2" fill="#cbd5e1"/><text x="342" y="450" font-size="13" fill="#172033" font-weight="normal" text-anchor="start">p = 30%：约 4.8 行</text><rect x="650" y="376" width="12" height="18" rx="2" fill="#b45309"/><text x="670" y="390" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">高质量：100 首名篇（只在衰减段用）</text><rect x="650" y="406" width="12" height="18" rx="2" fill="#cbd5e1"/><text x="670" y="420" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">普通：5289 首《全唐诗》</text><text x="480" y="482" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">每个检查点 × 每种配比各衰减一次；比较 7 种配比，WSD 只需 480 + 7×120 = 1320 步，余弦调度要 7×600 = 4200 步</text></g></svg>
