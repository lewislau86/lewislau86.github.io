<svg xmlns="http://www.w3.org/2000/svg" width="960" height="478" viewBox="0 0 960 478" role="img" aria-labelledby="title desc">
<title id="title">三种组 batch 的办法</title><desc id="desc">逐首补齐：每批按最长那首补齐，全训练集 32 首一批时 21.3% 的位置是 &lt;pad&gt;；按长度分桶：长度相近的放一批，浪费降到 0.3%；拼接成流：所有诗首尾相接、用 &lt;eos&gt; 隔开，切成等长窗口，没有空位，但窗口会横跨两首诗。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="478" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">三种组 batch 的办法：灰色是浪费的 &lt;pad&gt;，红框是跨过诗边界的窗口</text><text x="40" y="80" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">① 逐首补齐（按原顺序 4 首一批）</text><text x="40" y="102" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">整个训练集 32 首一批统计：21.3% 的位置是 &lt;pad&gt;</text><rect x="40" y="116" width="264" height="12" rx="2" fill="#2563eb" opacity="0.8"/><rect x="304" y="116" width="30" height="12" rx="2" fill="#cbd5e1"/><rect x="40" y="132" width="144" height="12" rx="2" fill="#2563eb" opacity="0.8"/><rect x="184" y="132" width="150" height="12" rx="2" fill="#cbd5e1"/><rect x="40" y="148" width="294" height="12" rx="2" fill="#2563eb" opacity="0.8"/><rect x="40" y="164" width="114" height="12" rx="2" fill="#2563eb" opacity="0.8"/><rect x="154" y="164" width="180" height="12" rx="2" fill="#cbd5e1"/><rect x="40" y="194" width="132" height="12" rx="2" fill="#2563eb" opacity="0.8"/><rect x="172" y="194" width="168" height="12" rx="2" fill="#cbd5e1"/><rect x="40" y="210" width="270" height="12" rx="2" fill="#2563eb" opacity="0.8"/><rect x="310" y="210" width="30" height="12" rx="2" fill="#cbd5e1"/><rect x="40" y="226" width="252" height="12" rx="2" fill="#2563eb" opacity="0.8"/><rect x="292" y="226" width="48" height="12" rx="2" fill="#cbd5e1"/><rect x="40" y="242" width="300" height="12" rx="2" fill="#2563eb" opacity="0.8"/><text x="510" y="80" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">② 按长度分桶（先排序再分批）</text><text x="510" y="102" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">整个训练集 32 首一批统计：0.3% 的位置是 &lt;pad&gt;</text><rect x="510" y="116" width="114" height="12" rx="2" fill="#0f766e" opacity="0.8"/><rect x="624" y="116" width="138" height="12" rx="2" fill="#cbd5e1"/><rect x="510" y="132" width="132" height="12" rx="2" fill="#0f766e" opacity="0.8"/><rect x="642" y="132" width="120" height="12" rx="2" fill="#cbd5e1"/><rect x="510" y="148" width="144" height="12" rx="2" fill="#0f766e" opacity="0.8"/><rect x="654" y="148" width="108" height="12" rx="2" fill="#cbd5e1"/><rect x="510" y="164" width="252" height="12" rx="2" fill="#0f766e" opacity="0.8"/><rect x="510" y="194" width="264" height="12" rx="2" fill="#0f766e" opacity="0.8"/><rect x="774" y="194" width="36" height="12" rx="2" fill="#cbd5e1"/><rect x="510" y="210" width="270" height="12" rx="2" fill="#0f766e" opacity="0.8"/><rect x="780" y="210" width="30" height="12" rx="2" fill="#cbd5e1"/><rect x="510" y="226" width="294" height="12" rx="2" fill="#0f766e" opacity="0.8"/><rect x="804" y="226" width="6" height="12" rx="2" fill="#cbd5e1"/><rect x="510" y="242" width="300" height="12" rx="2" fill="#0f766e" opacity="0.8"/><text x="40" y="300" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">③ 拼接成流（第 12 章）：首尾相接，每首后面一个 &lt;eos&gt;，再切成等长窗口</text><rect x="40.0" y="318" width="137.6" height="20" fill="#b45309" opacity="0.75"/><rect x="177.6" y="318" width="3.2" height="20" fill="#172033"/><rect x="180.8" y="318" width="73.6" height="20" fill="#d97706" opacity="0.75"/><rect x="254.4" y="318" width="3.2" height="20" fill="#172033"/><rect x="257.6" y="318" width="153.6" height="20" fill="#b45309" opacity="0.75"/><rect x="411.2" y="318" width="3.2" height="20" fill="#172033"/><rect x="414.4" y="318" width="57.6" height="20" fill="#d97706" opacity="0.75"/><rect x="472.0" y="318" width="3.2" height="20" fill="#172033"/><rect x="475.2" y="318" width="67.2" height="20" fill="#b45309" opacity="0.75"/><rect x="542.4" y="318" width="3.2" height="20" fill="#172033"/><rect x="545.6" y="318" width="140.8" height="20" fill="#d97706" opacity="0.75"/><rect x="686.4" y="318" width="3.2" height="20" fill="#172033"/><rect x="689.6" y="318" width="131.2" height="20" fill="#b45309" opacity="0.75"/><rect x="820.8" y="318" width="3.2" height="20" fill="#172033"/><rect x="72.0" y="348" width="204.8" height="12" rx="3" fill="none" stroke="#b91c1c" stroke-width="2"/><rect x="264.0" y="366" width="204.8" height="12" rx="3" fill="none" stroke="#b91c1c" stroke-width="2"/><rect x="472.0" y="384" width="204.8" height="12" rx="3" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="40" y="436" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">黑色细条是 &lt;eos&gt;。每个红框是一个 64-token 窗口，大多横跨两首诗：</text><text x="40" y="458" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">没有一个空位，但第 12 章的 batch 计划里 66% 的预测位置能“看到”上一首诗；想隔开就用文档掩码（§7）。</text></g></svg>
