<svg xmlns="http://www.w3.org/2000/svg" width="960" height="516" viewBox="0 0 960 516" role="img" aria-labelledby="title desc">
<title id="title">top-k 与 top-p 在尖峰和平坦分布上的区别</title><desc id="desc">左：尖峰分布，前两个候选占 99.7%，top-p(0.9) 只要 2 个，top-k=3 却留了 3 个，第三个概率只有 0.002。右：平坦分布，六个候选各占一成多，top-p(0.9) 要 6 个，top-k=3 只留 3 个，砍掉了 43% 的概率质量。两图合起来说明 top-p 的集合大小随分布变化，top-k 不变。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="516" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">六候选、两种分布：top-k 留几个是常数，top-p 留几个跟着分布走</text><text x="260" y="66" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">尖峰分布（句末标点）</text><rect x="100" y="176.9" width="42" height="153.1" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="121" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.73</text><rect x="156" y="273.7" width="42" height="56.3" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="177" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.27</text><rect x="212" y="329.6" width="42" height="1.5" rx="3" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/><text x="233" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.00</text><rect x="268" y="329.9" width="42" height="1.5" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="289" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.00</text><rect x="324" y="330.0" width="42" height="1.5" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="345" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.00</text><rect x="380" y="330.0" width="42" height="1.5" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="401" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.00</text><line x1="88" y1="330" x2="430" y2="330" stroke="#94a3b8" stroke-width="2"/><rect x="96" y="176.9" width="154" height="153.1" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="96" y="176.9" width="98" height="153.1" fill="none" stroke="#0f766e" stroke-width="0" stroke-dasharray="2 3"/><text x="166" y="166.91" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">top-k = 3 留 3 个</text><text x="260" y="396" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">top-p = 0.9 留 2 个 · top-k = 3 留 3 个</text><text x="260" y="422" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">框内是留下的候选，重新归一化后再抽样</text><text x="720" y="66" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">平坦分布（逗号之后）</text><rect x="560" y="285.7" width="42" height="44.3" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="581" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.21</text><rect x="616" y="289.9" width="42" height="40.1" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="637" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.19</text><rect x="672" y="293.7" width="42" height="36.3" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="693" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.17</text><rect x="728" y="297.2" width="42" height="32.8" rx="3" fill="#bfdbfe" stroke="#64748b" stroke-width="2"/><text x="749" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.16</text><rect x="784" y="300.3" width="42" height="29.7" rx="3" fill="#bfdbfe" stroke="#64748b" stroke-width="2"/><text x="805" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.14</text><rect x="840" y="303.1" width="42" height="26.9" rx="3" fill="#bfdbfe" stroke="#64748b" stroke-width="2"/><text x="861" y="350" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0.13</text><line x1="548" y1="330" x2="890" y2="330" stroke="#94a3b8" stroke-width="2"/><rect x="556" y="285.7" width="154" height="44.3" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="556" y="285.7" width="322" height="44.3" fill="none" stroke="#0f766e" stroke-width="0" stroke-dasharray="2 3"/><text x="626" y="275.711" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">top-k = 3 留 3 个</text><text x="720" y="396" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">top-p = 0.9 留 6 个 · top-k = 3 留 3 个</text><text x="720" y="422" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">框内是留下的候选，重新归一化后再抽样</text><text x="480" y="470" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">尖峰时前两个候选占 99.7%，top-p 只要 2 个就够；平坦时六个各占一成多，top-p 要 6 个。</text><text x="480" y="496" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">同样留 3 个：左边多留的那个概率只有 0.002，右边却砍掉了 43% 的概率质量。</text></g></svg>
