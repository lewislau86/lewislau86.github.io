<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc">
<title id="title">完整 TinyLLM 的结构</title><desc id="desc">左：11 个 token 的 ID 查嵌入表变成 [1, 11, 128]，穿过 4 个 Block，最终 RMSNorm 后乘嵌入表的转置得到 [1, 11, 4096] 的 logits，输入输出共用一张表。右：一个 Block 展开。注意力半块：RMSNorm，qkv 投影到 [1, 11, 384] 再切成 Q、K、V，拆成 4 个头 [1, 4, 11, 32]，Q、K 加 RoPE，因果 SDPA 后合头，proj 投影，加回残差。前馈半块：RMSNorm，gate 和 up 各投影到 341 维，SiLU(gate) 乘 up，down 投影回 128 维，加回残差。proj 和 down 的初始化再乘 1/√(2L)。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="730" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">完整 TinyLLM：一句 11 个 token 的诗走一遍（d=128，4 个头，每头 32 维）</text><rect x="50" y="66" width="270" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="185.0" y="88.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">token ID（第 4 章）</text><text x="185.0" y="106.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11]</text><path d="M185.0 116L185.0 136" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="50" y="138" width="270" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="185.0" y="160.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">查嵌入表 E（第 5 章）</text><text x="185.0" y="178.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><path d="M185.0 188L185.0 226" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="50" y="228" width="270" height="200" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="185.0" y="282" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">Block × 4（第 9 章）</text><text x="185.0" y="308" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">[1, 11, 128] → [1, 11, 128]</text><text x="185.0" y="344" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">每层结构相同、参数各自独立</text><text x="185.0" y="366" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">展开见右边</text><path d="M185.0 428L185.0 466" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="50" y="468" width="270" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="185.0" y="490.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">最终 RMSNorm（第 11 章）</text><text x="185.0" y="508.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><path d="M185.0 518L185.0 538" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="50" y="540" width="270" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="185.0" y="562.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">乘 E 的转置，得到 logits</text><text x="185.0" y="580.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 4096]</text><path d="M50 163 H24 V565 H46" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)" stroke-dasharray="7 5"/><text x="16" y="364" font-size="12.5" fill="#b45309" text-anchor="middle" transform="rotate(-90 16 364)">输入输出共用 E（4096×128）</text><rect x="370" y="62" width="600" height="652" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><line x1="320" y1="228" x2="370" y2="62" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="320" y1="428" x2="370" y2="714" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="6 4"/><text x="670.0" y="88" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">一个 Block 展开</text><text x="600" y="116" font-size="13.5" fill="#172033" font-weight="bold" text-anchor="middle">残差流 x：[1, 11, 128]</text><path d="M600 122L600 132" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="134" width="280" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="600" y="151" font-size="13.5" fill="#64748b" font-weight="bold" text-anchor="middle">RMSNorm</text><text x="600" y="168" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><path d="M600 174L600 182" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="182" width="280" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="600" y="199" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle">qkv：一个 Linear</text><text x="600" y="216" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle">[1, 11, 384]，切成 Q、K、V</text><path d="M600 222L600 230" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="230" width="280" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="600" y="247" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle">拆成 4 个头</text><text x="600" y="264" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 4, 11, 32]</text><path d="M600 270L600 278" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="278" width="280" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="600" y="295" font-size="13.5" fill="#7c3aed" font-weight="bold" text-anchor="middle">Q、K 加 RoPE（第 7 章）</text><text x="600" y="312" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 4, 11, 32]</text><path d="M600 318L600 326" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="326" width="280" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="600" y="343" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle">因果 SDPA（第 6 章），再合头</text><text x="600" y="360" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><path d="M600 366L600 374" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="374" width="280" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="600" y="391" font-size="13.5" fill="#b91c1c" font-weight="bold" text-anchor="middle">proj</text><text x="600" y="408" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><path d="M600 414L600 417" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><circle cx="600" cy="428" r="11" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="600" y="433" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M600 127 H430.0 V428 H587" stroke="#172033" stroke-width="2" fill="none" marker-end="url(#arrow-172033)"/><path d="M600 439L600 448" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="450" width="280" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="600" y="467" font-size="13.5" fill="#64748b" font-weight="bold" text-anchor="middle">RMSNorm</text><text x="600" y="484" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><path d="M600 490L600 498" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="498" width="280" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="600" y="515" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="middle">gate、up：两个 Linear</text><text x="600" y="532" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle">各 [1, 11, 341]</text><path d="M600 538L600 546" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="546" width="280" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="600" y="563" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="middle">SiLU(gate) × up（第 8 章）</text><text x="600" y="580" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 341]</text><path d="M600 586L600 594" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="460.0" y="594" width="280" height="40" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="600" y="611" font-size="13.5" fill="#b91c1c" font-weight="bold" text-anchor="middle">down</text><text x="600" y="628" font-size="11.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><path d="M600 634L600 637" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><circle cx="600" cy="648" r="11" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="600" y="653" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M600 443 H430.0 V648 H587" stroke="#172033" stroke-width="2" fill="none" marker-end="url(#arrow-172033)"/><text x="424.0" y="277.5" font-size="13" fill="#172033" font-weight="normal" text-anchor="end">残差</text><text x="424.0" y="548.0" font-size="13" fill="#172033" font-weight="normal" text-anchor="end">残差</text><path d="M600 659L600 676" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><text x="600" y="692" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">下一层：[1, 11, 128]</text><text x="756.0" y="200" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">线性层都不带偏置</text><text x="756.0" y="294" font-size="12.5" fill="#7c3aed" font-weight="normal" text-anchor="start">cos/sin 表预先算好，</text><text x="756.0" y="311" font-size="12.5" fill="#7c3aed" font-weight="normal" text-anchor="start">4 层共用一份</text><text x="756.0" y="390" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="start">红框：写回残差流的投影，</text><text x="756.0" y="407" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="start">初始化再乘 1/√(2L)（第 10 章）</text><text x="756.0" y="522" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start">中间宽度 8d/3 = 341</text><text x="756.0" y="618" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="start">同样乘 1/√(2L)</text></g></svg>
