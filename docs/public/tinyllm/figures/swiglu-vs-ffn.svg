<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">普通前馈层与 SwiGLU 的结构对比</title><desc id="desc">普通 FFN 先把 d 维升到 4d，过激活函数后降回 d，权重 8d²；SwiGLU 用 gate 与 value 两条投影升到 m 维，gate 经过 SiLU 后与 value 逐元素相乘，再降回 d，中间宽度取 8d/3 时权重也是 8d²。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">普通 FFN 与 SwiGLU：参数量相同，结构不同</text><text x="240" y="85" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle">普通 FFN（中间宽度 4d）</text><text x="240" y="106" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>x  [B, T, d]</text><rect x="140" y="132" width="200" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="240" y="161" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">up: d → 4d</text><path d="M240 178L240 196" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="140" y="200" width="200" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="240" y="229" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">GELU / ReLU</text><path d="M240 246L240 264" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="140" y="268" width="200" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="240" y="297" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">down: 4d → d</text><text x="240" y="340" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>out [B, T, d]</text><text x="240" y="380" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">权重：d·4d + 4d·d = 8d²</text><path d="M240 113L240 128" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><text x="690" y="85" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle">SwiGLU（中间宽度 m ≈ 8d/3）</text><text x="690" y="106" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>x  [B, T, d]</text><rect x="530" y="132" width="145" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="602" y="161" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">gate: d → m</text><rect x="705" y="132" width="145" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="777" y="161" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">value: d → m</text><path d="M690 113 V118 H602 V128" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M690 118 H777 V128" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="530" y="200" width="145" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="602" y="229" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">SiLU</text><path d="M602 178L602 196" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><circle cx="690" cy="291" r="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="690" y="299" font-size="22" fill="#0f766e" font-weight="bold" text-anchor="middle">⊙</text><path d="M602 246 V291 H668" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M777 178 V291 H712" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><text x="800" y="320" font-size="13.5" fill="#0f766e" font-weight="normal" text-anchor="middle">逐元素相乘：门控</text><rect x="590" y="330" width="200" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="690" y="356" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">down: m → d</text><path d="M690 311L690 326" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><text x="690" y="400" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">权重：3 · d · m = 3 · d · 8d/3 = 8d²</text><line x1="465" y1="70" x2="465" y2="410" stroke="#e2e8f0" stroke-width="2"/><text x="480" y="445" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">例：d = 12 时，普通 FFN 用 m = 48 有 1152 个权重；SwiGLU 用 m = 32，也是 1152 个。</text></g></svg>
