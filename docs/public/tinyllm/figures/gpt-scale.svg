<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">GPT 系列的规模增长</title><desc id="desc">GPT-1 于 2018 年发布，1.17 亿参数，训练语料约 7000 本书；GPT-2 于 2019 年，15 亿参数，约 40GB 网页文本；GPT-3 于 2020 年，1750 亿参数，约 3000 亿 token；2022 年的 ChatGPT 在 GPT-3.5 基础上做了指令微调和人类反馈训练。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="420" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">同一个目标，不断放大：GPT 系列的规模</text><text x="150" y="82" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">年份 · 模型</text><text x="470" y="82" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">参数量</text><text x="830" y="82" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">训练语料</text><rect x="40" y="100" width="220" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="133" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">2018 · GPT-1</text><rect x="300" y="112" width="51" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="361" y="133" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">1.17 亿</text><text x="830" y="133" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">约 7000 本书</text><rect x="40" y="168" width="220" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="201" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">2019 · GPT-2</text><rect x="300" y="180" width="151" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="461" y="201" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">15 亿</text><text x="830" y="201" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">约 40 GB 网页文本</text><rect x="40" y="236" width="220" height="52" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="150" y="269" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">2020 · GPT-3</text><rect x="300" y="248" width="336" height="28" rx="6" fill="#ecfdf5" stroke="#0f766e"/><text x="646" y="269" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">1750 亿</text><text x="830" y="269" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">约 3000 亿 token</text><rect x="40" y="304" width="220" height="52" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="150" y="337" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">2022 · ChatGPT</text><text x="310" y="337" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">在 GPT-3.5 上</text><text x="830" y="337" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">再做指令微调和人类反馈训练</text><text x="480" y="395" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">参数条按对数刻度画：GPT-3 的条只比 GPT-1 长几倍，参数量却多了约 1500 倍。目标始终是预测下一个 token。</text></g></svg>
