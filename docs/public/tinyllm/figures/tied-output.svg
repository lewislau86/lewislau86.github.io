<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">输入嵌入与输出层共享权重</title><desc id="desc">输入端用 token ID 从 E 中取一行得到向量；输出端用隐藏向量 h 与 E 的每一行做点积得到每个候选 token 的 logit。两端使用同一个形状为 V×d 的参数 E。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="440" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">输入查表与输出打分可以共用同一张表</text><rect x="360" y="160" width="240" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="480" y="205" font-size="22" fill="#7c3aed" font-weight="bold" text-anchor="middle">E  [V, d]</text><text x="480" y="240" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="middle">同一个 Parameter</text><rect x="40" y="80" width="220" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="116" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">输入：取第 i 行</text><text x="150" y="166" font-size="15" fill="#2563eb" font-weight="normal" text-anchor="middle">ID → E[i]  [d]</text><path d="M262 110 C320 110 330 180 356 190" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="700" y="80" width="220" height="60" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="810" y="116" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">输出：和每一行做点积</text><text x="810" y="166" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="middle">h · E[j] → logit_j</text><path d="M604 190 C640 180 650 110 696 110" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="700" y="220" width="220" height="140" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="810" y="250" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>h  [B, T, d]</text><text x="810" y="280" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>logits = h @ E^T</text><text x="810" y="310" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[B, T, V]</text><text x="810" y="342" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">softmax → 下一个 token 的概率</text><rect x="40" y="220" width="220" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="250" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ids  [B, T]</text><text x="150" y="280" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>x = E[ids]</text><text x="150" y="310" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[B, T, d]</text><text x="150" y="342" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">再加位置、进 Transformer</text><text x="480" y="410" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">共享后少一份 V×d 的权重；输入端和输出端的梯度都会汇入这同一张表。</text></g></svg>
