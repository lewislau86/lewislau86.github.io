<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286" role="img" aria-labelledby="title desc">
<title id="title">SFT 样本的模板与损失掩码</title><desc id="desc">上：一条训练样本由 &lt;user&gt;、指令、&lt;assistant&gt;、回答和 &lt;eos&gt; 拼成；前三段掩码为 0 不算损失，回答和 &lt;eos&gt; 掩码为 1 算损失。下：推理时把新的指令按同一个模板拼到 &lt;assistant&gt; 为止，模型从那里开始生成，直到生成 &lt;eos&gt;。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="286" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">SFT 的一条样本：模板拼好，只有回答部分算损失</text><rect x="50" y="80" width="70" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="85.0" y="108" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">&lt;user&gt;</text><rect x="126" y="80" width="280" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="266.0" y="108" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">写一首五言绝句，用“春”字开头。</text><rect x="412" y="80" width="100" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="462.0" y="108" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">&lt;assistant&gt;</text><rect x="518" y="80" width="330" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="683.0" y="108" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。</text><rect x="854" y="80" width="64" height="44" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="886.0" y="108" font-size="14" fill="#b91c1c" font-weight="normal" text-anchor="middle">&lt;eos&gt;</text><path d="M50 138 L512 138" stroke="#64748b" stroke-width="2.5" fill="none"/><text x="281.0" y="160" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">掩码 0：不算损失（指令是用户给的，模型不用学着写）</text><path d="M518 138 L918 138" stroke="#b45309" stroke-width="2.5" fill="none"/><text x="718" y="160" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">掩码 1：算损失（包括 &lt;eos&gt;，学会停下）</text><text x="50" y="210" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">推理时：</text><rect x="130" y="184" width="70" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="165.0" y="209" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">&lt;user&gt;</text><rect x="206" y="184" width="160" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="286.0" y="209" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">新的指令</text><rect x="372" y="184" width="100" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="422.0" y="209" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">&lt;assistant&gt;</text><path d="M482 204L528 204" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="538" y="209" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">模型从这里开始逐字生成，生成出 &lt;eos&gt; 就停</text><text x="480" y="260" font-size="14" fill="#b91c1c" font-weight="normal" text-anchor="middle">训练和推理必须用同一个模板：少了 &lt;assistant&gt; 或者换了说法，“去指令里找首字”这类行为就会失灵</text></g></svg>
