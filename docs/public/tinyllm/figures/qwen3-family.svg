<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">以 Qwen3-4B 为例的模型族谱</title><desc id="desc">上排是训练阶段：第 1 阶段在 30 万亿以上 token 上用 4K 序列学语言和知识（预训练）；第 2 阶段用约 5 万亿高质量 token 加强推理、学习率加快衰减；第 3 阶段用 32K 长序列、把 RoPE base 从 1 万调到 100 万（这两段就是今天常说的中训练）；三段做完发布 Qwen3-4B-Base。Base 经过从 Qwen3-32B、235B-A22B 的蒸馏式后训练，得到能对话、有思考和不思考两种模式的 Qwen3-4B。Qwen3-Embedding-4B 和 Qwen3-Reranker-4B 从 Base 训出；FP8、AWQ、GGUF 是 Qwen3-4B 的量化版；Qwen3Guard 在 Qwen3-4B 上再做安全专项训练；Instruct-2507 与 Thinking-2507 是官方所说的两种模式各自的更新版。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="640" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">一个 base，一族模型：以 Qwen3-4B 为例</text><rect x="30" y="66" width="190" height="108" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="125" y="92" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">第 1 阶段 · 通用</text><text x="125" y="116" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">30 万亿以上 token</text><text x="125" y="136" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">序列长度 4K</text><text x="125" y="156" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">学语言和世界知识</text><rect x="250" y="66" width="190" height="108" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="345" y="92" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">第 2 阶段 · 推理</text><text x="345" y="116" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">约 5 万亿高质量 token</text><text x="345" y="136" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">多放 STEM、代码、合成数据</text><text x="345" y="156" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">学习率加快衰减</text><rect x="470" y="66" width="190" height="108" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="565" y="92" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">第 3 阶段 · 长上下文</text><text x="565" y="116" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">数千亿 token，序列 32K</text><text x="565" y="136" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">RoPE base 1 万 → 100 万</text><text x="565" y="156" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">长文本占大头</text><path d="M222 120L247 120" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M442 120L467 120" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M662 120L697 120" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="700" y="66" width="230" height="108" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2.4"/><text x="815" y="98" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">Qwen3-4B-Base</text><text x="815" y="124" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">发布：给它文字，它往下接</text><text x="815" y="146" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">上下文 32K</text><line x1="30" y1="188" x2="220" y2="188" stroke="#64748b" stroke-width="1.6"/><text x="125" y="206" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">预训练</text><line x1="250" y1="188" x2="660" y2="188" stroke="#0f766e" stroke-width="1.6"/><text x="455" y="206" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">今天常说的“中训练”（报告里算预训练的后两阶段）</text><path d="M815 176L815 237" stroke="#b45309" stroke-width="2.4" fill="none" marker-end="url(#arrow-b45309)"/><rect x="700" y="240" width="230" height="104" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="815" y="266" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">后训练：从大模型蒸馏</text><text x="815" y="290" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">老师是 Qwen3-32B / 235B-A22B</text><text x="815" y="310" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">先学老师写的回答，</text><text x="815" y="330" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">再让自己的分布贴近老师</text><path d="M815 346L815 377" stroke="#b45309" stroke-width="2.4" fill="none" marker-end="url(#arrow-b45309)"/><rect x="700" y="380" width="230" height="70" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2.4"/><text x="815" y="408" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">Qwen3-4B</text><text x="815" y="432" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">发布：会对话，思考 / 不思考两种模式</text><path d="M760 176 V222 H550 V240" stroke="#7c3aed" stroke-width="2.2" fill="none" marker-end="url(#arrow-7c3aed)"/><rect x="440" y="243" width="220" height="92" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="550" y="268" font-size="14.5" fill="#7c3aed" font-weight="bold" text-anchor="middle">Qwen3-Embedding-4B</text><text x="550" y="290" font-size="14.5" fill="#7c3aed" font-weight="bold" text-anchor="middle">Qwen3-Reranker-4B</text><text x="550" y="314" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">从 Base 训成向量 / 打分模型</text><rect x="30" y="228" width="398" height="172" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="48" y="254" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">名字怎么读</text><text x="48" y="280" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-Base</text><text x="228" y="280" font-size="13" fill="#172033" font-weight="normal" text-anchor="start">只做完预训练和中训练</text><text x="48" y="305" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="start">不带后缀</text><text x="228" y="305" font-size="13" fill="#172033" font-weight="normal" text-anchor="start">做过后训练，能按对话格式回答</text><text x="48" y="330" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-FP8/-AWQ/-GGUF</text><text x="228" y="330" font-size="13" fill="#172033" font-weight="normal" text-anchor="start">同一个模型，换一种存储格式</text><text x="48" y="355" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-Instruct/-Thinking</text><text x="228" y="355" font-size="13" fill="#172033" font-weight="normal" text-anchor="start">只保留一种模式的对话模型</text><text x="48" y="380" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-2507</text><text x="228" y="380" font-size="13" fill="#172033" font-weight="normal" text-anchor="start">2025 年 7 月的更新版</text><path d="M700 438 H135 V477" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M365 438 V477" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="30" y="480" width="210" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="135" y="504" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">量化版</text><text x="135" y="528" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-FP8  -AWQ  -GGUF</text><text x="135" y="552" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">不再训练，只压缩权重</text><rect x="260" y="480" width="210" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="365" y="504" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">安全专项</text><text x="365" y="528" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Qwen3Guard-*-4B</text><text x="365" y="552" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">再做一轮后训练，判断或拒绝</text><path d="M815 452 V477" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)" stroke-dasharray="7 5"/><rect x="700" y="480" width="230" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5"/><text x="815" y="504" font-size="13.5" fill="#172033" font-weight="bold" text-anchor="middle">Qwen3-4B-Instruct-2507</text><text x="815" y="524" font-size="13.5" fill="#172033" font-weight="bold" text-anchor="middle">Qwen3-4B-Thinking-2507</text><text x="815" y="550" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">官方称作两种模式各自的更新版</text><text x="815" y="568" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">模型卡没写从哪个检查点出发</text><text x="480" y="612" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">训练阶段来自 Qwen3 技术报告；模型之间的实线取自 Hugging Face 模型卡的 base_model 标注，虚线只有官方文字说明。</text></g></svg>
