<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">Agent 与 TinyLLM 的两次往返</title><desc id="desc">第 1 次请求只有系统策略、用户目标和工具说明，TinyLLM 把消息渲染成 token，生成以 &lt;call&gt; 开头的一行 JSON，服务端解析成 tool_calls 返回。Agent 检查工具名、参数和预算后读取 README.md，把结果作为 tool 消息追加。第 2 次请求带着整段对话，TinyLLM 生成 JSON 答案，作为普通内容返回，Agent 判分。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一次任务两次请求：Agent 管流程和工具，模型只读 token、写 token</text><text x="165" y="66" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">Agent（learn-agent-rust 专题 3）</text><text x="480" y="66" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">HTTP：Chat Completions 的 JSON</text><text x="795" y="66" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">TinyLLM 服务端（本章，Python）</text><rect x="30" y="84" width="270" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="165" y="118" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">messages：system 策略、user 目标</text><text x="165" y="144" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">tools：read_file 的说明和 JSON Schema</text><rect x="660" y="84" width="270" height="112" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="795" y="118" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">render：&lt;system&gt;…&lt;user&gt;…&lt;assistant&gt;</text><text x="795" y="144" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">贪心生成：&lt;call&gt;{&quot;name&quot;:&quot;read_file&quot;,…}&lt;eos&gt;</text><text x="795" y="170" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">解析成 tool_calls，服务端配一个 id</text><path d="M304 122L654 122" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="480" y="114" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">POST（第 1 次）</text><path d="M654 166L306 166" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="480" y="158" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle">finish_reason = tool_calls</text><rect x="30" y="236" width="270" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="165" y="270" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">ExecuteTools：名字、参数、预算都对</text><text x="165" y="296" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">才读 README.md；结果作为 tool 消息</text><text x="165" y="322" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">追加，tool_call_id 和调用的 id 配对</text><rect x="660" y="236" width="270" height="112" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="795" y="270" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">render 整段对话（前一半和第 1 次相同）</text><text x="795" y="296" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">贪心生成：{&quot;command&quot;:…,&quot;source&quot;:…}&lt;eos&gt;</text><text x="795" y="322" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">没有 &lt;call&gt;：作为 content 返回</text><path d="M304 274L654 274" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="480" y="266" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">POST（第 2 次，带上工具结果）</text><path d="M654 318L306 318" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="480" y="310" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle">finish_reason = stop</text><path d="M165 198L165 232" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="30" y="380" width="270" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="165" y="407" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">answered → grade：格式、答案、真的读过</text><path d="M165 350L165 376" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="480" y="452" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">调用 id 的配对、参数校验、读文件的预算、什么时候停，都写在两边的程序里；模型只是在 &lt;assistant&gt; 后面接着写</text><text x="615" y="407" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">左边：本章实验用照 Rust 代码写的 Python 版，也可以直接换成 Rust 程序</text></g></svg>
