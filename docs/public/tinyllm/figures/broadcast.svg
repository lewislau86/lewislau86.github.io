<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">广播示意</title><desc id="desc">3 行 4 列的隐藏向量加上长度为 4 的偏置：偏置被看作一行并复制到三行，逐格相加得到同形状结果。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="460" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="44" font-size="24" fill="#172033" font-weight="bold" text-anchor="middle">广播：形状 [3, 4] + [4]，偏置被“复制”到每一行再逐格相加</text><text x="158" y="98" font-size="19" fill="#172033" font-weight="normal" text-anchor="middle">hidden[0]：[3, 4]</text><rect x="50" y="115" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="77.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">0</text><rect x="104" y="115" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="131.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">1</text><rect x="158" y="115" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="185.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">2</text><rect x="212" y="115" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="239.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">3</text><rect x="50" y="169" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="77.0" y="204" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">4</text><rect x="104" y="169" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="131.0" y="204" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">5</text><rect x="158" y="169" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="185.0" y="204" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">6</text><rect x="212" y="169" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="239.0" y="204" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">7</text><rect x="50" y="223" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="77.0" y="258" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">8</text><rect x="104" y="223" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="131.0" y="258" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">9</text><rect x="158" y="223" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="185.0" y="258" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">10</text><rect x="212" y="223" width="54" height="54" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="239.0" y="258" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">11</text><text x="298" y="205" font-size="34" fill="#172033" font-weight="normal" text-anchor="middle">+</text><text x="438" y="98" font-size="18" fill="#b45309" font-weight="normal" text-anchor="middle">bias：[4] → 看作 [1, 4] → 复制成 [3, 4]</text><rect x="330" y="115" width="54" height="54" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.2"/><text x="357.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">1</text><rect x="384" y="115" width="54" height="54" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.2"/><text x="411.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">2</text><rect x="438" y="115" width="54" height="54" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.2"/><text x="465.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">3</text><rect x="492" y="115" width="54" height="54" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.2"/><text x="519.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">4</text><rect x="330" y="169" width="54" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="357.0" y="204" font-size="20" fill="#94a3b8" font-weight="normal" text-anchor="middle">1</text><rect x="384" y="169" width="54" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="411.0" y="204" font-size="20" fill="#94a3b8" font-weight="normal" text-anchor="middle">2</text><rect x="438" y="169" width="54" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="465.0" y="204" font-size="20" fill="#94a3b8" font-weight="normal" text-anchor="middle">3</text><rect x="492" y="169" width="54" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="519.0" y="204" font-size="20" fill="#94a3b8" font-weight="normal" text-anchor="middle">4</text><rect x="330" y="223" width="54" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="357.0" y="258" font-size="20" fill="#94a3b8" font-weight="normal" text-anchor="middle">1</text><rect x="384" y="223" width="54" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="411.0" y="258" font-size="20" fill="#94a3b8" font-weight="normal" text-anchor="middle">2</text><rect x="438" y="223" width="54" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="465.0" y="258" font-size="20" fill="#94a3b8" font-weight="normal" text-anchor="middle">3</text><rect x="492" y="223" width="54" height="54" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="519.0" y="258" font-size="20" fill="#94a3b8" font-weight="normal" text-anchor="middle">4</text><text x="438" y="302" font-size="16" fill="#b45309" font-weight="normal" text-anchor="middle">↑ 只有第一行是真实数据，灰色行是广播出来的（不占内存）</text><text x="590" y="205" font-size="34" fill="#172033" font-weight="normal" text-anchor="middle">=</text><rect x="640" y="115" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="667.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">1</text><rect x="694" y="115" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="721.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">3</text><rect x="748" y="115" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="775.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">5</text><rect x="802" y="115" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="829.0" y="150" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">7</text><rect x="640" y="169" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="667.0" y="204" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">5</text><rect x="694" y="169" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="721.0" y="204" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">7</text><rect x="748" y="169" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="775.0" y="204" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">9</text><rect x="802" y="169" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="829.0" y="204" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">11</text><rect x="640" y="223" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="667.0" y="258" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">9</text><rect x="694" y="223" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="721.0" y="258" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">11</text><rect x="748" y="223" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="775.0" y="258" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">13</text><rect x="802" y="223" width="54" height="54" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="829.0" y="258" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">15</text><text x="748" y="98" font-size="19" fill="#0f766e" font-weight="normal" text-anchor="middle">结果：[3, 4]</text><rect x="110" y="324" width="740" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="360" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">规则：从最右边一轴开始对齐，两轴长度相等或其中一个为 1 才能配对。</text><text x="480" y="394" font-size="20" fill="#0f766e" font-weight="normal" text-anchor="middle">[2, 3, 4] + [4]：4 对 4 可以，左边缺的轴当作 1</text><text x="480" y="424" font-size="20" fill="#b91c1c" font-weight="normal" text-anchor="middle">[2, 3, 4] + [3]：4 对 3，无法配对，报错</text></g></svg>
