<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">投机解码的一轮</title><desc id="desc">上一轮留下的 token“相”和草稿模型猜的 4 个 token（。、&lt;eos&gt;、一、闻）一起送进目标模型，一次前向得到 5 个位置上目标模型自己的选择（。、&lt;eos&gt;、一、人、多）。错开一格逐个比较，前 3 个相同、全部接受，第 4 个不同，换成目标模型的“人”。这一轮前进 4 个 token，目标模型只前向 1 次；被拒草稿的 KV 要从缓存里回滚。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="490" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">投机解码的一轮：草稿猜 4 个，目标模型一次前向验证</text><text x="40" y="92" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">① 草稿模型连续猜 4 个</text><text x="40" y="114" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">目标模型把它们和上一轮</text><text x="40" y="132" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">留下的 token 一次送进去</text><rect x="230" y="82" width="100" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="280.0" y="114" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">相</text><rect x="344" y="82" width="100" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="394.0" y="114" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">。</text><rect x="458" y="82" width="100" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="508.0" y="114" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">&lt;eos&gt;</text><rect x="572" y="82" width="100" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="622.0" y="114" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">一</text><rect x="686" y="82" width="100" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="736.0" y="114" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">闻</text><text x="280.0" y="152" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">上一轮留下</text><text x="565.0" y="152" font-size="12.5" fill="#b45309" font-weight="normal" text-anchor="middle">草稿 d1 … d4</text><path d="M280.0 164L386.0 214" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M394.0 164L500.0 214" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M508.0 164L614.0 214" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M622.0 164L728.0 214" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M736.0 164L842.0 214" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/><text x="40" y="196" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">② 目标模型一次前向</text><text x="40" y="218" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">每个位置给出它自己</text><text x="40" y="236" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">选的下一个 token</text><rect x="344" y="222" width="100" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="394.0" y="254" font-size="19" fill="#2563eb" font-weight="bold" text-anchor="middle">。</text><rect x="458" y="222" width="100" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="508.0" y="254" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">&lt;eos&gt;</text><rect x="572" y="222" width="100" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="622.0" y="254" font-size="19" fill="#2563eb" font-weight="bold" text-anchor="middle">一</text><rect x="686" y="222" width="100" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="736.0" y="254" font-size="19" fill="#2563eb" font-weight="bold" text-anchor="middle">人</text><rect x="800" y="222" width="100" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><text x="850.0" y="254" font-size="19" fill="#64748b" font-weight="bold" text-anchor="middle">多</text><text x="40" y="318" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">③ 上下逐个比较</text><text x="40" y="340" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">第一处不同就停</text><text x="394.0" y="326" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">✓ 相同，接受</text><text x="508.0" y="326" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">✓ 相同，接受</text><text x="622.0" y="326" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">✓ 相同，接受</text><text x="736.0" y="326" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">× 不同</text><text x="736.0" y="346" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">换成目标的选择</text><text x="850.0" y="326" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">用不上</text><rect x="40" y="378" width="880" height="92" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="60" y="408" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">④ 这一轮前进 4 个 token：</text><rect x="300" y="388" width="64" height="32" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="332" y="410" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">。</text><rect x="372" y="388" width="64" height="32" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="404" y="410" font-size="12.5" fill="#b45309" font-weight="bold" text-anchor="middle">&lt;eos&gt;</text><rect x="444" y="388" width="64" height="32" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="476" y="410" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">一</text><rect x="516" y="388" width="64" height="32" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="548" y="410" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">人</text><text x="598" y="410" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">（前 3 个来自草稿，最后 1 个来自目标模型）</text><text x="60" y="450" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">目标模型只前向了 1 次。被拒的“闻”已经写进了 KV cache，要回滚删掉；最后那个 token 下一轮再送进去。</text></g></svg>
