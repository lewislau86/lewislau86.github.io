<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="title desc">
<title id="title">Transformer Block 的两种装法</title><desc id="desc">左：直接堆叠，x 先过注意力再过 SwiGLU，输出整个替换 x。右：Pre-Norm 残差 Block，x 沿残差流一路向下，两次分出副本经 RMSNorm 进入注意力或 SwiGLU，结果加回残差流；d=64 时注意力 16,384 个参数，SwiGLU 32,640 个，两个 RMSNorm 128 个。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="545" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="38" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">同样两个子层，两种装法</text><text x="220" y="80" font-size="19" fill="#b91c1c" font-weight="bold" text-anchor="middle">直接堆叠</text><text x="220" y="112" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>x  [B, T, d]</text><path d="M220 120L220 146" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="100" y="148" width="240" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="220" y="172" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle">注意力</text><text x="220" y="195" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">token 之间交换信息</text><path d="M220 206L220 236" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="100" y="238" width="240" height="58" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="220" y="262" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle">SwiGLU 前馈层</text><text x="220" y="285" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每个 token 自己加工</text><path d="M220 296L220 322" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="220" y="342" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>out  [B, T, d]</text><text x="220" y="392" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="middle">x 被整个替换掉：</text><text x="220" y="416" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="middle">下一层只能看到这一层的输出</text><text x="680" y="80" font-size="19" fill="#0f766e" font-weight="bold" text-anchor="middle">Pre-Norm 残差 Block（TinyLLM 采用）</text><text x="560" y="112" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>x  [B, T, d]</text><path d="M560 122 V500" stroke="#172033" stroke-width="6" fill="none" opacity="0.18"/><text x="544" y="320" font-size="15" fill="#64748b" font-weight="normal" text-anchor="end">残差流</text><path d="M560 156 H648" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="650" y="134" width="110" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="705" y="160" font-size="15" fill="#7c3aed" font-weight="bold" text-anchor="middle">RMSNorm</text><path d="M760 174L760 194" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="635" y="196" width="250" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="760" y="220" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">注意力 · 16,384 个参数</text><text x="760" y="242" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">token 之间交换信息</text><path d="M760 252 V278 H580" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><circle cx="560" cy="278" r="16" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="560" y="285" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M560 336 H648" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="650" y="314" width="110" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="705" y="340" font-size="15" fill="#7c3aed" font-weight="bold" text-anchor="middle">RMSNorm</text><path d="M760 354L760 374" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="635" y="376" width="250" height="56" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="760" y="400" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">SwiGLU · 32,640 个参数</text><text x="760" y="422" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">每个 token 自己加工</text><path d="M760 432 V458 H580" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><circle cx="560" cy="458" r="16" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="560" y="465" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M560 474L560 500" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="560" y="522" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>out  [B, T, d]</text><text x="650" y="500" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">子层只读一份归一化后的副本，结果加回 x</text><text x="650" y="522" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">d = 64；两个 RMSNorm 共 128 个参数</text><line x1="440" y1="66" x2="440" y2="440" stroke="#e2e8f0" stroke-width="2"/></g></svg>
