<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">残差连接的前向与反向</title><desc id="desc">输入 x 经过子层 F 后与 x 本身相加得到 y；反向时梯度 g 一路原样传回 x，另一路经过 F 的雅可比，两路相加。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="480" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">残差块：前向多一条加法，反向多一条直通的梯度路径</text><text x="80" y="125" font-size="26" fill="#2563eb" font-weight="bold" text-anchor="middle">x</text><path d="M100 118 H190" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="195" y="88" width="200" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="295" y="125" font-size="20" fill="#2563eb" font-weight="bold" text-anchor="middle">子层 F</text><path d="M395 118 H470" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><circle cx="490" cy="118" r="20" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="490" y="126" font-size="26" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M510 118 H590" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><text x="600" y="126" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="start">y = x + F(x)</text><path d="M140 118 V210 H490 V140" stroke="#0f766e" stroke-width="3.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="315" y="232" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="middle">直通路径：x 原样加到输出上</text><rect x="60" y="270" width="840" height="150" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="305" font-size="18" fill="#b45309" font-weight="bold" text-anchor="middle">反向传播时，从 y 传回来的梯度 g 分成两路再相加：</text><text x="480" y="345" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">dL/dx = g + J_F(x)^T · g</text><text x="480" y="385" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle">第一项来自直通路径，不经过 F 的任何运算；第二项经过 F 的雅可比，可能被放大或缩小。</text><text x="480" y="455" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">直通路径保证梯度至少有一条“原样”的通道；多层叠加后整体仍可能变大或变小，所以还要配合初始化与归一化。</text></g></svg>
