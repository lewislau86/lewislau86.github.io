<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" aria-labelledby="title desc">
<title id="title">梯度累积时分母放在哪</title><desc id="desc">8 首诗按长度排序后分成 4 个 micro-batch，真题数分别为 46, 53, 93, 96。各自平均再除以 4 时，短诗组每道题的权重放大到 1.57 倍，长诗组缩小到 0.75 倍，梯度方向的余弦相似度只有 0.939；各自求和、最后除以总题数 288，结果和一起算完全相同。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="366" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="38" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">同样 8 首诗、288 道真题，分成 4 个 micro-batch 累积梯度：分母放在哪？</text><text x="60" y="98" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">micro-batch 1</text><rect x="170" y="82" width="147.2" height="24" rx="4" fill="#2563eb" opacity="0.8"/><text x="325.20000000000005" y="100" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">46 道</text><text x="60" y="142" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">micro-batch 2</text><rect x="170" y="126" width="169.6" height="24" rx="4" fill="#2563eb" opacity="0.8"/><text x="347.6" y="144" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">53 道</text><text x="60" y="186" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">micro-batch 3</text><rect x="170" y="170" width="297.6" height="24" rx="4" fill="#2563eb" opacity="0.8"/><text x="475.6" y="188" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">93 道</text><text x="60" y="230" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">micro-batch 4</text><rect x="170" y="214" width="307.2" height="24" rx="4" fill="#2563eb" opacity="0.8"/><text x="485.20000000000005" y="232" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">96 道</text><rect x="560" y="70" width="370" height="92" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="745" y="98" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">有偏：各自平均，再除以 4</text><text x="745" y="122" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">每道题的权重 = 1 ÷ (4 × 本组题数)</text><text x="745" y="146" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">权重是一起算时的 1.57 / 1.36 / 0.77 / 0.75 倍</text><rect x="560" y="176" width="370" height="92" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="745" y="204" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">正确：各自求和，最后除以总题数</text><text x="745" y="228" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">每道题的权重 = 1 ÷ 288</text><text x="745" y="252" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">和 8 首一起算的梯度完全相同</text><rect x="40" y="286" width="880" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="480" y="312" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">按长度排序后分组，短诗那两组的题被放大到 1.57 倍，长诗那两组缩到 0.75 倍；</text><text x="480" y="334" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">梯度方向和一起算时的余弦相似度只有 0.939。题数相同的分组（原顺序）就没有这个问题。</text></g></svg>
