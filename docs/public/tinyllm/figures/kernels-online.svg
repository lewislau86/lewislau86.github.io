<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-labelledby="title desc">
<title id="title">online softmax 的更新过程</title><desc id="desc">第 0 层、第 0 句、第 0 个头最后一个位置的 64 个分数，分成 4 块、每块 16 个依次处理。每块之后更新目前的最大值 m 和以 m 为基准的指数和 ℓ；出现更大的分数时，旧的指数和与加权和乘以校正系数 e^(m旧−m新)。第三、四块各提高了一次最大值，校正系数分别是 0.856 和 0.403。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="392" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="38" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">online softmax：一行分数分 4 块到来，每块只看 16 个</text><text x="120" y="86" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">分数</text><text x="290" y="86" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">本块最大</text><text x="450" y="86" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">目前最大 m</text><text x="650" y="86" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">校正系数 e^(m旧−m新)</text><text x="840" y="86" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">指数和 ℓ</text><rect x="40" y="100" width="880" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="120" y="126" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">第 0–15 个</text><text x="290" y="126" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">1.112</text><text x="450" y="126" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">1.112</text><text x="650" y="126" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">0.000</text><text x="840" y="126" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">5.721</text><rect x="40" y="150" width="880" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="120" y="176" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">第 16–31 个</text><text x="290" y="176" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">0.776</text><text x="450" y="176" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">1.112</text><text x="650" y="176" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">1.000</text><text x="840" y="176" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">10.515</text><rect x="40" y="200" width="880" height="42" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="120" y="226" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">第 32–47 个</text><text x="290" y="226" font-size="15" fill="#b45309" font-weight="normal" text-anchor="middle">1.267</text><text x="450" y="226" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">1.267</text><text x="650" y="226" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">0.856</text><text x="840" y="226" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">14.434</text><rect x="40" y="250" width="880" height="42" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="120" y="276" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">第 48–63 个</text><text x="290" y="276" font-size="15" fill="#b45309" font-weight="normal" text-anchor="middle">2.176</text><text x="450" y="276" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">2.176</text><text x="650" y="276" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">0.403</text><text x="840" y="276" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">9.421</text><text x="480" y="340" font-size="15" fill="#b45309" font-weight="normal" text-anchor="middle">橙色行：新的一块出现了更大的分数，旧的 ℓ 和加权和都乘以校正系数，换到新的基准上</text><text x="480" y="368" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">第一块之前什么都没有，校正系数是 0；最后输出 = 加权和 ÷ ℓ，与先算完整 softmax 的结果只差浮点舍入</text></g></svg>
