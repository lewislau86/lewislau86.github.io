<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" role="img" aria-labelledby="title desc">
<title id="title">WSD 的分叉</title><desc id="desc">横轴是训练步数，纵轴是学习率。主干经过 warmup 后一直停在峰值上。从主干上的几个检查点出发，各接一段线性衰减到 0，就得到预算 A、B、C 三个训练完成的模型，衰减段约占各自预算的最后 20%。这是示意图，不是某次实验的曲线。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="444" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">WSD：一条主干一直在峰值上，从检查点接一段衰减就得到一个“训完”的模型</text><line x1="110" y1="340" x2="870" y2="340" stroke="#172033" stroke-width="1.5"/><line x1="110" y1="80" x2="110" y2="340" stroke="#172033" stroke-width="1.5"/><text x="870" y="366" font-size="13" fill="#64748b" font-weight="normal" text-anchor="end">训练步数 →</text><text x="80" y="210.0" font-size="13" fill="#64748b" text-anchor="middle" transform="rotate(-90 80 210.0)">学习率</text><path d="M110 340 L160 110 L850 110" stroke="#2563eb" stroke-width="3" fill="none"/><text x="156" y="100" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="end">warmup</text><text x="860" y="98" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="end">主干：停在峰值，可以一直往后接</text><circle cx="300" cy="110" r="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><path d="M300 110 L347.5 336" stroke="#0f766e" stroke-width="2.6" fill="none" stroke-dasharray="7 4"/><text x="351.5" y="326" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start">预算 A：衰减到 0</text><text x="300" y="98" font-size="12" fill="#0f766e" font-weight="normal" text-anchor="middle">检查点</text><circle cx="480" cy="110" r="6" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><path d="M480 110 L572.5 336" stroke="#b45309" stroke-width="2.6" fill="none" stroke-dasharray="7 4"/><text x="576.5" y="326" font-size="12.5" fill="#b45309" font-weight="normal" text-anchor="start">预算 B：衰减到 0</text><text x="480" y="98" font-size="12" fill="#b45309" font-weight="normal" text-anchor="middle">检查点</text><circle cx="660" cy="110" r="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><path d="M660 110 L797.5 336" stroke="#7c3aed" stroke-width="2.6" fill="none" stroke-dasharray="7 4"/><text x="801.5" y="326" font-size="12.5" fill="#7c3aed" font-weight="normal" text-anchor="start">预算 C：衰减到 0</text><text x="660" y="98" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle">检查点</text><text x="480" y="400" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">衰减段约占这一个预算的最后 20%（第 17 章）；分叉不浪费主干：每个预算只多花一段衰减</text><text x="480" y="424" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">余弦调度的形状由总步数决定，换一个预算就要从头重训；第 23 章的逐轮淘汰正是靠这个分叉</text></g></svg>
