<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="title desc">
<title id="title">推理服务的结构</title><desc id="desc">客户端发来的请求由 HTTP 线程解析、分词后放进收件箱；唯一的引擎线程取出新请求交给 Replica，一步一步跑（抢占、放人、分块、一次前向、块池和前缀缓存），把每一步新出的 token 放进各请求自己的队列；HTTP 线程从队列里取 token，用 DecodeStream 攒成完整的字，按普通 JSON 或 SSE 流写回。优雅退出时先拒绝新请求并让健康检查返回 503，再把手上的请求跑完，最后关掉服务。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="424" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">一个最小的推理服务：HTTP 线程不碰模型，引擎线程独占模型</text><rect x="30" y="70" width="190" height="238" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="125" y="96" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">客户端</text><text x="44" y="128" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">POST /v1/chat/completions</text><text x="44" y="158" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">  stream=false：一次返回</text><text x="44" y="188" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">  stream=true：SSE 逐段</text><text x="44" y="218" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">GET /metrics</text><text x="44" y="248" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">GET /health</text><rect x="270" y="70" width="190" height="238" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="365" y="96" font-size="13.5" fill="#2563eb" font-weight="bold" text-anchor="middle">HTTP 线程（每个连接一个）</text><text x="365" y="128" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">解析 JSON、分词</text><text x="365" y="156" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">检查长度，退出中就回 503</text><text x="365" y="184" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">submit → 收件箱</text><text x="365" y="212" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">从自己的队列取 token</text><text x="365" y="240" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">DecodeStream 攒成整字</text><text x="365" y="268" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">写回 JSON 或 SSE</text><path d="M222 140L266 140" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M266 260L222 260" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="510" y="70" width="140" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="580" y="96" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">收件箱</text><text x="580" y="116" font-size="12" fill="#172033" font-weight="normal" text-anchor="middle">queue.Queue</text><rect x="510" y="248" width="140" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="580" y="274" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">每个请求的队列</text><text x="580" y="294" font-size="12" fill="#172033" font-weight="normal" text-anchor="middle">新 token / 结束</text><path d="M462 100L506 100" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M506 278L462 278" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)"/><rect x="700" y="70" width="230" height="238" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="815" y="96" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">引擎线程（只有一个）</text><text x="716" y="128" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">取收件箱里的新请求</text><text x="716" y="156" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">Replica.step()：</text><text x="716" y="184" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">  抢占 / 放人 / 分块</text><text x="716" y="212" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">  一次前向（INT8 权重）</text><text x="716" y="240" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">  块池 + 前缀缓存</text><text x="716" y="268" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">把新 token 放进各自的队列</text><path d="M652 100L696 100" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)"/><path d="M696 278L652 278" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="270" y="336" width="660" height="70" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6"/><text x="600" y="360" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">优雅退出：① accepting = False，新请求一律 503（/health 也变 503，负载均衡器把流量切走）</text><text x="600" y="384" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">② 引擎线程把收件箱和正在跑的请求都跑完　③ 线程结束，关掉 HTTP 服务</text></g></svg>
