t-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>5</text><rect x="170" y="142" width="38" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="189.0" y="166.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>6</text><rect x="208" y="142" width="38" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="227.0" y="166.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>7</text><rect x="94" y="180" width="38" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="113.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>8</text><rect x="132" y="180" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="151.0" y="204.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>9</text><rect x="170" y="180" width="38" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="189.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>10</text><rect x="208" y="180" width="38" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="227.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>11</text><text x="170" y="246" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">内存里依次是 0 1 2 … 11</text><text x="500" y="86" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">x.reshape(4, 3)</text><rect x="443" y="104" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="462.0" y="128.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0</text><rect x="481" y="104" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="500.0" y="128.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>1</text><rect x="519" y="104" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="538.0" y="128.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>2</text><rect x="443" y="142" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="462.0" y="166.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>3</text><rect x="481" y="142" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="166.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>4</text><rect x="519" y="142" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="538.0" y="166.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>5</text><rect x="443" y="180" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="462.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>6</text><rect x="481" y="180" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>7</text><rect x="519" y="180" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="538.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>8</text><rect x="443" y="218" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="462.0" y="242.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>9</text><rect x="481" y="218" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="242.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>10</text><rect x="519" y="218" width="38" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="538.0" y="242.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>11</text><text x="500" y="284" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">按内存顺序重新分行</text><text x="500" y="306" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">第 0 行仍是 0 1 2</text><text x="800" y="86" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">x.transpose(0, 1)</text><rect x="743" y="104" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="762.0" y="128.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0</text><rect x="781" y="104" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="800.0" y="128.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>4</text><rect x="819" y="104" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="838.0" y="128.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>8</text><rect x="743" y="142" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="762.0" y="166.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>1</text><rect x="781" y="142" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="800.0" y="166.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>5</text><rect x="819" y="142" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="838.0" y="166.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>9</text><rect x="743" y="180" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="762.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>2</text><rect x="781" y="180" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="800.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>6</text><rect x="819" y="180" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="838.0" y="204.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>10</text><rect x="743" y="218" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="762.0" y="242.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>3</text><rect x="781" y="218" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="800.0" y="242.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>7</text><rect x="819" y="218" width="38" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="838.0" y="242.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>11</text><text x="800" y="284" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">行和列互换</text><text x="800" y="306" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">第 0 行是原来的第 0 列：0 4 8</text><path d="M260 150L428 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M260 178L728 190" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="480" y="352" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">橙色的 1、5、9 原来是第 1 列：transpose 后正好成了第 1 行；reshape 后散在三行里</text><text x="480" y="378" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle">拆注意力头时先用 view 切出“头”这一维，再用 transpose 把它换到前面；用错一个，形状对，结果错</text></g></svg>
