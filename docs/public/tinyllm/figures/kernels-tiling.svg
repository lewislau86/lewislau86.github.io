<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">分块注意力的计算顺序</title><desc id="desc">左：64 个位置按 16 切成 4×4 个方块。因果掩码让对角线右上方的 6 块整块不用算，对角线上的块只算左下半，一共算 10 块。右：处理一行 Q 块时，Q 块常驻片上，K、V 的块依次读进来，每次只算一个 16×16 的分数块，用 online softmax 更新每行的最大值、指数和与加权和；最后只把输出块和每行一个 lse 写回主存。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="440" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="38" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">分块注意力：一次只在片上算一个 16×16 的方块</text><text x="234" y="76" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">K、V 的块 j →</text><text x="64" y="234" font-size="15" fill="#64748b" text-anchor="middle" transform="rotate(-90 64 234)">Q 的块 i →</text><text x="94" y="146.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">0</text><text x="141.0" y="100" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">0</text><rect x="113" y="113" width="56" height="56" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><path d="M113 113 L169 169 L169 113 Z" fill="#ffffff" opacity="0.85"/><text x="133.0" y="155.0" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">算</text><rect x="175" y="113" width="56" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.5"/><text x="203.0" y="146.0" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">跳过</text><rect x="237" y="113" width="56" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.5"/><text x="265.0" y="146.0" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">跳过</text><rect x="299" y="113" width="56" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.5"/><text x="327.0" y="146.0" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">跳过</text><text x="94" y="208.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">1</text><text x="203.0" y="100" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">1</text><rect x="113" y="175" width="56" height="56" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="141.0" y="208.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">算</text><rect x="175" y="175" width="56" height="56" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><path d="M175 175 L231 231 L231 175 Z" fill="#ffffff" opacity="0.85"/><text x="195.0" y="217.0" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">算</text><rect x="237" y="175" width="56" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.5"/><text x="265.0" y="208.0" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">跳过</text><rect x="299" y="175" width="56" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.5"/><text x="327.0" y="208.0" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">跳过</text><text x="94" y="270.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">2</text><text x="265.0" y="100" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">2</text><rect x="113" y="237" width="56" height="56" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="141.0" y="270.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">算</text><rect x="175" y="237" width="56" height="56" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="203.0" y="270.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">算</text><rect x="237" y="237" width="56" height="56" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><path d="M237 237 L293 293 L293 237 Z" fill="#ffffff" opacity="0.85"/><text x="257.0" y="279.0" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">算</text><rect x="299" y="237" width="56" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.5"/><text x="327.0" y="270.0" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">跳过</text><text x="94" y="332.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">3</text><text x="327.0" y="100" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">3</text><rect x="113" y="299" width="56" height="56" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="141.0" y="332.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">算</text><rect x="175" y="299" width="56" height="56" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="203.0" y="332.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">算</text><rect x="237" y="299" width="56" height="56" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="265.0" y="332.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">算</text><rect x="299" y="299" width="56" height="56" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><path d="M299 299 L355 355 L355 299 Z" fill="#ffffff" opacity="0.85"/><text x="319.0" y="341.0" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">算</text><rect x="108" y="232" width="252" height="66" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5"/><text x="234" y="388" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">每个头 16 块：算 10 块，跳过 6 块</text><text x="234" y="412" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">对角线上的块只算左下半（橙色），其余整块可见（绿色）</text><text x="700" y="92" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">蓝框那一行（Q 块 2）怎样走</text><rect x="450" y="108" width="500" height="74" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="700" y="132" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">主存（显存 / 内存）：完整的 Q、K、V，最后写回输出 O 和每行的 lse</text><text x="700" y="158" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">容量大、读写慢</text><rect x="450" y="240" width="500" height="128" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="700" y="264" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">片上快速存储（GPU 的共享内存 / CPU 的缓存）</text><text x="700" y="290" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">Q 块 2 常驻；每行的 m、ℓ 和加权和 o</text><text x="700" y="314" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">依次放进 K、V 的块 0、1、2，算一个 16×16 的分数块</text><text x="700" y="338" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">用 online softmax 更新 m、ℓ、o，分数块用完即弃</text><text x="700" y="358" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">容量小、读写快</text><line x1="570" y1="184" x2="570" y2="236" stroke="#2563eb" stroke-width="2.5"/><text x="562" y="214" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="end">读 Q 块、K/V 块</text><line x1="830" y1="184" x2="830" y2="236" stroke="#b45309" stroke-width="2.5"/><text x="838" y="214" font-size="13" fill="#b45309" font-weight="normal" text-anchor="start">只写回 O 块和 lse</text><text x="700" y="400" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">T×T 的分数表从头到尾没有完整出现在主存里</text></g></svg>
