<svg xmlns="http://www.w3.org/2000/svg" width="960" height="532" viewBox="0 0 960 532" role="img" aria-labelledby="title desc">
<title id="title">tokenizer 流水线</title><desc id="desc">原文“猫在学习 TinyLLM。”加一个换行，经规范化（本例不改写）、预切分与字节映射（空格变成 Ġ、换行变成 Ċ，一个汉字是 3 个字节），BPE 按合并优先级切成 16 个 token，查词表得到同样多的 ID；解码时把 ID 变回字节、整段拼回原文。数据来自第 4 章脚本的 encode-roundtrip 输出。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="532" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">tokenizer 是一条流水线：“猫在学习 TinyLLM。\n” 每一步变成什么</text><rect x="40" y="64" width="220" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="150" y="94" font-size="14.5" fill="#64748b" font-weight="bold" text-anchor="middle">原文</text><rect x="276" y="64" width="520" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="536" y="95" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">猫在学习 TinyLLM。⏎</text><text x="810" y="95" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">14 个字符</text><path d="M150 114L150 130" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="40" y="132" width="220" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="150" y="162" font-size="14.5" fill="#64748b" font-weight="bold" text-anchor="middle">① 规范化</text><rect x="276" y="132" width="520" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="536" y="163" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">本例不改写（NFKC 等规则在这一步）</text><text x="810" y="163" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">随词表保存</text><path d="M150 182L150 198" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="40" y="200" width="220" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="230" font-size="14.5" fill="#2563eb" font-weight="bold" text-anchor="middle">② 预切分 + 字节映射</text><rect x="276" y="200" width="520" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="536" y="231" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">UTF-8 字节 → 可显示符号；空格变成 Ġ，换行变成 Ċ</text><text x="810" y="231" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">汉字 3 字节</text><path d="M150 250L150 266" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="40" y="268" width="220" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="150" y="298" font-size="14.5" fill="#0f766e" font-weight="bold" text-anchor="middle">③ BPE 按合并优先级切分</text><rect x="276" y="268" width="520" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="284" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="293.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">ç</text><rect x="306" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="315.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">Į</text><rect x="328" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="337.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">«</text><rect x="350" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="359.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">å</text><rect x="372" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="381.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">ľ</text><rect x="394" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="403.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">¨</text><rect x="416" y="280" width="64" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="448.0" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">åŃ¦ä¹ł</text><rect x="483" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="492.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">Ġ</text><rect x="505" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="514.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>T</text><rect x="527" y="280" width="28" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="541.0" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>in</text><rect x="558" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="567.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>y</text><rect x="580" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="589.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>L</text><rect x="602" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="611.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>L</text><rect x="624" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="633.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>M</text><rect x="646" y="280" width="37" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="664.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">ãĢĤ</text><rect x="686" y="280" width="19" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/><text x="695.5" y="298" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">Ċ</text><text x="810" y="299" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">16 个 token</text><path d="M150 318L150 334" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="40" y="336" width="220" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="150" y="366" font-size="14.5" fill="#b45309" font-weight="bold" text-anchor="middle">④ 查词表得到 ID</text><rect x="276" y="336" width="520" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="536" y="367" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>167 238 108 165 254 105 289 224 55 265 92 47 47 48 263 202</text><text x="810" y="367" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">送进模型</text><path d="M150 386L150 402" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="40" y="404" width="220" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="150" y="434" font-size="14.5" fill="#7c3aed" font-weight="bold" text-anchor="middle">⑤ 解码：ID → 字节 → 整段拼回</text><rect x="276" y="404" width="520" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="536" y="435" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">猫在学习 TinyLLM。⏎（和原文逐字相同）</text><text x="810" y="435" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">整段解码</text><text x="480" y="486" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">③ 里 “ç Į «” 三个片段合起来才是“猫”这一个字的 3 个字节；“学习”两个字合成了一个 token</text><text x="480" y="510" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">① ② 是配置，③ 是训练出来的合并表，④ 是词表；四样都要和模型一起保存（第 4 章第 7 节）</text></g></svg>
