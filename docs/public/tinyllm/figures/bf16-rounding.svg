<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">1 附近的浮点刻度</title><desc id="desc">三条数轴画出 1.0 附近能精确表示的数。FP32 的间隔约 1.2e-7，1.001 能保留；FP16 的间隔约 0.00098，1.001 舍入成 1.0009766；BF16 的间隔是 0.0078125，1.001 舍入回 1.0，一次 0.001 的更新完全丢失。所以混合精度训练要把主权重留在 FP32。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">1 附近的刻度有多密：一次 0.001 的更新还留得住吗</text><text x="110" y="106" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="end">FP32</text><line x1="140" y1="100" x2="860" y2="100" stroke="#94a3b8" stroke-width="1.5"/><rect x="140" y="92" width="720" height="16" fill="#eff6ff" stroke="none"/><text x="480" y="104" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">刻度密到画不出来</text><circle cx="345.71428571428567" cy="100" r="5" fill="#172033" stroke="#172033" stroke-width="2.5"/><circle cx="397.1428571428514" cy="100" r="5" fill="#b45309" stroke="#b45309" stroke-width="2.5"/><text x="345.71428571428567" y="130" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="start">间隔 2^-23 ≈ 0.00000012</text><text x="860" y="130" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="end">1.001 → 1.00100005：留住了</text><text x="110" y="206" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="end">FP16</text><line x1="140" y1="200" x2="860" y2="200" stroke="#94a3b8" stroke-width="1.5"/><line x1="144.82142857142875" y1="192" x2="144.82142857142875" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="195.044642857143" y1="192" x2="195.044642857143" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="245.26785714285722" y1="192" x2="245.26785714285722" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="295.49107142857144" y1="192" x2="295.49107142857144" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="345.71428571428567" y1="192" x2="345.71428571428567" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="395.9375" y1="192" x2="395.9375" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="446.16071428571416" y1="192" x2="446.16071428571416" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="496.38392857142844" y1="192" x2="496.38392857142844" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="546.6071428571427" y1="192" x2="546.6071428571427" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="596.8303571428569" y1="192" x2="596.8303571428569" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="647.0535714285711" y1="192" x2="647.0535714285711" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="697.2767857142854" y1="192" x2="697.2767857142854" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="747.4999999999997" y1="192" x2="747.4999999999997" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="797.7232142857139" y1="192" x2="797.7232142857139" y2="208" stroke="#0f766e" stroke-width="1.4"/><line x1="847.9464285714281" y1="192" x2="847.9464285714281" y2="208" stroke="#0f766e" stroke-width="1.4"/><circle cx="345.71428571428567" cy="200" r="5" fill="#172033" stroke="#172033" stroke-width="2.5"/><circle cx="397.1428571428514" cy="200" r="5" fill="#b45309" stroke="#b45309" stroke-width="2.5"/><text x="345.71428571428567" y="230" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="start">间隔 2^-10 ≈ 0.00098</text><text x="860" y="230" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="end">1.001 → 1.0009766：大致留住</text><text x="110" y="306" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="end">BF16</text><line x1="140" y1="300" x2="860" y2="300" stroke="#94a3b8" stroke-width="1.5"/><line x1="345.71428571428567" y1="292" x2="345.71428571428567" y2="308" stroke="#b91c1c" stroke-width="1.4"/><line x1="747.4999999999997" y1="292" x2="747.4999999999997" y2="308" stroke="#b91c1c" stroke-width="1.4"/><circle cx="345.71428571428567" cy="300" r="5" fill="#172033" stroke="#172033" stroke-width="2.5"/><circle cx="397.1428571428514" cy="300" r="5" fill="#b45309" stroke="#b45309" stroke-width="2.5"/><text x="345.71428571428567" y="330" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="start">间隔 2^-7 = 0.0078125</text><text x="860" y="330" font-size="13" fill="#b91c1c" font-weight="bold" text-anchor="end">1.001 → 1.0：整个被吞掉</text><text x="345.71428571428567" y="76" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">1.0</text><text x="403.1428571428514" y="76" font-size="12.5" fill="#b45309" font-weight="normal" text-anchor="start">1.001</text><text x="480" y="420" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">学习率 1e-3 量级的一步更新，落在 BF16 的半个刻度以内，加上去再舍入就回到原值</text><text x="480" y="446" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle">所以混合精度训练时，前向和反向可以用 BF16，参数本身（主权重）和优化器状态要留在 FP32</text></g></svg>
