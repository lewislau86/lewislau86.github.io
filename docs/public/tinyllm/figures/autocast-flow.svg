<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">autocast 混合精度的数据流</title><desc id="desc">参数保存为 FP32；在 autocast 区域内，矩阵乘法等算子转为 FP16 或 BF16 计算，softmax、layer_norm 和损失等按 FP32 计算，其余跟随输入；反向传播的梯度累加回 FP32 参数，使用 FP16 时还需要 GradScaler。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="420" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">autocast：按算子选精度，参数仍以 FP32 保存</text><rect x="40" y="90" width="220" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="150" y="122" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">模型参数</text><text x="150" y="146" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>FP32</text><rect x="330" y="75" width="300" height="270" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><text x="480" y="100" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">with torch.autocast(...)</text><rect x="355" y="115" width="250" height="58" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="140" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">matmul / linear / conv</text><text x="480" y="162" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">转成 FP16 / BF16 计算</text><rect x="355" y="190" width="250" height="58" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="215" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">softmax / layer_norm / 损失</text><text x="480" y="237" font-size="13.5" fill="#0f766e" font-weight="normal" text-anchor="middle">按 FP32 计算</text><rect x="355" y="265" width="250" height="58" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="480" y="290" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">其他算子</text><text x="480" y="312" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">跟随输入 dtype</text><path d="M262 125 H351" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="700" y="160" width="220" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="810" y="192" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">loss.backward()</text><text x="810" y="216" font-size="13.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">梯度累加回 FP32 参数</text><path d="M634 220 H696" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow-7c3aed)"/><rect x="700" y="265" width="220" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="810" y="297" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">只有 FP16 才需要</text><text x="810" y="320" font-size="13.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">GradScaler 防梯度下溢</text><text x="480" y="395" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">具体哪些算子转低精度，由 PyTorch 对每种设备维护的列表决定，随版本可能变化；打印实际 dtype 最可靠。</text></g></svg>
