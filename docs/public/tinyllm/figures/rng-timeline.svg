<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">全局随机数的取用顺序</title><desc id="desc">上：一口气训练时，第 119、120、121、122 步的 dropout 依次取全局随机数 r1、r2、r3、r4。下：从第 120 步的检查点恢复时，随机数状态恢复到该取 r3，但从 epoch 中间开始训练要先创建迭代器，DataLoader 取走了 r3，第 121 步的 dropout 只能取 r4，之后全部错开一位。给 DataLoader 自己的随机数生成器就能修好。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="370" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">恢复训练为什么差了一点：全局随机数多被取走了一次</text><text x="480" y="78" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">全局随机数是一串依次取用的数：r1 r2 r3 …，dropout 每步按顺序取</text><text x="150" y="124" font-size="14.5" fill="#2563eb" font-weight="bold" text-anchor="end">一口气训完</text><rect x="170" y="100" width="86" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="213.0" y="124" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="middle">step 119：r1</text><rect x="262" y="100" width="86" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="305.0" y="124" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="middle">step 120：r2</text><rect x="354" y="100" width="86" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="397.0" y="124" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="middle">step 121：r3</text><rect x="446" y="100" width="86" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="489.0" y="124" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="middle">step 122：r4</text><rect x="538" y="100" width="24" height="38" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="1.4"/><text x="550.0" y="124" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">…</text><text x="150" y="194" font-size="14.5" fill="#b45309" font-weight="bold" text-anchor="end">断电后恢复</text><rect x="170" y="170" width="114" height="38" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="227.0" y="194" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">读检查点</text><rect x="290" y="170" width="102" height="38" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="341.0" y="194" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">iter(loader)：r3</text><rect x="398" y="170" width="86" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="441.0" y="194" font-size="12.5" fill="#b45309" font-weight="normal" text-anchor="middle">step 121：r4</text><rect x="490" y="170" width="86" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="533.0" y="194" font-size="12.5" fill="#b45309" font-weight="normal" text-anchor="middle">step 122：r5</text><rect x="582" y="170" width="24" height="38" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="1.4"/><text x="594.0" y="194" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">…</text><text x="170" y="160" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">恢复了第 120 步之后的随机数状态，下一个该取的是 r3</text><text x="480" y="248" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">恢复后从 epoch 1 中间开始，先创建一次迭代器，DataLoader 顺手取走 r3 给 worker 当种子；</text><text x="480" y="272" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">从第 121 步起每一步的 dropout 掩码都错开一位，损失差在小数点后第 4 位，120 步后参数最大差 0.52</text><rect x="170" y="300" width="620" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/><text x="480" y="329" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">修法：DataLoader(..., generator=torch.Generator().manual_seed(种子))，它就不再碰全局随机数</text></g></svg>
