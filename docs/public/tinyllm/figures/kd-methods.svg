<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">三种训学生的办法</title><desc id="desc">第一行从头训：用真实的诗，每个位置的目标是真实的下一个字，只有一个 token 的概率为 1。第二行序列级蒸馏：用老师写的诗，目标同样只有一个字。第三行软标签蒸馏：用真实的诗，但每个位置的目标是老师给出的整个概率分布，学生用 KL 散度去拟合。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="440" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">三种训学生的办法：学的都是“下一个字”，标签从哪来不一样</text><rect x="30" y="74" width="150" height="86" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="105" y="124" font-size="16" fill="#64748b" font-weight="bold" text-anchor="middle">从头训</text><text x="210" y="100" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">数据：真实的诗</text><text x="210" y="126" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">每个位置只有一个正确答案（真实的下一个字）</text><rect x="690" y="90.0" width="22" height="60.0" fill="#64748b" rx="2"/><rect x="720" y="148" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="750" y="148" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="780" y="148" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="810" y="148" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="840" y="148" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="870" y="148" width="22" height="2" fill="#cbd5e1" rx="2"/><text x="790" y="168" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">这个位置的目标分布</text><rect x="30" y="186" width="150" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="105" y="236" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">序列级蒸馏</text><text x="210" y="212" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">数据：老师写的诗</text><text x="210" y="238" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">老师采样写出来，学生把它当成真实数据学</text><rect x="690" y="202.0" width="22" height="60.0" fill="#2563eb" rx="2"/><rect x="720" y="260" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="750" y="260" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="780" y="260" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="810" y="260" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="840" y="260" width="22" height="2" fill="#cbd5e1" rx="2"/><rect x="870" y="260" width="22" height="2" fill="#cbd5e1" rx="2"/><text x="790" y="280" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">这个位置的目标分布</text><rect x="30" y="298" width="150" height="86" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="105" y="348" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">软标签蒸馏</text><text x="210" y="324" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">数据：真实的诗</text><text x="210" y="350" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">每个位置给出老师的整个概率分布，学生去拟合它</text><rect x="690" y="348.8" width="22" height="25.2" fill="#b45309" rx="2"/><rect x="720" y="361.4" width="22" height="12.6" fill="#b45309" rx="2"/><rect x="750" y="366.2" width="22" height="7.800000000000001" fill="#b45309" rx="2"/><rect x="780" y="368.6" width="22" height="5.3999999999999995" fill="#b45309" rx="2"/><rect x="810" y="370.4" width="22" height="3.5999999999999996" fill="#b45309" rx="2"/><rect x="840" y="371.0" width="22" height="3.0" fill="#b45309" rx="2"/><rect x="870" y="371.6" width="22" height="2.4" fill="#b45309" rx="2"/><text x="790" y="392" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">这个位置的目标分布</text><text x="480" y="420" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">软标签告诉学生“哪些字也说得通、各有几分可能”，一个位置传过去的信息多得多；代价是训练时每一步都要跑一遍老师</text></g></svg>
