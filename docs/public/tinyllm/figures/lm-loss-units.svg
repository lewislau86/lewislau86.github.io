<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">验证损失的几种读法</title><desc id="desc">5.579 nats/token 除以 ln2 是 8.05 比特/token；取 e 的指数是困惑度 265，相当于在 265 个候选里均匀乱猜；乘以每字的 token 数再除以 ln2 是 7.68 比特/字。对照：均匀乱猜 4096 个 token 的损失是 8.318。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="430" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="38" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">一个数，四种读法：第 12 章基线的验证损失 5.579</text><rect x="340" y="70" width="280" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="480" y="102" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="middle">5.579 nats / token</text><text x="480" y="128" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">12,224 道题的 −ln p 取平均</text><path d="M480 146L160 214" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><rect x="40" y="218" width="240" height="96" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="160" y="252" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">8.05 比特 / token</text><text x="160" y="278" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">÷ ln 2：换成以 2 为底</text><text x="160" y="300" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">每个 token 平均要几个“是/否”问题</text><path d="M480 146L480 214" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="360" y="218" width="240" height="96" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="252" font-size="19" fill="#0f766e" font-weight="bold" text-anchor="middle">困惑度 265</text><text x="480" y="278" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">e^5.579</text><text x="480" y="300" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">像在 265 个候选里均匀乱猜</text><path d="M480 146L800 214" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><rect x="680" y="218" width="240" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="800" y="252" font-size="19" fill="#7c3aed" font-weight="bold" text-anchor="middle">7.68 比特 / 字</text><text x="800" y="278" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">× 每字 0.954 个 token，再 ÷ ln 2</text><text x="800" y="300" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">换了分词器也能比较</text><rect x="40" y="342" width="880" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="480" y="368" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">对照：均匀乱猜 4096 个 token 是 ln 4096 = 8.318 nats，困惑度 4096；完美预测是 0 nats，困惑度 1</text><text x="480" y="392" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">困惑度是“正确答案概率”的几何平均的倒数：几何平均 0.0038，算术平均却有 0.18</text></g></svg>
