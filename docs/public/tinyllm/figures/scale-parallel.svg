<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">数据并行、ZeRO-3/FSDP 与张量并行</title><desc id="desc">数据并行：每张卡放完整的模型，各算 batch 的一部分，反向后 all-reduce 梯度。ZeRO-3/FSDP：每张卡只放参数、梯度、优化器状态的一部分，每层用之前 all-gather 参数，反向后 reduce-scatter 梯度。张量并行：每个矩阵切开放在不同的卡上，所有卡处理同一个 batch，每个子层之后 all-reduce 激活。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="410" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">三种把训练分到多张卡上的方式（以 2 张卡为例）</text><text x="170" y="84" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle">数据并行</text><rect x="30" y="104" width="280" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170" y="128" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">卡 0</text><text x="170" y="154" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">完整的模型</text><text x="170" y="180" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">数据：batch 前一半</text><rect x="30" y="224" width="280" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170" y="248" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">卡 1</text><text x="170" y="274" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">完整的模型</text><text x="170" y="300" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">数据：batch 后一半</text><path d="M20 168 C -5 190, -5 230, 20 252" stroke="#b91c1c" stroke-width="2.4" fill="none" marker-end="url(#arrow-b91c1c)" marker-start="url(#arrow-b91c1c)"/><text x="170" y="360" font-size="13.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">反向后：all-reduce 梯度</text><text x="170" y="386" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">每张卡要放得下整个模型</text><text x="500" y="84" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle">ZeRO-3 / FSDP</text><rect x="360" y="104" width="280" height="96" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="500" y="128" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">卡 0</text><text x="500" y="154" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">参数、梯度、优化器的 1/2</text><text x="500" y="180" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">数据：batch 前一半</text><rect x="360" y="224" width="280" height="96" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="500" y="248" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">卡 1</text><text x="500" y="274" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">参数、梯度、优化器的 1/2</text><text x="500" y="300" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">数据：batch 后一半</text><path d="M350 168 C 325 190, 325 230, 350 252" stroke="#b91c1c" stroke-width="2.4" fill="none" marker-end="url(#arrow-b91c1c)" marker-start="url(#arrow-b91c1c)"/><text x="500" y="360" font-size="13.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">每层用前 all-gather 参数，反向后 reduce-scatter 梯度</text><text x="500" y="386" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">通信更多，换来显存除以卡数</text><text x="830" y="84" font-size="18" fill="#b45309" font-weight="bold" text-anchor="middle">张量并行</text><rect x="690" y="104" width="280" height="96" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="830" y="128" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">卡 0</text><text x="830" y="154" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">每个矩阵的一半</text><text x="830" y="180" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">数据：同一个 batch</text><rect x="690" y="224" width="280" height="96" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="830" y="248" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">卡 1</text><text x="830" y="274" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">每个矩阵的一半</text><text x="830" y="300" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">数据：同一个 batch</text><path d="M680 168 C 655 190, 655 230, 680 252" stroke="#b91c1c" stroke-width="2.4" fill="none" marker-end="url(#arrow-b91c1c)" marker-start="url(#arrow-b91c1c)"/><text x="830" y="360" font-size="13.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">每个子层后：all-reduce 激活</text><text x="830" y="386" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">通信频繁，适合同一台机器内</text></g></svg>
