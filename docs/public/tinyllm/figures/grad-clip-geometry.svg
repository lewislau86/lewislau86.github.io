<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">按全局范数裁剪与按值裁剪</title><desc id="desc">左：按全局范数裁剪，梯度向量整体缩短到阈值半径的圆上，方向不变。右：按值裁剪，每个分量被限制在正负阈值之内，大的分量被压扁，小的不变，裁剪后的方向偏离原梯度。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">同一个梯度，两种裁剪方式（二维示意）</text><text x="250" y="82" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">按全局范数裁剪：整体缩小，方向不变</text><line x1="80" y1="400" x2="400" y2="400" stroke="#cbd5e1" stroke-width="1.5"/><line x1="100" y1="420" x2="100" y2="120" stroke="#cbd5e1" stroke-width="1.5"/><path d="M220 400 A120 120 0 0 0 100 280" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5"/><text x="228" y="388" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="start">半径 = 阈值</text><path d="M100 400L340 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="346" y="214" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">原梯度</text><path d="M100 400L196.0 328.0" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow-2563eb)"/><text x="200.0" y="352.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start">裁剪后</text><text x="710" y="82" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">按值裁剪：逐个数截断，方向改变</text><line x1="540" y1="400" x2="860" y2="400" stroke="#cbd5e1" stroke-width="1.5"/><line x1="560" y1="420" x2="560" y2="120" stroke="#cbd5e1" stroke-width="1.5"/><rect x="560" y="328.0" width="72.0" height="72.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5"/><text x="640.0" y="332.0" font-size="13" fill="#b45309" font-weight="normal" text-anchor="start">每个数限制在 ±阈值</text><path d="M560 400L800 340" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="806" y="334" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">原梯度</text><path d="M560 400L632.0 340" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#arrow-b45309)"/><text x="636.0" y="364" font-size="14" fill="#b45309" font-weight="bold" text-anchor="start">裁剪后</text><text x="250" y="440" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">所有分量乘同一个系数 min(1, 阈值/‖g‖)</text><text x="710" y="440" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">大的分量被压扁，小的不动，方向偏向小分量</text></g></svg>
