<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">可以随时中断和恢复的训练循环</title><desc id="desc">最外面是 progress（step、epoch、batch_in_epoch）。每个 epoch 先 sampler.set_epoch(epoch, start)，跳过这个 epoch 已经用过的样本；每个 batch 依次 zero_grad、前向、backward、裁剪、optimizer.step、scheduler.step，然后推进 progress。每隔若干步取一次 .item() 打印日志、测一次验证损失、保存一次完整检查点（先写临时文件再替换）；到达 until 就返回，下次从 progress 接着来。一个 epoch 用完后 epoch 加一、batch_in_epoch 归零。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="620" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">可以随时中断、随时恢复的训练循环</text><rect x="60" y="70" width="880" height="54" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="500" y="94" font-size="16" fill="#7c3aed" font-weight="bold" text-anchor="middle">progress = {step, epoch, batch_in_epoch}</text><text x="500" y="115" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">新训练从 0 开始；恢复时从检查点读出来</text><path d="M500 124L500 146" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="60" y="148" width="880" height="452" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="80" y="174" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">while step &lt; until：每个 epoch</text><rect x="90" y="186" width="820" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="500" y="211" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>sampler.set_epoch(epoch, start=batch_in_epoch * BATCH)</text><rect x="90" y="238" width="820" height="304" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><text x="108" y="262" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">for x, y in loader：每个 batch</text><rect x="112" y="278" width="118" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="171.0" y="305" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>zero_grad</text><path d="M230 300L243 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="244" y="278" width="118" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="303.0" y="306" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle">前向</text><path d="M362 300L375 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="376" y="278" width="118" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="435.0" y="305" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>backward</text><path d="M494 300L507 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="508" y="278" width="118" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="567.0" y="306" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle">裁剪</text><path d="M626 300L639 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="640" y="278" width="118" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="699.0" y="305" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>optimizer.step</text><path d="M758 300L771 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="772" y="278" width="118" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="831.0" y="305" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>scheduler.step</text><text x="500" y="348" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">step += 1，batch_in_epoch += 1；损失先存成张量</text><rect x="120" y="372" width="760" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="136" y="396" font-size="14.5" fill="#64748b" font-weight="bold" text-anchor="start">每 log_every 步</text><text x="290" y="396" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">取一次 .item() 打印：GPU 上 .item() 会让 CPU 停下来等 GPU 算完</text><rect x="120" y="414" width="760" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="136" y="438" font-size="14.5" fill="#64748b" font-weight="bold" text-anchor="start">每 eval_every 步</text><text x="290" y="438" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">model.eval() 测验证损失，再切回 model.train()</text><rect x="120" y="456" width="760" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="136" y="480" font-size="14.5" fill="#b45309" font-weight="bold" text-anchor="start">每 save_every 步</text><text x="290" y="480" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">保存完整检查点：先写 .tmp，再 os.replace；只留最新几个</text><rect x="120" y="498" width="760" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="136" y="522" font-size="14.5" fill="#b91c1c" font-weight="bold" text-anchor="start">step == until</text><text x="290" y="522" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">返回；下一次从 progress 接着来</text><text x="500" y="572" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="middle">这个 epoch 的 batch 用完：epoch += 1，batch_in_epoch = 0</text></g></svg>
