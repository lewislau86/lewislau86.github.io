48b" font-weight="normal" text-anchor="middle">在</text><text x="660.0" y="102" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">学习</text><text x="522" y="141.0" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="end">我</text><rect x="530" y="110" width="49" height="49" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="554.5" y="140.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">1.00</text><rect x="582" y="110" width="49" height="49" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="606.5" y="140.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">0</text><rect x="634" y="110" width="49" height="49" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="658.5" y="140.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">0</text><text x="522" y="193.0" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="end">在</text><rect x="530" y="162" width="49" height="49" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="554.5" y="192.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">0.33</text><rect x="582" y="162" width="49" height="49" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="606.5" y="192.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">0.67</text><rect x="634" y="162" width="49" height="49" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="658.5" y="192.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">0</text><text x="522" y="245.0" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="end">学习</text><rect x="530" y="214" width="49" height="49" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/><text x="554.5" y="244.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">0.25</text><rect x="582" y="214" width="49" height="49" rx="5" fi