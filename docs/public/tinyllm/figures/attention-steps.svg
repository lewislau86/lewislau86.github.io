rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="794.5" y="244.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">1.76</text><rect x="822" y="214" width="49" height="49" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="846.5" y="244.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">2.01</text><text x="480" y="300" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">每一行是一个位置：它给自己和前面每个位置打分，归一化成权重，再按权重把各位置的 V 加起来。</text><text x="480" y="326" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">“学习”这一行：分数 0.71、0.71、1.41 → 权重 0.25、0.25、0.50 → 输出 0.25·v0 + 0.25·v1 + 0.50·v2。</text><text x="480" y="352" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">“我”这一行只看得见自己，权重是 1，输出就是它自己的 V。</text></g></svg>
