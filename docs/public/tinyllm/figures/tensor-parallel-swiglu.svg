<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc">
<title id="title">SwiGLU 的张量并行切分</title><desc id="desc">两张卡各有一份完整的输入 x。gate 和 up 的权重按列切成两半，每张卡算出中间宽度的一半，SiLU 门控在本卡内完成；down 的权重按行切成两半，每张卡算出一份部分和，最后用一次 all-reduce 把两份部分和相加，得到完整输出。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="545" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">张量并行：一个 SwiGLU 前馈层切到 2 张卡上</text><rect x="60" y="66" width="410" height="330" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="265" y="90" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">GPU 0</text><rect x="165" y="104" width="200" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="265.0" y="123.0" font-size="13" fill="#64748b" font-weight="bold" text-anchor="middle">输入 x（每张卡一份完整的）</text><text x="265.0" y="141.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, d]</text><rect x="80" y="176" width="170" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="165.0" y="197.0" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">gate 的第 0 半列</text><text x="165.0" y="215.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[d, h/2]</text><rect x="280" y="176" width="170" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="365.0" y="197.0" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">up 的第 0 半列</text><text x="365.0" y="215.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[d, h/2]</text><path d="M265 148 V162 H165 V174" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M265 162 H365 V174" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="165" y="250" width="200" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="265.0" y="269.0" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">SiLU(gate)·up</text><text x="265.0" y="287.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">[T, h/2]：只在本卡算</text><path d="M165 224 V236 H265 V248" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M365 224 V236 H265" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="165" y="322" width="200" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="265.0" y="343.0" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">down 的第 0 半行</text><text x="265.0" y="361.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">[h/2, d] → 部分和 [T, d]</text><path d="M265 294L265 318" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="530" y="66" width="410" height="330" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text x="735" y="90" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">GPU 1</text><rect x="635" y="104" width="200" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="735.0" y="123.0" font-size="13" fill="#64748b" font-weight="bold" text-anchor="middle">输入 x（每张卡一份完整的）</text><text x="735.0" y="141.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[T, d]</text><rect x="550" y="176" width="170" height="48" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="635.0" y="197.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">gate 的第 1 半列</text><text x="635.0" y="215.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[d, h/2]</text><rect x="750" y="176" width="170" height="48" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="835.0" y="197.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">up 的第 1 半列</text><text x="835.0" y="215.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[d, h/2]</text><path d="M735 148 V162 H635 V174" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M735 162 H835 V174" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="635" y="250" width="200" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="735.0" y="269.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">SiLU(gate)·up</text><text x="735.0" y="287.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">[T, h/2]：只在本卡算</text><path d="M635 224 V236 H735 V248" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><path d="M835 224 V236 H735" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="635" y="322" width="200" height="48" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="735.0" y="343.0" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="middle">down 的第 1 半行</text><text x="735.0" y="361.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">[h/2, d] → 部分和 [T, d]</text><path d="M735 294L735 318" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="330" y="420" width="340" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="500" y="442" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">all-reduce：两张卡的部分和相加</text><text x="500" y="461" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>y = y0 + y1   [T, d]</text><path d="M265 370 V444 H326" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#arrow-b91c1c)"/><path d="M735 370 V444 H674" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#arrow-b91c1c)"/><text x="500" y="500" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">gate、up 按列切，down 按行切：中间的门控完全在各卡内部算完，前向只在最后通信一次</text><text x="500" y="524" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">每张卡只存一半的前馈层参数；代价是每层都要一次和激活一样大的通信，所以只在同一台机器的几张卡之间做</text></g></svg>
