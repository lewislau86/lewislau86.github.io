<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">数据流与评估口径</title><desc id="desc">训练集和验证集各自拼成一条长 token 流，每首诗后接一个 &lt;eos&gt;。训练时用单独的随机数生成器事先排好每步 32 个起点，各切 65 个 token，前 64 个是输入、后 64 个是目标。验证时把整条验证流切成 191 个不重叠的 64-token 窗口，全部算一遍取平均，再换算成比特/字。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="1000" height="510" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="500" y="36" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">数据流与评估口径：每个模型吃同一批数据，验证集每次算法相同</text><text x="40" y="86" font-size="14.5" fill="#2563eb" font-weight="bold" text-anchor="start">训练流</text><text x="40" y="106" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">225,007 个 token</text><rect x="200" y="70" width="77" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="238.5" y="92" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">诗1</text><rect x="277" y="70" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="288" y="92" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="299" y="70" width="55" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="326.5" y="92" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">诗2</text><rect x="354" y="70" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="365" y="92" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="376" y="70" width="99" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="425.5" y="92" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">诗3</text><rect x="475" y="70" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="486" y="92" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="497" y="70" width="66" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="530.0" y="92" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">诗4</text><rect x="563" y="70" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="574" y="92" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="585" y="70" width="88" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="629.0" y="92" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">诗5</text><rect x="673" y="70" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="684" y="92" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="695" y="70" width="44" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="717.0" y="92" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">诗6</text><rect x="739" y="70" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="750" y="92" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="761" y="70" width="77" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="799.5" y="92" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">诗7</text><rect x="838" y="70" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="849" y="92" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><text x="960" y="62" font-size="12.5" fill="#b45309" font-weight="normal" text-anchor="end">e = &lt;eos&gt;</text><text x="500" y="140" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">每一步：用一个单独的随机数生成器（种子 1234）事先排好 32 个起点</text><line x1="230" y1="104" x2="230" y2="156" stroke="#b91c1c" stroke-width="2"/><rect x="230" y="158" width="260" height="30" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.4"/><text x="350" y="178" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">65 个 token 的窗口</text><line x1="420" y1="104" x2="420" y2="156" stroke="#b91c1c" stroke-width="2"/><rect x="420" y="158" width="260" height="30" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.4"/><text x="540" y="178" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">65 个 token 的窗口</text><line x1="610" y1="104" x2="610" y2="156" stroke="#b91c1c" stroke-width="2"/><rect x="610" y="158" width="240" height="30" rx="10" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.4"/><text x="730" y="178" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">65 个 token 的窗口</text><text x="500" y="214" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">窗口内：输入 x = 前 64 个，目标 y = 后 64 个（往后错一位）</text><rect x="230" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="244" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t0</text><rect x="260" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="274" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t1</text><rect x="290" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="304" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t2</text><rect x="320" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="334" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t3</text><rect x="350" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="364" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t4</text><rect x="380" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="394" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t5</text><rect x="410" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="424" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t6</text><rect x="440" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="454" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t7</text><rect x="470" y="228" width="28" height="26" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="484" y="246" font-size="10.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t8</text><text x="220" y="246" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="end">窗口</text><rect x="230" y="260" width="238" height="24" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="350" y="277" font-size="12.5" fill="#2563eb" font-weight="normal" text-anchor="middle">x：t0 … t63</text><rect x="260" y="290" width="238" height="24" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="380" y="307" font-size="12.5" fill="#0f766e" font-weight="normal" text-anchor="middle">y：t1 … t64</text><text x="560" y="268" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">→ 模型的种子只决定初始参数，</text><text x="560" y="290" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">  换结构、换超参数时 batch 完全相同</text><text x="40" y="366" font-size="14.5" fill="#7c3aed" font-weight="bold" text-anchor="start">验证流</text><text x="40" y="386" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">12,256 个 token</text><rect x="200" y="350" width="77" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="238.5" y="372" font-size="11.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">诗1</text><rect x="277" y="350" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="288" y="372" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="299" y="350" width="55" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="326.5" y="372" font-size="11.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">诗2</text><rect x="354" y="350" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="365" y="372" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="376" y="350" width="99" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="425.5" y="372" font-size="11.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">诗3</text><rect x="475" y="350" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="486" y="372" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="497" y="350" width="66" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="530.0" y="372" font-size="11.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">诗4</text><rect x="563" y="350" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="574" y="372" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="585" y="350" width="88" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="629.0" y="372" font-size="11.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">诗5</text><rect x="673" y="350" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="684" y="372" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="695" y="350" width="44" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="717.0" y="372" font-size="11.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">诗6</text><rect x="739" y="350" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="750" y="372" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="761" y="350" width="77" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="799.5" y="372" font-size="11.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">诗7</text><rect x="838" y="350" width="22" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="849" y="372" font-size="11" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>e</text><rect x="200" y="398" width="156" height="28" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="278" y="417" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle">窗口 1：64 个</text><rect x="360" y="398" width="156" height="28" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="438" y="417" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle">窗口 2：64 个</text><rect x="520" y="398" width="156" height="28" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="598" y="417" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle">窗口 3：64 个</text><rect x="680" y="398" width="156" height="28" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="758" y="417" font-size="12" fill="#7c3aed" font-weight="normal" text-anchor="middle">窗口 4：64 个</text><text x="850" y="417" font-size="12.5" fill="#7c3aed" font-weight="normal" text-anchor="start">…… 共 191 个</text><text x="500" y="460" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">不重叠、不抽样、全部算一遍取平均：同一个模型每次得到同一个数</text><text x="500" y="486" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">nats/token × 每字 0.954 个 token ÷ ln 2 = 比特/字（换分词器也能比）</text></g></svg>
