<svg xmlns="http://www.w3.org/2000/svg" width="960" height="504" viewBox="0 0 960 504" role="img" aria-labelledby="title desc">
<title id="title">第 1 章模型的形状流</title><desc id="desc">一个 batch 是 32 段、每段 24 个字的编号，查字表和位置表后变成 [32, 24, 96]，穿过 3 个 Block 形状不变，最后归一化并乘字表的转置得到 [32, 24, 556] 的分数。训练时这些分数和往后错一位的目标算交叉熵，backward 给 388,128 个参数算梯度，AdamW 更新参数；生成时只取最后一个位置的分数抽一个字。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="504" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">第 1 章的模型：一个 batch 穿过一次前向</text><rect x="90" y="66" width="340" height="52" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="260.0" y="89.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">一批训练样本：每格是一个字的编号</text><text x="260.0" y="107.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[32, 24]</text><path d="M260.0 118L260.0 136" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="90" y="138" width="340" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="260.0" y="161.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">查表：字向量 + 位置向量</text><text x="260.0" y="179.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[32, 24, 96]</text><path d="M260.0 190L260.0 208" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="90" y="210" width="340" height="52" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="260.0" y="233.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">Block 1：注意力 + 前馈层</text><text x="260.0" y="251.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[32, 24, 96]</text><path d="M260.0 262L260.0 280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="90" y="282" width="340" height="52" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="260.0" y="305.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">Block 2</text><text x="260.0" y="323.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[32, 24, 96]</text><path d="M260.0 334L260.0 352" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="90" y="354" width="340" height="52" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="260.0" y="377.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">Block 3</text><text x="260.0" y="395.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[32, 24, 96]</text><path d="M260.0 406L260.0 424" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="90" y="426" width="340" height="52" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="260.0" y="449.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">RMSNorm，再乘字表的转置</text><text x="260.0" y="467.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[32, 24, 556]</text><rect x="78" y="200" width="364" height="216" rx="12" fill="none" stroke="#0f766e" stroke-dasharray="6 4" stroke-width="1.5"/><text x="454" y="312" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="start">形状不变</text><text x="454" y="160" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="start">字表 556×96</text><text x="454" y="178" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="start">位置表 24×96</text><text x="454" y="448" font-size="13" fill="#b45309" font-weight="normal" text-anchor="start">每个位置给 556 个字</text><text x="454" y="466" font-size="13" fill="#b45309" font-weight="normal" text-anchor="start">各打一个分</text><path d="M90 164 H60 V452 H86" stroke="#b45309" stroke-width="1.8" fill="none" marker-end="url(#arrow-b45309)" stroke-dasharray="7 5"/><text x="54" y="342.0" font-size="12" fill="#b45309" font-weight="normal" text-anchor="end">同一张字表</text><text x="780" y="96" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="middle">训练时</text><rect x="630" y="112" width="300" height="52" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="780.0" y="135.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">目标：同一段往后错一位</text><text x="780.0" y="153.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[32, 24]</text><rect x="630" y="196" width="300" height="52" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="780.0" y="219.0" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">交叉熵损失</text><text x="780.0" y="237.0" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="middle">一个数</text><path d="M780 164L780 192" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M430 452 H590 V222 H626" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)"/><text x="780" y="284" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">backward 给 388,128 个参数各算一个梯度，</text><text x="780" y="306" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">AdamW 把每个参数挪一小步，重复 600 次</text><text x="780" y="366" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">生成时</text><text x="780" y="392" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">只取最后一个位置的 556 个分数，</text><text x="780" y="414" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="middle">抽一个字接到末尾，再走一遍左边这一列</text></g></svg>
