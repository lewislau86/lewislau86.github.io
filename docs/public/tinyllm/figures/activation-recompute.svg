<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">激活重计算</title><desc id="desc">上：普通训练时，每个 Block 内部的中间结果都要存着等反向用。下：激活重计算只存每个 Block 的输入，内部的中间结果算完就扔，反向传播到这个 Block 时从输入把前向重算一遍。第 24 章的实验里，激活显存省下九成多，梯度逐位相同，每步慢约三成。</desc>
