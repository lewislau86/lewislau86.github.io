<svg xmlns="http://www.w3.org/2000/svg" width="960" height="362" viewBox="0 0 960 362" role="img" aria-labelledby="title desc">
<title id="title">RLHF 的三步</title><desc id="desc">第一步 SFT；第二步用同一条指令的两个回答和人的二选一，按 Bradley–Terry 损失训练奖励模型；第三步 PPO：策略采样回答，奖励模型打分，每个 token 再减去 β 乘以和 SFT 的 KL。PPO 同时用到策略、参考、奖励模型、价值模型四个模型；价值模型估计每个位置之后还能拿多少奖励。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="362" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">RLHF 的三步：先 SFT，再从二选一学一个打分器，最后用强化学习对着打分器优化</text><rect x="30" y="70" width="280" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170" y="100" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">① SFT</text><text x="170" y="128" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">第 38 章</text><text x="170" y="152" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">指令—回答，交叉熵</text><path d="M312 120L338 120" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="340" y="70" width="280" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="100" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">② 奖励模型</text><text x="480" y="128" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">偏好对：同一条指令的两个回答</text><text x="480" y="152" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">Bradley–Terry：选中的分比落选的高</text><path d="M622 120L648 120" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="650" y="70" width="280" height="100" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="790" y="100" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">③ PPO</text><text x="790" y="128" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">策略采样 → 打分 → 更新</text><text x="790" y="152" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">奖励 = 奖励模型的分 − β·KL</text><text x="480" y="210" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">PPO 这一步同时用到四个模型</text><rect x="30" y="230" width="210" height="74" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="135" y="258" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">策略</text><text x="135" y="282" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">从 SFT 复制，要训练</text><rect x="262" y="230" width="210" height="74" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="367" y="258" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">参考</text><text x="367" y="282" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">SFT 本身，冻住；算 KL</text><rect x="494" y="230" width="210" height="74" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="599" y="258" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">奖励模型</text><text x="599" y="282" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">冻住；给整个回答打分</text><rect x="726" y="230" width="210" height="74" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="831" y="258" font-size="15" fill="#7c3aed" font-weight="bold" text-anchor="middle">价值模型</text><text x="831" y="282" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">从奖励模型复制，要训练</text><text x="480" y="340" font-size="13.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">KL 是一根绳子：策略离 SFT 越远，罚得越多。没有它，策略会找到奖励模型的漏洞，分数一路涨，回答越来越不像话</text></g></svg>
