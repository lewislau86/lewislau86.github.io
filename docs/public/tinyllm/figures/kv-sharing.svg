<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">前缀共享与写时复制</title><desc id="desc">示意。左：两个请求开头是同一段 24 个 token 的系统提示词，正好 3 个写满的块，每块的键是前一块的键加这一块 token 的哈希；两张块表的前 3 项指向同样的物理块，引用计数 2，只算一次、只存一份。右：37 个 token 的提示词 prefill 一次后 fork 出 4 条采样，4 个写满的块一直共用；第 5 块只写了 5 格，每条都要往里写，前 3 条写时引用计数大于 1，先复制一块再写，第 4 条写时引用计数已经是 1，直接写。共复制 3 次，块数峰值 16，各自 prefill 要 28 块。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="350" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">共享块：引用计数决定能不能直接写</text><text x="240" y="74" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">① 前缀共享：同一段系统提示词</text><rect x="40" y="92" width="210" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="145" y="112" font-size="12" fill="#172033" font-weight="normal" text-anchor="middle">k1 = hash(·, 第 0～7 个)</text><path d="M252 107L296 107" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="300" y="92" width="90" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="345" y="112" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">块 #3  引用 2</text><rect x="40" y="132" width="210" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="145" y="152" font-size="12" fill="#172033" font-weight="normal" text-anchor="middle">k2 = hash(k1, 第 8～15 个)</text><path d="M252 147L296 147" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="300" y="132" width="90" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="345" y="152" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">块 #8  引用 2</text><rect x="40" y="172" width="210" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="145" y="192" font-size="12" fill="#172033" font-weight="normal" text-anchor="middle">k3 = hash(k2, 第 16～23 个)</text><path d="M252 187L296 187" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="300" y="172" width="90" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="345" y="192" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">块 #5  引用 2</text><text x="240" y="228" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">请求 A 的块表：[3, 8, 5, 11]</text><text x="240" y="250" font-size="13" fill="#172033" font-weight="normal" text-anchor="middle">请求 B 的块表：[3, 8, 5, 14]</text><text x="240" y="278" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">前 3 块只算一次、只存一份；各自的第 4 块不同</text><text x="240" y="300" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">键链着前一块的键：同一个键 = 同一段完整前缀</text><text x="240" y="322" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">没写满的块不登记，也不会被别人命中</text><line x1="480" y1="64" x2="480" y2="340" stroke="#cbd5e1" stroke-width="1.5"/><text x="720" y="74" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">② fork 4 条采样：37 个 token 的提示词</text><rect x="520" y="92" width="58" height="30" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="549" y="112" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle">引用 4</text><rect x="586" y="92" width="58" height="30" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="615" y="112" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle">引用 4</text><rect x="652" y="92" width="58" height="30" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="681" y="112" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle">引用 4</text><rect x="718" y="92" width="58" height="30" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="747" y="112" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle">引用 4</text><rect x="788" y="92" width="150" height="30" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><text x="863" y="112" font-size="11.5" fill="#b91c1c" font-weight="bold" text-anchor="middle">只写了 5/8 格 · 引用 4</text><text x="647" y="142" font-size="12.5" fill="#b45309" font-weight="normal" text-anchor="middle">前 4 块写满：只读，4 条一直共用</text><text x="863" y="142" font-size="12.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">第 5 块：4 条都要往里写</text><text x="530" y="184" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">第 1 条要写第 38 个 token</text><rect x="712" y="168" width="230" height="26" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="827" y="186" font-size="12" fill="#b91c1c" font-weight="bold" text-anchor="middle">引用 4 &gt; 1 → 复制一块再写</text><text x="530" y="218" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">第 2 条</text><rect x="712" y="202" width="230" height="26" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="827" y="220" font-size="12" fill="#b91c1c" font-weight="bold" text-anchor="middle">引用 3 &gt; 1 → 复制</text><text x="530" y="252" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">第 3 条</text><rect x="712" y="236" width="230" height="26" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="827" y="254" font-size="12" fill="#b91c1c" font-weight="bold" text-anchor="middle">引用 2 &gt; 1 → 复制</text><text x="530" y="286" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">第 4 条</text><rect x="712" y="270" width="230" height="26" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/><text x="827" y="288" font-size="12" fill="#0f766e" font-weight="bold" text-anchor="middle">引用 1 → 原块直接写</text><text x="720" y="322" font-size="13.5" fill="#0f766e" font-weight="bold" text-anchor="middle">写时复制 3 次；块数峰值 16，各自 prefill 要 28</text></g></svg>
