<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="title desc">
<title id="title">从 Transformer 翻译模型到 GPT</title><desc id="desc">左：2017 年的 Transformer 用编码器读完整句英文 the book on the table，解码器逐词生成“桌子上的书”，每生成一个词都通过交叉注意力回头看原文的任意位置，因此词序不同也能对上。右：GPT 去掉编码器，只保留只能看前文的解码器，在连续文本上预测下一个 token。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="515" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">从翻译模型到 GPT：去掉编码器，只留下“预测下一个 token”</text><rect x="25" y="65" width="450" height="395" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><text x="250" y="92" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">2017 · Transformer：为机器翻译设计</text><text x="250" y="122" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">编码器：一次读完整句原文</text><rect x="48" y="132" width="74" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="85" y="158" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>the</text><rect x="132" y="132" width="74" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="169" y="158" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>book</text><rect x="216" y="132" width="74" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="253" y="158" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>on</text><rect x="300" y="132" width="74" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="337" y="158" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>the</text><rect x="384" y="132" width="74" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="421" y="158" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>table</text><path d="M421 174 C421 230 95 230 95 282" stroke="#b45309" stroke-width="2" fill="none" stroke-opacity="0.8"/><path d="M253 174 C253 230 195 230 195 282" stroke="#b45309" stroke-width="2" fill="none" stroke-opacity="0.8"/><path d="M169 174 C169 230 395 230 395 282" stroke="#b45309" stroke-width="2" fill="none" stroke-opacity="0.8"/><rect x="58" y="284" width="74" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="95" y="310" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">桌子</text><rect x="158" y="284" width="74" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="195" y="310" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">上</text><rect x="258" y="284" width="74" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="295" y="310" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">的</text><rect x="358" y="284" width="74" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="395" y="310" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">书</text><text x="250" y="348" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">解码器：一个词一个词地生成译文</text><text x="250" y="370" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">橙线 = 交叉注意力：生成每个译词时回头看原文任意位置</text><text x="250" y="398" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">位置编码告诉模型每个词排在第几；注意力让它</text><text x="250" y="418" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">不必按原文顺序对齐，“书”可以去看 book</text><text x="250" y="440" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">训练数据：成对的“原文 → 译文”</text><rect x="500" y="65" width="435" height="395" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="717" y="92" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">2018 起 · GPT：只保留解码器</text><rect x="540" y="135" width="70" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="575" y="161" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">床</text><rect x="622" y="135" width="70" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="657" y="161" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">前</text><rect x="704" y="135" width="70" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="739" y="161" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">明</text><rect x="786" y="135" width="70" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="821" y="161" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">月</text><rect x="540" y="195" width="312" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="696" y="225" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">N 层解码器 Block</text><text x="696" y="249" font-size="13.5" fill="#0f766e" font-weight="normal" text-anchor="middle">只能看自己和前面的字</text><path d="M575 177L575 192" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M657 177L657 192" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M739 177L739 192" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M821 177L821 192" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M696 267L696 292" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="626" y="296" width="140" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="696" y="324" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">下一个：光</text><text x="717" y="370" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">没有原文、没有译文，只有一段段连续文本；</text><text x="717" y="393" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">每个位置都在猜下一个 token</text><text x="717" y="440" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">训练数据：任何文字都能用，越多越好</text><text x="480" y="492" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">这门课的 TinyLLM 就是右边这种结构：Decoder-only，目标只有一个，预测下一个 token。</text></g></svg>
