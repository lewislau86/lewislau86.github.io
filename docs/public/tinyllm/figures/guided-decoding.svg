<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="title desc">
<title id="title">约束解码如何把不合法的 token 排除掉</title><desc id="desc">左：模型对整张 2048 个 token 的词表给出打分。中：五言模板只允许 1310 个单字 token；句末位置只允许两个标点。其余位置被打分 −∞，softmax 后概率为 0。右：同一批请求，加掩码的 12 首全部符合四句五言，不加掩码的一首都不符合。掩码保证格式，不保证内容。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="486" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">约束解码的一步：把不合法的 token 打分设成 −∞，再归一化、抽样</text><text x="170" y="78" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">词表 2048 个 token 的打分</text><rect x="50" y="92" width="240" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="62" y="104" width="216" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170" y="185.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">单字 token（1310 个）</text><rect x="62" y="266" width="216" height="26" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="170" y="285.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">标点（2 个）</text><rect x="62" y="304" width="216" height="70" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="170" y="345.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">字节碎片与特殊 token</text><text x="170" y="412" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">softmax 之后</text><text x="480" y="78" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">这一步允许的集合</text><rect x="370" y="92" width="220" height="300" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/><rect x="382" y="104" width="196" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="480" y="172" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">五言模板：单字</text><text x="480" y="196" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">第 7 个字符</text><rect x="382" y="266" width="196" height="114" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="480" y="316" font-size="22" fill="#b91c1c" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>-inf</text><text x="480" y="344" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">句末位置换成标点集合</text><path d="M346 242L366 242" stroke="#b91c1c" stroke-width="3" fill="none" marker-end="url(#arrow-b91c1c)"/><text x="356" y="228" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">掩码</text><text x="790" y="78" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">抽样结果</text><rect x="690" y="92" width="200" height="138" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="790" y="126" font-size="20" fill="#0f766e" font-weight="bold" text-anchor="middle">之 看 结 庐 乌 ，</text><text x="790" y="158" font-size="20" fill="#0f766e" font-weight="bold" text-anchor="middle">才 子 各 相 关 ，</text><text x="790" y="190" font-size="20" fill="#0f766e" font-weight="bold" text-anchor="middle">龙 儿 好 复 深 。</text><text x="790" y="214" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">格式 12/12 合法</text><rect x="690" y="244" width="200" height="126" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="790" y="276" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">不加掩码时</text><text x="790" y="304" font-size="19" fill="#172033" font-weight="normal" text-anchor="middle">之 看 结 庐 阜 。</text><text x="790" y="334" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">格式 0/12 合法</text><path d="M594 200L686 160" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M594 320L686 300" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><text x="480" y="436" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">掩码只保证格式合法，不改变模型对内容的判断：右边两首都不通顺，但下面那首连句数、字数都不对。</text><text x="480" y="462" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">每步的代价是一次 2048 维赋值；把它写进有限状态机或文法，就能约束 JSON、正则这类更复杂的格式。</text></g></svg>
