<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="title desc">
<title id="title">矩阵乘法的反向传播</title><desc id="desc">前向 y = x @ W；反向已知 g = ∂L/∂y，直接算 dL/dW = xᵀg 和 dL/dx = gWᵀ，两次矩阵乘法的计算量与前向同一量级。若先构造完整雅可比矩阵 dy/dW，在 d_in = d_out = 4096 时就有约 687 亿个数，FP32 下约 275 GB。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="475" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">反向传播不构造雅可比矩阵，只做和前向同样大小的矩阵乘法</text><rect x="30" y="75" width="430" height="175" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="103" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle">前向：y = x @ W</text><text x="245" y="140" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>x [T, d_in]  @  W [d_in, d_out]</text><text x="245" y="170" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">→  y [T, d_out]  →  ...  →  L（一个数）</text><text x="245" y="215" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">计算量：T × d_in × d_out 次乘加</text><rect x="500" y="75" width="430" height="175" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="715" y="103" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">反向：已知 g = dL/dy  [T, d_out]</text><text x="715" y="140" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>dL/dW = x^T @ g   [d_in, d_out]</text><text x="715" y="170" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>dL/dx = g @ W^T   [T, d_in]</text><text x="715" y="215" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">两次矩阵乘法，计算量和前向同一量级</text><path d="M462 160 H496" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="30" y="280" width="900" height="130" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="480" y="310" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">如果先把完整的雅可比矩阵 dy/dW 算出来，再乘 g，会怎样？</text><text x="480" y="345" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>dy/dW: [T*d_out, d_in*d_out]</text><text x="480" y="380" font-size="15.5" fill="#172033" font-weight="normal" text-anchor="middle">取 T = 1、d_in = d_out = 4096（7B 级模型里一个投影矩阵的大小）：约 687 亿个数，FP32 下约 275 GB</text><text x="480" y="450" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">PyTorch 的每个算子都直接实现“g 乘雅可比”这一步（向量-雅可比积，VJP），所以从来不需要把雅可比矩阵存下来。</text></g></svg>
