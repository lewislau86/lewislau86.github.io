<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">LoRA 的结构</title><desc id="desc">输入 x 同时经过冻住的原权重 W 和一条低秩支路：先乘 A（r×in，随机初始化），再乘 B（out×r，初始化为 0），乘 α/r 后和 W 的输出相加。可训练参数从 in·out 变成 r·(in+out)。训练完把 (α/r)·B·A 加回 W，支路消失，推理和原模型一样。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="440" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">LoRA：原权重冻住，旁边加一条低秩支路，训练完再合并回去</text><rect x="60" y="150" width="70" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="95" y="181" font-size="18" fill="#172033" font-weight="normal" text-anchor="middle">x</text><rect x="230" y="90" width="220" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="340" y="118" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">W（out × in）</text><text x="340" y="142" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">冻住，不更新</text><rect x="210" y="200" width="110" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="265" y="226" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">A（r × in）</text><text x="265" y="247" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">随机初始化</text><rect x="350" y="200" width="110" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="405" y="226" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">B（out × r）</text><text x="405" y="247" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">初始化为 0</text><path d="M132 168L226 128" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M132 182L206 228" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><path d="M322 230L346 230" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><circle cx="540" cy="175" r="22" fill="#ffffff" stroke="#172033" stroke-width="2.5"/><text x="540" y="182" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M452 125L520 162" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M462 230L520 190" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><text x="500" y="245" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">× α/r</text><path d="M564 175L620 175" stroke="#172033" stroke-width="2.5" fill="none" marker-end="url(#arrow-172033)"/><text x="640" y="181" font-size="16" fill="#172033" font-weight="normal" text-anchor="start">输出</text><text x="60" y="320" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">可训练参数：r·(in + out)，原来是 in·out。r 远小于 in、out 时，梯度和 AdamW 状态都只剩一小部分</text><text x="60" y="348" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">B 从 0 开始，刚加上时模型和原来完全一样；训练只改 A、B</text><rect x="60" y="372" width="840" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="403" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">合并：W′ = W + (α/r)·B·A，支路消失，推理时的结构、参数量、速度都和原模型一样</text></g></svg>
