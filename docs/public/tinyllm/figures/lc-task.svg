<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
<title id="title">长上下文的检索任务</title><desc id="desc">一行普通的唐诗文本中，某个位置被换成字母 k，倒数第二个位置换成 &lt;bos&gt;，模型要在 &lt;bos&gt; 后面预测出 k。字母和 &lt;bos&gt; 之间隔 d 个位置。字母从 16 个唐诗里不出现的字母中选；基线训练时距离不超过 60，测试时 d 取到 240。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="310" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="34" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">检索任务：模型能不能找回 d 个位置以前的那个字母</text><rect x="40" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="62" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">春</text><rect x="92" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="114" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">风</text><rect x="144" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="166" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">又</text><rect x="196" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="218" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">绿</text><rect x="248" y="80" width="44" height="40" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="270" y="106" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">k</text><rect x="300" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="322" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">江</text><rect x="352" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="374" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">南</text><rect x="404" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="426" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">岸</text><rect x="456" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="478" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">…</text><rect x="508" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="530" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">明</text><rect x="560" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="582" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">月</text><rect x="612" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="634" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">何</text><rect x="664" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="686" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">时</text><rect x="716" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="738" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">照</text><rect x="768" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="790" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">我</text><rect x="820" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="842" y="106" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">还</text><rect x="868" y="80" width="52" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="894" y="106" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">&lt;bos&gt;</text><rect x="924" y="80" width="44" height="40" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="946" y="106" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">k ?</text><path d="M894 130 C894 190 270 190 270 130" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="582.0" y="198" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">注意力要跨过 d 个位置，找到这个字母并抄过来</text><text x="40" y="240" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 字母是 a～p 之一，唐诗语料里从来不出现；猜对的概率靠蒙只有 1/16</text><text x="40" y="266" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 基线训练时，四分之一的行里有字母和若干处 &lt;bos&gt; 查询，距离不超过 60（都在 64 个位置以内）</text><text x="40" y="292" font-size="13.5" fill="#172033" font-weight="normal" text-anchor="start">· 测试时把 d 取 16、48、112、176、240：后三个都超过了训练长度 64</text></g></svg>
