<svg xmlns="http://www.w3.org/2000/svg" width="960" height="485" viewBox="0 0 960 485" role="img" aria-labelledby="title desc">
<title id="title">大模型架构的三代演进</title><desc id="desc">第一代（2017）：为翻译设计的编码器-解码器 Transformer，用注意力取代循环网络、用位置编码标出词序，需要成对数据。第二代（2018～2023）：只有解码器，预测下一个 token；GPT-1 去掉编码器，GPT-2 把归一化挪到子层前，GPT-3 扩大到 1750 亿参数，2021 年出现 RoPE，2023 年 LLaMA 与 Llama 2 采用 RMSNorm、SwiGLU、RoPE 和 GQA。第三代（2024～2026）：稀疏加混合注意力；DeepSeek-V2/V3 用 MLA 压缩 KV 并采用细粒度 MoE，Qwen3-Next 与 Kimi Linear 把线性注意力和完整注意力按 3:1 混合，Kimi K3 有 2.8 万亿参数、896 个专家每次选 16 个、100 万 token 上下文。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="485" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="38" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">三代架构：目标没变，零件一直在换</text><rect x="20" y="62" width="250" height="370" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="145.0" y="90" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">第一代 · 2017</text><text x="145.0" y="114" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">编码器-解码器</text><text x="145.0" y="140" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">为翻译设计：读原文，写译文</text><text x="36" y="176" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="start">2017</text><text x="78" y="176" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">Transformer</text><text x="78" y="196" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">注意力取代循环网络</text><text x="78" y="222" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">位置编码标出词序</text><text x="78" y="248" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">需要“原文 → 译文”成对数据</text><rect x="285" y="62" width="330" height="370" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="450.0" y="90" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">第二代 · 2018～2023</text><text x="450.0" y="114" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">只有解码器（稠密）</text><text x="450.0" y="140" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">任何文本都能学：预测下一个 token</text><text x="301" y="176" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="start">2018</text><text x="343" y="176" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">GPT-1</text><text x="343" y="196" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">去掉编码器</text><text x="301" y="222" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="start">2019</text><text x="343" y="222" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">GPT-2</text><text x="343" y="242" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">归一化挪到子层前（Pre-Norm）</text><text x="301" y="268" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="start">2020</text><text x="343" y="268" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">GPT-3</text><text x="343" y="288" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">1750 亿参数，看几个例子就会做新任务</text><text x="301" y="314" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="start">2021</text><text x="343" y="314" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">RoPE</text><text x="343" y="334" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">旋转位置编码</text><text x="301" y="360" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="start">2023</text><text x="343" y="360" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">LLaMA / Llama 2</text><text x="343" y="380" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">RMSNorm、SwiGLU、RoPE；GQA</text><rect x="630" y="62" width="310" height="370" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="785.0" y="90" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">第三代 · 2024～2026</text><text x="785.0" y="114" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">稀疏 + 混合注意力</text><text x="785.0" y="140" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">同一个目标，做大且省</text><text x="646" y="176" font-size="13" fill="#b45309" font-weight="bold" text-anchor="start">2024</text><text x="688" y="176" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">DeepSeek-V2/V3</text><text x="688" y="196" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">MLA 压缩 KV；细粒度 MoE</text><text x="646" y="222" font-size="13" fill="#b45309" font-weight="bold" text-anchor="start">2025</text><text x="688" y="222" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">Qwen3-Next、Kimi Linear</text><text x="688" y="242" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">线性注意力 : 完整注意力 = 3 : 1</text><text x="646" y="268" font-size="13" fill="#b45309" font-weight="bold" text-anchor="start">2026</text><text x="688" y="268" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">Kimi K3</text><text x="688" y="288" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">2.8 万亿参数，896 个专家选 16 个，</text><text x="688" y="314" font-size="12.5" fill="#172033" font-weight="normal" text-anchor="start">100 万 token 上下文</text><path d="M272 220L283 220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M617 220L628 220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="480" y="462" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">TinyLLM 的主线就是第二代的“现代稠密解码器”；第三代的 MoE、KV 压缩和混合注意力在后面的专题里讲。</text></g></svg>
