<svg xmlns="http://www.w3.org/2000/svg" width="960" height="455" viewBox="0 0 960 455" role="img" aria-labelledby="title desc">
<title id="title">串行计算的链式法则</title><desc id="desc">x 为 3，u 等于 2x 为 6，y 等于 u 平方为 36。反向把局部导数 12 与 2 相乘得到 24。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="960" height="455" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="43" font-size="27" fill="#172033" font-weight="bold">链式法则：局部变化率沿路径相乘</text><rect x="60" y="104" width="240" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="180" y="145" font-size="24" fill="#172033" font-weight="normal">输入 x</text><text x="180" y="188" font-size="30" fill="#2563eb" font-weight="bold">3</text><rect x="360" y="104" width="240" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="145" font-size="24" fill="#172033" font-weight="normal">u = 2x</text><text x="480" y="188" font-size="30" fill="#2563eb" font-weight="bold">6</text><rect x="660" y="104" width="240" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="780" y="145" font-size="24" fill="#172033" font-weight="normal">y = u²</text><text x="780" y="188" font-size="30" fill="#2563eb" font-weight="bold">36</text><path d="M304 158L351 158" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M604 158L651 158" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="258" font-size="21" fill="#172033" font-weight="normal">前向：先计算 u，再计算 y</text><path d="M762 324L482 324" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M460 324L180 324" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="750" y="303" font-size="22" fill="#0f766e" font-weight="normal">起点：1</text><text x="480" y="303" font-size="22" fill="#0f766e" font-weight="normal">dy/du = 2u = 12</text><text x="180" y="303" font-size="22" fill="#0f766e" font-weight="normal">du/dx = 2</text><rect x="100" y="367" width="760" height="60" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="406" font-size="25" fill="#0f766e" font-weight="normal">dy/dx = (dy/du) × (du/dx) = 12 × 2 = 24</text></g></svg>
