<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">主线模型的矩阵乘法</title><desc id="desc">输入行 [1,2] 分别与权重的两列做点积得到 [5,1]，加偏置 [0,1] 后为 [5,2]。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="960" height="450" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="42" font-size="27" fill="#172033" font-weight="bold">矩阵乘法：一行与一列，逐项相乘后求和</text><text x="130" y="97" font-size="22" fill="#2563eb" font-weight="normal">X · shape [1, 2]</text><rect x="68" y="124" width="62" height="62" fill="#dbeafe" stroke="#94a3b8"/><text x="99.0" y="164.3" font-size="26" fill="#172033" font-weight="normal">1</text><rect x="130" y="124" width="62" height="62" fill="#dbeafe" stroke="#94a3b8"/><text x="161.0" y="164.3" font-size="26" fill="#172033" font-weight="normal">2</text><text x="238" y="168" font-size="32" fill="#172033" font-weight="normal">×</text><text x="360" y="97" font-size="22" fill="#0f766e" font-weight="normal">W · shape [2, 2]</text><rect x="298" y="124" width="62" height="62" fill="#ccfbf1" stroke="#94a3b8"/><text x="329.0" y="164.3" font-size="26" fill="#172033" font-weight="normal">1</text><rect x="360" y="124" width="62" height="62" fill="#fef3c7" stroke="#94a3b8"/><text x="391.0" y="164.3" font-size="26" fill="#172033" font-weight="normal">-1</text><rect x="298" y="186" width="62" height="62" fill="#ccfbf1" stroke="#94a3b8"/><text x="329.0" y="226.3" font-size="26" fill="#172033" font-weight="normal">2</text><rect x="360" y="186" width="62" height="62" fill="#fef3c7" stroke="#94a3b8"/><text x="391.0" y="226.3" font-size="26" fill="#172033" font-weight="normal">1</text><path d="M453 166L506 166" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="606" y="97" font-size="22" fill="#172033" font-weight="normal">XW · shape [1, 2]</text><rect x="544" y="124" width="62" height="62" fill="#ccfbf1" stroke="#94a3b8"/><text x="575.0" y="164.3" font-size="26" fill="#172033" font-weight="normal">5</text><rect x="606" y="124" width="62" height="62" fill="#fef3c7" stroke="#94a3b8"/><text x="637.0" y="164.3" font-size="26" fill="#172033" font-weight="normal">1</text><text x="749" y="164" font-size="30" fill="#172033" font-weight="normal">+</text><text x="844" y="97" font-size="22" fill="#172033" font-weight="normal">b · [2]</text><rect x="782" y="124" width="62" height="62" fill="#ffffff" stroke="#94a3b8"/><text x="813.0" y="164.3" font-size="26" fill="#172033" font-weight="normal">0</text><rect x="844" y="124" width="62" height="62" fill="#ffffff" stroke="#94a3b8"/><text x="875.0" y="164.3" font-size="26" fill="#172033" font-weight="normal">1</text><rect x="60" y="286" width="400" height="88" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="260" y="323" font-size="23" fill="#0f766e" font-weight="normal">第 1 列：1 × 1 + 2 × 2 = 5</text><text x="260" y="353" font-size="19" fill="#172033" font-weight="normal">两项来自同一行 X 与 W 的第一列</text><rect x="500" y="286" width="400" height="88" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="700" y="323" font-size="22" fill="#b45309" font-weight="normal">第 2 列：1 × (−1) + 2 × 1 = 1</text><text x="700" y="353" font-size="21" fill="#172033" font-weight="normal">加上偏置后得到 Z = [5, 2]</text><text x="480" y="418" font-size="23" fill="#2563eb" font-weight="normal">相乘的内部维度必须相等：[M, K] × [K, N] → [M, N]</text></g></svg>
