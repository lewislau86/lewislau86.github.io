<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One training step on 1,024 GPUs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --ink: #16181d; --muted: #6b7079; --line: #8a909b; --faint: #e3e6ea; --idle: #eceef1;
  --fwd: #aab1bc; --bwd: #4f5866; --nv: #2457d6; --net: #d17f00; --nv-text: #2457d6; --net-text: #9a5d00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not(.light) {
    --bg: #111214; --ink: #e8eaed; --muted: #9aa0a9; --line: #6b717b; --faint: #2a2d32; --idle: #1e2024;
    --fwd: #5d6673; --bwd: #a6aebb; --nv: #6893f5; --net: #e69a22; --nv-text: #8fb0ff; --net-text: #f0b04a;
    color-scheme: dark;
  }
}
:root.dark {
  --bg: #111214; --ink: #e8eaed; --muted: #9aa0a9; --line: #6b717b; --faint: #2a2d32; --idle: #1e2024;
  --fwd: #5d6673; --bwd: #a6aebb; --nv: #6893f5; --net: #e69a22; --nv-text: #8fb0ff; --net-text: #f0b04a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 13px/1.4 "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.fig { max-width: 840px; margin: 0 auto; padding: 16px 16px 12px; position: relative; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
button.play { appearance: none; border: 1px solid var(--faint); background: var(--bg); color: var(--ink); width: 30px; height: 30px; border-radius: 4px; cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
button.play:hover { border-color: var(--line); }
button.play svg { width: 12px; height: 12px; fill: currentColor; }
#tip { max-width: 300px; }
.tip { position: absolute; pointer-events: none; background: var(--bg); color: var(--ink); border: 1px solid var(--faint); border-radius: 4px; padding: 6px 8px; font-size: 12px; line-height: 1.45; max-width: 260px; display: none; z-index: 5; }
.tip b { font-weight: 600; }
.tip .m { color: var(--muted); }
canvas { display: block; touch-action: none; }
.wrap { display: grid; grid-template-columns: auto minmax(220px, 1fr); gap: 0 28px; align-items: start; }
@media (max-width: 671px) { .wrap { grid-template-columns: 1fr; } .panel { margin-top: 6px; } }
.panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kick { color: var(--muted); font-size: 13px; }
.now { font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.phase { color: var(--muted); font-size: 13px; min-height: 36px; }
.key { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
@media (max-width: 671px) { .key { grid-template-columns: 1fr 1fr; } .phase { min-height: 0; } }
.key span { display: flex; align-items: center; gap: 8px; }
.key i { flex: none; width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.key i.dot { border-radius: 50%; width: 8px; height: 8px; margin: 0 1.5px; }
.slow { color: var(--muted); font-size: 12px; margin-left: auto; }
.sub { font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--ink); min-height: 2.8em; margin: 16px auto 0; max-width: 540px; text-align: center; }
/* D and E: darker compute cells in dark mode so the light of the particles stands out */
@media (prefers-color-scheme: dark) { :root:not(.light) { --fwd: #3f4651; --bwd: #737c89; --idle: #1b1d21; } }
:root.dark { --fwd: #3f4651; --bwd: #737c89; --idle: #1b1d21; }

.spd { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.spd input { width: 96px; accent-color: var(--ink); }


/* hue says direction (forward blue, backward orange); shade says kind: light fill = compute, mid = tokens inside a node,
   dark = traffic between nodes (pipeline sends and the sync among copies); idle and the optimizer step stay neutral */
:root { --fwd: #87b7f5; --bwd: #ec9d81; --fwd-nv: #3b86e4; --bwd-nv: #d35e2f; /* the tour, from the micro-batch ramps */ --fwd-net: #173d96; --bwd-net: #8f3f00; }
@media (prefers-color-scheme: dark) { :root:not(.light) { --fwd: #2d4b7c; --bwd: #7d4c22; --fwd-nv: #6f9dff; --bwd-nv: #f29a3d; --fwd-net: #b3cbff; --bwd-net: #ffc88f; } }
:root.dark { --fwd: #2d4b7c; --bwd: #7d4c22; --fwd-nv: #6f9dff; --bwd-nv: #f29a3d; --fwd-net: #b3cbff; --bwd-net: #ffc88f; }

#strip { transition: opacity .5s; }
@media (min-width: 672px) { #fig > .cvwrap { grid-column: 1; grid-row: 1; } #fig > .panel { grid-column: 2; grid-row: 1; } #fig > #strip { grid-column: 1 / -1; grid-row: 2; margin-top: 14px; } }
#strip.off { opacity: 0; pointer-events: none; }
.chap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--faint); border: 1px solid var(--faint); border-radius: 4px; overflow: hidden; max-width: 260px; }
@media (max-width: 671px) { .chap { grid-template-columns: repeat(6, 1fr); max-width: none; } }
.chap button { appearance: none; border: 0; background: var(--bg); color: var(--muted); font: inherit; font-size: 12px; padding: 5px 0; min-width: 0; cursor: pointer; }
.chap button.on { color: var(--ink); background: var(--idle); font-weight: 600; }
.now { min-height: 30px; }
.now:empty { display: none; }
.phase, .kick { display: none; }
.run { display: grid; gap: 4px; min-height: 250px; align-content: start; } /* fixed slot: the panel does not move when the card turns into the legend */
.run .row { display: grid; grid-template-columns: 14px 1fr; gap: 1px 8px; align-items: baseline; transition: opacity .35s; }
.run .row.dim { opacity: .28; }
.run .nm { font-size: 12px; line-height: 1.3; color: var(--ink); }
.run .pf { grid-column: 2; font: 400 10.5px/1.3 "IBM Plex Mono", ui-monospace, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
.run .mv { grid-column: 2; font-size: 11.5px; color: var(--muted); }
.run.card .nm { font-size: 14px; font-weight: 600; }
.g { display: inline-block; width: 10px; height: 10px; border-radius: 2px; transform: translateY(1px); box-sizing: border-box; }
.g.dot { border-radius: 50%; width: 9px; height: 9px; }
.g.chev, .g.chevl { border-radius: 0; width: 10px; height: 10px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.g.chevl { clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.g.dia { border-radius: 1px; width: 8px; height: 8px; transform: translateY(1px) rotate(45deg); margin-left: 1px; }
.g.ring { border-radius: 50%; width: 9px; height: 9px; border: 2px solid; background: transparent !important; }

/* header mode: a banner that loops the real step on all 1,024 GPUs; one button stretches it into the full figure */
#hroot { position: relative; max-width: 980px; margin: 0 auto; overflow: hidden; }
#bcv { position: absolute; top: 0; left: 0; display: block; }
#full { position: absolute; top: 0; left: 0; right: 0; visibility: hidden; }
#hroot.open #full { position: relative; visibility: visible; }
#hroot.open #bcv { display: none; }
#full .panel { transition: opacity .45s; }
#hroot.settling #full .panel, #hroot.settling #cv { opacity: 0; }
#cv { transition: opacity .45s; }
.hbtn { position: absolute; z-index: 3; appearance: none; display: inline-flex; align-items: center; gap: 8px; font: 600 13px/1 "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px; cursor: pointer; transition: opacity .3s; }
.hbtn:hover { border-color: var(--ink); }
.hbtn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; }
#open { right: 16px; bottom: 14px; }
#btitle { position: absolute; z-index: 2; top: 16px; left: 22px; pointer-events: none; }
#btitle h2 { margin: 0; font: 600 30px/1.1 "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.015em; color: var(--ink); }
#bphase { position: absolute; z-index: 2; margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; text-align: center; color: var(--ink); pointer-events: none; }
#btip { max-width: 300px; }
#hroot.open #bphase { display: none; }
#hroot.open #btitle, .notitle #btitle h2 { display: none; }
#close { position: static; padding: 7px 10px; }
#hroot:not(.collapsed) #open { opacity: 0; pointer-events: none; }
@media (max-width: 671px) { #open { right: 50%; transform: translateX(50%); bottom: 10px; } }
/* the banner's notes use the hand of the Smol Training Playbook's Excalidraw figures */
@font-face { font-family: Virgil; src: url(https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Virgil.woff2) format("woff2"); font-display: swap; }
</style>
</head>
<body>
<div id="hroot" class="collapsed">
  <div class="tip" id="btip"></div>
  <div id="btitle"><h2>The Ultimate MoE Training Handbook</h2></div><p id="bphase" aria-live="polite">one training step on 1,024 GPUs</p>
  <canvas id="bcv" aria-label="All 1,024 GPUs of the cluster running one training step, on a loop"></canvas>
  <button class="hbtn" id="open" aria-label="Open the interactive figure"><svg viewBox="0 0 14 14"><path d="M8.5 1.5h4v4M12.5 1.5l-4.5 4.5M5.5 12.5h-4v-4M1.5 12.5l4.5-4.5"/></svg>Explore the training step</button>
  <div id="full">
<div class="fig wrap" id="fig">
  <div class="cvwrap"><canvas id="cv"></canvas>
  <div class="sub" id="sub" aria-live="polite"></div></div>
  <div class="panel">
    <div class="kick" id="kick">&nbsp;</div>
    <div class="now" id="now"></div>
    <div class="phase" id="phase"></div>
    <div class="run" id="run"></div>
    <canvas id="strip" class="off"></canvas>
    <div class="chap" id="chap"></div>
    <div class="bar"><button class="play" id="play" aria-label="Play or pause"></button><label class="spd">speed <input type="range" id="spd" min="-2" max="2" step="0.25" value="0" aria-label="Playback speed"></label><span class="slow" id="slow"></span></div>
  </div>
  <div class="tip" id="tip"></div>
</div>

    <button class="hbtn" id="close" aria-label="Back to the banner" style="display:none"><svg viewBox="0 0 14 14"><path d="M12.5 5.5h-4v-4M8.5 5.5l4-4M1.5 8.5h4v4M5.5 8.5l-4 4"/></svg>Collapse</button>
  </div>
</div>
