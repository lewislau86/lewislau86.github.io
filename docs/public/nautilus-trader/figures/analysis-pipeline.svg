<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="title desc">
<title id="title">回测结果的分析流程</title><desc id="desc">左边四类输入：账户余额、平仓时的已实现盈亏、每日组合快照、仓位与仓位快照。中间三条：盈亏序列交给 calculate_from_realized_pnls 得到 stats_pnls，收益序列（组合快照覆盖两个以上 UTC 日时用组合日收益，否则用仓位收益）交给 calculate_from_returns 得到 stats_returns，仓位列表交给 calculate_from_positions 得到 stats_general。右边输出到 BacktestResult、运行后日志，以及 Python 的报表和业绩报告。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="452" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">回测结果怎样算出来：PortfolioAnalyzer 与三类统计</text><rect x="24.0" y="70.0" width="190.0" height="62.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="119.0" y="95.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">账户余额</text><text x="119.0" y="115.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">初始 / 当前</text><rect x="24.0" y="150.0" width="190.0" height="62.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="119.0" y="175.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">平仓时的已实现盈亏</text><text x="119.0" y="195.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按币种、按时间</text><rect x="24.0" y="230.0" width="190.0" height="62.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="119.0" y="255.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">每日组合快照</text><text x="119.0" y="275.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">权益曲线</text><rect x="24.0" y="330.0" width="190.0" height="62.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="119.0" y="355.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">仓位 + 仓位快照</text><text x="119.0" y="375.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">含 NETTING 历史轮次</text><rect x="300.0" y="70.0" width="260.0" height="62.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="430.0" y="95.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">盈亏序列</text><text x="430.0" y="115.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">calculate_from_realized_pnls</text><line x1="560.0" y1="101.0" x2="610.0" y2="101.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="612.0" y="77.0" width="150.0" height="48.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="687.0" y="105.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>stats_pnls</text><rect x="300.0" y="210.0" width="260.0" height="62.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="430.0" y="235.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">收益序列</text><text x="430.0" y="255.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">calculate_from_returns</text><line x1="560.0" y1="241.0" x2="610.0" y2="241.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="612.0" y="217.0" width="150.0" height="48.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="687.0" y="245.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>stats_returns</text><rect x="300.0" y="330.0" width="260.0" height="62.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="430.0" y="355.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">仓位列表</text><text x="430.0" y="375.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">calculate_from_positions</text><line x1="560.0" y1="361.0" x2="610.0" y2="361.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="612.0" y="337.0" width="150.0" height="48.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="687.0" y="365.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>stats_general</text><line x1="214.0" y1="101.0" x2="298.0" y2="101.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="214.0" y1="181.0" x2="298.0" y2="106.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="214.0" y1="261.0" x2="298.0" y2="241.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="214.0" y1="361.0" x2="298.0" y2="361.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="430.0" y="292.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">快照跨 ≥ 2 个 UTC 日 → 组合日收益</text><text x="430.0" y="314.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">否则 → 仓位收益（按日复利合并）</text><line x1="150.0" y1="330.0" x2="300.0" y2="252.0" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/><rect x="790.0" y="70.0" width="146.0" height="330.0" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="863.0" y="104.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">BacktestResult</text><text x="863.0" y="142.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">运行后日志</text><text x="863.0" y="180.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">PORTFOLIO</text><text x="863.0" y="218.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">PERFORMANCE</text><text x="863.0" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Python：</text><text x="863.0" y="294.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">ReportProvider</text><text x="863.0" y="332.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">create_tearsheet</text><line x1="762.0" y1="101.0" x2="788.0" y2="101.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><line x1="762.0" y1="241.0" x2="788.0" y2="241.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><line x1="762.0" y1="361.0" x2="788.0" y2="361.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="480.0" y="432.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">默认注册 20 个统计；夏普不扣无风险利率、按 √252 年化；Profit Factor 用收益序列；MaxDrawdown 需手动注册</text></g></svg>
