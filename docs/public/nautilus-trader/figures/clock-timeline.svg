<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">回测时间线：数据与计时器的执行顺序</title><desc id="desc">横轴是回测时间。上方蓝色圆圈是数据，下方橙色圆圈是计时器，数字是执行顺序：10:00:00.223 的成交、10:00:30 的心跳计时器、10:00:45 的成交、10:01:00.000 的成交、10:01:00 到点的心跳和 K 线计时器、10:01:06 的成交。同一时刻的数据先于计时器执行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="530" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">回测时间线：先执行更早的计时器，再处理这一时刻的数据，最后执行同一时刻的计时器</text><line x1="130" y1="230" x2="900" y2="230" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/><line x1="150.0" y1="224" x2="150.0" y2="236" stroke="#172033" stroke-width="1.5"/><text x="150.0" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>10:00:00</text><line x1="462.9" y1="224" x2="462.9" y2="236" stroke="#172033" stroke-width="1.5"/><text x="462.9" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>10:00:30</text><line x1="619.3" y1="224" x2="619.3" y2="236" stroke="#172033" stroke-width="1.5"/><text x="619.3" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>10:00:45</text><line x1="775.7" y1="224" x2="775.7" y2="236" stroke="#172033" stroke-width="1.5"/><text x="775.7" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>10:01:00</text><text x="30.0" y="146.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">数据</text><text x="30.0" y="326.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">计时器</text><line x1="152.3" y1="230" x2="152.3" y2="150" stroke="#2563eb" stroke-width="1.5"/><circle cx="152.3" cy="140" r="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="152.3" y="146.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">①</text><text x="152.3" y="108.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">成交 10:00:00.223</text><line x1="619.3" y1="230" x2="619.3" y2="150" stroke="#2563eb" stroke-width="1.5"/><circle cx="619.3" cy="140" r="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="619.3" y="146.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">③</text><text x="589.3" y="108.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">成交 10:00:45</text><line x1="775.7" y1="230" x2="775.7" y2="150" stroke="#2563eb" stroke-width="1.5"/><circle cx="775.7" cy="140" r="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="775.7" y="146.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">④</text><text x="765.7" y="82.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">成交 10:01:00.000</text><line x1="838.3" y1="230" x2="838.3" y2="150" stroke="#2563eb" stroke-width="1.5"/><circle cx="838.3" cy="140" r="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="838.3" y="146.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">⑥</text><text x="868.3" y="108.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">成交 10:01:06</text><line x1="462.9" y1="230" x2="462.9" y2="310" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="462.9" cy="320" r="13" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="462.9" y="326.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">②</text><text x="462.9" y="362.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">heartbeat 10:00:30</text><line x1="775.7" y1="230" x2="775.7" y2="310" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="775.7" cy="320" r="13" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="775.7" y="326.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">⑤</text><text x="735.7" y="362.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">heartbeat、TIME_BAR 10:01:00</text><rect x="24.0" y="392.0" width="912.0" height="112.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="418.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">规则（crates/backtest/src/engine.rs）</text><text x="44.0" y="444.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">对每个数据时间戳 T：advance_time_impl(T) 执行所有 ≤ T−1 的计时器 → replay_data_row 处理 T 的全部数据</text><text x="44.0" y="468.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">→ flush_accumulator_events(T) 执行恰好在 T 到点的计时器。执行每个计时器前，所有组件时钟被设到它的时刻。</text><text x="44.0" y="492.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">所以 10:01:00.000 的成交先进入 K 线聚合器，再由 10:01:00 的 TIME_BAR 计时器生成 K 线（左开右闭）。</text></g></svg>
