troke-width="1.2"/><text x="191.0" y="230.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>data</text><rect x="232.0" y="212.0" width="107.0" height="26.0" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="285.5" y="230.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>execution</text><rect x="349.0" y="212.0" width="107.0" height="26.0" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="402.5" y="230.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>portfolio</text><rect x="466.0" y="212.0" width="62.0" height="26.0" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="497.0" y="230.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>risk</text><rect x="538.0" y="212.0" width="89.0" height="26.0" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="582.5" y="230.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>trading</text><text x="160.0" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">数据引擎；执行引擎、撮合与订单仿真；组合；风控；策略与执行算法</text><rect x="40.0" y="272.0" width="856.0" height="62.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="60.0" y="309.0" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="start">后端</text><rect x="160.0" y="282.0" width="125.0" height="26.0" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="222.5" y="300.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>persistence</text><rect x="295.0" y="282.0" width="152.0" height="26.0" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="371.0" y="300.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>infrastructure</text><text x="160.0" y="326.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">Parquet 数据目录与流式写入；Redis / PostgreSQL 缓存与总线后端</text><rect x="40.0" y="342.0" width="856.0" height="62.0" rx="12" fill="#f1f5f9" stroke="#172033" stroke-width="1.5"/><text x="60.0" y="379.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="start">公共服务</text><rect x="160.0" y="352.0" width="80.0" height="26.0" rx="7" fill="#ffffff" stroke="#172033" stroke-width="1.2"/><text x="200.0" y="370.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>common</text><text x="160.0" y="396.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">MessageBus、Cache、Clock、Actor / Component、客户端 trait、实盘 runner</text><rect x="40.0" y="412.0" width="856.0" height="62.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="60.0" y="449.0" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="start">工具库</text><rect x="160.0" y="422.0" width="89.0" height="26.0" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="204.5" y="440.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>network</text><rect x="259.0" y="422.0" width="134.0" height="26.0" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="326.0" y="440.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consola