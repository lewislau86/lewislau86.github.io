#172033" stroke-width="1.2"/><text x="357.5" y="510.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>model</text><text x="160.0" y="536.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">时间戳、UUID、正确性检查；过程宏；领域模型（值类型、行情、订单、仓位…）</text><line x1="918.0" y1="72.0" x2="918.0" y2="536.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="0" y="0" transform="translate(936 312.0) rotate(90)" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">依赖方向</text><text x="480.0" y="568.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">另有 crates/lib.rs 组成的伞形 crate nautilus-trader（只重导出 core、common、model），以及 examples/tutorials。</text></g></svg>
