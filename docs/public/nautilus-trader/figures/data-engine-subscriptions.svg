<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">订阅的持有者计数</title><desc id="desc">四列是四条命令：A 订阅、B 订阅、A 退订、B 退订。中间一行是登记表里同一个键的持有者数，依次是 1、2、1、0。最下面一行是真正发给适配器的命令：只有第一次订阅和最后一次退订会下发，中间两次只改变计数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="480" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">两个策略订阅、退订同一品种的报价：只有首次订阅和最后一次退订会下发</text><text x="30.0" y="104.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="start">组件命令</text><text x="30.0" y="214.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="start">持有者数</text><text x="30.0" y="324.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="start">发给适配器</text><rect x="130.0" y="70.0" width="185.0" height="70.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="222.5" y="99.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">① A 订阅</text><text x="222.5" y="120.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SubscribeQuotes</text><line x1="222.0" y1="142.0" x2="222.0" y2="176.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="130.0" y="178.0" width="185.0" height="64.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="222.0" y="206.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>owners = 1</text><text x="222.0" y="230.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">retain → 新建</text><line x1="222.0" y1="244.0" x2="222.0" y2="288.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="130.0" y="290.0" width="185.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="222.0" y="324.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>subscribe_quotes</text><rect x="335.0" y="70.0" width="185.0" height="70.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="427.5" y="99.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">② B 订阅</text><text x="427.5" y="120.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SubscribeQuotes</text><line x1="427.0" y1="142.0" x2="427.0" y2="176.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="335.0" y="178.0" width="185.0" height="64.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="427.0" y="206.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>owners = 2</text><text x="427.0" y="230.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">retain → 计数</text><line x1="427.0" y1="244.0" x2="427.0" y2="288.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="335.0" y="290.0" width="185.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="7 5"/><text x="427.0" y="324.0" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">（不下发）</text><rect x="540.0" y="70.0" width="185.0" height="70.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="632.5" y="99.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">③ A 退订</text><text x="632.5" y="120.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>UnsubscribeQuotes</text><line x1="632.0" y1="142.0" x2="632.0" y2="176.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="540.0" y="178.0" width="185.0" height="64.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="632.0" y="206.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>owners = 1</text><text x="632.0" y="230.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">release → Retained</text><line x1="632.0" y1="244.0" x2="632.0" y2="288.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="540.0" y="290.0" width="185.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="7 5"/><text x="632.0" y="324.0" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">（不下发）</text><rect x="745.0" y="70.0" width="185.0" height="70.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="837.5" y="99.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">④ B 退订</text><text x="837.5" y="120.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>UnsubscribeQuotes</text><line x1="837.0" y1="142.0" x2="837.0" y2="176.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="745.0" y="178.0" width="185.0" height="64.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="837.0" y="206.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>owners = 0</text><text x="837.0" y="230.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">release → Final</text><line x1="837.0" y1="244.0" x2="837.0" y2="288.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="745.0" y="290.0" width="185.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="837.0" y="324.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>unsubscribe_quotes</text><rect x="24.0" y="370.0" width="912.0" height="92.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="396.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">SubscriptionRegistry（crates/data/src/subscription.rs）</text><text x="44.0" y="422.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">键 = 数据类型 + 品种（如 Quotes(ETHUSDT.BINANCE)）；持有者按订阅命令 ID 区分，同一命令重复到达不重复计数。</text><text x="44.0" y="446.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">客户端由 显式 client_id → 交易所路由表 → 默认客户端 找到；注册了 BACKTEST 客户端时，订阅一律交给它。</text></g></svg>
