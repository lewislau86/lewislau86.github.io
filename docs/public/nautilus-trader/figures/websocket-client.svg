<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
<title id="title">WebSocket 客户端的结构与重连</title><desc id="desc">上半部分：适配器的发送经限流器交给唯一的写入任务，心跳也经写入任务，读取任务把消息交回适配器并丢弃旧纪元的帧，传输层可选 tungstenite 或 sockudo-ws。左下是控制器的状态：Active、Reconnecting、Closed，以及实测的重连等待序列、稳定阈值和节流。右下是状态边沿经节点变成总线事件，以及反向的重连命令。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="456" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">WebSocketClient：四个任务、重连与状态边沿</text><rect x="24.0" y="70.0" width="150.0" height="64.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="99.0" y="96.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">适配器</text><text x="99.0" y="117.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">send / 回调</text><rect x="214.0" y="70.0" width="150.0" height="64.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="289.0" y="96.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">限流器</text><text x="289.0" y="117.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">GCRA 多键等待</text><rect x="404.0" y="70.0" width="170.0" height="64.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="489.0" y="96.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">写入任务</text><text x="489.0" y="117.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">唯一写端；重连缓冲重放</text><rect x="404.0" y="150.0" width="170.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="489.0" y="172.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">心跳任务</text><text x="489.0" y="193.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Ping 或文本 ping</text><rect x="214.0" y="150.0" width="150.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="289.0" y="172.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">读取任务</text><text x="289.0" y="193.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">旧纪元的帧丢弃</text><rect x="614.0" y="96.0" width="150.0" height="80.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="689.0" y="120.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">传输层</text><text x="689.0" y="141.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">tungstenite /</text><text x="689.0" y="162.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">sockudo-ws</text><rect x="804.0" y="96.0" width="132.0" height="80.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="870.0" y="120.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">交易所</text><text x="870.0" y="141.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">WebSocket</text><text x="870.0" y="162.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">端点</text><line x1="174.0" y1="102.0" x2="212.0" y2="102.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><line x1="364.0" y1="102.0" x2="402.0" y2="102.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><line x1="489.0" y1="150.0" x2="489.0" y2="136.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><line x1="574.0" y1="110.0" x2="612.0" y2="120.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><polyline points="689.0,176.0 689.0,222.0 289.0,222.0 289.0,208.0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="214.0" y1="178.0" x2="100.0" y2="136.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><line x1="764.0" y1="136.0" x2="802.0" y2="136.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="24.0" y="236.0" width="600.0" height="200.0" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="262.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">控制器：连接状态</text><rect x="44.0" y="280.0" width="120.0" height="46.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="104.0" y="308.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Active</text><rect x="244.0" y="280.0" width="150.0" height="46.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="319.0" y="308.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Reconnecting</text><rect x="474.0" y="280.0" width="130.0" height="46.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="539.0" y="308.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Closed</text><line x1="164.0" y1="296.0" x2="242.0" y2="296.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><line x1="242.0" y1="312.0" x2="166.0" y2="312.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="394.0" y1="303.0" x2="472.0" y2="303.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="204.0" y="346.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">失败 / Close / 超时 / 请求</text><text x="530.0" y="346.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">达到次数上限</text><text x="44.0" y="378.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">实测等待：0 → 0 → 2 → 3 → 4.5 → … → 30 秒（+0～100 ms 抖动）</text><text x="44.0" y="402.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">连上满 10 秒重置；两分钟内 ≥ 3 次后每次至少 1 秒（失败时另加）</text><text x="44.0" y="424.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">心跳超时：任何帧重置；空闲超时：只有应用数据重置</text><rect x="652.0" y="236.0" width="284.0" height="200.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="794.0" y="262.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">状态边沿 → 总线</text><text x="794.0" y="290.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">SocketStateSink：Connected /</text><text x="794.0" y="312.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">Disconnected</text><text x="794.0" y="334.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ 系统事件 channel → 节点</text><text x="794.0" y="356.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ events.system.</text><text x="794.0" y="378.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">SocketStateChanged.{客户端}.{端点}</text><text x="794.0" y="400.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">反向：ReconnectSocket 命令</text><text x="794.0" y="422.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">→ request_reconnect()</text></g></svg>
