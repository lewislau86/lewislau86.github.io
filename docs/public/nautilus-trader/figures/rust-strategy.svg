<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Rust 策略的组成</title><desc id="desc">左边是你写的部分：持有 StrategyCore 的结构体、覆盖回调的 impl DataActor，以及可选地在宏里覆盖 Strategy 的方法。中间是 nautilus_strategy! 宏生成的 DataActorNative、StrategyNative 和空的 impl Strategy。右边是框架提供的通用实现和默认方法：任何 DataActor 自动实现 Component，DataActor 和 Strategy 的订阅、下单、派发方法都有默认实现。下方是 StrategyCore 的组成，DataActorCore、OrderFactory、OrderManager、Portfolio 和计时器在注册到 Trader 时才接上。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="600" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一个 Rust 策略由三部分拼成：你写的结构体和回调、宏生成的样板、框架的默认实现</text><rect x="24.0" y="58.0" width="292.0" height="352.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="170.0" y="86.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">你写的</text><rect x="38.0" y="104.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="170.0" y="132.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>struct EmaCross</text><text x="170.0" y="156.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>core: StrategyCore</text><text x="170.0" y="178.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">+ 指标、参数、自己的状态</text><rect x="38.0" y="204.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="170.0" y="232.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>impl DataActor for EmaCross</text><text x="170.0" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_start / on_quote / on_stop …</text><text x="170.0" y="278.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">只覆盖需要的回调</text><rect x="38.0" y="304.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="170.0" y="332.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">（可选）宏的花括号里</text><text x="170.0" y="356.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">覆盖 Strategy 的方法</text><text x="170.0" y="378.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">如 on_order_filled</text><rect x="334.0" y="58.0" width="292.0" height="352.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="86.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">nautilus_strategy! 宏生成</text><rect x="348.0" y="104.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="480.0" y="132.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>impl DataActorNative</text><text x="480.0" y="156.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>core() / core_mut()</text><text x="480.0" y="178.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">启动时先跑框架的 on_start</text><rect x="348.0" y="204.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="480.0" y="232.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>impl StrategyNative</text><text x="480.0" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>strategy_core() / _mut()</text><text x="480.0" y="278.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">由此拿到下单工厂、组合</text><rect x="348.0" y="304.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="480.0" y="332.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>impl Strategy {}</text><text x="480.0" y="356.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">空实现，全用默认方法</text><text x="480.0" y="378.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">外加 config() 访问器</text><rect x="644.0" y="58.0" width="292.0" height="352.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="790.0" y="86.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">框架提供（默认方法与通用实现）</text><rect x="658.0" y="104.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="790.0" y="132.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>impl&lt;T&gt; Component for T</text><text x="790.0" y="156.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">任何 DataActor 自动获得</text><text x="790.0" y="178.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">生命周期状态机</text><rect x="658.0" y="204.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="790.0" y="232.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">DataActor 的默认方法</text><text x="790.0" y="256.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>subscribe_* / request_*</text><text x="790.0" y="278.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">以及派发前检查 handle_*</text><rect x="658.0" y="304.0" width="264.0" height="92.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="790.0" y="332.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Strategy 的默认方法</text><text x="790.0" y="356.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">submit_order / cancel_order …</text><text x="790.0" y="378.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">handle_order_event 等</text><rect x="24.0" y="430.0" width="912.0" height="150.0" rx="14" fill="#f1f5f9" stroke="#172033" stroke-width="1.5"/><text x="44.0" y="458.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">StrategyCore（crates/trading/src/strategy/core.rs）注册之后才完整</text><rect x="40.0" y="476.0" width="168.0" height="84.0" rx="9" fill="#ffffff" stroke="#172033" stroke-width="1.2"/><text x="124.0" y="508.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>DataActorCore</text><text x="124.0" y="534.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">状态、时钟、订阅表</text><rect x="218.0" y="476.0" width="168.0" height="84.0" rx="9" fill="#ffffff" stroke="#172033" stroke-width="1.2"/><text x="302.0" y="508.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>OrderFactory</text><text x="302.0" y="534.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">生成订单和订单号</text><rect x="396.0" y="476.0" width="168.0" height="84.0" rx="9" fill="#ffffff" stroke="#172033" stroke-width="1.2"/><text x="480.0" y="508.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>OrderManager</text><text x="480.0" y="534.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">关联订单 OCO / OTO</text><rect x="574.0" y="476.0" width="168.0" height="84.0" rx="9" fill="#ffffff" stroke="#172033" stroke-width="1.2"/><text x="658.0" y="508.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Portfolio</text><text x="658.0" y="534.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">净头寸、盈亏查询</text><rect x="752.0" y="476.0" width="168.0" height="84.0" rx="9" fill="#ffffff" stroke="#172033" stroke-width="1.2"/><text x="836.0" y="508.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">计时器</text><text x="836.0" y="534.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">GTD 过期、市场退出</text></g></svg>
