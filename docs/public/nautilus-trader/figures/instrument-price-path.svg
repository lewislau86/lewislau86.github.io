<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">一个价格从策略走到交易所</title><desc id="desc">上面一行是一个期权价格 1.03 的路径：策略算出浮点数，make_price 按两位小数舍入后仍是 1.03，RiskEngine 只检查精度和价格上下限所以放行，交易所因为 1.03 不是最小变动价位 0.05 的倍数而拒单。中间的红框标出风控不检查增量整数倍和整手的缝隙。下面是两种严格对齐的办法：next_bid_price 和 next_ask_price 分别得到 1.00 和 1.05，try_normalize_price 对未对齐的价格直接报错。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="500" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一个价格从策略走到交易所：每一站检查什么、不检查什么</text><rect x="24.0" y="70.0" width="210.0" height="120.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="129.0" y="102.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">策略算出 f64</text><text x="129.0" y="134.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>1.03</text><text x="129.0" y="162.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">（增量 0.05 的期权）</text><line x1="236.0" y1="130.0" x2="256.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="258.0" y="70.0" width="210.0" height="120.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="363.0" y="102.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>make_price</text><text x="363.0" y="134.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">转十进制，银行家舍入</text><text x="363.0" y="162.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">只舍到 2 位小数 → 1.03</text><line x1="470.0" y1="130.0" x2="490.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="492.0" y="70.0" width="210.0" height="120.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="597.0" y="102.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>RiskEngine</text><text x="597.0" y="134.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">精度 ≤ 2 ✓</text><text x="597.0" y="162.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">min/max 价格 ✓</text><line x1="704.0" y1="130.0" x2="724.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="726.0" y="70.0" width="210.0" height="120.0" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="831.0" y="102.0" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="middle">交易所</text><text x="831.0" y="134.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">1.03 不是 0.05 的倍数</text><text x="831.0" y="162.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">拒单</text><rect x="258.0" y="206.0" width="444.0" height="64.0" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="7 5"/><text x="480.0" y="232.0" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">缝隙：风控不检查增量的整数倍，也不检查 lot_size</text><text x="480.0" y="256.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">make_price 的结果可以过风控、却被交易所拒绝</text><rect x="24.0" y="290.0" width="912.0" height="150.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="318.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">要严格对齐，用这两个方法</text><rect x="44.0" y="336.0" width="420.0" height="88.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="254.0" y="364.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">next_bid_price(1.03, 0) → 1.00</text><text x="254.0" y="385.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">next_ask_price(1.03, 0) → 1.05</text><text x="254.0" y="406.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">有价位表按价位表，没有就按增量对齐</text><rect x="496.0" y="336.0" width="420.0" height="88.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="706.0" y="364.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">try_normalize_price(1.03)</text><text x="706.0" y="385.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">→ 错误：not aligned to price increment</text><text x="706.0" y="406.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">适合在适配器边界做最后检查</text><text x="480.0" y="470.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">make_qty 同理：只舍到 size_increment 的小数位；正数舍成 0 时报错；round_down=true 时向零截断。</text></g></svg>
