<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">括号单在仿真器里的生命周期</title><desc id="desc">四列分别是提交括号单、入场成交、买一价跌到 399.90、止损成交；三行分别是入场单、止损和止盈。入场单提交后发往风控并成交；两张退出单先等父单，入场成交后进入本地仿真；止损在买一价跌破 400.00 时释放为市价单并成交；止盈一直在本地，最后被本地撤销。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="480" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一张带仿真止盈止损的括号单：三张订单在四个时刻的状态</text><text x="278.0" y="90.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">提交括号单</text><text x="466.0" y="90.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">入场成交 1 @ 423.50</text><text x="654.0" y="90.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">bid 跌到 399.90</text><text x="842.0" y="90.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">止损成交</text><text x="24.0" y="152.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">入场 MARKET</text><rect x="190.0" y="116.0" width="176.0" height="76.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="278.0" y="148.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">发往风控</text><text x="278.0" y="169.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">SubmitOrder</text><rect x="378.0" y="116.0" width="176.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="466.0" y="159.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">FILLED</text><rect x="566.0" y="116.0" width="176.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="654.0" y="159.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">FILLED</text><rect x="754.0" y="116.0" width="176.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="842.0" y="159.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">FILLED</text><text x="24.0" y="244.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">止损 STOP 400.00</text><rect x="190.0" y="208.0" width="176.0" height="76.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="278.0" y="240.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">INITIALIZED</text><text x="278.0" y="261.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">等父单成交</text><rect x="378.0" y="208.0" width="176.0" height="76.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="466.0" y="240.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">EMULATED</text><text x="466.0" y="261.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">bid ≤ 400.00 触发</text><rect x="566.0" y="208.0" width="176.0" height="76.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="654.0" y="240.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">RELEASED</text><text x="654.0" y="261.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">转为 MARKET → 风控</text><rect x="754.0" y="208.0" width="176.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="842.0" y="240.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">FILLED</text><text x="842.0" y="261.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">OUO：撤兄弟单</text><text x="24.0" y="336.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">止盈 LIMIT 450.00</text><rect x="190.0" y="300.0" width="176.0" height="76.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="278.0" y="332.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">INITIALIZED</text><text x="278.0" y="353.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">等父单成交</text><rect x="378.0" y="300.0" width="176.0" height="76.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="466.0" y="332.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">EMULATED</text><text x="466.0" y="353.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">bid ≥ 450.00 触发</text><rect x="566.0" y="300.0" width="176.0" height="76.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="654.0" y="332.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">EMULATED</text><text x="654.0" y="353.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">继续持有</text><rect x="754.0" y="300.0" width="176.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="842.0" y="332.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">CANCELED</text><text x="842.0" y="353.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">本地撤销</text><rect x="40.0" y="404.0" width="26.0" height="18.0" rx="4" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="76.0" y="418.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">在本地：仿真器持有或等待父单</text><rect x="340.0" y="404.0" width="26.0" height="18.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="376.0" y="418.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">已交给风控与执行引擎</text><rect x="640.0" y="404.0" width="26.0" height="18.0" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="676.0" y="418.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">已关闭</text><text x="480.0" y="456.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">入场成交后，仿真器里的 OrderManager 按 OTO 为两张退出单生成提交命令；止损成交后按 OUO 撤掉止盈</text></g></svg>
