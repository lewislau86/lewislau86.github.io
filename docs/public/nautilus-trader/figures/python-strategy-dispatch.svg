<svg xmlns="http://www.w3.org/2000/svg" width="960" height="636" viewBox="0 0 960 636" role="img" aria-labelledby="title desc">
<title id="title">Python 策略怎样挂在 Rust 框架上</title><desc id="desc">左列是 Python 一侧：你的子类、原样保留的配置对象、每次穿过边界得到的拷贝、缓存等句柄返回的快照，以及下单。中列是 PyO3 边界：Strategy 是一个不可跨线程、可子类化、支持弱引用的 Rust 类，持有 Rc&lt;UnsafeCell&lt;PyStrategyInner&gt;&gt;；一次回调要升级弱引用、拿 GIL、把 Rust 值转成新的 Python 对象，再按名字调用方法；数据回调里的异常只记日志，on_start 里的异常让启动失败。右列是 Rust 核心：PyStrategyInner 实现 DataActor 和 Strategy，注册表存放它的 Rc 并保留 Python 对象的强引用；消息总线先更新指标再调用 on_bar；下单与 Rust 策略走同一条路径；LiveNode.run 释放 GIL。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="636" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">Python 策略：一个 Rust 类的子类，回调经 PyO3 从 Rust 调进来</text><rect x="24.0" y="60.0" width="290.0" height="520.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="169.0" y="88.0" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">Python</text><rect x="44.0" y="108.0" width="250.0" height="70.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="169.0" y="137.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">class EMACross(Strategy)</text><text x="169.0" y="157.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_bar 等方法是你写的 Python</text><rect x="44.0" y="198.0" width="250.0" height="70.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="169.0" y="227.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">self.config</text><text x="169.0" y="247.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">任意 Python 对象，原样保留</text><rect x="44.0" y="288.0" width="250.0" height="82.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="169.0" y="313.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">你手里的 Bar、Order</text><text x="169.0" y="333.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每次穿过边界都是一份拷贝</text><text x="169.0" y="353.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">之后不会自己更新</text><rect x="44.0" y="390.0" width="250.0" height="82.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="169.0" y="415.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">self.cache / portfolio / clock</text><text x="169.0" y="435.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">同一份 Rust 状态的包装</text><text x="169.0" y="455.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每次读取返回新的快照</text><rect x="44.0" y="492.0" width="250.0" height="70.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="169.0" y="521.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">submit_order(order)</text><text x="169.0" y="541.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">走第 9 章的同一条 Rust 路径</text><rect x="334.0" y="60.0" width="290.0" height="520.0" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="479.0" y="88.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">PyO3 边界</text><rect x="354.0" y="108.0" width="250.0" height="82.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="479.0" y="133.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Strategy（pyclass）</text><text x="479.0" y="153.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">unsendable, subclass, weakref</text><text x="479.0" y="173.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">持有 Rc&lt;UnsafeCell&lt;…Inner&gt;&gt;</text><rect x="354.0" y="210.0" width="250.0" height="108.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="479.0" y="238.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">一次回调</text><text x="479.0" y="258.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">① 升级弱引用拿到 Python 对象</text><text x="479.0" y="278.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">② Python::attach 拿 GIL</text><text x="479.0" y="298.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">③ Rust 值转成新的 Python 对象</text><rect x="354.0" y="338.0" width="250.0" height="82.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="479.0" y="363.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">④ call_method1(&quot;on_bar&quot;)</text><text x="479.0" y="383.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按名字查找：你的覆盖</text><text x="479.0" y="403.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">或基类里 Rust 的空实现</text><rect x="354.0" y="440.0" width="250.0" height="100.0" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="479.0" y="464.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">异常</text><text x="479.0" y="484.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">数据回调：记 ERROR，继续运行</text><text x="479.0" y="504.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_start：启动失败，</text><text x="479.0" y="524.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">run() 抛 RuntimeError</text><rect x="644.0" y="60.0" width="292.0" height="520.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="790.0" y="88.0" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">Rust 核心（核心线程）</text><rect x="664.0" y="108.0" width="252.0" height="82.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="790.0" y="133.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">PyStrategyInner</text><text x="790.0" y="153.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">StrategyCore + 弱引用 + 配置</text><text x="790.0" y="173.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">实现 DataActor、Strategy</text><rect x="664.0" y="210.0" width="252.0" height="82.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="790.0" y="235.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">组件 / Actor 注册表</text><text x="790.0" y="255.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">存放 Inner 的 Rc</text><text x="790.0" y="275.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">另保留 Python 对象的强引用</text><rect x="664.0" y="312.0" width="252.0" height="82.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="790.0" y="337.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">消息总线 → handle_bar</text><text x="790.0" y="357.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">先更新指标（第 12 章）</text><text x="790.0" y="377.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">再调用 on_bar</text><rect x="664.0" y="414.0" width="252.0" height="70.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="790.0" y="443.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">RiskEngine → ExecEngine</text><text x="790.0" y="463.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">下单与 Rust 策略完全相同</text><rect x="664.0" y="504.0" width="252.0" height="58.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="790.0" y="527.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">LiveNode.run() 释放 GIL</text><text x="790.0" y="547.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">回调时再拿回来</text><line x1="662.0" y1="353.0" x2="606.0" y2="270.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><line x1="352.0" y1="379.0" x2="296.0" y2="143.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="296.0,553.0 630.0,553.0 630.0,449.0 662.0,449.0" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><line x1="606.0" y1="149.0" x2="662.0" y2="149.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="480.0" y="612.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每条订阅到的消息都会穿过一次边界，不论子类是否覆盖了对应的方法；实测一次空回调约 1 微秒（debug 构建）。</text></g></svg>
