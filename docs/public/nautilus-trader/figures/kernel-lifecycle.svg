<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">内核的构造顺序和一生</title><desc id="desc">上半是九步构造：日志、时钟、可选的事件存储、缓存、放进线程局部存储的消息总线、组合和三大引擎及订单仿真器、注册总线处理器、关停处理器、Trader。下半是一次实盘运行：start 启动引擎和客户端，实盘节点接着连接数据客户端并把品种冲进缓存、连接执行客户端并对账，然后 start_trader 恢复状态并启动组件，运行到收到关停命令后依次 stop_trader、断开客户端、finalize_stop 保存状态停止引擎封存事件存储、dispose 释放一切。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="580" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">NautilusKernel：九步构造，两步启动，分步关闭</text><rect x="24.0" y="58.0" width="912.0" height="196.0" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="84.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">构造（new_with_dependencies）</text><rect x="44.0" y="100.0" width="120.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="104.0" y="129.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">① 日志</text><rect x="176.0" y="100.0" width="120.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="236.0" y="129.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">② 时钟</text><rect x="308.0" y="100.0" width="190.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="403.0" y="129.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">③ 事件存储（可选）</text><rect x="510.0" y="100.0" width="120.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="570.0" y="129.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">④ Cache</text><rect x="642.0" y="100.0" width="274.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="779.0" y="129.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">⑤ MessageBus → 线程局部</text><rect x="44.0" y="168.0" width="300.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="194.0" y="197.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">⑥ Portfolio、三大引擎、仿真器</text><rect x="356.0" y="168.0" width="200.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="456.0" y="197.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">⑦ 注册总线处理器</text><rect x="568.0" y="168.0" width="160.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="648.0" y="197.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">⑧ 关停处理器</text><rect x="740.0" y="168.0" width="176.0" height="50.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="828.0" y="197.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">⑨ Trader</text><line x1="165.0" y1="125.0" x2="175.0" y2="125.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="297.0" y1="125.0" x2="307.0" y2="125.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="499.0" y1="125.0" x2="509.0" y2="125.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="631.0" y1="125.0" x2="641.0" y2="125.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="779.0,152.0 779.0,160.0 194.0,160.0 194.0,166.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="345.0" y1="193.0" x2="355.0" y2="193.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="557.0" y1="193.0" x2="567.0" y2="193.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="729.0" y1="193.0" x2="739.0" y2="193.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24.0" y="272.0" width="912.0" height="250.0" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="298.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">一次实盘运行（LiveNode::start / run / stop）</text><rect x="40.0" y="316.0" width="168.0" height="86.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="124.0" y="343.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">start()</text><text x="124.0" y="363.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">启动引擎和客户端</text><text x="124.0" y="383.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Trader → READY</text><line x1="210.0" y1="359.0" x2="222.0" y2="359.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="222.0" y="316.0" width="168.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="306.0" y="343.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">连接数据客户端</text><text x="306.0" y="363.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">品种冲进缓存</text><text x="306.0" y="383.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">flush_pending_data</text><line x1="392.0" y1="359.0" x2="404.0" y2="359.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="404.0" y="316.0" width="168.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="488.0" y="343.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">连接执行客户端</text><text x="488.0" y="363.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">启动对账</text><text x="488.0" y="383.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">timeout_connection</text><line x1="574.0" y1="359.0" x2="586.0" y2="359.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="586.0" y="316.0" width="168.0" height="86.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="670.0" y="343.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">start_trader()</text><text x="670.0" y="363.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_load（load_state）</text><text x="670.0" y="383.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">仿真器、组件 on_start</text><line x1="756.0" y1="359.0" x2="768.0" y2="359.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="768.0" y="316.0" width="168.0" height="86.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="852.0" y="343.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">运行</text><text x="852.0" y="363.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">select! 循环</text><text x="852.0" y="383.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">ShutdownSystem → 停</text><rect x="40.0" y="424.0" width="210.0" height="70.0" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="145.0" y="453.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">stop_trader()</text><text x="145.0" y="473.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">组件 on_stop</text><line x1="252.0" y1="459.0" x2="266.0" y2="459.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="268.0" y="424.0" width="210.0" height="70.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="373.0" y="463.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">断开客户端</text><line x1="480.0" y1="459.0" x2="494.0" y2="459.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="496.0" y="424.0" width="210.0" height="70.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="601.0" y="453.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">finalize_stop()</text><text x="601.0" y="473.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">存状态、停引擎、封存</text><line x1="708.0" y1="459.0" x2="722.0" y2="459.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="724.0" y="424.0" width="210.0" height="70.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="829.0" y="453.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">dispose()</text><text x="829.0" y="473.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">释放引擎、缓存、总线</text><text x="480.0" y="552.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">蓝：内核方法　青：实盘节点在 start 与 start_trader 之间插入的步骤　回测由 BacktestEngine 直接依次调用两步</text></g></svg>
