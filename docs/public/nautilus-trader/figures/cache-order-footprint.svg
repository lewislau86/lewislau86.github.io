<svg xmlns="http://www.w3.org/2000/svg" width="960" height="522" viewBox="0 0 960 522" role="img" aria-labelledby="title desc">
<title id="title">一张限价单在缓存索引里的足迹</title><desc id="desc">表格的行是缓存的索引集合，列是订单的四个时刻：创建时属于总表和本地集合，提交后属于在途集合并登记账户，交易所接受后属于挂单集合并登记交易所订单号，全部成交后属于已结束集合并建立仓位索引。总表那一行始终有它。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="522" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一张限价单在缓存索引里的足迹：每一步属于哪些集合</text><text x="350.0" y="70.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">add_order</text><text x="350.0" y="92.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>INITIALIZED</text><text x="518.0" y="70.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">提交后</text><text x="518.0" y="92.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SUBMITTED</text><text x="686.0" y="70.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">交易所接受</text><text x="686.0" y="92.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ACCEPTED</text><text x="854.0" y="70.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">全部成交</text><text x="854.0" y="92.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>FILLED</text><text x="254.0" y="132.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="end" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>orders</text><rect x="270.0" y="110.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="438.0" y="110.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="606.0" y="110.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="774.0" y="110.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><text x="254.0" y="174.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="end" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>orders_active_local</text><rect x="270.0" y="152.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="438.0" y="152.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="606.0" y="152.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="774.0" y="152.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="254.0" y="216.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="end" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>orders_inflight</text><rect x="270.0" y="194.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="438.0" y="194.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="606.0" y="194.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="774.0" y="194.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="254.0" y="258.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="end" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>orders_open</text><rect x="270.0" y="236.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="438.0" y="236.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="606.0" y="236.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="774.0" y="236.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="254.0" y="300.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="end" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>orders_closed</text><rect x="270.0" y="278.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="438.0" y="278.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="606.0" y="278.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="774.0" y="278.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><text x="254.0" y="342.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="end" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>venue_order_ids</text><rect x="270.0" y="320.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="438.0" y="320.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="606.0" y="320.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="774.0" y="320.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><text x="254.0" y="384.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="end" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>account_orders</text><rect x="270.0" y="362.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="438.0" y="362.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="606.0" y="362.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><rect x="774.0" y="362.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><text x="254.0" y="426.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="end">order_position 等</text><rect x="270.0" y="404.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="438.0" y="404.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="606.0" y="404.0" width="160.0" height="34.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="774.0" y="404.0" width="160.0" height="34.0" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/><text x="480.0" y="466.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">归属索引（strategy_orders、instrument_orders、venue_orders）在 add_order 时一次写入，之后不变。</text><text x="480.0" y="492.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">每个订单事件经 update_order：先在副本上 apply，成功后替换缓存里的订单，再由 refresh_order 按新状态维护这些集合。</text></g></svg>
