<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" role="img" aria-labelledby="title desc">
<title id="title">Cache 的内部布局</title><desc id="desc">Cache 用哈希表按 ID 存标的、订单簿、行情环形队列、订单、仓位和账户；订单、仓位、账户包在 SharedCell 也就是 Rc&lt;RefCell&lt;…&gt;&gt; 里。一个订单是 OrderAny 枚举，里面是具体订单类型加上 OrderCore，OrderCore 保存事件列表和当前状态。CacheIndex 是 31 个只存 ID 的映射和集合，例如 venue_order_ids、orders_open、orders_inflight。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect width="960" height="576" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="38.0" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">Cache 内部：主表存对象，索引只存 ID，行情存成定长环形队列</text><rect x="40.0" y="60.0" width="430.0" height="470.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="255.0" y="88.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">struct Cache（crates/common/src/cache/mod.rs）</text><rect x="56.0" y="104.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/><text x="68.0" y="122.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>instruments</text><text x="68.0" y="140.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AHashMap&lt;InstrumentId, InstrumentAny&gt;</text><rect x="56.0" y="150.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/><text x="68.0" y="168.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>books</text><text x="68.0" y="186.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AHashMap&lt;InstrumentId, OrderBook&gt;</text><rect x="56.0" y="196.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/><text x="68.0" y="214.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>quotes / trades</text><text x="68.0" y="232.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AHashMap&lt;InstrumentId, BoundedVecDeque&lt;…&gt;&gt;</text><rect x="56.0" y="242.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/><text x="68.0" y="260.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>bars</text><text x="68.0" y="278.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AHashMap&lt;BarType, BoundedVecDeque&lt;Bar&gt;&gt;</text><rect x="56.0" y="288.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="68.0" y="306.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>orders</text><text x="68.0" y="324.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AHashMap&lt;ClientOrderId, SharedCell&lt;OrderAny&gt;&gt;</text><rect x="56.0" y="334.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="68.0" y="352.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>positions</text><text x="68.0" y="370.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AHashMap&lt;PositionId, SharedCell&lt;Position&gt;&gt;</text><rect x="56.0" y="380.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/><text x="68.0" y="398.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>accounts</text><text x="68.0" y="416.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AHashMap&lt;AccountId, SharedCell&lt;AccountAny&gt;&gt;</text><rect x="56.0" y="426.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="68.0" y="444.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>index</text><text x="68.0" y="462.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>CacheIndex</text><rect x="56.0" y="472.0" width="398.0" height="42.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/><text x="68.0" y="490.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>database</text><text x="68.0" y="508.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Option&lt;Box&lt;dyn CacheDatabaseAdapter&gt;&gt;</text><rect x="490.0" y="60.0" width="430.0" height="210.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="705.0" y="88.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SharedCell&lt;OrderAny&gt; = Rc&lt;RefCell&lt;…&gt;&gt;</text><rect x="506.0" y="102.0" width="398.0" height="46.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="705.0" y="119.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">OrderAny::Limit(LimitOrder)</text><text x="705.0" y="139.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>price · expire_time · is_post_only …</text><rect x="506.0" y="158.0" width="398.0" height="96.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="705.0" y="180.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">OrderCore</text><text x="705.0" y="200.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>events: Vec&lt;OrderEventAny&gt;</text><text x="705.0" y="220.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>status · filled_qty · leaves_qty · avg_px</text><text x="705.0" y="240.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>client_order_id · venue_order_id …</text><line x1="454.0" y1="304.0" x2="490.0" y2="200.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-orange)"/><rect x="490.0" y="286.0" width="430.0" height="244.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="705.0" y="314.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">CacheIndex：31 个只放 ID 的表</text><text x="506.0" y="340.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>venue_order_ids: VenueOrderId → ClientOrderId</text><text x="506.0" y="363.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>client_order_ids: ClientOrderId → VenueOrderId</text><text x="506.0" y="386.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>order_strategy / order_position / order_client</text><text x="506.0" y="409.0" font-size="14" fill=