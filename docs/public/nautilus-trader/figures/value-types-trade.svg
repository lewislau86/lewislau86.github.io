<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">一行成交拆成六个值</title><desc id="desc">上面是测试数据 CSV 的第一行，下面是它变成的 TradeTick 的六个字段：品种 ID 由两个驻留字符串组成；价格 423.76 和数量 2.679 都存成全局倍数放大的整数，高精度模式下分别是 4237600000000000000 和 26790000000000000，标准模式下是 423760000000 和 2679000000；主动方是卖方；成交 ID 是栈上定长字符串；时间是 u64 纳秒。最下面是这笔成交的名义金额 1135.25304000 USDT，精度来自币种。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="600" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一行成交记录在内存里是什么：定点整数、驻留字符串、栈上字符串和 u64 纳秒</text><rect x="24.0" y="58.0" width="912.0" height="70.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="84.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">CSV 原文（test_data/binance/ethusdt-trades.csv 第 1 行）</text><text x="44.0" y="112.0" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>2020-08-14 10:00:00.223000+00:00,148568980,423.76,2.67900,True</text><line x1="480.0" y1="130.0" x2="480.0" y2="156.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="492.0" y="150.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>TradeTick</text><rect x="24.0" y="166.0" width="296.0" height="132.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="172.0" y="196.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>InstrumentId</text><text x="172.0" y="226.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ETHUSDT.BINANCE</text><text x="172.0" y="254.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Symbol + Venue</text><text x="172.0" y="280.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">两个 Ustr 句柄</text><rect x="332.0" y="166.0" width="296.0" height="132.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/><text x="480.0" y="196.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Price</text><text x="480.0" y="226.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">423.76（precision 2）</text><text x="480.0" y="254.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>HP raw 4237600000000000000</text><text x="480.0" y="280.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>std raw 423760000000</text><rect x="640.0" y="166.0" width="296.0" height="132.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/><text x="788.0" y="196.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Quantity</text><text x="788.0" y="226.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">2.67900（precision 5）</text><text x="788.0" y="254.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>HP raw 26790000000000000</text><text x="788.0" y="280.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>std raw 2679000000</text><rect x="24.0" y="316.0" width="296.0" height="132.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="172.0" y="346.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AggressorSide</text><text x="172.0" y="376.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SELL</text><text x="172.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>buyer_maker = True</text><text x="172.0" y="430.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">主动方是卖方</text><rect x="332.0" y="316.0" width="296.0" height="132.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="480.0" y="346.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>TradeId</text><text x="480.0" y="376.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>148568980</text><text x="480.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">StackStr，最多 36 字符</text><text x="480.0" y="430.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">不进全局字符串表</text><rect x="640.0" y="316.0" width="296.0" height="132.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="788.0" y="346.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>UnixNanos</text><text x="788.0" y="376.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>1597399200223000000</text><text x="788.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>2020-08-14T10:00:00.223Z</text><text x="788.0" y="430.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ts_event = ts_init</text><rect x="24.0" y="470.0" width="912.0" height="74.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="480.0" y="498.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">名义金额 Money：423.76 × 2.679 = 1135.25304000 USDT</text><text x="480.0" y="526.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Money 没有自己的精度字段，跟着币种 USDT 的精度 8 显示</text><text x="480.0" y="574.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">HP = 高精度模式，raw = 数值 × 10^16；std = 标准模式，raw = 数值 × 10^9。放大倍数是全局的，和这个值自己的精度无关。</text></g></svg>
