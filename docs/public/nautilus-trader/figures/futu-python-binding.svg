<svg xmlns="http://www.w3.org/2000/svg" width="960" height="664" viewBox="0 0 960 664" role="img" aria-labelledby="title desc">
<title id="title">富途适配器的 Python 绑定</title><desc id="desc">路线 A 和 IB 适配器一样：在富途适配器的配置和工厂类型上加 pyclass，在 src/python/mod.rs 的 pymodule 里登记类并向全局注册表登记工厂和配置的提取函数，在 crates/pyo3 里加可选依赖并用 wrap_pymodule 挂成 _libnautilus.futu，再由 python/nautilus_trader/adapters/futu 转出；用户在 Python 里把工厂和配置交给 LiveNode.builder 的 add_data_client，节点按工厂名和配置类名查注册表，得到 Rust 的工厂和配置对象。路线 B 是继承 nautilus_trader.live.clients 里的 Python 基类写纯 Python 客户端；路线 C 是独立的 Rust/PyO3 包。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="664" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">Python 怎么用上富途适配器：官方路线走 PyO3 注册表，另一条路是纯 Python 客户端</text><rect x="30.0" y="58.0" width="560.0" height="586.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="46.0" y="84.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">路线 A：Rust 适配器 + PyO3 绑定（和 IB 一样）</text><rect x="46.0" y="100.0" width="528.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="60.0" y="130.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">① 配置和工厂类型加 #[pyclass]</text><text x="60.0" y="156.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">config.rs、factories.rs：FutuDataClientConfig、FutuDataClientFactory…</text><line x1="310.0" y1="174.0" x2="310.0" y2="184.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="46.0" y="186.0" width="528.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="60.0" y="216.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">② src/python/mod.rs：#[pymodule] fn futu</text><text x="60.0" y="242.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">add_class；注册表登记工厂名 &quot;FUTU&quot; 和配置类名的提取函数</text><line x1="310.0" y1="260.0" x2="310.0" y2="270.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="46.0" y="272.0" width="528.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="60.0" y="302.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">③ crates/pyo3</text><text x="60.0" y="328.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">Cargo.toml 加可选依赖；lib.rs 挂成 _libnautilus.futu</text><line x1="310.0" y1="346.0" x2="310.0" y2="356.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="46.0" y="358.0" width="528.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="60.0" y="388.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">④ python/nautilus_trader/adapters/futu/</text><text x="60.0" y="414.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">__init__.py 转出；make py-stubs 生成 __init__.pyi</text><line x1="310.0" y1="432.0" x2="310.0" y2="442.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="46.0" y="444.0" width="528.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="60.0" y="474.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">⑤ 用户脚本</text><text x="60.0" y="500.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">builder.add_data_client(None, FutuDataClientFactory(), 配置)</text><line x1="310.0" y1="518.0" x2="310.0" y2="528.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="46.0" y="530.0" width="528.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="60.0" y="560.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">⑥ LiveNodeBuilder.add_data_client（现成）</text><text x="60.0" y="586.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">按工厂名和配置类名查注册表，取出 Rust 的工厂和配置</text><text x="310.0" y="626.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">①②在适配器 crate 里；③改两个现有文件；④⑤是 Python；⑥是现成的</text><rect x="610.0" y="58.0" width="320.0" height="586.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="626.0" y="84.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">路线 B：纯 Python 适配器</text><text x="626.0" y="118.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">继承 nautilus_trader.live.clients</text><text x="626.0" y="149.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>DataClient / ExecutionClient</text><text x="626.0" y="176.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>DataClientFactory /</text><text x="626.0" y="203.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ExecutionClientFactory</text><text x="626.0" y="230.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">注册时必须给名字</text><text x="626.0" y="261.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>add_data_client(&quot;FUTU&quot;, Factory,</text><text x="626.0" y="288.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">  DataClientConfig(…))</text><text x="626.0" y="315.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">节点用 PythonDataFactory 包一层</text><text x="626.0" y="346.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">订阅和命令钩子是 async，跑在节点的</text><text x="626.0" y="373.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">asyncio 循环上；拿到只读缓存，</text><text x="626.0" y="400.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">输出经队列交给 Rust 引擎</text><text x="626.0" y="427.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">可以直接用富途官方的 futu-api</text><text x="626.0" y="458.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">Python SDK 连 OpenD，最快跑通；</text><text x="626.0" y="485.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">代价是协议处理留在 Python 里</text><text x="626.0" y="512.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">路线 C：独立的 Rust/PyO3 包</text><text x="626.0" y="543.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">外观仍继承上面的 Python 基类，</text><text x="626.0" y="570.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">只能和已安装 wheel 里的模型类</text><text x="626.0" y="597.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">交换对象，不能共享 Rust trait 对象</text></g></svg>
