<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">K 线聚合的订阅与数据流</title><desc id="desc">上半部分是订阅时：策略调用 subscribe_bars 订阅一个 INTERNAL 的 K 线类型，DataEngine 不把它转给数据客户端，而是按标准 BarType 建一个共享的聚合器，再向客户端订阅源数据：LAST 订阅成交，BID、ASK、MID 订阅报价，组合 K 线订阅 @ 后面的源 K 线。下半部分是运行时：成交发布到 data.trades 主题，按优先级先到 Portfolio、再到聚合器的处理器、最后到策略；聚合器用 BarBuilder 累计开高低收和成交量，满足关闭条件或时间 K 线的定时器到点时生成 K 线，process_engine_bar 写入缓存并发布到 data.bars 主题，策略的 handle_bar 先更新指标，再调用 on_bar。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="650" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">K 线在 Rust 的 DataEngine 里合成：订阅时建聚合器，运行时逐笔喂进去</text><rect x="24.0" y="58.0" width="912.0" height="150.0" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="84.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">订阅时：一次 subscribe_bars(…-1-MINUTE-LAST-INTERNAL)</text><rect x="40.0" y="100.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="142.0" y="130.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">策略 subscribe_bars</text><text x="142.0" y="151.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rust 或 Python 都一样</text><text x="142.0" y="172.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">发 SubscribeBars 命令</text><line x1="246.0" y1="146.0" x2="266.0" y2="146.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="264.0" y="100.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="366.0" y="130.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">DataEngine</text><text x="366.0" y="151.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">来源是 INTERNAL</text><text x="366.0" y="172.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">不转给数据客户端</text><line x1="470.0" y1="146.0" x2="490.0" y2="146.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="488.0" y="100.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="590.0" y="130.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">建聚合器</text><text x="590.0" y="151.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按标准 BarType 只建一份</text><text x="590.0" y="172.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">多个订阅者共享</text><line x1="694.0" y1="146.0" x2="714.0" y2="146.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="712.0" y="100.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="814.0" y="130.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">向客户端订阅源数据</text><text x="814.0" y="151.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">LAST 订成交</text><text x="814.0" y="172.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">BID/ASK/MID 订报价</text><rect x="24.0" y="226.0" width="912.0" height="376.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="252.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">运行时：一笔成交怎样变成 on_bar（全程在核心线程上同步执行）</text><rect x="40.0" y="300.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="142.0" y="330.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">DataEngine 收到成交</text><text x="142.0" y="351.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">来自客户端或回测数据流</text><text x="142.0" y="372.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">先写 Cache，再发布</text><line x1="246.0" y1="346.0" x2="266.0" y2="346.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="264.0" y="300.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="366.0" y="330.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">总线 data.trades.*</text><text x="366.0" y="351.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按优先级从高到低派发</text><text x="366.0" y="372.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">聚合器 5 先于策略 0</text><line x1="470.0" y1="346.0" x2="490.0" y2="346.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="488.0" y="300.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="590.0" y="330.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BarTradeHandler</text><text x="590.0" y="351.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">订阅时登记的处理器</text><text x="590.0" y="372.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">弱引用找到聚合器</text><line x1="694.0" y1="346.0" x2="714.0" y2="346.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="712.0" y="300.0" width="204.0" height="92.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="814.0" y="330.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BarAggregator</text><text x="814.0" y="351.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">BarBuilder 累计 OHLCV</text><text x="814.0" y="372.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">满足关闭条件就 build</text><rect x="712.0" y="410.0" width="204.0" height="56.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="814.0" y="432.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">时钟定时器 TIME_BAR_…</text><text x="814.0" y="452.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">到点调用 build_bar</text><line x1="814.0" y1="410.0" x2="814.0" y2="394.0" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/><rect x="40.0" y="486.0" width="204.0" height="92.0" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text x="142.0" y="516.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">on_bar（你的代码）</text><text x="142.0" y="537.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rust 直接调用</text><text x="142.0" y="558.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Python 拿 GIL 按名字调用</text><line x1="266.0" y1="532.0" x2="246.0" y2="532.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="264.0" y="486.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="366.0" y="516.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">handle_bar（框架）</text><text x="366.0" y="537.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">先更新注册的指标</text><text x="366.0" y="558.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">组件不在 RUNNING 就丢弃</text><line x1="490.0" y1="532.0" x2="470.0" y2="532.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="488.0" y="486.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="590.0" y="516.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">总线 data.bars.{类型}</text><text x="590.0" y="537.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">主题用标准 BarType</text><text x="590.0" y="558.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">组合 K 线也去掉 @ 部分</text><line x1="714.0" y1="532.0" x2="694.0" y2="532.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="712.0" y="486.0" width="204.0" height="92.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="814.0" y="516.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">process_engine_bar</text><text x="814.0" y="537.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">可选的时间戳顺序检查</text><text x="814.0" y="558.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">写 Cache，再发布</text><polyline points="934.0,346.0 926.0,346.0 926.0,532.0 918.0,532.0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><text x="480.0" y="628.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">聚合器的优先级（5）高于策略（0）：凑满一根 K 线的那笔成交，策略先收到 on_bar，再收到这笔成交的 on_trade_tick。</text></g></svg>
