4" fill="#172033" font-weight="bold" text-anchor="middle">RiskEngine</text><text x="282.0" y="451.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>risk</text><rect x="352.0" y="412.0" width="132.0" height="50.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="418.0" y="431.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">ExecutionEngine</text><text x="418.0" y="451.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>execution</text><rect x="488.0" y="412.0" width="132.0" height="50.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="554.0" y="431.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">OrderEmulator</text><text x="554.0" y="451.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>execution</text><rect x="80.0" y="476.0" width="172.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="166.0" y="498.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Cache</text><text x="166.0" y="518.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>common/src/cache</text><rect x="264.0" y="476.0" width="172.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="350.0" y="498.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Portfolio</text><text x="350.0" y="518.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>crates/portfolio</text><rect x="448.0" y="476.0" width="172.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="534.0" y="498.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Clock</text><text x="534.0" y="518.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Virtual / Live</text><line x1="146.0" y1="400.0" x2="146.0" y2="410.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/><line x1="282.0" y1="400.0" x2="282.0" y2="410.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/><line x1="418.0" y1="400.0" x2="418.0" y2="410.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/><line x1="554.0" y1="400.0" x2="554.0" y2="410.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/><line x1="350.0" y1="354.0" x2="350.0" y2="364.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/><rect x="660.0" y="208.0" width="240.0" height="340.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="780.0" y="232.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">Tokio 运行时（后台线程）</text><rect x="676.0" y="246.0" width="208.0" height="58.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="780.0" y="269.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">DataClient</text><text x="780.0" y="289.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>crates/adapters/&lt;venue&gt;</text><rect x="676.0" y="316.0" width="208.0" height="58.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="780.0" y="339.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">ExecutionClient</text><text x="780.0" y="359.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>crates/adapters/&lt;venue&gt;</text><rect x="676.0" y="386.0" width="208.0" height="50.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="780.0" y="405.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">网络：HTTP / WebSocket</text><text x="780.0" y="425.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>crates/network</text><rect x="676.0" y="448.0" width="208.0" height="50.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="780.0" y="467.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">日志 · 写库 · 写数据目录</text><text x="780.0" y="487.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">后台写入任务</text><text x="780.0" y="528.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">只通过 channel 把事件送回核心</text><line x1="676.0" y1="290.0" x2="642.0" y2="380.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-orange)"/><line x1="676.0" y1="350.0" x2="642.0" y2="386.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-orange)"/><rect x="60.0" y="574.0" width="400.0" height="44.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="260.0" y="601.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">回测：成交由节点内的 SimulatedExchange 撮合</text><rect x="500.0" y="574.0" width="420.0" height="44.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="710.0" y="601.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">实盘：交易所 · 券商（REST / WebSocket / 私有 TCP）</text><line x1="780.0" y1="548.0" x2="780.0" y2="572.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" ma