<svg xmlns="http://www.w3.org/2000/svg" width="960" height="636" viewBox="0 0 960 636" role="img" aria-labelledby="title desc">
<title id="title">NautilusTrader 节点全貌</title><desc id="desc">最上层是 Python 应用，经 PyO3 扩展模块进入 Rust。一个进程一个节点，节点外壳是 BacktestEngine 或 LiveNode，内部的 NautilusKernel 在单一核心线程上运行 Trader、MessageBus、各引擎、Cache、Portfolio 和 Clock；适配器客户端、网络、日志和持久化写入跑在 Tokio 后台线程，只通过 channel 把事件送回核心线程。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect width="960" height="636" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="38.0" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">一个 NautilusTrader 节点：Python 控制面、PyO3 边界、Rust 内核与后台 I/O</text><rect x="40.0" y="58.0" width="880.0" height="54.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="60.0" y="82.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">Python 应用层</text><text x="60.0" y="102.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>python/nautilus_trader/</text><text x="600.0" y="92.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">Strategy / DataActor 子类 · 配置 · 节点编排 · 报表 · 自定义适配器</text><rect x="40.0" y="122.0" width="880.0" height="40.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="60.0" y="147.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">PyO3 绑定</text><text x="560.0" y="147.0" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">扩展模块 nautilus_trader._libnautilus = crates/pyo3 汇总各 crate 的 src/python/</text><rect x="40.0" y="176.0" width="880.0" height="384.0" rx="14" fill="#ffffff" stroke="#172033" stroke-width="1.8"/><text x="60.0" y="198.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">一个进程只跑一个节点</text><rect x="60.0" y="208.0" width="300.0" height="46.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="210.0" y="225.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BacktestEngine / BacktestNode</text><text x="210.0" y="246.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>crates/backtest</text><rect x="370.0" y="208.0" width="270.0" height="46.0" rx="10" fill="#f1f5f9" strok