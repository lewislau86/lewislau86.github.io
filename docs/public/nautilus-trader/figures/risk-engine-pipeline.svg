<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">风控流水线</title><desc id="desc">五个阶段从左到右：前置检查只减仓约束和品种；单张订单检查价格和数量的精度、正负与上下限以及 GTD；账户层面选定账户后检查名义金额、余额或初始保证金并扣除预留；交易状态决定放行或拒绝；限流器默认每秒 100 条，超出即拒绝。任何一步失败都生成 OrderDenied，通过后交给执行引擎。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="490" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一张 SubmitOrder 在 RiskEngine 里的路径</text><rect x="24.0" y="70.0" width="166.0" height="170.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="107.0" y="98.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">① 前置</text><text x="107.0" y="130.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">只减仓不增仓</text><text x="107.0" y="156.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">品种在缓存里</text><line x1="107.0" y1="242.0" x2="107.0" y2="288.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><line x1="192.0" y1="155.0" x2="208.0" y2="155.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="210.0" y="70.0" width="166.0" height="170.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="293.0" y="98.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">② check_order</text><text x="293.0" y="130.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">价格精度与正负</text><text x="293.0" y="156.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">数量精度与上下限</text><text x="293.0" y="182.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">GTD 未过期</text><line x1="293.0" y1="242.0" x2="293.0" y2="288.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><line x1="378.0" y1="155.0" x2="394.0" y2="155.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="396.0" y="70.0" width="166.0" height="170.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="479.0" y="98.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">③ 账户层面</text><text x="479.0" y="130.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">选定账户</text><text x="479.0" y="156.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">名义金额上下限</text><text x="479.0" y="182.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">余额或初始保证金</text><text x="479.0" y="208.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">扣除预留</text><line x1="479.0" y1="242.0" x2="479.0" y2="288.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><line x1="564.0" y1="155.0" x2="580.0" y2="155.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="582.0" y="70.0" width="166.0" height="170.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="665.0" y="98.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">④ 交易状态</text><text x="665.0" y="130.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">ACTIVE 放行</text><text x="665.0" y="156.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">REDUCING 只减仓</text><text x="665.0" y="182.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">HALTED 拒绝</text><line x1="665.0" y1="242.0" x2="665.0" y2="288.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><line x1="750.0" y1="155.0" x2="766.0" y2="155.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="768.0" y="70.0" width="166.0" height="170.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="851.0" y="98.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">⑤ 限流器</text><text x="851.0" y="130.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">默认 100 条/秒</text><text x="851.0" y="156.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">超出即拒绝</text><line x1="851.0" y1="242.0" x2="851.0" y2="288.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="24.0" y="290.0" width="912.0" height="56.0" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="480.0" y="324.0" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">任何一步失败：生成 OrderDenied（改单为 OrderModifyDenied），带标准化原因，策略 on_order_denied 收到</text><rect x="24.0" y="366.0" width="912.0" height="96.0" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="392.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">通过 → ExecEngine.queue_execute → 执行引擎 → 执行客户端</text><text x="44.0" y="418.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">不检查：价格是否对齐最小变动价位、每手股数；不经过风控：撤单、查询、持有中的仿真单</text><text x="44.0" y="442.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">bypass = true：直接转发执行引擎，交易状态也不再生效</text></g></svg>
