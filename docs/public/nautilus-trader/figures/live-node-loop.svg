<svg xmlns="http://www.w3.org/2000/svg" width="960" height="588" viewBox="0 0 960 588" role="img" aria-labelledby="title desc">
<title id="title">LiveNode 的事件循环</title><desc id="desc">左边是 Tokio 工作线程上的消息来源；中间是 biased select 的 12 个分支，从上到下优先级递减：信号、停止检查、关闭截止时间、待派发回调、维护计时器、时间事件、系统事件与命令、执行事件、交易命令、外部消息、数据事件、数据命令；右边是每类消息在核心线程上的去向。底部是启动和停止的顺序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="588" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">LiveNode 的事件循环：biased select 从上到下取消息</text><rect x="24.0" y="62.0" width="220.0" height="396.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="134.0" y="88.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">Tokio 工作线程</text><text x="134.0" y="155.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">实时计时器</text><text x="134.0" y="201.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">网络层</text><text x="134.0" y="257.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">执行客户端</text><text x="134.0" y="303.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">策略 / 风控</text><text x="134.0" y="335.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">外部消息流</text><text x="134.0" y="377.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">数据客户端</text><rect x="300.0" y="66.0" width="300.0" height="28.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="450.0" y="85.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">1. 信号 SIGINT / SIGTERM</text><rect x="300.0" y="98.0" width="300.0" height="28.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="450.0" y="117.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">2. 停止检查（100 ms）</text><rect x="300.0" y="130.0" width="300.0" height="28.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="450.0" y="149.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">3. 关闭截止时间</text><rect x="300.0" y="162.0" width="300.0" height="28.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="450.0" y="181.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">4. 待派发回调</text><rect x="300.0" y="194.0" width="300.0" height="28.0" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="450.0" y="213.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">5. 维护计时器（100 ms）</text><rect x="300.0" y="226.0" width="300.0" height="28.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="245.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">6. 时间事件</text><rect x="300.0" y="258.0" width="300.0" height="28.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="277.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">7. 系统事件 / 系统命令</text><rect x="300.0" y="290.0" width="300.0" height="28.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="309.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">8. 执行事件</text><rect x="300.0" y="322.0" width="300.0" height="28.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="341.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">9. 交易命令</text><rect x="300.0" y="354.0" width="300.0" height="28.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="373.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">10. 外部消息总线入站</text><rect x="300.0" y="386.0" width="300.0" height="28.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="405.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">11. 数据事件</text><rect x="300.0" y="418.0" width="300.0" height="28.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="437.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">12. 数据命令</text><line x1="280.0" y1="70.0" x2="280.0" y2="440.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="268.0" y="456.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end">优先</text><line x1="244.0" y1="155.0" x2="298.0" y2="245.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="244.0" y1="201.0" x2="298.0" y2="277.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="244.0" y1="257.0" x2="298.0" y2="309.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="244.0" y1="303.0" x2="298.0" y2="341.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="244.0" y1="335.0" x2="298.0" y2="373.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="244.0" y1="377.0" x2="298.0" y2="405.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="650.0" y="62.0" width="286.0" height="396.0" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="793.0" y="88.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">核心线程上的去向</text><text x="793.0" y="124.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">维护：对账、清理、审计、队列监控</text><text x="793.0" y="164.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">时间事件 → 组件回调</text><text x="793.0" y="204.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">系统 → 套接字状态 / 重连</text><text x="793.0" y="244.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">执行事件 → ExecEngine.process</text><text x="793.0" y="284.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">交易命令 → 风控 / 执行引擎</text><text x="793.0" y="324.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">外部消息 → 本地总线</text><text x="793.0" y="364.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">数据事件 → DataEngine</text><text x="793.0" y="404.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">数据命令 → DataEngine</text><text x="793.0" y="430.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">防饿死：skip_time、skip_data</text><text x="793.0" y="450.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每 64 次派发 yield 一次</text><rect x="24.0" y="476.0" width="912.0" height="92.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="44.0" y="502.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">启动</text><text x="96.0" y="502.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">缓存 → 绑定发送端 → 内核 start → 连接数据客户端 → 品种灌入缓存 → 连接执行客户端 → 对账 → start_trader → 运行</text><text x="44.0" y="538.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">停止</text><text x="96.0" y="538.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">停 Trader（on_stop）→ 宽限期 delay_post_stop 处理残余事件 → 并行收尾报告任务与断开客户端 → 内核 finalize_stop</text></g></svg>
