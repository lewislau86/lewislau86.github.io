<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" role="img" aria-labelledby="title desc">
<title id="title">Python 与 Rust 的边界</title><desc id="desc">上半部分是四行表格：接口以生成的类型存根为准；数值是定点整数，官方 wheel 是 16 位小数的高精度模式，运算结果可能是 Price、Decimal 或 float；错误在边界上映射为 ValueError、TypeError、OverflowError；Python 读到的是拷贝或快照。下半部分对比 v1 迁移到 v2 时两类失败：导入路径、方法名、参数类型的错误会立刻报出；旧回调名不再被调用、NO_* 常量变成 None、avg_px 变成 Decimal、把 is_initialized 直接换成 is_ready 会改变含义，这些不会报错。底部建议用类型检查器和回测核对。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="544" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">Python 与 Rust 的边界：跨过去的是什么，迁移时哪些错误会沉默</text><rect x="24.0" y="60.0" width="912.0" height="44.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="250.0" y="88.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">边界上发生什么</text><text x="560.0" y="88.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">Python 这边看到的</text><rect x="24.0" y="112.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="140.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">接口</text><text x="250.0" y="140.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">生成的 .pyi 存根</text><text x="560.0" y="140.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">存根里没有的运行时属性不算公开接口</text><rect x="24.0" y="164.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="192.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">数值</text><text x="250.0" y="192.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">定点整数，wheel 为 16 位小数</text><text x="560.0" y="192.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">同类相加仍是 Price；乘法、配 int 得 Decimal</text><rect x="24.0" y="216.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="244.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">错误</text><text x="250.0" y="244.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">参数先校验，失败映射为异常</text><text x="560.0" y="244.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">ValueError、TypeError、OverflowError</text><rect x="24.0" y="268.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="296.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">对象</text><text x="250.0" y="296.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">读到的是拷贝或快照</text><text x="560.0" y="296.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">改了不影响内核；运行中节点被借出</text><rect x="24.0" y="332.0" width="446.0" height="150.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="362.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">v1 → v2：响亮的失败</text><text x="44.0" y="392.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">旧的导入路径：ImportError</text><text x="44.0" y="416.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">旧的方法名：AttributeError</text><text x="44.0" y="440.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">旧的参数类型：TypeError</text><text x="44.0" y="464.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">启动或调用时立刻发现</text><rect x="490.0" y="332.0" width="446.0" height="150.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="510.0" y="362.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">v1 → v2：沉默的失败</text><text x="510.0" y="392.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">旧回调名（on_quote_tick）：从不被调用</text><text x="510.0" y="416.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">NO_ORDER_SIDE 等：现在是 None</text><text x="510.0" y="440.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">avg_px：float 变 Decimal，== 比较变了</text><text x="510.0" y="464.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">is_initialized 直接换成 is_ready()：含义变了</text><text x="480.0" y="520.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">对策：用类型检查器对照存根，跑一遍回测核对回调次数和结果，再上实盘。</text></g></svg>
