<svg xmlns="http://www.w3.org/2000/svg" width="960" height="534" viewBox="0 0 960 534" role="img" aria-labelledby="title desc">
<title id="title">对账的两个阶段</title><desc id="desc">上面是启动对账：拉取报告、去重、订单对账、成交对账、仓位对账，一致则启动 Trader，否则生成 RECONCILIATION 订单补齐，仍不一致则启动失败。中间是运行期的三种检查及默认设置。下面对比在途查询耗尽后两种恢复策略的处理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="534" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">对账：启动时一次，运行期周期检查</text><text x="24.0" y="70.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">启动（连接执行客户端之后、启动 Trader 之前）</text><rect x="24.0" y="84.0" width="136.0" height="64.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="92.0" y="110.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">拉报告</text><text x="92.0" y="130.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">订单、成交、仓位</text><line x1="160.0" y1="116.0" x2="172.0" y2="116.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="174.0" y="84.0" width="136.0" height="64.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="242.0" y="110.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">去重</text><text x="242.0" y="130.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">重复报告记警告</text><line x1="310.0" y1="116.0" x2="322.0" y2="116.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="324.0" y="84.0" width="136.0" height="64.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="392.0" y="110.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">订单对账</text><text x="392.0" y="130.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">外部订单新建</text><line x1="460.0" y1="116.0" x2="472.0" y2="116.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="474.0" y="84.0" width="136.0" height="64.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="542.0" y="110.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">成交对账</text><text x="542.0" y="130.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">补 OrderFilled</text><line x1="610.0" y1="116.0" x2="622.0" y2="116.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="624.0" y="84.0" width="136.0" height="64.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="692.0" y="110.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">仓位对账</text><text x="692.0" y="130.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按账户和品种比较</text><line x1="774.0" y1="116.0" x2="790.0" y2="116.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="792.0" y="76.0" width="144.0" height="80.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="864.0" y="100.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">一致？</text><text x="864.0" y="120.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">是 → 启动 Trader</text><text x="864.0" y="140.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">否 → 生成订单</text><rect x="24.0" y="166.0" width="912.0" height="50.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="480.0" y="188.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">生成 RECONCILIATION 合成市价单补齐（generate_missing_orders，默认开启）</text><text x="480.0" y="208.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">补齐后仍超出容差 → 启动失败，策略不启动；缺少仓位报告 ≠ 空仓</text><text x="24.0" y="250.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">运行期（维护计时器调度，startup_delay 10 秒后开始）</text><rect x="24.0" y="266.0" width="912.0" height="38.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="291.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="start">在途检查</text><text x="180.0" y="291.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">默认每 2 秒；在途 &gt; 5 秒的订单单独查询，最多 5 次</text><rect x="24.0" y="312.0" width="912.0" height="38.0" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="337.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="start">未结订单检查</text><text x="180.0" y="337.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">默认关闭；只看未结列表时，缺失 5 次后单独查询，查不到不下结论</text><rect x="24.0" y="358.0" width="912.0" height="38.0" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="383.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="start">仓位检查</text><text x="180.0" y="383.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">默认关闭；先补权威成交，再生成合成事件；查询失败本轮跳过</text><text x="24.0" y="426.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">在途查询耗尽后</text><rect x="24.0" y="440.0" width="446.0" height="74.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="247.0" y="461.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">RetainUnresolved（默认）</text><text x="247.0" y="481.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">未确认的提交保持未解决，发布 SubmissionRecoveryExhausted</text><text x="247.0" y="501.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">待撤 / 待改：拒绝命令，订单恢复原状态</text><rect x="490.0" y="440.0" width="446.0" height="74.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="713.0" y="461.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">ResolveLocally</text><text x="713.0" y="481.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">SUBMITTED → 拒绝（INFLIGHT_TIMEOUT）</text><text x="713.0" y="501.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">PENDING_CANCEL / UPDATE → 视为已撤销</text></g></svg>
