<svg xmlns="http://www.w3.org/2000/svg" width="960" height="564" viewBox="0 0 960 564" role="img" aria-labelledby="title desc">
<title id="title">Python 里跑实盘节点的两种模式</title><desc id="desc">表格对比 run() 和 run_async()：前者占用调用它的线程并安装 SIGINT、SIGTERM 处理，后者托管在宿主的 asyncio 循环上、信号归宿主；托管模式下运行中只能用事先取好的 cache 和 portfolio，dispose 要等任务结束，不支持数据库后端的缓存。底部是共同规则：同样的生命周期，一个进程一个节点，换节点要先释放旧节点的引用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="564" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">Python 里跑实盘节点：run() 占住线程，run_async() 托管在你的事件循环里</text><rect x="24.0" y="60.0" width="912.0" height="44.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="88.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start"></text><text x="330.0" y="88.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>run()</text><text x="640.0" y="88.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>run_async()</text><rect x="24.0" y="112.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="140.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">谁占用线程</text><text x="330.0" y="140.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">调用 run() 的线程，直到关闭完成</text><text x="640.0" y="140.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">你的 asyncio 循环；节点定期让出</text><rect x="24.0" y="164.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="192.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">信号</text><text x="330.0" y="192.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">节点安装 SIGINT / SIGTERM 处理</text><text x="640.0" y="192.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">节点不装，归宿主应用</text><rect x="24.0" y="216.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="244.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">怎样停止</text><text x="330.0" y="244.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">信号，或别的线程里 handle.stop()</text><text x="640.0" y="244.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">handle.stop() 后 await；或取消任务</text><rect x="24.0" y="268.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="296.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">运行中读状态</text><text x="330.0" y="296.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">—</text><text x="640.0" y="296.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">只能用运行前取好的 cache、portfolio</text><rect x="24.0" y="320.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="348.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">dispose()</text><text x="330.0" y="348.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">run() 返回之后</text><text x="640.0" y="348.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">运行中调用什么也不做；任务结束后再调</text><rect x="24.0" y="372.0" width="912.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.0"/><text x="44.0" y="400.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">数据库后端的缓存</text><text x="330.0" y="400.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">原生客户端可以</text><text x="640.0" y="400.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">拒绝：后端会阻塞宿主循环</text><rect x="24.0" y="436.0" width="912.0" height="108.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="44.0" y="464.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">两种模式共同的规则</text><text x="44.0" y="492.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">同样的启动顺序、维护、对账和关闭（第 30、34 章）；一个进程、一个线程只能有一个节点</text><text x="44.0" y="520.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">换节点：只 dispose() 不够，要 del 旧节点（必要时 gc.collect()）之后才能再 build</text></g></svg>
