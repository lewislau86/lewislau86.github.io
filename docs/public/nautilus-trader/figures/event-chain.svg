<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">事件链与事件存储</title><desc id="desc">上半是一笔成交的处理：适配器发来 OrderFilled，执行引擎先更新订单、再确定仓位 ID 并更新仓位，然后发布订单事件和仓位事件，账户状态随后更新。中间是消息总线，下游处理器和抓取点看到同一个消息。下半是可选的事件存储：抓取适配器按事件和命令 ID 去重，写入线程分配序号并按批提交，写进按运行划分的 redb 文件；写入失败只停止记录、不打断交易，下次启动时封存这个运行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="580" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一笔成交的事件链，以及事件存储怎样把它记下来</text><rect x="24.0" y="58.0" width="912.0" height="196.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="84.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">产生与传播（执行引擎 handle_order_fill）</text><rect x="40.0" y="100.0" width="166.0" height="84.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="123.0" y="126.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">适配器</text><text x="123.0" y="147.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>OrderFilled</text><text x="123.0" y="168.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">交易所成交回报</text><line x1="208.0" y1="142.0" x2="220.0" y2="142.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="220.0" y="100.0" width="166.0" height="84.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="303.0" y="126.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">更新订单</text><text x="303.0" y="147.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>apply(event)</text><text x="303.0" y="168.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">写回缓存</text><line x1="388.0" y1="142.0" x2="400.0" y2="142.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="400.0" y="100.0" width="166.0" height="84.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="483.0" y="126.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">更新仓位</text><text x="483.0" y="147.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">定 position_id</text><text x="483.0" y="168.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Position.apply</text><line x1="568.0" y1="142.0" x2="580.0" y2="142.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="580.0" y="100.0" width="166.0" height="84.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="663.0" y="126.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">发布订单事件</text><text x="663.0" y="147.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>events.order.{S}</text><text x="663.0" y="168.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">组合先、策略后</text><line x1="748.0" y1="142.0" x2="760.0" y2="142.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="760.0" y="100.0" width="166.0" height="84.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="843.0" y="126.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">发布仓位事件</text><text x="843.0" y="147.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>events.position.{S}</text><text x="843.0" y="168.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Changed / Closed</text><rect x="580.0" y="196.0" width="340.0" height="46.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="750.0" y="223.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">随后：AccountState → events.account.{A}</text><text x="44.0" y="224.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">S = 策略 ID，A = 账户 ID</text><rect x="24.0" y="272.0" width="912.0" height="40.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="480.0" y="298.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">消息总线派发：下游处理器和抓取点看到同一个消息</text><line x1="480.0" y1="256.0" x2="480.0" y2="270.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="24.0" y="330.0" width="912.0" height="220.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="44.0" y="356.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">记录（可选：内核构建时传入 EventStoreFactory 才打开）</text><line x1="480.0" y1="314.0" x2="480.0" y2="368.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="44.0" y="380.0" width="280.0" height="84.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="184.0" y="406.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BusCaptureAdapter</text><text x="184.0" y="427.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按事件 ID、命令 ID</text><text x="184.0" y="448.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">去重：同一消息只记一次</text><line x1="326.0" y1="422.0" x2="344.0" y2="422.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="344.0" y="380.0" width="280.0" height="84.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="484.0" y="406.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">EventStoreWriter</text><text x="484.0" y="427.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">有界通道 10,000</text><text x="484.0" y="448.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">分配 seq，每批 100 条或 5 ms</text><line x1="626.0" y1="422.0" x2="644.0" y2="422.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="644.0" y="380.0" width="280.0" height="84.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="784.0" y="406.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">redb 运行文件</text><text x="784.0" y="427.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>&lt;base&gt;/&lt;instance&gt;/&lt;run&gt;.redb</text><text x="784.0" y="448.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">记录 + 索引 + 清单 + 锚点</text><text x="480.0" y="494.0" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">阻塞超过 250 ms 或提交失败：停止记录，交易照常继续</text><text x="480.0" y="522.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">下次启动封存：Ended / CrashedRecovered / Quarantined；回放按 seq 恢复缓存</text></g></svg>
