<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">DST 的两层与种子</title><desc id="desc">三列分别是普通构建、源码里的写法、仿真构建。第一层由门面把 Tokio 的时间、任务、运行时和信号换成 madsim；第二层用接缝处理墙上时间、随机数、迭代顺序和 select 轮询顺序。左下是 Clippy 和提交前钩子的静态检查，右下是种子：同一个种子得到相同的执行，失败时用 MADSIM_TEST_SEED 重放。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="530" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">DST：一份源码，两种构建，一个种子</text><text x="170.0" y="70.0" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">普通构建</text><text x="480.0" y="70.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">源码里写的</text><text x="790.0" y="70.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">simulation + --cfg madsim</text><rect x="24.0" y="84.0" width="292.0" height="40.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="108.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">tokio::time / task / runtime</text><rect x="334.0" y="84.0" width="292.0" height="40.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="108.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">dst::time · dst::task · dst::runtime</text><rect x="644.0" y="84.0" width="292.0" height="40.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="790.0" y="108.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">madsim（单线程、虚拟时间）</text><line x1="332.0" y1="104.0" x2="318.0" y2="104.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="628.0" y1="104.0" x2="642.0" y2="104.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="24.0" y="134.0" width="292.0" height="40.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="158.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">tokio::signal</text><rect x="334.0" y="134.0" width="292.0" height="40.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="158.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">dst::signal</text><rect x="644.0" y="134.0" width="292.0" height="40.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="790.0" y="158.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">ctrl_c 可注入；terminate 永不完成</text><line x1="332.0" y1="154.0" x2="318.0" y2="154.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="628.0" y1="154.0" x2="642.0" y2="154.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="24.0" y="184.0" width="292.0" height="40.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="208.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">SystemTime::now()</text><rect x="334.0" y="184.0" width="292.0" height="40.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="208.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">duration_since_unix_epoch</text><rect x="644.0" y="184.0" width="292.0" height="40.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="790.0" y="208.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">madsim 虚拟墙上时间</text><line x1="332.0" y1="204.0" x2="318.0" y2="204.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="628.0" y1="204.0" x2="642.0" y2="204.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="24.0" y="234.0" width="292.0" height="40.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="258.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">rand::rng()</text><rect x="334.0" y="234.0" width="292.0" height="40.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="258.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">UUID4、抖动、成交模型接缝</text><rect x="644.0" y="234.0" width="292.0" height="40.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="790.0" y="258.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">madsim::rand（种子）</text><line x1="332.0" y1="254.0" x2="318.0" y2="254.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="628.0" y1="254.0" x2="642.0" y2="254.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="24.0" y="284.0" width="292.0" height="40.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="308.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">AHashMap 随机顺序</text><rect x="334.0" y="284.0" width="292.0" height="40.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="308.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">IndexMap / IndexSet / 排序</text><rect x="644.0" y="284.0" width="292.0" height="40.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="790.0" y="308.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">顺序固定</text><line x1="332.0" y1="304.0" x2="318.0" y2="304.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="628.0" y1="304.0" x2="642.0" y2="304.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="24.0" y="334.0" width="292.0" height="40.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="358.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">select! 随机轮询</text><rect x="334.0" y="334.0" width="292.0" height="40.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="358.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">select! { biased; … }</text><rect x="644.0" y="334.0" width="292.0" height="40.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="790.0" y="358.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">按书写顺序</text><line x1="332.0" y1="354.0" x2="318.0" y2="354.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="628.0" y1="354.0" x2="642.0" y2="354.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><text x="170.0" y="400.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">第一层：前两行（门面替换运行时）</text><text x="790.0" y="400.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">第二层：后四行（接缝与约定）</text><rect x="24.0" y="418.0" width="600.0" height="92.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="44.0" y="444.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">守住约定</text><text x="44.0" y="470.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">Clippy：禁 getrandom 直调、LocalSet</text><text x="44.0" y="494.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">check-dst-conventions：7 条规则，17 个 crate；例外写 // dst-ok</text><rect x="644.0" y="418.0" width="292.0" height="92.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="790.0" y="444.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">种子</text><text x="790.0" y="470.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">同种子 → 同调度、同计时器、同随机数</text><text x="790.0" y="494.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">MADSIM_TEST_SEED=… 重放失败</text></g></svg>
