<svg xmlns="http://www.w3.org/2000/svg" width="960" height="502" viewBox="0 0 960 502" role="img" aria-labelledby="title desc">
<title id="title">Python 对象与 Rust 状态的三种关系</title><desc id="desc">第一种是值对象，例如 QuoteTick、Price、LimitOrder，Python 与 Rust 之间传递时各自持有一份拷贝；第二种是句柄，例如 Cache、Portfolio、Clock，Python 对象只包着 Rc&lt;RefCell&lt;…&gt;&gt;，读的是内核里唯一的那份状态；第三种是可继承的基类 Strategy，Rust 端的 PyStrategyInner 实现 Strategy trait，通过弱引用回调 Python 子类的 on_quote 等方法。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect width="960" height="502" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="38.0" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">Python 里拿到的对象和 Rust 状态有三种关系</text><rect x="40.0" y="62.0" width="290.0" height="392.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="185.0" y="92.0" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">① 值对象：跨边界就复制</text><rect x="56.0" y="114.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="185.0" y="138.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Python 侧</text><text x="185.0" y="162.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">QuoteTick、Price、订单</text><line x1="185.0" y1="178.0" x2="185.0" y2="206.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/><rect x="56.0" y="208.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="185.0" y="232.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">绑定方式</text><text x="185.0" y="256.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#[pyclass(from_py_object)]</text><line x1="185.0" y1="272.0" x2="185.0" y2="300.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/><rect x="56.0" y="302.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="185.0" y="326.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rust 侧</text><text x="185.0" y="350.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">同名 struct 的另一份拷贝</text><text x="185.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">策略收到的 quote、</text><text x="185.0" y="424.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">cache.order() 返回的订单，</text><text x="185.0" y="444.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">都是那一刻的快照</text><rect x="345.0" y="62.0" width="290.0" height="392.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="490.0" y="92.0" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">② 句柄：共享同一份状态</text><rect x="361.0" y="114.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="490.0" y="138.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Python 侧</text><text x="490.0" y="162.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Cache、Portfolio、Clock</text><line x1="490.0" y1="178.0" x2="490.0" y2="206.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="361.0" y="208.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="490.0" y="232.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">绑定方式</text><text x="490.0" y="256.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>PyCache(Rc&lt;RefCell&lt;Cache&gt;&gt;)</text><line x1="490.0" y1="272.0" x2="490.0" y2="300.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="361.0" y="302.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="490.0" y="326.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rust 侧</text><text x="490.0" y="350.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">内核里唯一的那个 Cache</text><text x="490.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">句柄本身不存数据，</text><text x="490.0" y="424.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每次读都去借 Rust 的状态，</text><text x="490.0" y="444.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">unsendable：不能跨线程</text><rect x="650.0" y="62.0" width="290.0" height="392.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="795.0" y="92.0" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">③ 基类：Rust 回调 Python</text><rect x="666.0" y="114.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="795.0" y="138.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Python 侧</text><text x="795.0" y="162.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>class MyStrategy(Strategy)</text><line x1="795.0" y1="178.0" x2="795.0" y2="206.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="666.0" y="208.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="795.0" y="232.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>PyStrategy.inner</text><text x="795.0" y="256.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Rc&lt;UnsafeCell&lt;Inner&gt;&gt;</text><line x1="795.0" y1="272.0" x2="795.0" y2="300.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="666.0" y="302.0" width="258.0" height="62.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="795.0" y="326.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rust 侧</text><text x="795.0" y="350.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">StrategyCore + 弱引用 py_self</text><text x="795.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Inner 实现 Strategy trait，</text><text x="795.0" y="424.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">事件到来时用 call_method1</text><text x="795.0" y="444.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">调回 Python 的 on_quote 等</text><text x="480.0" y="482.0" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">所以：不要缓存旧的订单对象等它“自己变”；要最新状态就再向 cache 要一次。</text></g></svg>
