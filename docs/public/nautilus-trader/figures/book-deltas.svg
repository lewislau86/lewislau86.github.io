<title id="title">二档订单簿的四个状态</title><desc id="desc">四列分别是一本 ETHUSDT 二档簿在快照、更新买一数量、删除卖一、更新一个不存在的买价之后的状态。快照后最优买卖价是 423.70 和 423.80，价差 0.10；更新后买一数量变成 1.5；删除 423.80 后最优卖价变成 423.90，价差扩大到 0.20；最后一条更新在簿里新增了 423.65 这一档。</desc>
