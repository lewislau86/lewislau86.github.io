<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">实盘节点的线程分布</title><desc id="desc">左边是全局 Tokio 运行时的工作线程，运行 WebSocket、HTTP、重连心跳和实时计时器；中间是核心线程，运行节点事件循环、引擎、缓存、组合和策略回调；右边是独立的日志线程。三者之间只通过 channel 通信。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一个实盘节点的线程分布</text><rect x="24.0" y="64.0" width="290.0" height="360.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="169.0" y="92.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">全局 Tokio 运行时</text><text x="169.0" y="116.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">get_runtime()，工作线程 × N</text><rect x="44.0" y="134.0" width="250.0" height="58.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="169.0" y="157.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">WebSocket 读写</text><text x="169.0" y="177.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">行情、订单回报</text><rect x="44.0" y="204.0" width="250.0" height="58.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="169.0" y="227.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">HTTP 请求</text><text x="169.0" y="247.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">下单、查询、对账</text><rect x="44.0" y="274.0" width="250.0" height="58.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="169.0" y="297.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">重连与心跳</text><text x="169.0" y="317.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">网络层后台任务</text><rect x="44.0" y="344.0" width="250.0" height="58.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="169.0" y="367.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">实时计时器</text><text x="169.0" y="387.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">等待到点</text><rect x="352.0" y="64.0" width="290.0" height="360.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="497.0" y="92.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">核心线程</text><text x="497.0" y="116.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Python：调用 run() 的线程</text><text x="497.0" y="138.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rust：驱动 main 的线程</text><rect x="372.0" y="160.0" width="250.0" height="66.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="497.0" y="187.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">LiveNode 事件循环</text><text x="497.0" y="207.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">AsyncRunner 从 channel 取消息</text><rect x="372.0" y="244.0" width="250.0" height="66.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="497.0" y="271.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">引擎、缓存、组合</text><text x="497.0" y="291.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rc&lt;RefCell&lt;…&gt;&gt;，只在此线程</text><rect x="372.0" y="328.0" width="250.0" height="66.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="497.0" y="355.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">策略、Actor 回调</text><text x="497.0" y="375.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Python 策略回调时取 GIL</text><rect x="680.0" y="64.0" width="256.0" height="160.0" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="808.0" y="92.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">日志线程 logging</text><text x="808.0" y="120.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">普通操作系统线程</text><text x="808.0" y="144.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">不属于 Tokio</text><text x="808.0" y="176.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">写终端和文件</text><text x="808.0" y="200.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">磁盘 I/O 不阻塞核心线程</text><rect x="680.0" y="244.0" width="256.0" height="180.0" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="808.0" y="272.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">通信方式</text><text x="808.0" y="302.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">行情、订单事件 → channel</text><text x="808.0" y="326.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">命令 → 客户端的发送通道</text><text x="808.0" y="350.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">日志事件 → std mpsc</text><text x="808.0" y="374.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">没有跨线程共享的</text><text x="808.0" y="398.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">可变状态</text><line x1="314.0" y1="220.0" x2="350.0" y2="220.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/><line x1="642.0" y1="150.0" x2="678.0" y2="150.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="480.0" y="450.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">13 个同步核心 crate 不依赖 Tokio（提交前钩子检查）；适配器用 get_runtime().spawn，不用 tokio::spawn</text></g></svg>
