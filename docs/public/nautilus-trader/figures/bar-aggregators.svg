<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">BarBuilder 与七种聚合器</title><desc id="desc">上面是所有聚合器共用的 BarBuilder，记录开高低收、成交量和笔数。下面八张卡片是不同的关闭规则：按笔数、按成交量（大单会被拆进两根）、按成交额、按主动买卖的净失衡、按同方向连续成交、按价格移动的 Renko 砖块、按时钟的时间 K 线，以及用更小的 K 线合成大 K 线的组合方式。每张卡片下面写着本章实验得到的根数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">所有聚合器共用一个 BarBuilder，区别只在“什么时候关闭这根 K 线”</text><rect x="300.0" y="58.0" width="360.0" height="92.0" rx="12" fill="#f1f5f9" stroke="#172033" stroke-width="1.5"/><text x="480.0" y="86.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">BarBuilder（每根 K 线的累加器）</text><text x="480.0" y="112.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>open/high/low/close · volume · count</text><text x="480.0" y="136.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">ts_init 比上一笔早就忽略；空 K 线用上一收盘价补</text><text x="480.0" y="174.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">下面每个聚合器的 BarAggregatorCore 里都有一个 BarBuilder，加上各自的关闭规则</text><rect x="24.0" y="186.0" width="220.0" height="132.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="134.0" y="216.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>TickBarAggregator</text><text x="134.0" y="248.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">成交笔数 count ≥ step</text><text x="134.0" y="286.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">250-TICK → 279 根</text><rect x="254.0" y="186.0" width="220.0" height="132.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="364.0" y="216.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>VolumeBarAggregator</text><text x="364.0" y="248.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">成交量凑满 step，大单拆进两根</text><text x="364.0" y="286.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">100-VOLUME → 1912 根</text><rect x="484.0" y="186.0" width="220.0" height="132.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="594.0" y="216.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ValueBarAggregator</text><text x="594.0" y="248.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">成交额 价×量 累计到 step</text><text x="594.0" y="286.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">50000-VALUE → 1627 根</text><rect x="714.0" y="186.0" width="220.0" height="132.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="824.0" y="216.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">…ImbalanceBarAggregator</text><text x="824.0" y="248.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">买 +1、卖 −1，|和| ≥ step</text><text x="824.0" y="286.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">100-TICK_IMBALANCE → 65 根</text><rect x="24.0" y="336.0" width="220.0" height="132.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="134.0" y="366.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">…RunsBarAggregator</text><text x="134.0" y="398.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">同方向连续 step 笔，换向重来</text><text x="134.0" y="436.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">20-TICK_RUNS → 247 根</text><rect x="254.0" y="336.0" width="220.0" height="132.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/><text x="364.0" y="366.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>RenkoBarAggregator</text><text x="364.0" y="398.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">价格离上一块收盘 ≥ 砖块大小</text><text x="364.0" y="436.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">50-RENKO → 158 根</text><rect x="484.0" y="336.0" width="220.0" height="132.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/><text x="594.0" y="366.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>TimeBarAggregator</text><text x="594.0" y="398.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">时钟定时器到点，不看数据</text><text x="594.0" y="436.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">1-MINUTE → 299 根</text><rect x="714.0" y="336.0" width="220.0" height="132.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/><text x="824.0" y="366.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">组合：…@1-MINUTE-INTERNAL</text><text x="824.0" y="398.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">源是更小的 K 线</text><text x="824.0" y="436.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">5-MINUTE → 59 根</text><text x="480.0" y="506.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">蓝：阈值类　青：信息驱动类（需要成交的主动方向）　橙：按价格或按时间</text><text x="480.0" y="530.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">根数是本章实验：ETHUSDT.BINANCE 69,806 笔成交，2020-08-14 10:00–15:00 UTC</text></g></svg>
