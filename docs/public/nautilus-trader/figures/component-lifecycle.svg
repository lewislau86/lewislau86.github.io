<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="title desc">
<title id="title">组件生命周期与 Trader 的启停顺序</title><desc id="desc">上方是主路径：PRE_INITIALIZED 经 initialize 到 READY，经 start 进入 STARTING，on_start 成功后到 RUNNING，经 stop 进入 STOPPING，on_stop 成功后到 STOPPED。上方弧线是 reset，从 STOPPED 经 RESETTING 回到 READY；下方弧线是 resume，从 STOPPED 经 RESUMING 回到 RUNNING。左下列出 degrade、dispose、fault 三种操作；右下是 Trader 启动、停止、重置三类组件的顺序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="486" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">组件生命周期与 Trader 的启停顺序</text><rect x="24.0" y="120.0" width="136.0" height="52.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="92.0" y="152.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">PRE_INITIALIZED</text><rect x="179.0" y="120.0" width="136.0" height="52.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="247.0" y="152.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">READY</text><rect x="334.0" y="120.0" width="136.0" height="52.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="402.0" y="152.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">STARTING</text><rect x="489.0" y="120.0" width="136.0" height="52.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="557.0" y="152.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">RUNNING</text><rect x="644.0" y="120.0" width="136.0" height="52.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="712.0" y="152.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">STOPPING</text><rect x="799.0" y="120.0" width="136.0" height="52.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="867.0" y="152.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">STOPPED</text><line x1="160.0" y1="146.0" x2="178.0" y2="146.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="169.5" y="194.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">initialize()</text><line x1="315.0" y1="146.0" x2="333.0" y2="146.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="324.5" y="194.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">start()</text><line x1="470.0" y1="146.0" x2="488.0" y2="146.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="479.5" y="194.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_start 成功</text><line x1="625.0" y1="146.0" x2="643.0" y2="146.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="634.5" y="194.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">stop()</text><line x1="780.0" y1="146.0" x2="798.0" y2="146.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="789.5" y="194.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_stop 成功</text><polyline points="867.0,120.0 867.0,84.0 247.0,84.0 247.0,118.0" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><text x="480.0" y="78.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">reset()：经 RESETTING 回到 READY（释放订阅）</text><polyline points="887.0,172.0 887.0,216.0 557.0,216.0 557.0,174.0" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><text x="722.0" y="236.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">resume()：经 RESUMING 回到 RUNNING</text><rect x="24.0" y="290.0" width="470.0" height="176.0" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="320.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">其余操作</text><text x="44.0" y="352.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">degrade()：RUNNING → DEGRADING → DEGRADED</text><text x="44.0" y="376.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">dispose()：READY / STOPPING / STOPPED → DISPOSED</text><text x="44.0" y="400.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">fault()：STARTING / RUNNING / STOPPED … → FAULTED</text><text x="44.0" y="424.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">回调出错：停在过渡状态（虚线框），不自动回退</text><text x="44.0" y="448.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">只有 RUNNING 的组件会收到回调</text><rect x="514.0" y="290.0" width="422.0" height="176.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="534.0" y="320.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">Trader 的顺序</text><text x="534.0" y="356.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">启动</text><text x="584.0" y="356.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">Actor → 策略 → 执行算法</text><text x="534.0" y="386.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">停止</text><text x="584.0" y="386.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">Actor → 执行算法 → 策略</text><text x="534.0" y="416.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start">重置</text><text x="584.0" y="416.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">Actor → 策略 → 执行算法</text><text x="534.0" y="448.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">manage_stop 的策略：先市场退出，平仓后自行停止</text></g></svg>
