<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Python 里跑回测的两条路</title><desc id="desc">上面是低层的 BacktestEngine：建引擎、加交易所和品种、加数据、加策略、运行；可以 reset 后换参数重跑，也可以分批流式运行。中间是高层的 BacktestNode：数据先写进 Parquet 数据目录，用 BacktestRunConfig 描述交易所、数据和引擎，构建节点、按运行 ID 加策略、运行得到结果列表，可以分块读取。下面是结果：BacktestResult、DataFrame 报表、HTML 业绩报告，以及记 ERROR 即提前结束的 shutdown_on_error。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="620" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">Python 里跑回测：BacktestEngine 手工装配，BacktestNode 按配置从数据目录跑</text><rect x="24.0" y="60.0" width="912.0" height="176.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="86.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">BacktestEngine（低层）：数据在内存里，自己装配</text><rect x="44.0" y="102.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="122.0" y="124.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BacktestEngine</text><text x="122.0" y="145.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">传入引擎配置</text><line x1="202.0" y1="130.0" x2="218.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="220.0" y="102.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="298.0" y="124.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">add_venue</text><text x="298.0" y="145.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">add_instrument</text><line x1="378.0" y1="130.0" x2="394.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="396.0" y="102.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="474.0" y="124.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">add_data</text><text x="474.0" y="145.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每次一条独立的流</text><line x1="554.0" y1="130.0" x2="570.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="572.0" y="102.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="650.0" y="124.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">add_strategy</text><text x="650.0" y="145.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">实例或可导入配置</text><line x1="730.0" y1="130.0" x2="746.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="748.0" y="102.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="826.0" y="124.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">run()</text><text x="826.0" y="145.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">同步跑完</text><text x="44.0" y="186.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">重复跑：reset() 保留数据、品种、交易所和组件；换参数前 clear_strategies()</text><text x="44.0" y="212.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">数据太大：add_data(批) → run(streaming=True) → clear_data()，最后 end()</text><rect x="24.0" y="252.0" width="912.0" height="176.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="278.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">BacktestNode（高层）：一个 BacktestRunConfig 描述一次运行</text><rect x="44.0" y="294.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="122.0" y="316.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">数据目录</text><text x="122.0" y="337.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Parquet：品种与行情</text><line x1="202.0" y1="322.0" x2="218.0" y2="322.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="220.0" y="294.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="298.0" y="316.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BacktestRunConfig</text><text x="298.0" y="337.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">交易所、数据、引擎</text><line x1="378.0" y1="322.0" x2="394.0" y2="322.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="396.0" y="294.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="474.0" y="316.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BacktestNode</text><text x="474.0" y="337.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">build()</text><line x1="554.0" y1="322.0" x2="570.0" y2="322.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="572.0" y="294.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="650.0" y="316.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">加策略</text><text x="650.0" y="337.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按运行 ID</text><line x1="730.0" y1="322.0" x2="746.0" y2="322.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="748.0" y="294.0" width="156.0" height="56.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="826.0" y="316.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">run()</text><text x="826.0" y="337.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">返回结果列表</text><text x="44.0" y="378.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">chunk_size 不为空时分块读取目录；dispose_on_completion=False 才能在 run 之后取报表</text><text x="44.0" y="404.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">独立的多组配置：每组建一个节点，跑完 dispose，再建下一个</text><rect x="24.0" y="444.0" width="912.0" height="128.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="44.0" y="470.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">结果</text><rect x="44.0" y="488.0" width="204.0" height="64.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="146.0" y="514.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BacktestResult</text><text x="146.0" y="535.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">统计与收益序列</text><rect x="266.0" y="488.0" width="204.0" height="64.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="368.0" y="514.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">generate_*_report</text><text x="368.0" y="535.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">pandas DataFrame</text><rect x="488.0" y="488.0" width="204.0" height="64.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="590.0" y="514.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">create_tearsheet</text><text x="590.0" y="535.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">交互式 HTML</text><rect x="710.0" y="488.0" width="204.0" height="64.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="812.0" y="514.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">shutdown_on_error</text><text x="812.0" y="535.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">记 ERROR 即提前结束</text><text x="480.0" y="600.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">两条路最后跑的是同一个 Rust BacktestEngine；本章实验里四种跑法得到完全相同的 16 张订单、8 个仓位。</text></g></svg>
