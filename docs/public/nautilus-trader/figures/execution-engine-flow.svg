<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title desc">
<title id="title">执行引擎的命令路径与事件路径</title><desc id="desc">上排是命令路径：入口、提交校验与外部客户端、按 client_id、账户发行方、品种场所、默认客户端的顺序选执行客户端、提交前的场所匹配与仓位 ID 检查，交给执行客户端。下排是事件路径，从右往左：找订单、成交前置处理（OMS 类型、仓位 ID、去重、超额）、更新缓存里的订单、通知 Portfolio 并更新仓位。底部是成交时三类主题的发布顺序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="556" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">ExecutionEngine 的两个方向：命令出去，事件回来</text><text x="24.0" y="64.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start">命令路径 →</text><rect x="24.0" y="76.0" width="216.0" height="104.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="132.0" y="112.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">入口 ExecEngine.execute</text><text x="132.0" y="133.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">风控放行后经 queue_execute</text><text x="132.0" y="154.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">撤单、查询直接进来</text><line x1="240.0" y1="128.0" x2="256.0" y2="128.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="256.0" y="76.0" width="216.0" height="104.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="364.0" y="112.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">validate_submission</text><text x="364.0" y="133.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">过期或重复的提交：跳过</text><text x="364.0" y="154.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">外部客户端：发到总线</text><line x1="472.0" y1="128.0" x2="488.0" y2="128.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="488.0" y="76.0" width="216.0" height="104.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="596.0" y="112.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">选执行客户端</text><text x="596.0" y="133.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">client_id → 账户发行方</text><text x="596.0" y="154.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">→ 品种场所 → 默认客户端</text><line x1="704.0" y1="128.0" x2="720.0" y2="128.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="720.0" y="76.0" width="216.0" height="104.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="828.0" y="112.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">handle_submit_order</text><text x="828.0" y="133.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">场所匹配、NETTING 仓位 ID</text><text x="828.0" y="154.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">认领客户端 → submit_order</text><text x="596.0" y="202.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">找不到客户端 → OrderDenied（NoExecutionClient）</text><line x1="828.0" y1="180.0" x2="828.0" y2="232.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="24.0" y="234.0" width="912.0" height="48.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="264.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">ExecutionClient：请求发往场所，回报转成订单事件 → ExecEngine.process（实盘经运行器转发）</text><line x1="828.0" y1="282.0" x2="828.0" y2="330.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="936.0" y="318.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="end">← 事件路径</text><rect x="24.0" y="332.0" width="216.0" height="104.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="132.0" y="368.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">成交：仓位与发布</text><text x="132.0" y="389.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Portfolio.update_order</text><text x="132.0" y="410.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">开仓 / 更新 / 翻转仓位</text><line x1="256.0" y1="384.0" x2="240.0" y2="384.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="256.0" y="332.0" width="216.0" height="104.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="364.0" y="368.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">更新订单</text><text x="364.0" y="389.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>cache.update_order</text><text x="364.0" y="410.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">自有订单簿、订单快照</text><line x1="488.0" y1="384.0" x2="472.0" y2="384.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="488.0" y="332.0" width="216.0" height="104.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="596.0" y="368.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">成交前置（仅 Filled）</text><text x="596.0" y="389.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">OMS 类型 → 仓位 ID</text><text x="596.0" y="410.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">去重、超额检查</text><line x1="720.0" y1="384.0" x2="704.0" y2="384.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="720.0" y="332.0" width="216.0" height="104.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="828.0" y="368.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">找订单</text><text x="828.0" y="389.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按 client_order_id</text><text x="828.0" y="410.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">找不到再按 venue_order_id</text><text x="480.0" y="462.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">非成交事件：更新订单后直接发布到 events.order.{strategy}；被丢弃的成交发到 events.order_fill_declined.{instrument}</text><rect x="24.0" y="480.0" width="912.0" height="52.0" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="512.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">成交的发布顺序：events.order_filled.{instrument} → events.order.{strategy} → events.position.{strategy}</text></g></svg>
