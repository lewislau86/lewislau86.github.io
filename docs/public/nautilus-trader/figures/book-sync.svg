<svg xmlns="http://www.w3.org/2000/svg" width="960" height="504" viewBox="0 0 960 504" role="img" aria-labelledby="title desc">
<title id="title">订单簿的同步与恢复</title><desc id="desc">上面是三个阶段：Waiting 接受快照后进入 Synced 并输出，增量接不上时进入 Recovering 停止输出，接受新快照后回到 Synced。中间是一次恢复的四步：关闭快照闸门、重新订阅、连接确认后打开闸门、接受合法快照。下面是重试节奏：180 秒内 8 次，之后间隔从 1 分钟翻倍到 15 分钟。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="504" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">订单簿的同步与恢复：只有 Synced 才输出</text><rect x="40.0" y="66.0" width="200.0" height="72.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="86.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Waiting</text><text x="140.0" y="107.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">等第一份快照</text><text x="140.0" y="128.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">不输出</text><rect x="380.0" y="66.0" width="200.0" height="72.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="86.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Synced(seqId)</text><text x="480.0" y="107.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">增量接得上就前进</text><text x="480.0" y="128.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">输出给 DataEngine</text><rect x="720.0" y="66.0" width="200.0" height="72.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="820.0" y="86.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Recovering</text><text x="820.0" y="107.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">失步，等新快照</text><text x="820.0" y="128.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">不输出</text><line x1="240.0" y1="102.0" x2="378.0" y2="102.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><text x="309.0" y="92.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">接受快照</text><line x1="580.0" y1="92.0" x2="718.0" y2="92.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="649.0" y="82.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">gap()：接不上</text><line x1="718.0" y1="116.0" x2="582.0" y2="116.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><text x="649.0" y="134.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">接受新快照</text><text x="820.0" y="160.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">无负责者 → 返回 Recover</text><rect x="24.0" y="178.0" width="912.0" height="150.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="44.0" y="204.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">一次恢复（claim 之后，BookRecovery::run）</text><rect x="44.0" y="220.0" width="196.0" height="60.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="142.0" y="244.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">关闭快照闸门</text><text x="142.0" y="264.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">SnapshotGate</text><line x1="240.0" y1="250.0" x2="264.0" y2="250.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="266.0" y="220.0" width="196.0" height="60.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="364.0" y="244.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">重新订阅</text><text x="364.0" y="264.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">写入请求</text><line x1="462.0" y1="250.0" x2="486.0" y2="250.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="488.0" y="220.0" width="196.0" height="60.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="586.0" y="244.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">连接确认写入</text><text x="586.0" y="264.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">打开闸门</text><line x1="684.0" y1="250.0" x2="708.0" y2="250.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="710.0" y="220.0" width="196.0" height="60.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="808.0" y="244.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">接受合法快照</text><text x="808.0" y="264.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">整体替换价位</text><text x="480.0" y="310.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">写入完成不算恢复完成；闸门打开之前到达的快照不接受</text><text x="44.0" y="360.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">失败时的重试节奏</text><line x1="60.0" y1="400.0" x2="910.0" y2="400.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="70.0" y="382.0" width="260.0" height="36.0" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="200.0" y="405.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">预算：180 秒内 8 次</text><circle cx="380" cy="400" r="5" fill="#b45309"/><text x="380.0" y="432.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">1 分钟</text><circle cx="470" cy="400" r="5" fill="#b45309"/><text x="470.0" y="432.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">2 分钟</text><circle cx="590" cy="400" r="5" fill="#b45309"/><text x="590.0" y="432.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">4 分钟</text><circle cx="730" cy="400" r="5" fill="#b45309"/><text x="730.0" y="432.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">8 分钟</text><circle cx="880" cy="400" r="5" fill="#b45309"/><text x="880.0" y="432.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">15 分钟</text><text x="480.0" y="462.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">之后间隔翻倍、加抖动，上限 15 分钟；每次尝试最长 max(快照超时, 60 秒)；永不放弃，直到成功或取消</text><text x="480.0" y="484.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">OKX 序号：快照 prevSeqId = -1；增量的 prevSeqId 必须等于上一批的 seqId</text></g></svg>
