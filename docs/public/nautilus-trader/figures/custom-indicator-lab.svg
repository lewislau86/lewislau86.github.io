<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724" viewBox="0 0 960 724" role="img" aria-labelledby="title desc">
<title id="title">从零写一个指标的四步</title><desc id="desc">上排三个框：先定规格（IBS 公式、取最近 period 根平均、攒满之前值为 0、坏数据和零振幅 K 线跳过），再实现 Indicator（update_raw、handle_bar、reset），再写单元测试（手算值、边界、属性测试，cargo test 13 个通过）。下方是回测对账：同一份 69,806 笔 ETHUSDT 成交，一路经 BacktestEngine 聚合成 250 笔一根的 K 线、由注册表先更新指标、在 on_bar 里记录；另一路不经过框架，每 250 笔切块算 IBS 并取最近 10 个平均。两路逐根比较 279 根，K 线完全一致，最大误差约 6e-16。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="724" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">从零写一个指标：定规格 → 实现 → 单元测试 → 回测里逐根对账</text><rect x="24.0" y="60.0" width="288.0" height="168.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="168.0" y="88.0" font-size="16" fill="#64748b" font-weight="bold" text-anchor="middle">① 定规格</text><text x="168.0" y="120.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">IBS = (收盘 − 最低) / (最高 − 最低)</text><text x="168.0" y="146.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">取最近 period 根的平均</text><text x="168.0" y="172.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">攒满之前 value = 0</text><text x="168.0" y="198.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">坏数据、零振幅 K 线跳过</text><line x1="314.0" y1="144.0" x2="334.0" y2="144.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="336.0" y="60.0" width="288.0" height="168.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="88.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">② 实现 Indicator</text><text x="480.0" y="120.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">update_raw：校验 → 窗口 → 平均</text><text x="480.0" y="146.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">handle_bar：取高、低、收</text><text x="480.0" y="172.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">reset：清空全部状态</text><text x="480.0" y="198.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">src/lib.rs</text><line x1="626.0" y1="144.0" x2="646.0" y2="144.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="648.0" y="60.0" width="288.0" height="168.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="792.0" y="88.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">③ 单元测试</text><text x="792.0" y="120.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">手算值：0.5、0.25</text><text x="792.0" y="146.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">未初始化、零振幅、坏数据</text><text x="792.0" y="172.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">属性测试：任意序列 = 朴素平均</text><text x="792.0" y="198.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">cargo test：13 个通过</text><line x1="480.0" y1="230.0" x2="480.0" y2="254.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24.0" y="258.0" width="912.0" height="412.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="284.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">④ 回测里对账：同一份成交走两条互不相干的路，再逐根比较</text><rect x="300.0" y="300.0" width="360.0" height="56.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="480.0" y="322.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">ethusdt-trades.csv</text><text x="480.0" y="343.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">69,806 笔 ETHUSDT 成交</text><polyline points="390.0,358.0 390.0,374.0 250.0,374.0 250.0,386.0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><polyline points="570.0,358.0 570.0,374.0 710.0,374.0 710.0,386.0" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><rect x="40.0" y="390.0" width="420.0" height="52.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="250.0" y="410.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">BacktestEngine · DataEngine</text><text x="250.0" y="431.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每 250 笔聚合一根 K 线（INTERNAL）</text><line x1="250.0" y1="442.0" x2="250.0" y2="462.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="40.0" y="464.0" width="420.0" height="52.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="250.0" y="484.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Indicators 表先更新指标</text><text x="250.0" y="505.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">register_indicator_for_bars</text><line x1="250.0" y1="516.0" x2="250.0" y2="536.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="40.0" y="538.0" width="420.0" height="52.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="250.0" y="558.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">on_bar 记下高、低、收和 value</text><text x="250.0" y="579.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">此时 value 已含这根 K 线</text><rect x="500.0" y="390.0" width="420.0" height="52.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="710.0" y="410.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">独立算法（不经过框架）</text><text x="710.0" y="431.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每 250 笔切一块：最高、最低、最后</text><line x1="710.0" y1="442.0" x2="710.0" y2="462.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="500.0" y="464.0" width="420.0" height="52.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="710.0" y="484.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">逐块算 IBS，取最近 10 个平均</text><text x="710.0" y="505.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rust 朴素循环 / pandas rolling</text><line x1="710.0" y1="516.0" x2="710.0" y2="536.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="500.0" y="538.0" width="420.0" height="52.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="710.0" y="558.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">得到 279 根的期望值</text><text x="710.0" y="579.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">前 9 根没有期望值</text><line x1="462.0" y1="564.0" x2="498.0" y2="564.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40.0" y="608.0" width="880.0" height="46.0" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text x="480.0" y="636.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">279 根逐根比较：K 线完全一致，第 10 根起初始化，最大误差 6.1e-16（Rust）/ 6.7e-16（Python）</text><text x="480.0" y="700.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">期望值必须来自另一条路径：拿指标自己再算一遍，只能证明它和自己一致。</text></g></svg>
