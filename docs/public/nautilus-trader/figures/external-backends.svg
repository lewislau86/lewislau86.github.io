<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img" aria-labelledby="title desc">
<title id="title">缓存后端与外部消息流</title><desc id="desc">上面是缓存后端：核心线程上的缓存把写命令发进无界 channel，后台任务按间隔成批提交到 Redis 或 PostgreSQL，订单存为事件列表，启动时经读连接恢复。下面是消息总线：采集节点发布时先本地分发，再把 BusMessage 交给出站任务 XADD 到 Redis 流；策略节点的入站任务用 XREAD 从当前时刻读取，在本地总线上再发布，外部客户端的行情进入数据引擎。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="474" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">外部后端：核心线程只放 channel，I/O 在后台任务里</text><text x="24.0" y="70.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">缓存后端</text><rect x="24.0" y="84.0" width="190.0" height="70.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="119.0" y="103.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Cache（核心线程）</text><text x="119.0" y="123.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">写入只发命令</text><text x="119.0" y="143.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">立即返回</text><rect x="254.0" y="84.0" width="180.0" height="70.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="344.0" y="113.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">写命令 channel</text><text x="344.0" y="133.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">无界</text><rect x="474.0" y="84.0" width="220.0" height="70.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="584.0" y="103.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">后台写任务</text><text x="584.0" y="123.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每 buffer_interval_ms</text><text x="584.0" y="143.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">一批 pipeline 提交</text><rect x="734.0" y="84.0" width="202.0" height="70.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="835.0" y="103.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Redis / PostgreSQL</text><text x="835.0" y="123.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">trader-{id}:orders:…</text><text x="835.0" y="143.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">订单存为事件列表</text><line x1="214.0" y1="119.0" x2="252.0" y2="119.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><line x1="434.0" y1="119.0" x2="472.0" y2="119.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="694.0" y1="119.0" x2="732.0" y2="119.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><polyline points="835.0,154.0 835.0,180.0 119.0,180.0 119.0,156.0" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><text x="477.0" y="198.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">启动：读连接 load_all → 按事件重建订单、仓位、账户（不恢复行情历史，之后仍要对账）</text><text x="24.0" y="240.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">消息总线：采集节点 → Redis 流 → 策略节点</text><rect x="24.0" y="254.0" width="290.0" height="200.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="169.0" y="278.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">采集节点</text><text x="169.0" y="306.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">publish：先本地分发</text><text x="169.0" y="330.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ BusMessage{topic, type,</text><text x="169.0" y="352.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">encoding, payload}</text><text x="169.0" y="380.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">types_filter 排除报价</text><text x="169.0" y="404.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">出站任务：攒批 XADD</text><text x="169.0" y="430.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">autotrim：按时间或条数修剪</text><rect x="370.0" y="314.0" width="220.0" height="80.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="480.0" y="338.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Redis 流 binance</text><text x="480.0" y="358.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">关掉三个前缀开关</text><text x="480.0" y="378.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">键就是 binance</text><rect x="646.0" y="254.0" width="290.0" height="200.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="791.0" y="278.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">策略节点</text><text x="791.0" y="306.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">external_streams = [binance]</text><text x="791.0" y="330.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">入站任务：XREAD，从当前时刻读</text><text x="791.0" y="356.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">事件循环的外部消息分支</text><text x="791.0" y="380.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ 本地总线再发布（不再外发）</text><text x="791.0" y="404.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">外部客户端 BINANCE_EXT</text><text x="791.0" y="428.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ 数据引擎写缓存、维护订单簿</text><line x1="314.0" y1="354.0" x2="368.0" y2="354.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="590.0" y1="354.0" x2="644.0" y2="354.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/></g></svg>
