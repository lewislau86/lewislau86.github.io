<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724" viewBox="0 0 960 724" role="img" aria-labelledby="title desc">
<title id="title">富途适配器在 crate 依赖图中的位置</title><desc id="desc">富途适配器 adapters/futu 和 adapters/interactive_brokers 平级，被 pyo3 在 adapters feature 下依赖，自己依赖 live，并实现 common 里的 DataClient 和 ExecutionClient trait。它下面另有一个新增的独立协议库 futu-opend，对应 IB 适配器依赖的第三方 ibapi。live 依赖 system，system 依赖各引擎，引擎依赖 common，common 依赖 model 和 core。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="724" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">富途适配器放在 crate 图的哪里：和 IB 适配器平级，挂在 live 之下</text><rect x="274.0" y="61.0" width="112.0" height="38.0" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/><text x="330.0" y="85.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>pyo3</text><rect x="33.0" y="151.0" width="274.0" height="38.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="170.0" y="175.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>adapters/interactive_brokers</text><rect x="400.5" y="151.0" width="139.0" height="38.0" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5"/><text x="470.0" y="175.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>adapters/futu</text><rect x="664.0" y="151.0" width="112.0" height="38.0" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5"/><text x="720.0" y="175.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>futu-opend</text><rect x="34.0" y="241.0" width="112.0" height="38.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="90.0" y="265.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ibapi</text><rect x="274.0" y="241.0" width="112.0" height="38.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="330.0" y="265.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>live</text><rect x="274.0" y="326.0" width="112.0" height="38.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/><text x="330.0" y="350.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>system</text><rect x="150.0" y="412.0" width="300.0" height="38.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="300.0" y="437.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>data · execution · risk · portfolio · trading</text><rect x="274.0" y="496.0" width="112.0" height="38.0" rx="8" fill="#f1f5f9" stroke="#172033" stroke-width="1.4"/><text x="330.0" y="520.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>common</text><rect x="265.0" y="576.0" width="130.0" height="38.0" rx="8" fill="#f1f5f9" stroke="#172033" stroke-width="1.4"/><text x="330.0" y="600.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>model · core</text><line x1="330.0" y1="99.0" x2="170.0" y2="149.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330.0" y1="99.0" x2="470.0" y2="149.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><text x="420.0" y="112.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">adapters feature</text><line x1="170.0" y1="189.0" x2="90.0" y2="239.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="170.0" y1="189.0" x2="330.0" y2="239.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="470.0" y1="189.0" x2="330.0" y2="239.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><line x1="539.5" y1="170.0" x2="661.0" y2="170.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><line x1="330.0" y1="279.0" x2="330.0" y2="324.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330.0" y1="364.0" x2="330.0" y2="410.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330.0" y1="452.0" x2="330.0" y2="494.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330.0" y1="534.0" x2="330.0" y2="574.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="520.0,189.0 540.0,230.0 540.0,515.0 394.0,515.0" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/><text x="548.0" y="470.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">实现 trait</text><rect x="630.0" y="236.0" width="300.0" height="440.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="646.0" y="262.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">要新增的两个 crate</text><text x="646.0" y="292.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">futu-opend（独立协议库）</text><text x="646.0" y="318.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">· 不依赖任何 nautilus crate</text><text x="646.0" y="344.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">· tokio + prost：包头、SHA1、</text><text x="646.0" y="370.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">　RSA/AES、心跳、请求与回包对应</text><text x="646.0" y="396.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">· 地位等同 IB 适配器依赖的 ibapi</text><text x="646.0" y="428.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">adapters/futu（nautilus-futu）</text><text x="646.0" y="454.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">· 依赖 live、common、model、</text><text x="646.0" y="480.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">　core 和 futu-opend</text><text x="646.0" y="506.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">· 实现 common 里的 DataClient、</text><text x="646.0" y="532.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">　ExecutionClient trait</text><text x="646.0" y="558.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">· python feature 下才依赖 system</text><text x="646.0" y="590.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">要改的现有文件</text><text x="646.0" y="616.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">· 根 Cargo.toml；Makefile 的</text><text x="646.0" y="642.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">　ADAPTER_CRATES</text><text x="646.0" y="668.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">· crates/pyo3：Cargo.toml、lib.rs</text><text x="480.0" y="704.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">橙色虚线框是新增的部分；箭头从使用方指向被依赖方。IB 适配器的依赖取自它的 Cargo.toml，富途照此设计。</text></g></svg>
