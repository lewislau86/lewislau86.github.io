<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">实时计时器的生命周期</title><desc id="desc">左边核心线程上，策略调用 set_timer，LiveClock 建 LiveTimer 并 spawn 一个任务；右边工作线程上，任务等待到点，构造带 ts_event 和 ts_init 的 TimeEvent，按回调类型发进时间事件 channel；核心线程的事件循环取出事件并执行回调。底部时间轴标出计划时间、构造时间和回调执行时间之间的两段延迟。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="480" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一个实时计时器：任务在工作线程上等待，回调在核心线程上执行</text><rect x="24.0" y="62.0" width="360.0" height="300.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="204.0" y="88.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">核心线程</text><rect x="44.0" y="104.0" width="320.0" height="60.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="204.0" y="128.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">策略 on_start</text><text x="204.0" y="148.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">clock.set_timer(&quot;heartbeat&quot;, 30 秒)</text><rect x="44.0" y="184.0" width="320.0" height="60.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="204.0" y="208.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">LiveClock</text><text x="204.0" y="228.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">取消同名旧计时器 → 建 LiveTimer → start()</text><rect x="44.0" y="274.0" width="320.0" height="70.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="204.0" y="293.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">事件循环取出 TimeEvent</text><text x="204.0" y="313.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">凭回调或令牌找到回调，执行</text><text x="204.0" y="333.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_time_event(event)</text><line x1="204.0" y1="164.0" x2="204.0" y2="182.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="576.0" y="62.0" width="360.0" height="300.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="756.0" y="88.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">Tokio 工作线程</text><rect x="596.0" y="104.0" width="320.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="756.0" y="123.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">计时器任务（每个计时器一个）</text><text x="756.0" y="143.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">固定间隔：interval_at，错过连续补发</text><text x="756.0" y="163.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">日程：睡到下一个时间点，错过补一次</text><rect x="596.0" y="194.0" width="320.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="756.0" y="213.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">到点：构造 TimeEvent</text><text x="756.0" y="233.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">ts_event = 计划时间</text><text x="756.0" y="253.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">ts_init = 实际读到的时间</text><rect x="596.0" y="284.0" width="320.0" height="60.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="756.0" y="308.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">按回调类型发出</text><text x="756.0" y="328.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Send 回调随事件走；Rc 回调只发令牌</text><line x1="756.0" y1="174.0" x2="756.0" y2="192.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="756.0" y1="264.0" x2="756.0" y2="282.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="364.0" y1="214.0" x2="594.0" y2="139.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="480.0" y="160.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">spawn 到全局运行时</text><line x1="594.0" y1="314.0" x2="366.0" y2="309.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="480.0" y="296.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">时间事件 channel</text><line x1="60.0" y1="410.0" x2="900.0" y2="410.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="200" cy="410" r="6" fill="#b45309"/><text x="200.0" y="394.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">ts_event</text><text x="200.0" y="436.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">计划时间 10:00:00.000</text><circle cx="470" cy="410" r="6" fill="#b45309"/><text x="470.0" y="394.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">ts_init</text><text x="470.0" y="436.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">任务构造事件 +0.4 ms</text><circle cx="760" cy="410" r="6" fill="#b45309"/><text x="760.0" y="394.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">回调执行</text><text x="760.0" y="436.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">核心线程取出 +3 ms</text><text x="335.0" y="462.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Tokio 调度延迟</text><text x="615.0" y="462.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">channel 排队时间</text></g></svg>
