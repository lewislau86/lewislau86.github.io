<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">数据目录的结构、写入与查询</title><desc id="desc">左边是目录树：按数据类型、标识符分目录，文件名是起止时间。右上是写入一批报价的六步：时间升序检查、单一标识检查、Arrow 编码、确定目录和文件名、区间不重叠检查、zstd 写入。右下是查询的五步：列出文件、按标识符筛目录、按文件名筛时间、DataFusion SQL 过滤、解码排序，前三步不打开文件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="500" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">数据目录：文件名就是时间索引</text><rect x="24.0" y="60.0" width="330.0" height="420.0" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="88.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">目录树</text><text x="44.0" y="122.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>catalog/data/</text><text x="66.0" y="152.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>currency_pair/</text><text x="88.0" y="182.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AUDUSD.SIM/</text><text x="110.0" y="212.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">1970…_1970….parquet</text><text x="66.0" y="242.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>quotes/</text><text x="88.0" y="272.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>AUDUSD.SIM/</text><text x="110.0" y="302.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">2025-01-01T00-00-00-…Z_</text><text x="110.0" y="332.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">2025-01-01T00-12-24-…Z.parquet</text><text x="66.0" y="362.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start">trades/  bars/  …</text><text x="66.0" y="392.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start">custom/{类型名}/</text><text x="44.0" y="440.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">类型 / 标识符（/ 删除，^ 换 _）/</text><text x="44.0" y="462.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">{起始}_{结束}.parquet</text><text x="380.0" y="88.0" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">写入 write_to_parquet</text><rect x="380.0" y="102.0" width="86.0" height="56.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="423.0" y="124.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">ts_init</text><text x="423.0" y="144.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">升序</text><line x1="466.0" y1="130.0" x2="474.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="474.0" y="102.0" width="86.0" height="56.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="517.0" y="124.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">单一</text><text x="517.0" y="144.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">标识</text><line x1="560.0" y1="130.0" x2="568.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="568.0" y="102.0" width="86.0" height="56.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="611.0" y="124.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Arrow</text><text x="611.0" y="144.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">编码</text><line x1="654.0" y1="130.0" x2="662.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="662.0" y="102.0" width="86.0" height="56.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="705.0" y="124.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">目录 +</text><text x="705.0" y="144.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">文件名</text><line x1="748.0" y1="130.0" x2="756.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="756.0" y="102.0" width="86.0" height="56.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="799.0" y="124.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">区间</text><text x="799.0" y="144.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">不重叠</text><line x1="842.0" y1="130.0" x2="850.0" y2="130.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="850.0" y="102.0" width="86.0" height="56.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="893.0" y="124.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">zstd</text><text x="893.0" y="144.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">写入</text><text x="380.0" y="186.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">价格、数量 → Decimal128(38, 16)；instrument_id 与精度写在 schema 元数据</text><text x="380.0" y="210.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">标准模式写入乘 10^7、读取除回；超过 9 位小数的值读取报错</text><text x="380.0" y="262.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">查询 query</text><rect x="380.0" y="276.0" width="104.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="432.0" y="312.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">列出文件</text><line x1="484.0" y1="308.0" x2="494.0" y2="308.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="494.0" y="276.0" width="104.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="546.0" y="302.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">按标识符</text><text x="546.0" y="322.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">筛目录</text><line x1="598.0" y1="308.0" x2="608.0" y2="308.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="608.0" y="276.0" width="104.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="660.0" y="302.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">按文件名</text><text x="660.0" y="322.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">筛时间</text><line x1="712.0" y1="308.0" x2="722.0" y2="308.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="722.0" y="276.0" width="104.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="774.0" y="302.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">DataFusion</text><text x="774.0" y="322.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">SQL</text><line x1="826.0" y1="308.0" x2="836.0" y2="308.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="836.0" y="276.0" width="104.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="888.0" y="302.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">解码</text><text x="888.0" y="322.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">排序</text><rect x="380.0" y="352.0" width="332.0" height="28.0" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="546.0" y="371.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">前三步只看路径，不打开文件</text><text x="380.0" y="410.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">SELECT * FROM t WHERE (条件) AND ts_init &gt;= start</text><text x="380.0" y="432.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">AND ts_init &lt;= end ORDER BY ts_init</text><text x="380.0" y="462.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">回测：BacktestDataConfig → 一次性读出，或分页读出后按时间归并、分块播放</text></g></svg>
