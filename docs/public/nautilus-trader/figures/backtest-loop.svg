<svg xmlns="http://www.w3.org/2000/svg" width="960" height="554" viewBox="0 0 960 554" role="img" aria-labelledby="title desc">
<title id="title">回测主循环处理一个时间戳</title><desc id="desc">五个步骤从上到下：先执行早于 T 的计时器；交易所用新数据撮合已挂订单；数据引擎把数据交给策略，策略的命令进入同步队列；结清阶段反复处理命令队列、交易所命令和撮合，直到没有新命令；最后在 T 的最后一条数据之后执行恰好在 T 的计时器、资金费率结算、模拟模块和强平检查。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="554" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">回测主循环处理一个时间戳 T</text><rect x="40.0" y="64.0" width="620.0" height="72.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="350.0" y="94.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">① 先执行早于 T 的计时器</text><text x="350.0" y="115.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">advance_time_impl：时钟设到计时器时刻，执行回调并结清</text><line x1="350.0" y1="136.0" x2="350.0" y2="156.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40.0" y="156.0" width="620.0" height="72.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="350.0" y="186.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">② 交易所先看到数据</text><text x="350.0" y="207.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">route_data_to_exchange：更新订单簿，撮合已挂订单</text><line x1="350.0" y1="228.0" x2="350.0" y2="248.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40.0" y="248.0" width="620.0" height="72.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="350.0" y="278.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">③ 策略再看到数据</text><text x="350.0" y="299.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">DataEngine 写缓存、发布 → on_quote / on_bar；下单进入命令队列</text><line x1="350.0" y1="320.0" x2="350.0" y2="340.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40.0" y="340.0" width="620.0" height="72.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="350.0" y="370.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">④ 结清命令（循环直到为空）</text><text x="350.0" y="391.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">drain_command_queues → settle_venues：风控 → 执行 → 交易所 → 撮合</text><line x1="350.0" y1="412.0" x2="350.0" y2="432.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40.0" y="432.0" width="620.0" height="72.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="350.0" y="462.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">⑤ T 的最后一条数据之后</text><text x="350.0" y="483.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">恰好在 T 的计时器 → 资金费率 → 模拟模块 → 强平检查</text><polyline points="660.0,390.0 720.0,390.0 720.0,362.0 662.0,362.0" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><text x="732.0" y="370.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">成交回调发出新命令</text><text x="732.0" y="392.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">→ 再结清一轮</text><rect x="700.0" y="254.0" width="236.0" height="60.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="818.0" y="278.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SyncTradingCommandSender</text><text x="818.0" y="300.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">命令先入线程局部队列</text><text x="700.0" y="186.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start">已挂订单先于新订单</text><text x="700.0" y="208.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start">看到这条新行情</text><text x="480.0" y="532.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">相同 ts_init 的数据：先 add_data 的流先播放；同一流内保持原顺序</text></g></svg>
