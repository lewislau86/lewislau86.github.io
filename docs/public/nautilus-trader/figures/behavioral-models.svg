<svg xmlns="http://www.w3.org/2000/svg" width="960" height="434" viewBox="0 0 960 434" role="img" aria-labelledby="title desc">
<title id="title">行为模型在模拟成交路径上的位置</title><desc id="desc">上排从左到右是交易命令、交易所队列、撮合引擎、成交事件和账户；下排橙色框是对应位置的可替换模型：延迟模型决定到达时间，成交模型决定挂单是否成交、是否滑点或提供合成订单簿，手续费模型计算佣金，保证金模型计算保证金。底部是每个时间戳末尾运行的模拟模块。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="434" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">一笔模拟成交经过的行为模型</text><rect x="24.0" y="70.0" width="168.0" height="66.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="108.0" y="97.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">交易命令</text><text x="108.0" y="118.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">SubmitOrder 等</text><line x1="192.0" y1="103.0" x2="210.0" y2="103.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="210.0" y="70.0" width="168.0" height="66.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="294.0" y="97.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">交易所队列</text><text x="294.0" y="118.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">在途队列 → 结算点</text><line x1="378.0" y1="103.0" x2="396.0" y2="103.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="396.0" y="70.0" width="168.0" height="66.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="97.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">撮合引擎</text><text x="480.0" y="118.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">挂单 / 吃单 / 市价</text><line x1="564.0" y1="103.0" x2="582.0" y2="103.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="582.0" y="70.0" width="168.0" height="66.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="666.0" y="97.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">OrderFilled</text><text x="666.0" y="118.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">成交价、数量、佣金</text><line x1="750.0" y1="103.0" x2="768.0" y2="103.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="768.0" y="70.0" width="168.0" height="66.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="852.0" y="97.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">账户</text><text x="852.0" y="118.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">余额、冻结、保证金</text><line x1="294.0" y1="182.0" x2="294.0" y2="138.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="210.0" y="184.0" width="168.0" height="112.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="294.0" y="224.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">延迟模型</text><text x="294.0" y="244.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">到达 = ts_init + 延迟</text><text x="294.0" y="264.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">提交 / 改单 / 撤单</text><line x1="480.0" y1="182.0" x2="480.0" y2="138.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="396.0" y="184.0" width="168.0" height="112.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="480.0" y="214.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">成交模型</text><text x="480.0" y="234.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">碰到限价是否成交</text><text x="480.0" y="254.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">L1 是否滑一个价位</text><text x="480.0" y="274.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">或给合成订单簿</text><line x1="666.0" y1="182.0" x2="666.0" y2="138.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="582.0" y="184.0" width="168.0" height="112.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="666.0" y="224.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">手续费模型</text><text x="666.0" y="244.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">|名义| × 挂单或吃单费率</text><text x="666.0" y="264.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">固定 / 按张 / 期权</text><line x1="852.0" y1="182.0" x2="852.0" y2="138.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="768.0" y="184.0" width="168.0" height="112.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="852.0" y="224.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">保证金模型</text><text x="852.0" y="244.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">杠杆模型（默认）</text><text x="852.0" y="264.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">或标准模型</text><text x="105.0" y="220.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">可替换的插件</text><text x="105.0" y="244.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">（橙色）</text><rect x="24.0" y="322.0" width="912.0" height="92.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="350.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">每个时间戳末尾：模拟模块 SimulationModule</text><text x="44.0" y="376.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">pre_process（每条行情前）→ process（结清命令后，读只读快照，返回资金调整）→ 交易所入账 → acknowledge</text><text x="44.0" y="400.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">内置：外汇隔夜利息 FXRolloverInterestModule、差价合约掉期 CfdSwapModule；永续资金费率由交易所自己处理</text></g></svg>
