<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">订单状态机</title><desc id="desc">最上面一行是主路径：INITIALIZED、SUBMITTED、ACCEPTED、PARTIALLY_FILLED、FILLED。第二行是分支：本地仿真单从 INITIALIZED 进入 EMULATED、再经 RELEASED 回到 SUBMITTED；触发类订单从 ACCEPTED 进入 TRIGGERED；改单和撤单请求进入 PENDING_UPDATE、PENDING_CANCEL 并可能回到原状态。第三行是终态 DENIED、REJECTED、CANCELED、EXPIRED、VOIDED 及其主要来源。底部注明几条照着真实交易所行为设计的转移。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="600" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">订单状态机：15 个状态，颜色说明订单在哪里</text><rect x="24.0" y="80.0" width="168.0" height="50.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="108.0" y="111.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>INITIALIZED</text><rect x="210.0" y="80.0" width="168.0" height="50.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="294.0" y="111.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SUBMITTED</text><rect x="396.0" y="80.0" width="168.0" height="50.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="480.0" y="111.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ACCEPTED</text><rect x="582.0" y="80.0" width="168.0" height="50.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="666.0" y="111.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>PARTIALLY_FILLED</text><rect x="768.0" y="80.0" width="168.0" height="50.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="852.0" y="111.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>FILLED</text><line x1="194.0" y1="105.0" x2="208.0" y2="105.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="380.0" y1="105.0" x2="394.0" y2="105.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="566.0" y1="105.0" x2="580.0" y2="105.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="752.0" y1="105.0" x2="766.0" y2="105.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="201.0" y="72.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">Submitted</text><text x="387.0" y="72.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">Accepted</text><text x="573.0" y="72.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">Filled（部分）</text><text x="759.0" y="72.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">Filled（满）</text><rect x="24.0" y="210.0" width="168.0" height="50.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="108.0" y="241.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>EMULATED</text><rect x="210.0" y="210.0" width="168.0" height="50.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="294.0" y="241.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>RELEASED</text><rect x="396.0" y="210.0" width="168.0" height="50.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="480.0" y="241.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>TRIGGERED</text><rect x="582.0" y="210.0" width="168.0" height="50.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="666.0" y="241.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>PENDING_UPDATE</text><rect x="768.0" y="210.0" width="168.0" height="50.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="852.0" y="241.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>PENDING_CANCEL</text><line x1="108.0" y1="132.0" x2="108.0" y2="208.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="116.0" y="175.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start">Emulated</text><line x1="194.0" y1="235.0" x2="208.0" y2="235.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><line x1="294.0" y1="208.0" x2="294.0" y2="132.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="302.0" y="175.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start">Submitted</text><line x1="480.0" y1="132.0" x2="480.0" y2="208.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><text x="488.0" y="175.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">Triggered</text><line x1="666.0" y1="132.0" x2="666.0" y2="208.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)" marker-start="url(#arrow-teal)"/><text x="658.0" y="175.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="end">改单</text><line x1="734.0" y1="132.0" x2="792.0" y2="208.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)" marker-start="url(#arrow-teal)"/><text x="808.0" y="175.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">撤单</text><rect x="24.0" y="290.0" width="912.0" height="46.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="7 5"/><text x="480.0" y="319.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">下面五个终态（加上 FILLED 共六个）可以从多个非终态到达；箭头太多，这里只列主要来源</text><rect x="24.0" y="360.0" width="168.0" height="50.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="108.0" y="391.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>DENIED</text><text x="108.0" y="434.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">INITIALIZED、RELEASED</text><text x="108.0" y="456.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">风控拒绝</text><rect x="210.0" y="360.0" width="168.0" height="50.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="294.0" y="391.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>REJECTED</text><text x="294.0" y="434.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">SUBMITTED、ACCEPTED…</text><text x="294.0" y="456.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">交易所拒绝</text><rect x="396.0" y="360.0" width="168.0" height="50.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="480.0" y="391.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>CANCELED</text><text x="480.0" y="434.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">多数在途和挂单状态</text><text x="480.0" y="456.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">IOC/FOK 也走这里</text><rect x="582.0" y="360.0" width="168.0" height="50.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="666.0" y="391.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>EXPIRED</text><text x="666.0" y="434.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">ACCEPTED、TRIGGERED…</text><text x="666.0" y="456.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">GTD 到期等</text><rect x="768.0" y="360.0" width="168.0" height="50.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="852.0" y="391.0" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>VOIDED</text><text x="852.0" y="434.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">FILLED</text><text x="852.0" y="456.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">成交被撤销</text><rect x="24.0" y="488.0" width="912.0" height="56.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="480.0" y="512.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">照着真实交易所写的几条：外部订单可从 INITIALIZED 直接到 ACCEPTED；CANCELED、EXPIRED 之后仍可 FILLED；</text><text x="480.0" y="534.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">改撤单被拒时回到 previous_status；ModifyDenied、CancelDenied 在任何状态下都不改变状态。</text><text x="480.0" y="572.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">蓝：在本地或在路上（既不 open 也不 closed）　青：挂在交易所（is_open）　灰：已结束（is_closed）</text></g></svg>
