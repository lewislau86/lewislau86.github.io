<svg xmlns="http://www.w3.org/2000/svg" width="960" height="524" viewBox="0 0 960 524" role="img" aria-labelledby="title desc">
<title id="title">模拟交易所与撮合引擎</title><desc id="desc">上方：命令从回测执行客户端进入交易所的普通队列或在途队列，结清时交给撮合引擎。左侧：行情进入撮合引擎，更新只读的订单簿后触发 iterate。撮合引擎内有订单簿、撮合核心、process_order 和 iterate，产生的订单事件从右侧经执行客户端回到执行引擎。底部是 L1 上市价买单和挂单限价单的成交价例子。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="524" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">SimulatedExchange：一个品种的撮合引擎有两个入口</text><rect x="250.0" y="60.0" width="200.0" height="60.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="350.0" y="84.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">BacktestExecutionClient</text><text x="350.0" y="104.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">生成 OrderSubmitted</text><line x1="450.0" y1="90.0" x2="500.0" y2="90.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="500.0" y="60.0" width="210.0" height="60.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="605.0" y="84.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">命令队列</text><text x="605.0" y="104.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">普通队列 / 在途队列（延迟）</text><line x1="605.0" y1="120.0" x2="605.0" y2="152.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="615.0" y="142.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start">settle_venues 处理到期命令</text><rect x="24.0" y="200.0" width="170.0" height="150.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="109.0" y="249.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">行情</text><text x="109.0" y="269.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">报价、成交</text><text x="109.0" y="289.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">K 线（开高低收）</text><text x="109.0" y="309.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">订单簿增量 / 快照</text><line x1="194.0" y1="275.0" x2="238.0" y2="275.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="240.0" y="154.0" width="500.0" height="240.0" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="490.0" y="178.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">OrderMatchingEngine（每个品种一个）</text><rect x="258.0" y="194.0" width="220.0" height="80.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="368.0" y="218.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">订单簿 book</text><text x="368.0" y="238.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">由数据维护，只读</text><text x="368.0" y="258.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">模拟成交不修改它</text><rect x="502.0" y="194.0" width="220.0" height="80.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="612.0" y="218.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">撮合核心 core</text><text x="612.0" y="238.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">本地挂单 + 当前买卖价</text><text x="612.0" y="258.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">与订单仿真器同一类型</text><rect x="258.0" y="290.0" width="220.0" height="88.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="368.0" y="318.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">process_order</text><text x="368.0" y="338.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">检查 → 按类型：</text><text x="368.0" y="358.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">成交 / 挂单 / 拒绝</text><rect x="502.0" y="290.0" width="220.0" height="88.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="612.0" y="318.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">iterate</text><text x="612.0" y="338.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">过期 GTD → 买单 → 卖单</text><text x="612.0" y="358.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">成交、触发、追踪止损</text><line x1="478.0" y1="234.0" x2="500.0" y2="234.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="612.0" y1="274.0" x2="612.0" y2="288.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="740.0" y1="275.0" x2="784.0" y2="275.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="786.0" y="200.0" width="150.0" height="150.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="861.0" y="239.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">订单事件</text><text x="861.0" y="259.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Accepted</text><text x="861.0" y="279.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Rejected</text><text x="861.0" y="299.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Filled …</text><text x="861.0" y="319.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">→ 执行引擎</text><rect x="24.0" y="412.0" width="912.0" height="92.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="44.0" y="438.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">L1 例子：卖一 0.65008 × 10 万，买入市价 15 万</text><text x="44.0" y="464.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">10 万 @ 0.65008（盘口数量用完）→ 剩余 5 万 @ 0.65009（最后成交价差一个价位）</text><text x="44.0" y="488.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">挂着的买入限价 0.65010 被卖价 0.65008 穿过时，按自己的限价 0.65010 成交（不给价格改善）</text></g></svg>
