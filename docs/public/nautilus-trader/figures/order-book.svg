<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="title desc">
<title id="title">OrderBook 的数据结构</title><desc id="desc">OrderBook 有 bids 和 asks 两条 BookLadder，每条是一个 BTreeMap，键为 BookPrice、值为 BookLevel。买方向的 BookPrice 比较顺序反转，因此两边的第一个元素都是最优价。每个 BookLevel 用 IndexMap 按插入顺序保存该价位上的 BookOrder，另有一个按订单号到价位的 HashMap，用来在修改和删除时直接定位。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect width="960" height="526" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="38.0" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">OrderBook：两条 BTreeMap 价格阶梯，每个价位一个保持先后顺序的 IndexMap</text><rect x="330.0" y="58.0" width="300.0" height="70.0" rx="10" fill="#f1f5f9" stroke="#172033" stroke-width="1.5"/><text x="480.0" y="77.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">OrderBook</text><text x="480.0" y="98.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>instrument_id · book_type</text><text x="480.0" y="119.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>sequence · ts_last · update_count</text><rect x="40.0" y="150.0" width="420.0" height="330.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="250.0" y="176.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">bids: BookLadder（买）</text><text x="250.0" y="198.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>levels: BTreeMap&lt;BookPrice, BookLevel&gt;</text><rect x="56.0" y="214.0" width="120.0" height="56.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="116.0" y="238.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>100.02</text><text x="116.0" y="258.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">最优</text><line x1="178.0" y1="242.0" x2="198.0" y2="242.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/><rect x="202.0" y="222.0" width="74.0" height="40.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-wid