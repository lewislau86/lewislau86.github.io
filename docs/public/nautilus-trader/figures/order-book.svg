th="1"/><text x="403.0" y="317.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#15</text><rect x="56.0" y="354.0" width="120.0" height="56.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="116.0" y="378.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>100.00</text><text x="116.0" y="398.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">第 3 档</text><line x1="178.0" y1="382.0" x2="198.0" y2="382.0" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/><rect x="202.0" y="362.0" width="74.0" height="40.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="239.0" y="387.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#16</text><rect x="284.0" y="362.0" width="74.0" height="40.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="321.0" y="387.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#17</text><text x="250.0" y="440.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>BookLevel.orders: IndexMap&lt;OrderId, BookOrder&gt;</text><text x="250.0" y="462.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">插入顺序 = 排队顺序（L3 逐笔；L2 每档只有一条）</text><line x1="480.0" y1="128.0" x2="250.0" y2="150.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="500.0" y="150.0" width="420.0" height="330.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="710.0" y="176.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">asks: BookLadder（卖）</text><text x="710.0" y="198.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>levels: BTreeMap&lt;BookPrice, BookLevel&gt;</text><rect x="516.0" y="214.0" width="120.0" height="56.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="576.0" y="238.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>100.03</text><text x="576.0" y="258.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">最优</text><line x1="638.0" y1="242.0" x2="658.0" y2="242.0" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow-orange)"/><rect x="662.0" y="222.0" width="74.0" height="40.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="699.0" y="247.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#50</text><rect x="744.0" y="222.0" width="74.0" height="40.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="781.0" y="247.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#51</text><rect x="826.0" y="222.0" width="74.0" height="40.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="863.0" y="247.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#52</text><rect x="516.0" y="284.0" width="120.0" height="56.0" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="576.0" y="308.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>100.04</text><text x="576.0" y="328.0" font-size="14" 