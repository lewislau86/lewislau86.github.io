<svg xmlns="http://www.w3.org/2000/svg" width="960" height="496" viewBox="0 0 960 496" role="img" aria-labelledby="title desc">
<title id="title">Portfolio 的输入与输出</title><desc id="desc">左侧五个输入：两个端点（账户状态、订单事件）和订单主题、仓位主题、行情主题，主题订阅优先级都是 10。中间是 Portfolio 内部的账户管理器、盈亏缓存、净头寸、快照与取价后备。右侧输出：写回缓存的账户、发布到 events.account 的账户状态、发布到 events.portfolio 的权益快照，以及策略的查询接口。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="496" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">Portfolio 的输入与输出（主题订阅均为优先级 10，先于策略）</text><text x="130.0" y="70.0" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">输入</text><text x="480.0" y="70.0" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">Portfolio 内部</text><text x="830.0" y="70.0" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">输出</text><rect x="24.0" y="84.0" width="212.0" height="60.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="130.0" y="108.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Portfolio.update_account</text><text x="130.0" y="128.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">交易所上报的账户状态</text><rect x="24.0" y="160.0" width="212.0" height="60.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="130.0" y="184.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Portfolio.update_order</text><text x="130.0" y="204.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">影响资金的订单事件</text><rect x="24.0" y="236.0" width="212.0" height="60.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/><text x="130.0" y="260.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">events.order.*</text><text x="130.0" y="280.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">发布账户状态</text><rect x="24.0" y="312.0" width="212.0" height="60.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/><text x="130.0" y="336.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">events.position.*</text><text x="130.0" y="356.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">净头寸、盈亏、保证金</text><rect x="24.0" y="388.0" width="212.0" height="60.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/><text x="130.0" y="412.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">data.quotes.* 等</text><text x="130.0" y="432.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">报价、标记价、外部 K 线</text><rect x="318.0" y="84.0" width="324.0" height="364.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><rect x="338.0" y="102.0" width="284.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="131.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">AccountsManager</text><text x="480.0" y="152.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">余额、冻结、保证金</text><rect x="338.0" y="186.0" width="284.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="215.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">盈亏缓存</text><text x="480.0" y="236.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>unrealized_pnls / realized_pnls</text><rect x="338.0" y="270.0" width="284.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="299.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">净头寸</text><text x="480.0" y="320.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">net_positions（跨策略）</text><rect x="338.0" y="354.0" width="284.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="383.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">快照与取价后备</text><text x="480.0" y="404.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">权益快照、最近有效价</text><line x1="236.0" y1="114.0" x2="336.0" y2="137.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="236.0" y1="190.0" x2="336.0" y2="137.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><line x1="236.0" y1="266.0" x2="336.0" y2="137.0" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><line x1="236.0" y1="342.0" x2="336.0" y2="221.0" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><line x1="236.0" y1="342.0" x2="336.0" y2="305.0" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><line x1="236.0" y1="418.0" x2="336.0" y2="221.0" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><text x="286.0" y="470.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">报价只让盈亏缓存失效，计算推迟到查询</text><rect x="724.0" y="96.0" width="212.0" height="70.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="830.0" y="125.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">缓存里的账户</text><text x="830.0" y="146.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">本地重算后写回</text><line x1="642.0" y1="131.0" x2="722.0" y2="131.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="724.0" y="180.0" width="212.0" height="70.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="830.0" y="209.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">events.account.{id}</text><text x="830.0" y="230.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">AccountState</text><line x1="642.0" y1="215.0" x2="722.0" y2="215.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="724.0" y="264.0" width="212.0" height="70.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="830.0" y="293.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">events.portfolio.{id}</text><text x="830.0" y="314.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每日权益快照</text><line x1="642.0" y1="299.0" x2="722.0" y2="299.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><rect x="724.0" y="348.0" width="212.0" height="70.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="830.0" y="377.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">PortfolioApi 查询</text><text x="830.0" y="398.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">策略 self.portfolio()</text><line x1="642.0" y1="383.0" x2="722.0" y2="383.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/></g></svg>
