<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
<title id="title">指标的注册表与更新路径</title><desc id="desc">上半部分是组件里的 Indicators：一个保存全部指标的列表，以及按品种分的报价、成交两张表和按品种加 K 线规格分的 K 线表，K 线表的键不含聚合来源。下半部分是一根 K 线到达时：框架先按品种和规格找出指标逐个更新。Rust 指标以 Rc&lt;RefCell&lt;T&gt;&gt; 注册，直接调用 handle_bar；Python 注册的指标被包成 PyActorIndicator，每次都要拿 GIL、把 K 线转成 Python 对象、按名字调用 handle_bar。任一指标出错就记日志并跳过 on_bar；组件不在运行状态时指标照样更新但不调用 on_bar；最后才调用你的 on_bar。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="670" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">指标挂在组件的 Indicators 表上，每根 K 线先更新指标、再调用 on_bar</text><rect x="24.0" y="58.0" width="912.0" height="168.0" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="84.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">注册：DataActorCore 里的 Indicators（crates/common/src/actor/indicators.rs）</text><rect x="40.0" y="100.0" width="208.0" height="108.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="144.0" y="138.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">indicators</text><text x="144.0" y="159.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">全部已注册的指标</text><text x="144.0" y="180.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按对象地址去重</text><rect x="264.0" y="100.0" width="208.0" height="108.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="368.0" y="138.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">indicators_for_quotes</text><text x="368.0" y="159.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">键：InstrumentId</text><text x="368.0" y="180.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">register_…_quote_ticks</text><rect x="488.0" y="100.0" width="208.0" height="108.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="592.0" y="138.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">indicators_for_trades</text><text x="592.0" y="159.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">键：InstrumentId</text><text x="592.0" y="180.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">register_…_trade_ticks</text><rect x="712.0" y="100.0" width="208.0" height="108.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="816.0" y="138.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">indicators_for_bars</text><text x="816.0" y="159.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">键：(品种, K 线规格)</text><text x="816.0" y="180.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">不含来源 INTERNAL/EXTERNAL</text><rect x="24.0" y="244.0" width="912.0" height="372.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="270.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">一根 K 线到达组件：handle_bar（框架代码）</text><rect x="40.0" y="290.0" width="300.0" height="64.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="190.0" y="316.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Indicators::handle_bar</text><text x="190.0" y="337.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">按 (品种, 规格) 找出这一组指标</text><line x1="342.0" y1="322.0" x2="380.0" y2="322.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="384.0" y="286.0" width="536.0" height="108.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="400.0" y="310.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">Rust 指标：Rc&lt;RefCell&lt;T&gt;&gt;，T 实现 Indicator</text><text x="400.0" y="338.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">borrow_mut().handle_bar(&amp;bar) → 直接改结构体里的 f64</text><text x="400.0" y="364.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">要打开 nautilus-common 的 indicators 特性</text><rect x="384.0" y="404.0" width="536.0" height="132.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/><text x="400.0" y="428.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">Python 注册的指标：包成 PyActorIndicator</text><text x="400.0" y="456.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">拿 GIL → Bar 转成新的 Python 对象</text><text x="400.0" y="482.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">→ call_method1(&quot;handle_bar&quot;) 按名字调用</text><text x="400.0" y="508.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">内置指标再经 PyO3 回到 Rust；纯 Python 类就在 Python 里算</text><polyline points="360.0,322.0 360.0,470.0 382.0,470.0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="40.0" y="380.0" width="300.0" height="64.0" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="190.0" y="406.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">任一指标出错</text><text x="190.0" y="426.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">记日志，这根 K 线不再调用 on_bar</text><rect x="40.0" y="460.0" width="300.0" height="64.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="190.0" y="486.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">组件不在 RUNNING</text><text x="190.0" y="506.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">指标照样更新，on_bar 不调用</text><rect x="40.0" y="540.0" width="300.0" height="60.0" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text x="190.0" y="564.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">on_bar（你的代码）</text><text x="190.0" y="585.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">读 indicator.value</text><line x1="190.0" y1="354.0" x2="190.0" y2="378.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><line x1="190.0" y1="444.0" x2="190.0" y2="458.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><line x1="190.0" y1="524.0" x2="190.0" y2="538.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="384.0" y="552.0" width="536.0" height="48.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="652.0" y="580.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">历史响应 on_historical_bars 之前也先更新指标</text><text x="480.0" y="642.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">注册不会订阅数据，也不会在 reset 时清空指标：订阅要另外调用 subscribe_*，清空要在 on_reset 里自己做。</text></g></svg>
