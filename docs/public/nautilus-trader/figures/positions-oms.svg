<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">同一串成交在 NETTING 和 HEDGING 下的去向</title><desc id="desc">上面是三笔成交：买 1 @ 420、买 1 @ 430、卖 3 @ 440。NETTING 泳道里只有一个固定 ID 的仓位，前两笔成交后是多 2、均价 425、已实现 -0.85；第三笔被拆成平 2 和开 1，平仓后已实现 28.27 并存入快照，同一 ID 开始新一轮空 1，已实现重置为 -0.44。HEDGING 泳道里三笔成交各自成为一个仓位，两个多 1、一个空 3，净敞口相同但互不轧差。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="570" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">三笔成交在两种订单管理模式下的去向</text><rect x="24.0" y="58.0" width="288.0" height="44.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="168.0" y="85.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">F1  BUY 1 @ 420</text><rect x="328.0" y="58.0" width="288.0" height="44.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="472.0" y="85.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">F2  BUY 1 @ 430</text><rect x="632.0" y="58.0" width="288.0" height="44.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="776.0" y="85.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">F3  SELL 3 @ 440</text><rect x="24.0" y="120.0" width="912.0" height="210.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="146.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">NETTING：一个仓位，ID = ETHUSDT.BINANCE-EMACross-001</text><rect x="44.0" y="164.0" width="260.0" height="70.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="174.0" y="193.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">多 1　均价 420</text><text x="174.0" y="214.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">已实现 -0.42</text><line x1="306.0" y1="199.0" x2="334.0" y2="199.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="336.0" y="164.0" width="260.0" height="70.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="466.0" y="193.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">多 2　均价 425</text><text x="466.0" y="214.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">已实现 -0.85</text><line x1="598.0" y1="199.0" x2="626.0" y2="199.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="628.0" y="160.0" width="292.0" height="158.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="774.0" y="184.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">F3 被拆成两笔</text><text x="774.0" y="210.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">平 2 @ 440，手续费 0.88</text><text x="774.0" y="232.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ FLAT，已实现 28.27，存快照</text><text x="774.0" y="262.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">开 1 @ 440，手续费 0.44</text><text x="774.0" y="284.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">→ 同一 ID 新一轮：空 1</text><text x="774.0" y="306.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">已实现重置为 -0.44</text><text x="44.0" y="268.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">加仓：成本相加、加权平均</text><text x="44.0" y="292.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">减仓：按比例分摊成本，440 × 2 - 850 = 30，再减手续费</text><rect x="24.0" y="348.0" width="912.0" height="160.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="44.0" y="374.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">HEDGING（三张单都不指定仓位）：三个仓位，互不轧差</text><rect x="44.0" y="392.0" width="276.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="182.0" y="421.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">P-…-1</text><text x="182.0" y="442.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">多 1　均价 420</text><rect x="340.0" y="392.0" width="276.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="478.0" y="421.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">P-…-2</text><text x="478.0" y="442.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">多 1　均价 430</text><rect x="636.0" y="392.0" width="276.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="774.0" y="421.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">P-…-3</text><text x="774.0" y="442.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">空 3　均价 440</text><text x="480.0" y="490.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">净敞口同样是空 1，但没有任何仓位被平掉，也没有已实现的价差盈亏</text><text x="480.0" y="540.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">手续费 0.1%，以 USDT 收取，直接计入已实现盈亏；数字单位 USDT。</text></g></svg>
