<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">从零编译的两条流水线</title><desc id="desc">上面是两条路共用的底座：rustup 按 rust-toolchain.toml 安装 1.100.0，Cargo.lock 锁定 937 个包，make 的编译目标先做依赖冷却期检查。左边是 Rust 部分：不需要 Python，直接用 cargo 编译某个 crate、运行 nautilus-backtest 的 engine-ema-cross 示例、跑测试。右边是 Python 部分，make build-debug 依次执行 make sync、生成类型存根、maturin develop 编译扩展模块，最后装进 python/.venv。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="590" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">从源码到能运行：Rust 一条路，Python 一条路，共用同一个 Cargo 工作区</text><rect x="40.0" y="56.0" width="880.0" height="64.0" rx="12" fill="#f1f5f9" stroke="#172033" stroke-width="1.5"/><text x="60.0" y="82.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">共用</text><text x="130.0" y="82.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="start">rustup：rust-toolchain.toml 锁定 1.100.0</text><text x="520.0" y="82.0" font-size="15" fill="#172033" font-weight="normal" text-anchor="start">Cargo.lock：937 个包，构建一律加 --locked</text><text x="130.0" y="106.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">make 的编译目标先跑 check-cargo-cooldown：拒绝发布不足冷却期的依赖版本</text><rect x="40.0" y="136.0" width="330.0" height="404.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="205.0" y="162.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">Rust 部分（不需要 Python）</text><rect x="56.0" y="178.0" width="298.0" height="72.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="205.0" y="206.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>cargo build -p nautilus-model</text><text x="205.0" y="230.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">只编一个 crate，先验证工具链</text><line x1="205.0" y1="252.0" x2="205.0" y2="266.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="56.0" y="268.0" width="298.0" height="72.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="205.0" y="296.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>cargo run -p nautilus-backtest</text><text x="205.0" y="320.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">--example engine-ema-cross</text><line x1="205.0" y1="342.0" x2="205.0" y2="356.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="56.0" y="358.0" width="298.0" height="72.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="205.0" y="386.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>target/debug/examples/…</text><text x="205.0" y="410.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">一个独立的可执行文件，跑完一次回测</text><line x1="205.0" y1="432.0" x2="205.0" y2="446.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="56.0" y="448.0" width="298.0" height="72.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="205.0" y="476.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>cargo test / cargo nextest</text><text x="205.0" y="500.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">或 make cargo-test-core-local</text><rect x="390.0" y="136.0" width="530.0" height="404.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="655.0" y="162.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">Python 部分：make build-debug 依次做四件事</text><rect x="406.0" y="178.0" width="498.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="655.0" y="206.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>① make sync</text><text x="655.0" y="230.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">uv sync：把 uv.lock 里的 72 个依赖装进 python/.venv（不装本包）</text><line x1="655.0" y1="252.0" x2="655.0" y2="266.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="406.0" y="268.0" width="498.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="655.0" y="296.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>② make py-stubs</text><text x="655.0" y="320.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">cargo run --bin python-stub-gen（maturin 那组 feature）→ 生成 .pyi</text><line x1="655.0" y1="342.0" x2="655.0" y2="356.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="406.0" y="358.0" width="498.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="655.0" y="386.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>③ maturin develop --profile nextest</text><text x="655.0" y="410.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">编译 crates/pyo3 → _libnautilus.*.so，放进包目录</text><line x1="655.0" y1="432.0" x2="655.0" y2="446.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="406.0" y="448.0" width="498.0" height="72.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="655.0" y="476.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">④ 在 python/.venv 里运行</text><text x="655.0" y="500.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">uv run --project python --no-sync python examples/backtest/…</text><text x="480.0" y="566.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">②和③都是完整的 Rust 编译，feature 取自 pyproject.toml 的 [tool.maturin]，含全部适配器；首次构建最耗时的是这两步。</text></g></svg>
