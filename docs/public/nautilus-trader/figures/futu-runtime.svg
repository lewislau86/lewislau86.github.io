<svg xmlns="http://www.w3.org/2000/svg" width="960" height="646" viewBox="0 0 960 646" role="img" aria-labelledby="title desc">
<title id="title">富途适配器的运行时位置</title><desc id="desc">核心线程上，DataEngine 和 ExecutionEngine 经 DataClientAdapter、ExecutionClientAdapter 调用 FutuDataClient 和 FutuExecutionClient 的同步 trait 方法，这些方法把网络工作交给 Tokio 上 TaskGroup 里的任务后立刻返回。任务通过共享连接 FutuSharedClient 与本机 OpenD 通信，OpenD 再连富途服务器。推送被解析成 QuoteTick、订单事件或报告，经 channel 交给 AsyncRunner，再派发回引擎。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="646" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">运行时：trait 方法在核心线程上立刻返回，网络活交给 Tokio，结果经 channel 回来</text><rect x="14.0" y="58.0" width="432.0" height="520.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="84.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">核心线程（单线程）</text><rect x="40.0" y="100.0" width="190.0" height="50.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="135.0" y="130.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">DataEngine</text><rect x="242.0" y="100.0" width="190.0" height="50.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="337.0" y="130.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">ExecutionEngine</text><rect x="40.0" y="176.0" width="190.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="135.0" y="198.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">DataClientAdapter</text><text x="135.0" y="218.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>data/src/client.rs</text><rect x="242.0" y="176.0" width="190.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="337.0" y="198.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">ExecutionClientAdapter</text><text x="337.0" y="218.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>execution/src/client/</text><rect x="40.0" y="258.0" width="190.0" height="64.0" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="135.0" y="274.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">FutuDataClient</text><text x="135.0" y="294.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">subscribe_quotes(…)</text><text x="135.0" y="314.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">同步，立刻返回</text><rect x="242.0" y="258.0" width="190.0" height="64.0" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="337.0" y="274.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">FutuExecutionClient</text><text x="337.0" y="294.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">submit_order(…)</text><text x="337.0" y="314.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">同步，立刻返回</text><line x1="135.0" y1="152.0" x2="135.0" y2="174.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="135.0" y1="234.0" x2="135.0" y2="256.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="337.0" y1="152.0" x2="337.0" y2="174.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="337.0" y1="234.0" x2="337.0" y2="256.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="40.0" y="470.0" width="392.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="236.0" y="492.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">AsyncRunner（crates/live/src/runner.rs）</text><text x="236.0" y="512.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">从 channel 取事件，派发到引擎的端点</text><polyline points="60.0,468.0 60.0,440.0 26.0,440.0 26.0,125.0 38.0,125.0" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><polyline points="412.0,468.0 412.0,440.0 438.0,440.0 438.0,125.0 434.0,125.0" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><text x="236.0" y="418.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>DataEngine.process_data · ExecEngine.process</text><text x="230.0" y="556.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">适配器只读缓存（CacheView），不写</text><rect x="470.0" y="58.0" width="300.0" height="520.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="486.0" y="84.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">Tokio 运行时</text><rect x="484.0" y="100.0" width="272.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="620.0" y="119.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">TaskGroup 里的任务</text><text x="620.0" y="139.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">订阅、下单、查询各起任务</text><text x="620.0" y="159.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">（不允许直接 tokio::spawn）</text><rect x="484.0" y="206.0" width="272.0" height="182.0" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="620.0" y="251.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">FutuSharedClient（共享连接）</text><text x="620.0" y="271.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">长度前缀编解码：包头 + protobuf</text><text x="620.0" y="291.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">serial_no → 等待中的请求</text><text x="620.0" y="311.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">定时发 KeepAlive（1004）</text><text x="620.0" y="331.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">推送按 proto_id 分发</text><text x="620.0" y="351.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">限流：下单 15 次 / 30 秒</text><rect x="484.0" y="420.0" width="272.0" height="104.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="620.0" y="446.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">推送解析</text><text x="620.0" y="466.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">行情推送 → QuoteTick 等</text><text x="620.0" y="486.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">2208 / 2218 → 订单事件或报告</text><text x="620.0" y="506.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">→ get_*_event_sender()</text><polyline points="135.0,324.0 135.0,346.0 456.0,346.0 456.0,150.0 482.0,150.0" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><line x1="432.0" y1="290" x2="456" y2="290" stroke="#b45309" stroke-width="1.5"/><text x="330.0" y="340.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">spawn 到 TaskGroup</text><line x1="620.0" y1="172.0" x2="620.0" y2="204.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)" marker-start="url(#arrow-teal)"/><line x1="620.0" y1="390.0" x2="620.0" y2="418.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><line x1="482.0" y1="498.0" x2="434.0" y2="498.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-orange)"/><rect x="796.0" y="200.0" width="150.0" height="96.0" rx="10" fill="#f1f5f9" stroke="#172033" stroke-width="1.5"/><text x="871.0" y="232.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">OpenD</text><text x="871.0" y="253.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>127.0.0.1:11111</text><text x="871.0" y="274.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">本机网关进程</text><rect x="796.0" y="380.0" width="150.0" height="60.0" rx="10" fill="#f1f5f9" stroke="#172033" stroke-width="1.5"/><text x="871.0" y="404.8" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">富途服务器</text><text x="871.0" y="425.8" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">行情 · 交易</text><line x1="758.0" y1="248.0" x2="794.0" y2="248.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="776.0" y="238.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>TCP</text><line x1="871.0" y1="298.0" x2="871.0" y2="378.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="480.0" y="604.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">橙色虚线框是富途要写的部分，其余都是现成的。</text><text x="480.0" y="626.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">命令：引擎 → 适配器方法 → Tokio 任务 → 共享连接；事件：推送 → 解析 → channel → AsyncRunner → 引擎。</text></g></svg>
