<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Actor、策略与 TWAP 的三件套</title><desc id="desc">左上的价差监控 Actor 在 on_quote 里计算价差并发布名为 spread 的信号；策略在 on_signal 里决定买入 6 ETH，下一张带 exec_algorithm_id=TWAP 的市价单，命令被发往 TWAP.execute 端点；TWAP 按 60 秒、每 10 秒一份拆成 6 份，前五份是派生的子单 E1 到 E5，最后一份是主单本身，都经风控和执行引擎提交到交易所；成交事件带着策略的 ID 回到策略。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="500" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">三件套：Actor 发信号，策略下单，TWAP 拆单</text><rect x="24.0" y="66.0" width="260.0" height="96.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="154.0" y="98.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">SpreadMonitor（Actor）</text><text x="154.0" y="119.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_quote 算价差</text><text x="154.0" y="140.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>publish_signal(&quot;spread&quot;)</text><line x1="286.0" y1="114.0" x2="336.0" y2="114.0" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/><text x="311.0" y="104.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">信号</text><rect x="338.0" y="66.0" width="280.0" height="96.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="478.0" y="98.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">策略 EMACross-001</text><text x="478.0" y="119.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_signal → 决定买 6 ETH</text><text x="478.0" y="140.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">exec_algorithm_id = TWAP</text><line x1="620.0" y1="114.0" x2="670.0" y2="114.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="645.0" y="104.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">下单</text><rect x="672.0" y="66.0" width="264.0" height="96.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="804.0" y="98.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">TWAP.execute 端点</text><text x="804.0" y="119.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">on_order：只收市价主单</text><text x="804.0" y="140.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">60 s ÷ 10 s = 6 份</text><text x="480.0" y="186.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Strategy::submit_order 看到 exec_algorithm_id，就把命令发往 {id}.execute，而不是风控</text><rect x="24.0" y="204.0" width="912.0" height="176.0" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="44.0" y="230.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">TWAP 每 10 秒提交一份（计时器名 = 主单号）</text><rect x="44.0" y="248.0" width="136.0" height="70.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="112.0" y="277.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">…-1-E1</text><text x="112.0" y="297.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">1 ETH</text><text x="112.0" y="340.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t = 0 s</text><rect x="192.0" y="248.0" width="136.0" height="70.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="260.0" y="277.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">…-1-E2</text><text x="260.0" y="297.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">1 ETH</text><text x="260.0" y="340.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t = 10 s</text><rect x="340.0" y="248.0" width="136.0" height="70.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="408.0" y="277.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">…-1-E3</text><text x="408.0" y="297.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">1 ETH</text><text x="408.0" y="340.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t = 20 s</text><rect x="488.0" y="248.0" width="136.0" height="70.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="556.0" y="277.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">…-1-E4</text><text x="556.0" y="297.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">1 ETH</text><text x="556.0" y="340.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t = 30 s</text><rect x="636.0" y="248.0" width="136.0" height="70.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="704.0" y="277.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">…-1-E5</text><text x="704.0" y="297.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">1 ETH</text><text x="704.0" y="340.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t = 40 s</text><rect x="784.0" y="248.0" width="136.0" height="70.0" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text x="852.0" y="277.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">主单 …-1</text><text x="852.0" y="297.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">剩余 1 ETH</text><text x="852.0" y="340.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>t = 50 s</text><text x="480.0" y="366.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">前五份由 spawn_market 派生（主单数量随之减少），最后一份提交主单本身</text><line x1="480.0" y1="382.0" x2="480.0" y2="404.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="250.0" y="406.0" width="460.0" height="52.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="437.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">RiskEngine → ExecutionEngine → 交易所</text><text x="480.0" y="484.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">成交事件带着策略 ID EMACross-001 回到策略，仓位记在策略名下，不属于 TWAP</text></g></svg>
