<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">四种 Python 组件与边界上的待遇</title><desc id="desc">上排是四种 Python 组件：DataActor、Strategy、ExecutionAlgorithm、Controller，都是持有 Rc&lt;UnsafeCell&lt;Inner&gt;&gt; 的 Rust 类；DataActor 和执行算法默认用类名作 ID，策略用类名加三位标签，Controller 继承 DataActor、持有 Trader 的弱引用、只能经可导入配置加入。中间是生命周期顺序：启动时 Actor、策略、执行算法，停止时 Actor、执行算法、策略。下方四行是穿过边界时的不同待遇：行情和订单是拷贝；信号的值被转成字符串；Python 自定义数据传递的是同一个对象；嵌套回调里修改订阅会遇到借用冲突。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="650" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">四种 Python 组件：同一种包装，不同的 ID 规则和加入方式</text><rect x="24.0" y="60.0" width="216.0" height="196.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="132.0" y="88.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">DataActor</text><text x="132.0" y="112.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">nautilus_trader.common</text><text x="132.0" y="146.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">Rc&lt;UnsafeCell&lt;…Inner&gt;&gt;</text><text x="132.0" y="178.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">默认 ID = 类名</text><text x="132.0" y="202.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">同类第二个实例冲突</text><text x="132.0" y="226.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">add_actor</text><rect x="256.0" y="60.0" width="216.0" height="196.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="364.0" y="88.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">Strategy</text><text x="364.0" y="112.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">nautilus_trader.trading</text><text x="364.0" y="146.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">Rc&lt;UnsafeCell&lt;…Inner&gt;&gt;</text><text x="364.0" y="178.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">默认 ID = 类名-000…</text><text x="364.0" y="202.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">标签必须唯一</text><text x="364.0" y="226.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">add_strategy</text><rect x="488.0" y="60.0" width="216.0" height="196.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="596.0" y="88.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">ExecutionAlgorithm</text><text x="596.0" y="112.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">nautilus_trader.trading</text><text x="596.0" y="146.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">Rc&lt;UnsafeCell&lt;…Inner&gt;&gt;</text><text x="596.0" y="178.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">默认 ID = 类名</text><text x="596.0" y="202.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">on_order 收到主单拷贝</text><text x="596.0" y="226.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">add_exec_algorithm</text><rect x="720.0" y="60.0" width="216.0" height="196.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="828.0" y="88.0" font-size="16" fill="#64748b" font-weight="bold" text-anchor="middle">Controller</text><text x="828.0" y="112.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">继承 DataActor</text><text x="828.0" y="146.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">沿用 DataActor 的 Inner</text><text x="828.0" y="178.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">持有 Trader 的弱引用</text><text x="828.0" y="202.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">只能用可导入配置加入</text><text x="828.0" y="226.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">运行时增删组件</text><rect x="24.0" y="276.0" width="912.0" height="76.0" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="44.0" y="302.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">启动顺序：Actor → Strategy → ExecutionAlgorithm（与加入顺序无关）</text><text x="44.0" y="330.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">停止顺序：Actor → ExecutionAlgorithm → Strategy；所以 Actor 在 on_start 里订阅，能收到策略在 on_start 里发出的信号</text><text x="480.0" y="384.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">穿过边界时，四种东西的待遇不同</text><rect x="24.0" y="404.0" width="912.0" height="48.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="44.0" y="434.0" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">Bar、QuoteTick、Order</text><text x="320.0" y="434.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">拷贝成新的 Python 对象</text><text x="680.0" y="434.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">手里的对象不会再变</text><rect x="24.0" y="462.0" width="912.0" height="48.0" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.3"/><text x="44.0" y="492.0" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="start">信号的 value</text><text x="320.0" y="492.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">str(value)，收到的永远是字符串</text><text x="680.0" y="492.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">数字、字典都会变成字符串</text><rect x="24.0" y="520.0" width="912.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/><text x="44.0" y="550.0" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">Python 自定义数据</text><text x="320.0" y="550.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">包装原对象，收到同一个对象</text><text x="680.0" y="550.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">接收方改它，发送方也看得见</text><rect x="24.0" y="578.0" width="912.0" height="48.0" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.3"/><text x="44.0" y="608.0" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="start">嵌套回调里改订阅</text><text x="320.0" y="608.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="start">外层调用还借用着同一个对象</text><text x="680.0" y="608.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">里层报 already borrowed</text></g></svg>
