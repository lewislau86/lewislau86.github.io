<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">一条报价在总线里的路径</title><desc id="desc">左边是 publish_typed 的五步：经过事件存储的抓取点；从线程局部存储取出处理器缓冲区；短暂借用总线，从匹配缓存取出处理器，未命中就匹配全部订阅并排序；放开借用后依次调用处理器；最后归还缓冲区。右边是这个主题的匹配结果：组合（优先级 10）、K 线聚合器（5）、策略（0），聚合器和策略在处理时还可能再发布或下单。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="550" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">publish_quote(&quot;data.quotes.BINANCE.ETHUSDT&quot;, &amp;quote) 在总线里的路径</text><rect x="24.0" y="64.0" width="300.0" height="86.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="174.0" y="91.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">① 抓取点</text><text x="174.0" y="112.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>dispatch_tap_publish</text><text x="174.0" y="133.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">事件存储（第 8 章）</text><line x1="174.0" y1="152.0" x2="174.0" y2="168.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="24.0" y="170.0" width="300.0" height="86.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="174.0" y="197.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">② 取缓冲区</text><text x="174.0" y="218.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>std::mem::take(TLS)</text><text x="174.0" y="239.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">嵌套发布拿到新缓冲区</text><line x1="174.0" y1="258.0" x2="174.0" y2="274.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="24.0" y="276.0" width="300.0" height="86.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="174.0" y="303.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">③ 短暂借用总线</text><text x="174.0" y="324.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">topic_cache 命中？</text><text x="174.0" y="345.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">否：匹配全部订阅并排序</text><line x1="174.0" y1="364.0" x2="174.0" y2="380.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><rect x="24.0" y="382.0" width="300.0" height="86.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="174.0" y="409.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">④ 放开借用</text><text x="174.0" y="430.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">依次调用处理器</text><text x="174.0" y="451.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">⑤ 归还缓冲区</text><rect x="352.0" y="64.0" width="584.0" height="400.0" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="372.0" y="92.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">匹配结果（已缓存，按优先级从高到低）</text><rect x="372.0" y="112.0" width="544.0" height="96.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="392.0" y="142.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Portfolio</text><text x="896.0" y="142.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="end">优先级 10</text><text x="392.0" y="168.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>data.quotes.*</text><text x="392.0" y="194.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">更新未实现盈亏</text><rect x="372.0" y="222.0" width="544.0" height="96.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="392.0" y="252.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>BarQuoteHandler</text><text x="896.0" y="252.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="end">优先级 5</text><text x="392.0" y="278.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>data.quotes.BINANCE.ETHUSDT</text><text x="392.0" y="304.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">聚合器：可能 publish_bar</text><rect x="372.0" y="332.0" width="544.0" height="96.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="392.0" y="362.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">策略 handle_quote</text><text x="896.0" y="362.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="end">优先级 0</text><text x="392.0" y="388.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>data.quotes.BINANCE.ETHUSDT</text><text x="392.0" y="414.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">on_quote：可能下单</text><line x1="326.0" y1="386.0" x2="350.0" y2="386.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="480.0" y="500.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">③ 是唯一借用总线的一段；处理器运行时总线已放开，所以它们内部可以再发布、再发送命令。</text><text x="480.0" y="526.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">订阅或退订会清空 topic_cache；派发中新增的订阅从下一次发布开始生效。</text></g></svg>
