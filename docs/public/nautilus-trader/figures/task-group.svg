<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">TaskGroup 的状态与两段关闭</title><desc id="desc">上面是一代任务的三个状态：Open 接受新任务，begin_shutdown 后进入 Closing，所有任务结束后进入 Drained，之后 start_generation 换上新的一代。下面是 finish_shutdown 的时间轴：优雅期限内等待任务自行退出，之后触发强制取消，再在强制期限内等待，仍未结束则返回 Timeout 并保留任务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="490" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">TaskGroup 的一代任务：先登记后运行，两段有界关闭</text><rect x="40.0" y="70.0" width="220.0" height="84.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="150.0" y="96.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Open</text><text x="150.0" y="117.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">spawn：锁内登记 → 再运行</text><text x="150.0" y="138.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">TaskSpawner 绑定本代</text><rect x="370.0" y="70.0" width="220.0" height="84.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="480.0" y="96.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Closing</text><text x="480.0" y="117.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">拒绝新任务</text><text x="480.0" y="138.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">等待任务结束</text><rect x="700.0" y="70.0" width="220.0" height="84.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="810.0" y="96.2" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Drained</text><text x="810.0" y="117.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">全部结束</text><text x="810.0" y="138.2" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">失败信息已取走</text><line x1="260.0" y1="112.0" x2="368.0" y2="112.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="314.0" y="102.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>begin_shutdown</text><line x1="590.0" y1="112.0" x2="698.0" y2="112.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="644.0" y="102.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">排空</text><polyline points="810.0,154.0 810.0,186.0 150.0,186.0 150.0,156.0" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><text x="480.0" y="206.0" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">start_generation：只有上一代 Drained 且为空时，才换上全新的一代</text><text x="40.0" y="256.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">finish_shutdown(优雅期限, 强制期限) 的时间轴</text><line x1="60.0" y1="300.0" x2="900.0" y2="300.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="60" y1="292" x2="60" y2="308" stroke="#172033" stroke-width="1.5"/><text x="60.0" y="326.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">0</text><line x1="300" y1="292" x2="300" y2="308" stroke="#172033" stroke-width="1.5"/><text x="300.0" y="326.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">优雅期限</text><line x1="600" y1="292" x2="600" y2="308" stroke="#172033" stroke-width="1.5"/><text x="600.0" y="326.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">优雅 + 强制期限</text><rect x="64.0" y="340.0" width="232.0" height="70.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="180.0" y="366.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">优雅取消令牌已触发</text><text x="180.0" y="390.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">任务自己监听、自行退出</text><rect x="304.0" y="340.0" width="292.0" height="70.0" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="450.0" y="366.0" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">触发强制取消令牌</text><text x="450.0" y="390.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">包装层 select! 直接丢弃 future</text><rect x="604.0" y="340.0" width="292.0" height="70.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="750.0" y="366.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">仍未结束 → Timeout</text><text x="750.0" y="390.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">保持 Closing，继续持有剩余任务</text><text x="480.0" y="444.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">任何时刻全部结束 → Drained；任务 panic 或意外取消 → 记为失败，以 Join 错误返回</text><text x="480.0" y="468.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">OKX：begin_shutdown → finish_shutdown(1 秒, 2 秒)</text></g></svg>
