<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">回调的调用流程</title><desc id="desc">左边是报价：DataEngine 先写缓存再发布到行情主题，MessageBus 按优先级派发，Portfolio 先于策略；订阅时登记的闭包从注册表取出组件，handle_quote 先更新指标、检查组件是否在运行，再调用 on_quote；Python 策略在这里拿 GIL 并按名字调用；出错只记日志。右边是成交：执行引擎更新缓存里的订单，处理仓位，然后发布订单事件，策略先收到 on_order_filled 再收到 on_order_event，最后发布仓位事件，触发 on_position_opened 等回调。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="640" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">回调是怎样被调用的：都从总线发布开始，经订阅时登记的闭包，回到组件</text><rect x="24.0" y="58.0" width="448.0" height="532.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="40.0" y="84.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">一条报价 → on_quote</text><rect x="38.0" y="100.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="54.0" y="126.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>DataEngine.handle_quote</text><text x="54.0" y="150.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">先写缓存，再发布到 data.quotes.{venue}.{symbol}</text><line x1="248.0" y1="166.0" x2="248.0" y2="180.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="38.0" y="182.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="54.0" y="208.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">MessageBus：TopicRouter&lt;QuoteTick&gt;</text><text x="54.0" y="232.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">按优先级派发：Portfolio（10）先于策略（0）</text><line x1="248.0" y1="248.0" x2="248.0" y2="262.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="38.0" y="264.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="54.0" y="290.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">订阅时登记的闭包</text><text x="54.0" y="314.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">按 actor_id 从注册表取出组件</text><line x1="248.0" y1="330.0" x2="248.0" y2="344.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="38.0" y="346.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="54.0" y="372.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">handle_quote（框架代码）</text><text x="54.0" y="396.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">先更新已注册的指标；组件不在 RUNNING 就丢弃</text><line x1="248.0" y1="412.0" x2="248.0" y2="426.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="38.0" y="428.0" width="420.0" height="64.0" rx="9" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/><text x="54.0" y="454.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">on_quote（你的代码）</text><text x="54.0" y="478.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">Rust 直接调用；Python 拿 GIL、转成新对象、按名字调用</text><line x1="248.0" y1="494.0" x2="248.0" y2="508.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="38.0" y="510.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="54.0" y="536.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">出错时</text><text x="54.0" y="560.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">返回错误或抛异常只记日志，派发继续，节点不停</text><rect x="488.0" y="58.0" width="448.0" height="532.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="504.0" y="84.0" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="start">一笔成交 → on_order_filled、on_position_opened</text><rect x="502.0" y="100.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="518.0" y="126.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ExecEngine.process(OrderFilled)</text><text x="518.0" y="150.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">执行客户端经 channel 送来的成交事件</text><line x1="712.0" y1="166.0" x2="712.0" y2="180.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><rect x="502.0" y="182.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="518.0" y="208.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">更新缓存里的订单</text><text x="518.0" y="232.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">订单 apply 这笔成交，状态、已成交量、均价随之变化</text><line x1="712.0" y1="248.0" x2="712.0" y2="262.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><rect x="502.0" y="264.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="518.0" y="290.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>handle_order_fill</text><text x="518.0" y="314.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">通知 Portfolio；开仓或更新仓位写进缓存</text><line x1="712.0" y1="330.0" x2="712.0" y2="344.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><rect x="502.0" y="346.0" width="420.0" height="64.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="518.0" y="372.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">发布 events.order.{strategy_id}</text><text x="518.0" y="396.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">Portfolio（10）先收到；再到 Trader 注册时订阅的策略</text><line x1="712.0" y1="412.0" x2="712.0" y2="426.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><rect x="502.0" y="428.0" width="420.0" height="64.0" rx="9" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/><text x="518.0" y="454.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">on_order_filled → on_order_event</text><text x="518.0" y="478.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">先具体回调，再通用回调；此时缓存里的仓位已更新</text><line x1="712.0" y1="494.0" x2="712.0" y2="508.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><rect x="502.0" y="510.0" width="420.0" height="64.0" rx="9" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/><text x="518.0" y="536.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">发布 events.position.{strategy_id}</text><text x="518.0" y="560.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">on_position_opened 等 → on_position_event</text><text x="480.0" y="620.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">橙色框是你写的回调；其余都是框架代码。两条路都在核心线程上同步执行，回调返回后派发才继续。</text></g></svg>
