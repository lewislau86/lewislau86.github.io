<svg xmlns="http://www.w3.org/2000/svg" width="960" height="594" viewBox="0 0 960 594" role="img" aria-labelledby="title desc">
<title id="title">Python 适配器的结构</title><desc id="desc">左列是 Rust 内核：数据和执行引擎是唯一写交易状态的地方，适配器只拿到只读的 ClientCache，对账在启动时调用报告钩子、运行中调用查询钩子，适配器的输出排队交给内核处理。中列是 Python 适配器：工厂同步构造客户端且不能碰事件循环，_connect 时循环才绑定，命令钩子在每个客户端的 FIFO 队列里按顺序执行，后台工作用 create_task 交给运行时托管。右列是交易所：会话、下单与查询、行情推送。底部说明超时的下单不发任何事件，由在途检查和查询钩子补齐。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="594" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">Python 适配器：钩子跑在节点绑定的 asyncio 循环上，输出排队交给 Rust 内核</text><rect x="24.0" y="60.0" width="300.0" height="470.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="174.0" y="88.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">Rust 内核（核心线程）</text><rect x="44.0" y="108.0" width="260.0" height="70.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="174.0" y="137.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">DataEngine / ExecEngine</text><text x="174.0" y="157.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">唯一能写交易状态的地方</text><rect x="44.0" y="198.0" width="260.0" height="70.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="174.0" y="227.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">ClientCache</text><text x="174.0" y="247.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">只读视图，读取返回快照</text><rect x="44.0" y="288.0" width="260.0" height="92.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="174.0" y="318.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">对账与在途检查</text><text x="174.0" y="338.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">启动时：_generate_* 报告</text><text x="174.0" y="358.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">运行中：_query_order</text><rect x="44.0" y="400.0" width="260.0" height="110.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="174.0" y="429.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">输出入队</text><text x="174.0" y="449.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">_handle_data 等</text><text x="174.0" y="469.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">generate_order_* 等</text><text x="174.0" y="489.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">由内核按顺序处理</text><rect x="344.0" y="60.0" width="300.0" height="470.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="494.0" y="88.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">你的适配器（同一线程上的 asyncio）</text><rect x="364.0" y="108.0" width="260.0" height="70.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="494.0" y="137.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">工厂 create(...)</text><text x="494.0" y="157.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">同步返回；不能碰事件循环</text><rect x="364.0" y="198.0" width="260.0" height="70.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="494.0" y="227.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">_connect</text><text x="494.0" y="247.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">循环已绑定：建会话、加载品种</text><rect x="364.0" y="288.0" width="260.0" height="92.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="494.0" y="318.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">命令钩子（async）</text><text x="494.0" y="338.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每个客户端一条 FIFO 队列</text><text x="494.0" y="358.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">最多排 1,024 个，按顺序执行</text><rect x="364.0" y="400.0" width="260.0" height="110.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="494.0" y="429.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">self.create_task(...)</text><text x="494.0" y="449.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">后台任务由运行时托管</text><text x="494.0" y="469.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">_disconnect：关队列、</text><text x="494.0" y="489.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">取消、收尾</text><rect x="664.0" y="60.0" width="272.0" height="470.0" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="800.0" y="88.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">交易所 / 网关</text><rect x="684.0" y="198.0" width="232.0" height="70.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="800.0" y="227.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">建立会话、登录</text><text x="800.0" y="247.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">连接要在 _connect 里建立</text><rect x="684.0" y="288.0" width="232.0" height="92.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="800.0" y="318.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">下单、撤单、查询</text><text x="800.0" y="338.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">回包可能丢失（超时）</text><text x="800.0" y="358.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">对账时问“到底成交没有”</text><rect x="684.0" y="400.0" width="232.0" height="110.0" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="800.0" y="439.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">行情推送</text><text x="800.0" y="459.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">后台任务持续读取</text><text x="800.0" y="479.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">收到后 _handle_data</text><line x1="306.0" y1="334.0" x2="362.0" y2="334.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/><text x="334.0" y="300.0" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">命令</text><line x1="626.0" y1="233.0" x2="682.0" y2="233.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="626.0" y1="334.0" x2="682.0" y2="334.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="626.0" y1="455.0" x2="682.0" y2="455.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="362.0" y1="470.0" x2="306.0" y2="470.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="334.0" y="436.0" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">输出</text><text x="480.0" y="570.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">超时不等于拒单：适配器什么都不发，订单留在 SUBMITTED，由在途检查调用 _query_order 查清后用报告补齐。</text></g></svg>
