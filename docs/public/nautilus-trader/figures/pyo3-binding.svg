<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">PyO3 绑定的构建与调用</title><desc id="desc">左边是构建时：各 crate 的 src/python 用 pyclass、pymethods、pyfunction 标注，再在 pymodule 函数里登记，crates/pyo3 的 _libnautilus 把这些子模块挂上去并写入 sys.modules，maturin 编成一个 .so，python/nautilus_trader 下的各模块再星号导入并修正模块名。右边是运行时：engine.add_data 把 Python 对象逐个提取成 Rust 的 Data，进入内核后全在 Rust 里流动；回测主循环里报价到达策略时，PyStrategyInner 拿 GIL、把报价转成新的 Python 对象，经弱引用调用 Python 子类的 on_quote。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="680" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480.0" y="36.0" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">PyO3 绑定：左边是模块怎样拼起来，右边是一次调用怎样在两种语言之间往返</text><rect x="24.0" y="58.0" width="436.0" height="600.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="40.0" y="84.0" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start">构建时（make build-debug）</text><rect x="40.0" y="100.0" width="404.0" height="92.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="56.0" y="128.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">① 各 crate 的 src/python/</text><text x="56.0" y="152.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#[pyclass] / #[pymethods] / #[pyfunction]</text><text x="56.0" y="174.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">只在 python feature 下编译</text><line x1="242.0" y1="194.0" x2="242.0" y2="208.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="40.0" y="210.0" width="404.0" height="92.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="56.0" y="238.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">② #[pymodule] fn model(…)</text><text x="56.0" y="262.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>m.add_class::&lt;Price&gt;()</text><text x="56.0" y="284.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">m.add_function(wrap_pyfunction!(…))</text><line x1="242.0" y1="304.0" x2="242.0" y2="318.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="40.0" y="320.0" width="404.0" height="92.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="56.0" y="348.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">③ crates/pyo3/src/lib.rs</text><text x="56.0" y="372.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family='"JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace'>#[pymodule] fn _libnautilus</text><text x="56.0" y="394.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">wrap_pymodule! + 写入 sys.modules</text><line x1="242.0" y1="414.0" x2="242.0" y2="428.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="40.0" y="430.0" width="404.0" height="92.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="56.0" y="458.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">④ maturin → 一个 .so</text><text x="56.0" y="482.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">_libnautilus.cpython-314-….so</text><text x="56.0" y="504.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">放在 python/nautilus_trader/ 下</text><line x1="242.0" y1="524.0" x2="242.0" y2="538.0" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-orange)"/><rect x="40.0" y="540.0" width="404.0" height="92.0" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/><text x="56.0" y="568.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="start">⑤ python/nautilus_trader/model/</text><text x="56.0" y="592.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">from …_libnautilus.model import *</text><text x="56.0" y="614.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">fixup_module_names；.pyi 由存根生成器写</text><rect x="480.0" y="58.0" width="456.0" height="600.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="496.0" y="84.0" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="start">运行时：engine.add_data(quotes) 与 on_quote 回调</text><rect x="500.0" y="100.0" width="416.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="708.0" y="122.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Python：engine.add_data([QuoteTick, …])</text><text x="708.0" y="142.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">参数是 Python 对象的列表</text><rect x="500.0" y="180.0" width="416.0" height="74.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="708.0" y="201.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">PyO3 包装：PyBacktestEngine.py_add_data</text><text x="708.0" y="221.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">逐个 extract：QuoteTick? TradeTick? Bar? …</text><text x="708.0" y="241.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">→ Vec&lt;Data&gt;（每个元素复制一份）</text><rect x="500.0" y="278.0" width="416.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="708.0" y="300.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Rust：BacktestEngine::add_data</text><text x="708.0" y="320.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">数据进入内核，之后全在 Rust 里流动</text><line x1="708.0" y1="158.0" x2="708.0" y2="178.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="708.0" y1="256.0" x2="708.0" y2="276.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="500.0" y="356.0" width="416.0" height="2.0" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><rect x="500.0" y="374.0" width="416.0" height="56.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="708.0" y="396.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Rust：engine.run() 主循环</text><text x="708.0" y="416.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">DataEngine 发布报价 → 策略的 handler</text><rect x="500.0" y="454.0" width="416.0" height="74.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="708.0" y="475.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">PyStrategyInner.dispatch_on_quote</text><text x="708.0" y="495.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Python::attach（拿 GIL）</text><text x="708.0" y="515.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">quote.into_py_any → 新的 Python 对象</text><rect x="500.0" y="552.0" width="416.0" height="56.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="708.0" y="574.9" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Python：MyStrategy.on_quote(quote)</text><text x="708.0" y="594.9" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">经 weakref 找到实例，按名字调用</text><line x1="708.0" y1="432.0" x2="708.0" y2="452.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><line x1="708.0" y1="530.0" x2="708.0" y2="550.0" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrow-teal)"/><text x="708.0" y="636.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">上半：Python → Rust 提取参数；下半：Rust → Python 回调</text></g></svg>
