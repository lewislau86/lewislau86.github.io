72033" font-weight="normal" text-anchor="middle">买单冻结报价币的名义金额（剩余数量 × 价格），卖单冻结要交付的基础币；冻结不含手续费。</text><text x="480.0" y="446.0" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">成交时：USDT 减少名义金额 423.50 和手续费 0.4235，ETH 增加 1；订单结束后冻结重算为 0。</text><text x="480.0" y="480.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">橙色格是这一步变化的余额。每一格都满足 冻结 + 可用 = 总额。</text></g></svg>
