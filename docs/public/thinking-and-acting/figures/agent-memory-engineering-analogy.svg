<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-labelledby="title desc">
<title id="title">四层记忆的工程类比</title><desc id="desc">注入上下文像一级缓存或目录页，故障是错误被广播；记忆表征像物化视图，故障是过度生长和并发覆盖；记忆笔记像便签，可能一开始就写错或过期；原始记录像只追加的事件日志，是做梦复核时的事实来源。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="535" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="44" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">把四层记忆当作一套存储系统来看</text><rect x="30" y="70" width="140" height="40" rx="4" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><text x="100" y="96" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">层</text><rect x="170" y="70" width="170" height="40" rx="4" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><text x="255" y="96" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">工程类比</text><rect x="340" y="70" width="180" height="40" rx="4" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><text x="430" y="96" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">谁写、何时写</text><rect x="520" y="70" width="210" height="40" rx="4" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><text x="625" y="96" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">典型故障</text><rect x="730" y="70" width="200" height="40" rx="4" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><text x="830" y="96" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">维护手段</text><rect x="30" y="116" width="140" height="86" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="2.4"/><text x="100" y="166" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">注入上下文</text><rect x="170" y="116" width="170" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="154" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">CPU 一级缓存</text><text x="255" y="178" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">书的目录页</text><rect x="340" y="116" width="180" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="430" y="154" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">做梦晋升</text><text x="430" y="178" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">会话内维护索引</text><rect x="520" y="116" width="210" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="625" y="154" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">错误广播到每次会话</text><text x="625" y="178" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">越长越不被遵循</text><rect x="730" y="116" width="200" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="830" y="154" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">只放索引与当前目标</text><text x="830" y="178" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">细节下放、留链接</text><rect x="30" y="208" width="140" height="86" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="2.4"/><text x="100" y="258" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">记忆表征</text><rect x="170" y="208" width="170" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="246" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">物化视图</text><text x="255" y="270" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">数据库索引</text><rect x="340" y="208" width="180" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="430" y="246" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">做梦批量构建</text><text x="430" y="270" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">多 Agent 协作</text><rect x="520" y="208" width="210" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="625" y="246" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">过度生长、断链</text><text x="625" y="270" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">并发写入互相覆盖</text><rect x="730" y="208" width="200" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="830" y="246" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">合并重复、断链检查</text><text x="830" y="270" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">一页一位作者</text><rect x="30" y="300" width="140" height="86" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/><text x="100" y="350" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">记忆笔记</text><rect x="170" y="300" width="170" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="338" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">便签 / 预写日志</text><text x="255" y="362" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">缓冲区</text><rect x="340" y="300" width="180" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="430" y="338" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">会话内即时写</text><text x="430" y="362" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">凭当下判断显著性</text><rect x="520" y="300" width="210" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="625" y="338" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">一开始就写错</text><text x="625" y="362" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">随环境变化而过期</text><rect x="730" y="300" width="200" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="830" y="338" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">对照原始记录复核</text><text x="830" y="362" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">记录“怎么知道的”</text><rect x="30" y="392" width="140" height="86" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.4"/><text x="100" y="442" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">原始记录</text><rect x="170" y="392" width="170" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="430" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">只追加的事件日志</text><text x="255" y="454" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">（event sourcing）</text><rect x="340" y="392" width="180" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="430" y="430" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">运行时自动记录</text><text x="430" y="454" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">不经筛选</text><rect x="520" y="392" width="210" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="625" y="430" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">体积大、查找贵</text><text x="625" y="454" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">不直接告诉你规律</text><rect x="730" y="392" width="200" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="830" y="430" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">保持不可变</text><text x="830" y="454" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">作为唯一事实来源</text><text x="480" y="512" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">本站的分析框架：类比用于帮助记忆各层的取舍，并非原文的表述。</text></g></svg>
