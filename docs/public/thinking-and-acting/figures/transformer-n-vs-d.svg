<title id="title">自注意力的 n² 项在一层计算中的占比</title><desc id="desc">横轴是序列长度 n（对数坐标，10 到 100 万），纵轴是一层 Transformer 中 n² 项的计算占比。d=512 时，30 个 token 的句子只占约 1%，n=d 时约 14%；d=8192 时，128K 上下文占约 73%，1M 上下文占约 95%。</desc>
<rect width="960" height="540" rx="16" fill="#f8fafc"/>
