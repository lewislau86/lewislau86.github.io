<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">记忆学习闭环与各模型的进展</title><desc id="desc">学习闭环分四步：记录失败、提出原因假设、检验确认、写成可复用规则。Sonnet 4.6 停在未经检验的假设，Opus 4.7 与 Sonnet 5 开始区分已确认和未确认，Opus 5、Opus 5.5、Sonnet 5.5 完成了闭环。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="590" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="44" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">记忆的学习闭环：不同模型各走到了哪一步</text><rect x="252" y="76" width="136" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="320" y="109" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">记录失败</text><path d="M388 103L410 103" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="412" y="76" width="136" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="480" y="109" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">提出原因假设</text><path d="M548 103L570 103" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="572" y="76" width="136" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="640" y="109" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">检验 / 确认</text><path d="M708 103L730 103" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="732" y="76" width="136" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="800" y="109" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">写成可复用规则</text><path d="M800 130 V150 H320 V134" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)" stroke-dasharray="6 5"/><text x="560" y="168" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">下一题开新会话：先读记忆目录，再作答</text><text x="226" y="227" font-size="16" fill="#172033" font-weight="bold" text-anchor="end">Sonnet 4.6</text><rect x="240" y="208" width="640" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><rect x="240" y="208" width="320" height="26" rx="13" fill="#64748b" opacity="0.85"/><text x="560" y="258" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">散落的多个文件，每个列着几条未经检验的猜测</text><text x="226" y="297" font-size="16" fill="#172033" font-weight="bold" text-anchor="end">Opus 4.7</text><rect x="240" y="278" width="640" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><rect x="240" y="278" width="416" height="26" rx="13" fill="#b45309" opacity="0.85"/><text x="560" y="328" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">合并成一份参考文档，开始标注“已核对 / 未确认”</text><text x="226" y="367" font-size="16" fill="#172033" font-weight="bold" text-anchor="end">Sonnet 5</text><rect x="240" y="348" width="640" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><rect x="240" y="348" width="480" height="26" rx="13" fill="#b45309" opacity="0.85"/><text x="560" y="398" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">判分后把答案标为“已确认”；答错就写更正</text><text x="226" y="437" font-size="16" fill="#172033" font-weight="bold" text-anchor="end">Opus 5</text><rect x="240" y="418" width="640" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><rect x="240" y="418" width="640" height="26" rx="13" fill="#0f766e" opacity="0.85"/><text x="560" y="468" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">规则 + 它为何成立 + 早前答案 + 踩过的陷阱</text><text x="226" y="507" font-size="16" fill="#172033" font-weight="bold" text-anchor="end">Opus 5.5 / Sonnet 5.5</text><rect x="240" y="488" width="640" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><rect x="240" y="488" width="640" height="26" rx="13" fill="#0f766e" opacity="0.85"/><text x="560" y="538" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">同样闭环：把验证过的作答规则存进记忆</text><text x="480" y="572" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">依原文对 CL-Bench 数据库任务中各模型记忆目录的描述归纳；进度条长度是本站的定性示意，不是测量值。</text></g></svg>
