<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">wiki 在三类任务上的表现</title><desc id="desc">需要跨文档综合的并购问答中，用 wiki 得 87%，仅搜索 73%；答案集中在单一文档的任务上 wiki 没有明显增益；另一任务中 wiki 长到 203 KB，是原文档 115 KB 的 1.77 倍。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="44" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">wiki 什么时候值得建？看问题需要跨越几份文档</text><rect x="30" y="80" width="290" height="420" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="175" y="112" font-size="20" fill="#0f766e" font-weight="bold" text-anchor="middle">跨文档综合</text><text x="175" y="140" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">并购问答 24 题 · 10 份文档</text><text x="175" y="164" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">过半要拼接多份文档；9 题需判断或计算</text><rect x="78" y="248.6" width="64" height="191.4" rx="6" fill="#0f766e" opacity="0.85"/><text x="110" y="238.6" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle">87%</text><text x="110" y="465" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">wiki</text><rect x="208" y="279.4" width="64" height="160.6" rx="6" fill="#64748b" opacity="0.85"/><text x="240" y="269.4" font-size="18" fill="#64748b" font-weight="bold" text-anchor="middle">73%</text><text x="240" y="465" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">仅搜索</text><text x="175" y="490" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">wiki 明显占优</text><rect x="335" y="80" width="290" height="420" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="480" y="112" font-size="20" fill="#64748b" font-weight="bold" text-anchor="middle">单文档查找</text><text x="480" y="140" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">LAB 任务 · 57 个评分点</text><text x="480" y="164" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">多数答案就在一份交易概览备忘录里</text><rect x="375" y="196" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><path d="M497 208L545 288" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="375" y="230" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><path d="M497 242L545 288" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="375" y="264" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><path d="M497 276L545 288" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="375" y="298" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><path d="M497 310L545 288" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="375" y="332" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><path d="M497 344L545 288" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="375" y="366" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><path d="M497 378L545 288" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="548" y="262" width="62" height="52" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="579" y="294" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">备忘录</text><text x="480" y="440" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">文本搜索一步就能命中</text><text x="480" y="490" font-size="15" fill="#64748b" font-weight="bold" text-anchor="middle">wiki 无明显增益</text><rect x="640" y="80" width="290" height="420" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><text x="785" y="112" font-size="20" fill="#b91c1c" font-weight="bold" text-anchor="middle">过度生长</text><text x="785" y="140" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">另一 LAB 任务 · 10 份文档</text><text x="785" y="164" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">wiki：68 页、255 条链接，部分页面无链接</text><circle cx="710" cy="300" r="50" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="710" y="296" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">原文档</text><text x="710" y="318" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">115 KB</text><circle cx="850" cy="300" r="66.4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="850" y="296" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="middle">wiki</text><text x="850" y="318" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">203 KB</text><text x="785" y="440" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">体积是原文的 1.77 倍</text><text x="785" y="490" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">地图和疆域一样大</text><text x="480" y="538" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">原文图 11、图 12 的数字；圆面积与文本体积成正比。三项分别来自不同任务，不可横向比较分数。</text></g></svg>
