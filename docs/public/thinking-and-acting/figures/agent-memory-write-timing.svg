<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">会话内写记忆与离线做梦的取舍</title><desc id="desc">会话内写记忆能在源头捕获显著性、立即可用，但分散注意力、只看到本会话；做梦在后台运行，可跨会话、对照原始记录纠错，但需要额外算力且结果有延迟。两者是分工关系。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="440" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="44" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">什么时候写记忆：现场写，还是事后整理？</text><rect x="40" y="80" width="400" height="262" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="240" y="110" font-size="20" fill="#0f766e" font-weight="bold" text-anchor="middle">会话内写（现场）</text><text x="70" y="142" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="start">+ 显著性在源头捕获，信息最新鲜</text><text x="70" y="184" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="start">+ 写完立刻可用，后面的轮次就能读</text><text x="70" y="226" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="start">− 分走主任务的注意力和步数</text><text x="70" y="268" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="start">− 只看得到本次会话</text><text x="70" y="310" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="start">− 写错了，当下没人复核</text><rect x="520" y="80" width="400" height="262" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="720" y="110" font-size="20" fill="#7c3aed" font-weight="bold" text-anchor="middle">做梦（离线整理）</text><text x="550" y="142" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="start">+ 放到后台，不打断主任务</text><text x="550" y="184" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="start">+ 跨多次会话找共同规律、共同错误</text><text x="550" y="226" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="start">+ 可对照原始记录纠错</text><text x="550" y="268" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="start">− 要额外算力，且要决定多久做一次</text><text x="550" y="310" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="start">− 结果有延迟，当前会话用不上</text><path d="M442 200L516 200" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M518 222L444 222" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><text x="480" y="384" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">二者是分工而不是二选一：现场负责“别丢”，做梦负责“别错、别乱、别太大”。</text><text x="480" y="418" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">对照原文结尾的开放问题整理；“+ / −”为本站归纳。</text></g></svg>
