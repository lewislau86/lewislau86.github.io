<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Agent 记忆的四层结构</title><desc id="desc">自下而上依次是原始记录、记忆笔记、记忆表征和注入上下文。会话自动写原始记录，并把显著观察写成笔记；做梦在会话之间回看原始记录，纠正笔记、构建 wiki，并决定哪些内容晋升到每次会话都会加载的顶层。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="44" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">Agent 记忆的四层结构，以及离线“做梦”在其中的位置</text><rect x="330" y="88" width="280" height="70" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2.4"/><text x="470" y="118" font-size="19" fill="#b91c1c" font-weight="bold" text-anchor="middle">注入上下文</text><text x="470" y="143" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">每次会话开头自动加载 · 必须很小</text><rect x="290" y="178" width="360" height="70" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2.4"/><text x="470" y="208" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">记忆表征（如 wiki）</text><text x="470" y="233" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">按主题组织、互相链接的页面</text><rect x="250" y="268" width="440" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/><text x="470" y="298" font-size="19" fill="#0f766e" font-weight="bold" text-anchor="middle">记忆笔记</text><text x="470" y="323" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">Claude 写下的显著观察与规则</text><rect x="210" y="358" width="520" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.4"/><text x="470" y="388" font-size="19" fill="#2563eb" font-weight="bold" text-anchor="middle">原始记录（transcripts）</text><text x="470" y="413" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">可搜索的完整事件日志</text><rect x="22" y="88" width="150" height="70" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/><text x="97" y="118" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">下一次会话</text><text x="97" y="145" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">从顶层开始</text><path d="M330 123L176 123" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arrow-b91c1c)"/><text x="253" y="114" font-size="14" fill="#b91c1c" font-weight="normal" text-anchor="middle">启动即加载</text><rect x="22" y="268" width="150" height="160" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/><text x="97" y="298" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">本次会话</text><text x="97" y="330" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">执行任务</text><text x="97" y="354" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle">与用户交互</text><path d="M172 296L248 296" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="212" y="287" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">写笔记</text><path d="M172 400L208 400" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="192" y="391" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">自动</text><rect x="782" y="88" width="158" height="340" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/><text x="861" y="114" font-size="19" fill="#7c3aed" font-weight="bold" text-anchor="middle">做梦（离线）</text><text x="861" y="134" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">会话之间运行</text><path d="M782 148L612 148" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><text x="861" y="170" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="middle">晋升 / 下放</text><text x="861" y="188" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">让顶层保持小</text><path d="M782 222L652 222" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><text x="861" y="244" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="middle">建 wiki · 补断链</text><path d="M782 304L692 304" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><text x="861" y="326" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="middle">纠错 · 补写</text><text x="861" y="344" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">跨会话找规律</text><path d="M732 380L780 380" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><text x="861" y="405" font-size="15" fill="#7c3aed" font-weight="normal" text-anchor="middle">回看原始记录</text><path d="M40 466 H920" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="250" y="498" font-size="16" fill="#b91c1c" font-weight="normal" text-anchor="middle">越往上：越小、越常被读到、写错代价越大</text><text x="712" y="498" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="middle">越往下：越完整、越接近事实、查找越贵</text><text x="480" y="538" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">示意图：依原文图 1 的层级关系重绘；箭头方向表示信息的整理与流动。</text></g></svg>
