<svg xmlns="http://www.w3.org/2000/svg" width="960" height="656" viewBox="0 0 960 656" role="img" aria-labelledby="title desc">
<title id="title">Mt. Moon 案例：错误笔记与做梦纠错</title><desc id="desc">笔记把 PokéCenter 记在东侧，Agent 误以为已经过山，跌下单向台阶后又把原因解释成走过头，错误在会话内自我强化。原始记忆和无记忆的运行都没有到达 Cerulean City；做梦对照原始记录改正笔记后，Agent 在第 1,935 次动作到达。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="656" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="44" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">Mt. Moon：一条写错的笔记，怎样把 Agent 困在山脚</text><rect x="10" y="96" width="170" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="95" y="127" font-size="16" fill="#64748b" font-weight="bold" text-anchor="middle">来时的路线</text><rect x="200" y="96" width="170" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="285" y="127" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">洞口 + PokéCenter</text><rect x="395" y="96" width="170" height="50" rx="10" fill="#ffffff" stroke="#172033" stroke-width="2"/><text x="480" y="127" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">Mt. Moon 洞穴</text><rect x="590" y="96" width="170" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="675" y="127" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">东侧出口</text><rect x="780" y="96" width="170" height="50" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="865" y="127" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">Cerulean City</text><path d="M371 121L392 121" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M566 121L587 121" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M761 121L777 121" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M215 146 C200 180 170 180 150 150" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arrow-b91c1c)"/><text x="185" y="192" font-size="14" fill="#b91c1c" font-weight="normal" text-anchor="middle">单向台阶：掉下去就回不来</text><text x="285" y="86" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">西侧</text><text x="675" y="86" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">东侧</text><rect x="30" y="212" width="900" height="140" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="240" font-size="18" fill="#b45309" font-weight="bold" text-anchor="middle">原始记忆：错误在会话内自我强化</text><rect x="38" y="258" width="196" height="74" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="136" y="287" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">笔记写错：</text><text x="136" y="313" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">PokéCenter 在东侧</text><path d="M234 295L265 295" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)"/><rect x="267" y="258" width="196" height="74" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="365" y="287" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">走出中心就宣布：</text><text x="365" y="313" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">“Mt Moon is behind me”</text><path d="M463 295L494 295" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)"/><rect x="496" y="258" width="196" height="74" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="594" y="287" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">把笔记更新成：</text><text x="594" y="313" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">“Mt Moon DONE”</text><path d="M692 295L723 295" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)"/><rect x="725" y="258" width="196" height="74" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="823" y="287" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">跌下台阶后解释为：</text><text x="823" y="313" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">“I overshot far west”</text><text x="480" y="388" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">三次运行的结局（3,000 次累计动作内）</text><text x="140" y="429" font-size="16" fill="#64748b" font-weight="bold" text-anchor="end">没有记忆</text><rect x="160" y="412" width="720" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><rect x="160" y="412" width="302.4" height="24" rx="12" fill="#64748b" opacity="0.8"/><text x="520" y="458" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">始终没有越过这座山</text><text x="140" y="495" font-size="16" fill="#b45309" font-weight="bold" text-anchor="end">原始记忆</text><rect x="160" y="478" width="720" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><rect x="160" y="478" width="259.2" height="24" rx="12" fill="#b45309" opacity="0.8"/><text x="520" y="524" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">跌下台阶 3 次，最后退回 Pewter City</text><text x="140" y="561" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="end">记忆 + 做梦</text><rect x="160" y="544" width="720" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><rect x="160" y="544" width="720" height="24" rx="12" fill="#0f766e" opacity="0.8"/><text x="520" y="590" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">对照原始记录改正笔记 → 回到洞里 → 第 1,935 次动作到达 Cerulean</text><text x="480" y="634" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">示意图：依原文图 7、图 8 的描述重绘；只有“第 1,935 次动作到达”是原文给出的数值，前两条进度条长度为示意。</text></g></svg>
