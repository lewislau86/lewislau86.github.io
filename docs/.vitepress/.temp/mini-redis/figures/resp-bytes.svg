<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">RESP 帧的字节结构</title><desc id="desc">GET course 编码为 25 字节：*2\r\n 表示两元素数组，$3\r\n 后跟 GET\r\n，$6\r\n 后跟 course\r\n。类型前缀和长度前缀让解析器知道每一项在哪里结束。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="340" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">GET course 在网络上的 25 个字节</text><rect x="55" y="100" width="136" height="64" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="123.0" y="140" font-size="18" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>*2\r\n</text><text x="123.0" y="192" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">4 字节</text><text x="123.0" y="218" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">数组：2 个元素</text><rect x="197" y="100" width="136" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="265.0" y="140" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>$3\r\n</text><text x="265.0" y="192" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">4 字节</text><text x="265.0" y="218" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">下一项 3 字节</text><rect x="339" y="100" width="170" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="424.0" y="140" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>GET\r\n</text><text x="424.0" y="192" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">5 字节</text><text x="424.0" y="218" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">第 1 项内容</text><rect x="515" y="100" width="136" height="64" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="583.0" y="140" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>$6\r\n</text><text x="583.0" y="192" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">4 字节</text><text x="583.0" y="218" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">下一项 6 字节</text><rect x="657" y="100" width="272" height="64" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="793.0" y="140" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>course\r\n</text><text x="793.0" y="192" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">8 字节</text><text x="793.0" y="218" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">第 2 项内容</text><path d="M55 250 H895" stroke="#64748b" stroke-width="1.5" fill="none"/><text x="55" y="280" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">解析顺序：</text><text x="140" y="280" font-size="15.5" fill="#172033" font-weight="normal" text-anchor="start">先看首字节类型（* 数组、$ 定长字符串），再按长度取内容，用 \r\n 确认边界。</text><text x="55" y="312" font-size="15.5" fill="#64748b" font-weight="normal" text-anchor="start">长度前缀让解析器不必扫描内容，也能正确处理内容里本身含有 \r\n 的值。</text></g></svg>
