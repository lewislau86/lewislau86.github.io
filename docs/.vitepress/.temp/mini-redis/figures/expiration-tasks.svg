<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-labelledby="title desc">
<title id="title">过期清理涉及的三个任务</title><desc id="desc">连接任务 A 执行 SET 时更新 entries 与过期索引，再用 Notify 提醒后台任务后立即回 OK；后台任务循环执行 purge_expired_keys、计算下一个到期时间并等待 sleep_until 或通知；连接任务 B 的 GET 读到的是清理之前或之后的状态。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="535" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">SET 只登记和提醒，真正删除由后台任务完成</text><rect x="30" y="75" width="900" height="105" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><text x="50" y="100" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="start">连接任务 A</text><rect x="50" y="112" width="160" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="130.0" y="142.0" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Set::apply</text><rect x="225" y="112" width="160" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="305.0" y="142.0" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Db::set</text><path d="M210 136L221 136" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="400" y="112" width="160" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="142.0" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle">更新 entries 与索引</text><path d="M385 136L396 136" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="600" y="112" width="160" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="680.0" y="142.0" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>notify_one</text><path d="M560 136L596 136" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="775" y="112" width="160" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="855.0" y="142.0" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle">写回 OK</text><path d="M760 136L771 136" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M680 162 C680 215 700 230 692 288" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)" stroke-dasharray="7 5"/><text x="710" y="220" font-size="14" fill="#7c3aed" font-weight="normal" text-anchor="start">通知，不是调用</text><rect x="160" y="250" width="640" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="180" y="275" font-size="14.5" fill="#7c3aed" font-weight="bold" text-anchor="start">后台任务 purge_expired_tasks（Db::new 时 spawn），循环：</text><rect x="180" y="292" width="185" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="272.5" y="321.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>purge_expired_keys</text><rect x="395" y="292" width="175" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="482.5" y="321.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">得到下一个 deadline</text><rect x="600" y="292" width="185" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="692.5" y="321.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>sleep_until / notified</text><path d="M365 315L391 315" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><path d="M570 315L596 315" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><path d="M692 338 V380 H272 V342" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><text x="482" y="400" font-size="14" fill="#7c3aed" font-weight="normal" text-anchor="middle">醒来后重新读取共享状态</text><rect x="30" y="445" width="900" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="50" y="470" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="start">连接任务 B</text><rect x="200" y="456" width="170" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="285.0" y="485.0" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Get::apply</text><rect x="400" y="456" width="170" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="485.0" y="485.0" font-size="14.5" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Db::get</text><path d="M370 479L396 479" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="590" y="485" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">看到的是清理之前或之后的 entries</text></g></svg>
