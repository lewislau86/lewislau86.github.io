<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">发布订阅的消息路径</title><desc id="desc">订阅客户端发送 SUBSCRIBE，订阅 Handler 从 Db 取得 broadcast Receiver 并长期等待；发布客户端发送 PUBLISH，发布 Handler 调用 Sender.send；消息经进程内 broadcast 到达订阅 Handler，后者向订阅客户端推送 message 帧；发布 Handler 向发布客户端返回接收者数。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="480" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">两条 TCP 连接、两个 Handler，由进程内 broadcast 接起来</text><rect x="30" y="110" width="190" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="125.0" y="138.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">订阅客户端</text><text x="125.0" y="159.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Client::subscribe</text><rect x="30" y="330" width="190" height="62" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="125.0" y="358.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">发布客户端</text><text x="125.0" y="379.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Client::publish</text><rect x="410" y="110" width="220" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="520.0" y="138.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">订阅 Handler</text><text x="520.0" y="159.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Subscribe::apply 长期循环</text><rect x="410" y="330" width="220" height="62" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="520.0" y="358.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">发布 Handler</text><text x="520.0" y="379.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Publish::apply</text><rect x="740" y="210" width="195" height="82" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="837.5" y="248.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">Db：pub_sub</text><text x="837.5" y="269.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">频道 news → broadcast</text><path d="M222 130L406 130" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="258" y="121" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>SUBSCRIBE news</text><circle cx="240" cy="116" r="13" fill="#2563eb"/><text x="240" y="121" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><path d="M632 141 C690 141 700 200 736 225" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="690" y="160" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start">取得 Receiver</text><path d="M222 350L406 350" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><text x="258" y="341" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>PUBLISH news hello</text><circle cx="240" cy="336" r="13" fill="#b45309"/><text x="240" y="341" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><path d="M632 361 C690 361 700 300 736 280" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><text x="690" y="352" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Sender.send</text><path d="M736 245 C680 220 660 190 634 168" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)" stroke-dasharray="7 5"/><text x="652" y="215" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="end">消息进入 Receiver</text><path d="M406 160L222 160" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="258" y="185" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start">message 帧（主动推送）</text><circle cx="240" cy="180" r="13" fill="#2563eb"/><text x="240" y="185" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><path d="M406 380L222 380" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><text x="258" y="405" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">Integer：接收者数</text><circle cx="240" cy="400" r="13" fill="#b45309"/><text x="240" y="405" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="480" y="450" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">①② 都是 TCP 上的请求；broadcast 只在服务端进程内传递；③ 是订阅连接上的推送，④ 才是 PUBLISH 自己的响应。</text></g></svg>
