<svg xmlns="http://www.w3.org/2000/svg" width="960" height="505" viewBox="0 0 960 505" role="img" aria-labelledby="title desc">
<title id="title">优雅停机的通道与顺序</title><desc id="desc">server::run 创建 broadcast 通道用于通知停机，Listener 持有 Sender，每个 Handler 持有一个 Receiver；再创建 mpsc 通道用于等待退出，每个 Handler 持有一个 Sender 克隆。收到关闭信号后，接入循环退出并 drop broadcast Sender，各 Handler 收到通知后返回并释放各自的 mpsc Sender，最后一个 Sender 消失时 server::run 的 recv 得到 None 并结束。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="505" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">停机靠两组通道：一组发通知，一组等全部退出</text><rect x="30" y="70" width="430" height="380" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="50" y="98" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">谁持有什么（server::run 创建）</text><rect x="50" y="115" width="180" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="140.0" y="137.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>broadcast Sender</text><text x="140.0" y="158.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">notify_shutdown</text><text x="245" y="135" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">只有 Listener 持有</text><rect x="50" y="185" width="180" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="140.0" y="207.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">Receiver × N</text><text x="140.0" y="228.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每个 Shutdown</text><text x="245" y="205" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">每个 Handler 一个</text><path d="M140 165L140 182" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><rect x="50" y="275" width="180" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="297.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>mpsc Sender</text><text x="140.0" y="318.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">shutdown_complete_tx</text><text x="245" y="295" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">Listener 持原件</text><rect x="50" y="345" width="180" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="367.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">Sender 克隆 × N</text><text x="140.0" y="388.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">_shutdown_complete</text><text x="245" y="365" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">每个 Handler 一个</text><path d="M140 325L140 342" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><text x="245" y="425" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start">mpsc Receiver：server::run 保留</text><text x="500" y="98" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">发生顺序</text><circle cx="515" cy="135" r="13" fill="#64748b"/><text x="515" y="140" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><rect x="540" y="115" width="390" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="555" y="141" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">Ctrl+C / shutdown Future 完成</text><circle cx="515" cy="191" r="13" fill="#64748b"/><text x="515" y="196" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><rect x="540" y="171" width="390" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="555" y="197" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">退出接入循环，不再创建 Handler</text><circle cx="515" cy="247" r="13" fill="#b45309"/><text x="515" y="252" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><rect x="540" y="227" width="390" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="555" y="253" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">drop broadcast Sender → 每个 Handler 收到通知</text><circle cx="515" cy="303" r="13" fill="#b45309"/><text x="515" y="308" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><rect x="540" y="283" width="390" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="555" y="309" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">Handler 返回，释放连接、配额和 mpsc Sender</text><circle cx="515" cy="359" r="13" fill="#2563eb"/><text x="515" y="364" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><rect x="540" y="339" width="390" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="555" y="365" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">最后一个 mpsc Sender 被 drop</text><circle cx="515" cy="415" r="13" fill="#2563eb"/><text x="515" y="420" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><rect x="540" y="395" width="390" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="555" y="421" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">recv() 得到 None → server::run 结束</text><text x="480" y="480" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">没有人真的“发送完成消息”：Sender 全部被 drop，Receiver 就会收到 None，这本身就是“全部退出”的信号。</text></g></svg>
