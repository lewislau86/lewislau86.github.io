<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" aria-labelledby="title desc">
<title id="title">Redis 的四种部署形态</title><desc id="desc">单机：客户端访问一个 Redis 节点；主从复制：Primary 把数据复制到 Replica；Sentinel：多个 Sentinel 监测主从并在故障时切换主节点；Cluster：16384 个哈希槽分布在多个主节点上，客户端按槽访问对应节点。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="425" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">从单机到集群：每一步解决一个新问题</text><rect x="30" y="70" width="210" height="330" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="135" y="100" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">单机</text><text x="135" y="384" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">mini-redis 所在的位置</text><rect x="260" y="70" width="210" height="330" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="365" y="100" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">主从复制</text><text x="365" y="384" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">数据有副本，读可分流</text><rect x="490" y="70" width="210" height="330" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="595" y="100" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">Sentinel</text><text x="595" y="384" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">自动发现故障并切换主节点</text><rect x="720" y="70" width="210" height="330" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="825" y="100" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">Cluster</text><text x="825" y="384" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">16384 个槽分片到多个主节点</text><rect x="75" y="130" width="120" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="135.0" y="158.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client</text><rect x="75" y="240" width="120" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="135.0" y="271.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">Redis</text><path d="M135 174L135 236" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="305" y="130" width="120" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="365.0" y="158.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client</text><rect x="305" y="220" width="120" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="365.0" y="251.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Primary</text><rect x="305" y="310" width="120" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="365.0" y="341.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Replica</text><path d="M365 174L365 216" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M365 270L365 306" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)"/><text x="435" y="294" font-size="14" fill="#7c3aed" font-weight="normal" text-anchor="start">复制</text><rect x="510" y="125" width="170" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="595.0" y="153.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">Sentinel × 3</text><rect x="510" y="220" width="80" height="50" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="550.0" y="251.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>P</text><rect x="600" y="220" width="80" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="640.0" y="251.0" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>R</text><path d="M550 169 V216" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)" stroke-dasharray="7 5"/><path d="M640 169 V216" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)" stroke-dasharray="7 5"/><text x="595" y="310" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">监测、投票、切换</text><text x="595" y="334" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">客户端向 Sentinel 询问主节点</text><rect x="765" y="125" width="120" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="825.0" y="153.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client</text><rect x="745" y="205" width="160" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="825.0" y="225.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">主节点 A</text><text x="825.0" y="246.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">0–5460</text><rect x="745" y="261" width="160" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="825.0" y="281.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">主节点 B</text><text x="825.0" y="302.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">5461–10922</text><rect x="745" y="317" width="160" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="825.0" y="337.0" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">主节点 C</text><text x="825.0" y="358.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">10923–16383</text><path d="M825 169 V201" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/></g></svg>
