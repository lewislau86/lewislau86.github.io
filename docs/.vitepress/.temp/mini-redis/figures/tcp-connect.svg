<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">TCP 连接的建立</title><desc id="desc">服务端依次 bind、取连接配额、accept 得到 socket，再包装为 Handler 并 spawn；客户端 connect 得到 socket，再包装为 Connection 和 Client。两端的 socket 共同构成一条 TCP 连接。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="490" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">两端各自准备 socket，合在一起才是一条 TCP 连接</text><text x="40" y="92" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="start">服务端</text><rect x="40" y="105" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="105.0" y="133.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>bind</text><text x="105.0" y="154.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">监听地址</text><rect x="190" y="105" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="255.0" y="133.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">取 permit</text><text x="255.0" y="154.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">连接配额</text><path d="M170 136L186 136" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="340" y="105" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="405.0" y="133.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>accept</text><text x="405.0" y="154.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">等待新连接</text><path d="M320 136L336 136" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="490" y="105" width="130" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="555.0" y="133.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>socket</text><text x="555.0" y="154.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">已连接</text><path d="M470 136L486 136" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="640" y="105" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="705.0" y="133.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Handler</text><text x="705.0" y="154.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">包装连接</text><path d="M620 136L636 136" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="790" y="105" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="855.0" y="133.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>spawn</text><text x="855.0" y="154.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">独立任务</text><path d="M770 136L786 136" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><text x="40" y="342" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="start">客户端</text><rect x="190" y="355" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="255.0" y="383.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">服务器地址</text><text x="255.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">host:port</text><rect x="340" y="355" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="405.0" y="383.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>connect</text><text x="405.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">发起握手</text><path d="M320 386L336 386" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="490" y="355" width="130" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="555.0" y="383.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>socket</text><text x="555.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">已连接</text><path d="M470 386L486 386" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="640" y="355" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="705.0" y="383.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Connection</text><text x="705.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">读写帧</text><path d="M620 386L636 386" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="790" y="355" width="130" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="855.0" y="383.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client</text><text x="855.0" y="404.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">命令 API</text><path d="M770 386L786 386" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M555 170 V350" stroke="#b45309" stroke-width="4" fill="none"/><path d="M555 176 V170" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#arrow-b45309)"/><path d="M555 344 V350" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#arrow-b45309)"/><rect x="585" y="226" width="300" height="64" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="735" y="252" font-size="18" fill="#b45309" font-weight="bold" text-anchor="middle">一条 TCP 连接</text><text x="735" y="277" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">操作系统负责握手与字节传输</text><text x="480" y="460" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">服务端从 accept 拿到 socket 后交给 Handler；客户端从 connect 拿到 socket 后交给 Connection。</text></g></svg>
