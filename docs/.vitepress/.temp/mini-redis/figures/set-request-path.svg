<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">SET 请求的完整路径</title><desc id="desc">客户端任务依次调用 Client::set、set_cmd、Set::into_frame、Connection::write_frame，把 RESP 字节写入 TCP；服务端 Handler 任务依次 read_frame、Command::from_frame、Set::parse_frames、Command::apply、Set::apply 和 Db::set，再写回 +OK；客户端 read_response 检查 OK 后继续 GET。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="640" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">一次 SET：同一任务内是函数调用，跨进程只有字节</text><rect x="30" y="70" width="300" height="520" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><text x="180" y="98" font-size="16" fill="#2563eb" font-weight="bold" text-anchor="middle">客户端进程 · 调用任务</text><rect x="630" y="70" width="300" height="520" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="780" y="98" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">服务端进程 · 此连接的 Handler 任务</text><rect x="60" y="120" width="240" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="148.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client::set</text><rect x="60" y="182" width="240" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="210.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>set_cmd</text><path d="M180 164L180 180" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="60" y="244" width="240" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="272.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Set::into_frame</text><path d="M180 226L180 242" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="60" y="306" width="240" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="334.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Connection::write_frame</text><path d="M180 288L180 304" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="660" y="120" width="240" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="780.0" y="148.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Connection::read_frame</text><rect x="660" y="182" width="240" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="780.0" y="210.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Command::from_frame</text><path d="M780 164L780 180" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="660" y="244" width="240" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="780.0" y="272.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Set::parse_frames</text><path d="M780 226L780 242" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="660" y="306" width="240" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="780.0" y="334.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Command::apply</text><path d="M780 288L780 304" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="660" y="368" width="240" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="780.0" y="396.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">Set::apply → Db::set</text><path d="M780 350L780 366" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="660" y="430" width="240" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="780.0" y="458.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Connection::write_frame</text><path d="M780 412L780 428" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="345" y="290" width="270" height="54" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="314" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>*3 $3 set $6 course $4 rust</text><text x="480" y="334" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">RESP 字节</text><path d="M300 328 H345" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><path d="M615 300 C640 300 630 142 656 142" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><rect x="60" y="470" width="240" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="498.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Client::read_response</text><rect x="60" y="530" width="240" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="558.0" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">检查 OK → 继续 GET</text><path d="M180 514L180 528" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="392" y="470" width="176" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="498" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+OK\r\n</text><path d="M660 452 C600 452 600 492 570 492" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><path d="M392 492 H302" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><text x="480" y="618" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">蓝、绿框内的箭头都是普通函数调用；橙色箭头是 TCP 上的字节，两边没有共享任何 Rust 对象。</text></g></svg>
