<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="title desc">
<title id="title">Db 与共享状态的结构</title><desc id="desc">Handler A、Handler B 和后台清理任务各持有一个 Db，它们通过 Arc 指向同一份 Shared。Shared 内的 Mutex 保护 State，State 包含 entries、expirations、pub_sub 和 shutdown 四项；Notify 位于锁外，用来提醒清理任务。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="960" height="475" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">多个任务各持一个 Db 句柄，指向同一份 Shared</text><rect x="40" y="110" width="220" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="145.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">Handler A 的 Db</text><path d="M262 139L340 214" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="40" y="200" width="220" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="235.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">Handler B 的 Db</text><path d="M262 229L340 214" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><rect x="40" y="290" width="220" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="150.0" y="325.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">后台清理任务</text><path d="M262 319L340 214" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><text x="300" y="150" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">Arc 克隆</text><rect x="345" y="80" width="575" height="330" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="370" y="110" font-size="19" fill="#0f766e" font-weight="bold" text-anchor="start">Shared（只有一份）</text><rect x="370" y="125" width="380" height="265" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="390" y="152" font-size="16" fill="#b45309" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Mutex&lt;State&gt;</text><text x="520" y="152" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">读写前先加锁</text><rect x="390" y="170" width="340" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="405" y="197" font-size="15.5" fill="#172033" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>entries</text><text x="530" y="197" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">key → Bytes 与可选到期时刻</text><rect x="390" y="222" width="340" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="405" y="249" font-size="15.5" fill="#172033" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>expirations</text><text x="530" y="249" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">按时间排序的 (到期时刻, key)</text><rect x="390" y="274" width="340" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="405" y="301" font-size="15.5" fill="#172033" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>pub_sub</text><text x="530" y="301" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">频道名 → broadcast Sender</text><rect x="390" y="326" width="340" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="405" y="353" font-size="15.5" fill="#172033" font-weight="bold" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>shutdown</text><text x="530" y="353" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">后台任务停止标记</text><rect x="770" y="200" width="130" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="835.0" y="245.0" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>Notify</text><text x="835.0" y="266.0" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">提醒清理任务</text><text x="835" y="330" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">不在锁里</text><text x="480" y="448" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">克隆 Db 只复制 Arc 指针；所有连接读写的是同一张表，修改需要先拿到 Mutex。</text></g></svg>
