<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="title desc">
<title id="title">稳定的 softmax 计算</title><desc id="desc">把分数 [5,2] 减去最大值得到 [0,-3]，取指数并除以指数总和，得到约 0.9526 和 0.0474。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="960" height="475" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="43" font-size="26" fill="#172033" font-weight="bold">Softmax：把分数转换成总和为 1 的概率</text><rect x="35" y="92" width="260" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="165" y="125" font-size="22" fill="#172033" font-weight="normal">原始分数 z</text><text x="165" y="170" font-size="25" fill="#2563eb" font-weight="bold">[5, 2]</text><text x="165" y="207" font-size="18" fill="#172033" font-weight="normal">分数可以超过 1</text><rect x="350" y="92" width="260" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="125" font-size="22" fill="#172033" font-weight="normal">减去最大值 5</text><text x="480" y="170" font-size="25" fill="#2563eb" font-weight="bold">[0, −3]</text><text x="480" y="207" font-size="18" fill="#172033" font-weight="normal">不改变最终概率</text><rect x="665" y="92" width="260" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="795" y="125" font-size="22" fill="#172033" font-weight="normal">指数再归一化</text><text x="795" y="170" font-size="25" fill="#2563eb" font-weight="bold">[0.9526, 0.0474]</text><text x="795" y="207" font-size="18" fill="#172033" font-weight="normal">两项相加为 1</text><path d="M302 158L341 158" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M617 158L656 158" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="275" font-size="23" fill="#172033" font-weight="normal">exp(0) = 1，exp(−3) ≈ 0.0498；每项除以 1.0498</text><text x="74" y="334" font-size="21" fill="#172033" font-weight="normal">类 1</text><rect x="130" y="310" width="700" height="35" rx="5" fill="#e2e8f0"/><rect x="130" y="310" width="666.802" height="35" rx="5" fill="#2563eb"/><text x="880" y="334" font-size="21" fill="#2563eb" font-weight="normal">95.26%</text><text x="74" y="389" font-size="21" fill="#172033" font-weight="normal">类 2</text><rect x="130" y="365" width="700" height="35" rx="5" fill="#e2e8f0"/><rect x="130" y="365" width="33.198" height="35" rx="5" fill="#0f766e"/><text x="880" y="389" font-size="21" fill="#0f766e" font-weight="normal">4.74%</text><text x="480" y="447" font-size="20" fill="#172033" font-weight="normal">这里只演示概率变换；主线小模型的原始输出仍是数值 [5, 2]。</text></g></svg>
