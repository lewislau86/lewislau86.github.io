<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">自动微分：同一个 x 的三条影响路径</title>
  <desc id="desc">函数 y 等于 x 乘 x 再加 x，在 x 等于三时输出十二。前向图中同一个 x 分别进入乘法的左输入、右输入，并直接进入加法。反向从 y 的梯度一开始，乘法两条输入边各贡献三，加法直接边贡献一，三个贡献累加到同一个 x，导数为七。</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c2410c"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .title{font-size:27px;font-weight:700}
      .label{font-size:21px;font-weight:700}
      .body{font-size:19px}
      .value{font-size:25px;font-weight:700;text-anchor:middle}
      .node{fill:#fff;stroke:#93b4e8;stroke-width:2}
      .forward{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#blue)}
      .backward{fill:none;stroke:#c2410c;stroke-width:2.5;marker-end:url(#orange)}
    </style>
  </defs>
  <rect width="960" height="660" rx="18" fill="#f8fafc"/>
  <text x="36" y="45" class="title">y = x × x + x：同一个输入，三条贡献</text>
  <text x="36" y="80" class="body">① 前向计算数值；② 反向沿每条输入边计算贡献，再在同一输入处累加。</text>
  <text x="36" y="122" class="label">① 前向：x = 3</text>
  <rect x="66" y="195" width="140" height="76" rx="12" class="node"/>
  <text x="136" y="241" class="value">x = 3</text>
  <rect x="373" y="152" width="190" height="86" rx="12" class="node"/>
  <text x="468" y="188" class="value">u = x × x</text>
  <text x="468" y="218" class="body" text-anchor="middle">u = 9</text>
  <rect x="735" y="195" width="170" height="76" rx="12" class="node"/>
  <text x="820" y="226" class="value">y = u + x</text>
  <text x="820" y="254" class="body" text-anchor="middle">y = 12</text>
  <path d="M206 214C270 214 279 176 370 176" class="forward"/>
  <path d="M206 250C270 250 288 216 370 216" class="forward"/>
  <text x="250" y="177" class="body">左输入边</text>
  <text x="264" y="270" class="body">右输入边</text>
  <path d="M563 195H732" class="forward"/>
  <text x="626" y="179" class="body">u = 9</text>
  <path d="M136 271V323H820V274" class="forward"/>
  <text x="405" y="312" class="body">直接加法边：仍使用同一个 x = 3</text>
  <line x1="36" y1="355" x2="924" y2="355" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="394" class="label">② 反向：从 dy/dy = 1 开始</text>
  <g>
    <rect x="60" y="415" width="420" height="46" rx="9" fill="#fff0e5"/>
    <text x="78" y="445" class="body">乘法左输入边：1 × 右边的 x = 3</text>
    <rect x="60" y="475" width="420" height="46" rx="9" fill="#fff0e5"/>
    <text x="78" y="505" class="body">乘法右输入边：1 × 左边的 x = 3</text>
    <rect x="60" y="535" width="420" height="46" rx="9" fill="#fff0e5"/>
    <text x="78" y="565" class="body">直接加法边：1 × 1 = 1</text>
  </g>
  <path d="M480 438H547L616 491" class="backward"/>
  <path d="M480 498H616" class="backward"/>
  <path d="M480 558H547L616 505" class="backward"/>
  <circle cx="644" cy="498" r="24" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="644" y="507" font-size="29" text-anchor="middle">+</text>
  <path d="M668 498H713" class="backward"/>
  <rect x="721" y="448" width="192" height="102" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="817" y="481" class="body" text-anchor="middle">累加到同一个 x</text>
  <text x="817" y="516" class="value">3 + 3 + 1 = 7</text>
  <text x="36" y="623" class="body">两条乘法输入边来自同一个 x；它们不是两个可以分别调整的参数。</text>
</svg>
