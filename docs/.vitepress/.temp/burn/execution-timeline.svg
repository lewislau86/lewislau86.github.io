<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc">
  <title id="title">一次计算从提交到读回的时间线</title>
  <desc id="desc">主机先后提交两个操作，设备按顺序执行对应 kernel，最后主机同步并读回结果。</desc>
  <rect width="860" height="300" fill="#ffffff"/>
  <text x="24" y="30" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1f2933">一次计算的时间线</text>
  <text x="24" y="52" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#52606d">提交很快，执行在设备上排队；只有同步或读回才保证结果已经可用。</text>

  <!-- lanes -->
  <text x="24" y="96" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#336b57">主机 Host</text>
  <text x="24" y="196" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#336b57">设备 Device</text>
  <line x1="24" y1="110" x2="836" y2="110" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="24" y1="210" x2="836" y2="210" stroke="#cbd2d9" stroke-width="1"/>

  <!-- host boxes -->
  <rect x="120" y="84" width="110" height="28" rx="5" fill="#e3f0eb" stroke="#519a80"/>
  <text x="175" y="103" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2933">提交 op1</text>
  <rect x="270" y="84" width="110" height="28" rx="5" fill="#e3f0eb" stroke="#519a80"/>
  <text x="325" y="103" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2933">提交 op2</text>
  <rect x="600" y="84" width="130" height="28" rx="5" fill="#fdf0e3" stroke="#c98a3c"/>
  <text x="665" y="103" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2933">同步 + 读回</text>

  <!-- device boxes -->
  <rect x="150" y="184" width="220" height="32" rx="5" fill="#e8eefc" stroke="#5b7fbd"/>
  <text x="260" y="205" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2933">kernel op1</text>
  <rect x="390" y="184" width="190" height="32" rx="5" fill="#e8eefc" stroke="#5b7fbd"/>
  <text x="485" y="205" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2933">kernel op2</text>

  <!-- submit arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
  </defs>
  <line x1="175" y1="112" x2="175" y2="180" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="325" y1="112" x2="410" y2="180" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="665" y1="180" x2="665" y2="116" stroke="#c98a3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- brackets -->
  <line x1="120" y1="140" x2="230" y2="140" stroke="#336b57" stroke-width="1"/>
  <text x="175" y="156" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#336b57">T_submit</text>
  <line x1="235" y1="140" x2="390" y2="140" stroke="#336b57" stroke-width="1"/>
  <text x="312" y="156" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#336b57">T_queue</text>
  <line x1="400" y1="240" x2="575" y2="240" stroke="#5b7fbd" stroke-width="1"/>
  <text x="487" y="258" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b7fbd">T_kernel</text>
  <line x1="600" y1="270" x2="730" y2="270" stroke="#c98a3c" stroke-width="1"/>
  <text x="665" y="288" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#c98a3c">T_readback</text>
</svg>
