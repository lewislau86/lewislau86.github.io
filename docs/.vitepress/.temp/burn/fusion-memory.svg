<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">融合怎样省去中间张量的一次写入与一次读取</title>
  <desc id="desc">矩乘结果 T 已经得到。未融合时，加法读取 T 和 b 并写入 U，ReLU 读取 U 并写入 Y，共五 n 次元素访问。融合时，单个内核读取 T 和 b，使用局部值 u 并写入 Y，共三 n 次元素访问。偏置按展开后的 n 个元素计，忽略缓存等因素。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#526980"/></marker>
  </defs>
  <rect width="960" height="660" rx="18" fill="#f7fafc"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#19344b" text-anchor="middle">
    <text x="480" y="44" font-size="26" font-weight="700">同一个 Y = ReLU(T + b)，两种数据路线</text>
    <text x="480" y="76" font-size="17" fill="#536d82">T = XW 已算好 · T 与展开的 b 各 n 个元素 · 每元素 s 字节</text>
    <rect x="24" y="104" width="912" height="211" rx="14" fill="#fff" stroke="#bfd0de"/>
    <text x="116" y="136" font-size="21" font-weight="700">分开执行</text>
    <text x="798" y="136" font-size="19" font-weight="600">5n 次访问 → 5ns 字节</text>
    <g stroke="#9eb6c9" stroke-width="1.5" fill="#eef4fa">
      <rect x="50" y="173" width="125" height="76" rx="9"/>
      <rect x="220" y="173" width="125" height="76" rx="9"/>
      <rect x="389" y="173" width="177" height="76" rx="9" fill="#fff0df" stroke="#d3a66c"/>
      <rect x="610" y="173" width="125" height="76" rx="9"/>
      <rect x="780" y="173" width="125" height="76" rx="9"/>
    </g>
    <g font-size="20" font-weight="600">
      <text x="112" y="204">读 T、b</text><text x="282" y="204">加法内核</text>
      <text x="477" y="204" fill="#7c501c">中间张量 U</text>
      <text x="672" y="204">ReLU 内核</text><text x="842" y="204">写 Y</text>
    </g>
    <g font-size="17" fill="#526b7e">
      <text x="112" y="232">2n 次</text><text x="282" y="232">U = T + b</text>
      <text x="477" y="232" fill="#7c501c">写 n 次 + 读 n 次</text>
      <text x="672" y="232">max(U, 0)</text><text x="842" y="232">n 次</text>
    </g>
    <g fill="none" stroke="#526980" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M178 210H212"/><path d="M348 210H381"/><path d="M569 210H602"/><path d="M738 210H772"/>
    </g>
    <text x="480" y="285" font-size="18" fill="#7c501c">橙色部分是可省掉的中间读写；不是又多做了两次加法。</text>
    <rect x="24" y="338" width="912" height="204" rx="14" fill="#fff" stroke="#a8c9b4"/>
    <text x="116" y="370" font-size="21" font-weight="700">融合执行</text>
    <text x="798" y="370" font-size="19" font-weight="600">3n 次访问 → 3ns 字节</text>
    <g stroke="#8eb5a1" stroke-width="1.5" fill="#eaf5ee">
      <rect x="80" y="401" width="160" height="80" rx="9"/>
      <rect x="310" y="401" width="340" height="80" rx="9"/>
      <rect x="720" y="401" width="160" height="80" rx="9"/>
    </g>
    <g font-size="21" font-weight="600" fill="#255c41">
      <text x="160" y="434">读 T、b</text><text x="480" y="434">一个内核：先加，再 ReLU</text><text x="800" y="434">写 Y</text>
    </g>
    <g font-size="18" fill="#426453">
      <text x="160" y="463">2n 次</text><text x="480" y="463">u 只供当前内核内部使用</text><text x="800" y="463">n 次</text>
    </g>
    <g fill="none" stroke="#526980" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M243 442H302"/><path d="M653 442H712"/>
    </g>
    <text x="480" y="515" font-size="18" fill="#255c41">省去 U 的写回和重读，仍需保持相同的数学结果。</text>
    <g font-size="17" fill="#526b7e">
      <text x="480" y="582">教学假设：逐次累计元素访问；不计矩乘内部访存、缓存和广播复用。</text>
      <text x="480" y="612">5n → 3n 描述逻辑流量；实际速度仍受启动、计算和设备实现影响。</text>
    </g>
  </g>
</svg>
