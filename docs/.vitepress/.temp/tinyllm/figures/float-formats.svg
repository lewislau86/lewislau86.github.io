<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">FP32、FP16、BF16 的位布局</title><desc id="desc">FP32 有 1 位符号、8 位指数、23 位尾数；FP16 有 1、5、10 位，最大 65504，eps 约 9.8e-4；BF16 有 1、8、7 位，范围与 FP32 接近，eps 约 7.8e-3。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">16 位的两种分法：FP16 多给尾数，BF16 多给指数</text><text x="40" y="115" font-size="20" fill="#172033" font-weight="bold" text-anchor="start">FP32</text><rect x="130" y="91" width="17" height="38" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="147" y="91" width="136" height="38" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><line x1="164" y1="91" x2="164" y2="129" stroke="#2563eb" stroke-opacity="0.25"/><line x1="181" y1="91" x2="181" y2="129" stroke="#2563eb" stroke-opacity="0.25"/><line x1="198" y1="91" x2="198" y2="129" stroke="#2563eb" stroke-opacity="0.25"/><line x1="215" y1="91" x2="215" y2="129" stroke="#2563eb" stroke-opacity="0.25"/><line x1="232" y1="91" x2="232" y2="129" stroke="#2563eb" stroke-opacity="0.25"/><line x1="249" y1="91" x2="249" y2="129" stroke="#2563eb" stroke-opacity="0.25"/><line x1="266" y1="91" x2="266" y2="129" stroke="#2563eb" stroke-opacity="0.25"/><text x="215.0" y="151" font-size="13.5" fill="#2563eb" font-weight="normal" text-anchor="middle">指数 8 位</text><rect x="283" y="91" width="391" height="38" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><line x1="300" y1="91" x2="300" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="317" y1="91" x2="317" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="334" y1="91" x2="334" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="351" y1="91" x2="351" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="368" y1="91" x2="368" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="385" y1="91" x2="385" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="402" y1="91" x2="402" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="419" y1="91" x2="419" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="436" y1="91" x2="436" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="453" y1="91" x2="453" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="470" y1="91" x2="470" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="487" y1="91" x2="487" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="504" y1="91" x2="504" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="521" y1="91" x2="521" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="538" y1="91" x2="538" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="555" y1="91" x2="555" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="572" y1="91" x2="572" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="589" y1="91" x2="589" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="606" y1="91" x2="606" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="623" y1="91" x2="623" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="640" y1="91" x2="640" y2="129" stroke="#b45309" stroke-opacity="0.25"/><line x1="657" y1="91" x2="657" y2="129" stroke="#b45309" stroke-opacity="0.25"/><text x="478.5" y="151" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">尾数 23 位</text><text x="694" y="107" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">eps ≈ 1.19e-7</text><text x="694" y="129" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start">max ≈ 3.4e38</text><text x="40" y="220" font-size="20" fill="#172033" font-weight="bold" text-anchor="start">FP16</text><rect x="130" y="196" width="17" height="38" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="147" y="196" width="85" height="38" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><line x1="164" y1="196" x2="164" y2="234" stroke="#2563eb" stroke-opacity="0.25"/><line x1="181" y1="196" x2="181" y2="234" stroke="#2563eb" stroke-opacity="0.25"/><line x1="198" y1="196" x2="198" y2="234" stroke="#2563eb" stroke-opacity="0.25"/><line x1="215" y1="196" x2="215" y2="234" stroke="#2563eb" stroke-opacity="0.25"/><text x="189.5" y="256" font-size="13.5" fill="#2563eb" font-weight="normal" text-anchor="middle">指数 5 位</text><rect x="232" y="196" width="170" height="38" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><line x1="249" y1="196" x2="249" y2="234" stroke="#b45309" stroke-opacity="0.25"/><line x1="266" y1="196" x2="266" y2="234" stroke="#b45309" stroke-opacity="0.25"/><line x1="283" y1="196" x2="283" y2="234" stroke="#b45309" stroke-opacity="0.25"/><line x1="300" y1="196" x2="300" y2="234" stroke="#b45309" stroke-opacity="0.25"/><line x1="317" y1="196" x2="317" y2="234" stroke="#b45309" stroke-opacity="0.25"/><line x1="334" y1="196" x2="334" y2="234" stroke="#b45309" stroke-opacity="0.25"/><line x1="351" y1="196" x2="351" y2="234" stroke="#b45309" stroke-opacity="0.25"/><line x1="368" y1="196" x2="368" y2="234" stroke="#b45309" stroke-opacity="0.25"/><line x1="385" y1="196" x2="385" y2="234" stroke="#b45309" stroke-opacity="0.25"/><text x="317.0" y="256" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">尾数 10 位</text><text x="422" y="212" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">eps ≈ 9.8e-4</text><text x="422" y="234" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>max = 65504</text><text x="40" y="325" font-size="20" fill="#172033" font-weight="bold" text-anchor="start">BF16</text><rect x="130" y="301" width="17" height="38" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="147" y="301" width="136" height="38" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><line x1="164" y1="301" x2="164" y2="339" stroke="#2563eb" stroke-opacity="0.25"/><line x1="181" y1="301" x2="181" y2="339" stroke="#2563eb" stroke-opacity="0.25"/><line x1="198" y1="301" x2="198" y2="339" stroke="#2563eb" stroke-opacity="0.25"/><line x1="215" y1="301" x2="215" y2="339" stroke="#2563eb" stroke-opacity="0.25"/><line x1="232" y1="301" x2="232" y2="339" stroke="#2563eb" stroke-opacity="0.25"/><line x1="249" y1="301" x2="249" y2="339" stroke="#2563eb" stroke-opacity="0.25"/><line x1="266" y1="301" x2="266" y2="339" stroke="#2563eb" stroke-opacity="0.25"/><text x="215.0" y="361" font-size="13.5" fill="#2563eb" font-weight="normal" text-anchor="middle">指数 8 位</text><rect x="283" y="301" width="119" height="38" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><line x1="300" y1="301" x2="300" y2="339" stroke="#b45309" stroke-opacity="0.25"/><line x1="317" y1="301" x2="317" y2="339" stroke="#b45309" stroke-opacity="0.25"/><line x1="334" y1="301" x2="334" y2="339" stroke="#b45309" stroke-opacity="0.25"/><line x1="351" y1="301" x2="351" y2="339" stroke="#b45309" stroke-opacity="0.25"/><line x1="368" y1="301" x2="368" y2="339" stroke="#b45309" stroke-opacity="0.25"/><line x1="385" y1="301" x2="385" y2="339" stroke="#b45309" stroke-opacity="0.25"/><text x="342.5" y="361" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">尾数 7 位</text><text x="422" y="317" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">eps ≈ 7.8e-3</text><text x="422" y="339" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="start">max ≈ 3.4e38</text><text x="480" y="420" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">指数位决定能表示多大、多小（范围），尾数位决定相邻两个数挨得多近（精度）。</text><text x="480" y="448" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">BF16 与 FP32 的指数位相同，所以范围几乎一样；代价是尾数只有 7 位，刻度比 FP16 粗 8 倍。</text></g></svg>
