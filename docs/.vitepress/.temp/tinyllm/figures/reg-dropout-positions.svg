<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">dropout 的位置和两种模式</title><desc id="desc">左：TinyLLM 的三处 dropout。① 注意力权重在 softmax 之后随机丢掉一部分；② 注意力和 SwiGLU 的输出在加回残差流之前各过一次 dropout；③ 词嵌入之后过一次。右：model.train() 时每个数以概率 p 置零，留下的乘 1/(1−p)，p=0.3 时约乘 1.43；model.eval() 时原样通过。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="650" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">TinyLLM 里的三处 dropout，以及它在训练和评估时的不同行为</text><text x="150" y="84" font-size="17" fill="#172033" font-weight="normal" text-anchor="middle">token ID</text><path d="M150 92L150 112" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="60" y="114" width="180" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="140" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">词嵌入</text><path d="M150 154L150 172" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="60" y="174" width="180" height="36" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/><text x="150" y="198" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="middle">③ Dropout</text><path d="M150 210 V547" stroke="#172033" stroke-width="6" fill="none" opacity="0.18"/><text x="136" y="300" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end">残差流</text><path d="M150 242 H288" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="290" y="224" width="180" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="380" y="247" font-size="15" fill="#7c3aed" font-weight="bold" text-anchor="middle">RMSNorm</text><path d="M380 258L380 272" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="270" y="274" width="220" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="380" y="302" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">注意力</text><text x="498" y="292" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="start">① 注意力权重</text><text x="498" y="312" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">softmax 之后随机丢掉一部分</text><path d="M380 318L380 330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="290" y="332" width="180" height="32" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/><text x="380" y="354" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">② Dropout</text><path d="M380 364 V372 H170" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-2563eb)"/><circle cx="150" cy="372" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="150" y="379" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M150 432 H288" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="290" y="414" width="180" height="34" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="380" y="437" font-size="15" fill="#7c3aed" font-weight="bold" text-anchor="middle">RMSNorm</text><path d="M380 448L380 462" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="270" y="464" width="220" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="380" y="492" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">SwiGLU</text><path d="M380 508L380 520" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="290" y="522" width="180" height="32" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/><text x="380" y="544" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">② Dropout</text><path d="M380 554 V562 H170" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><circle cx="150" cy="562" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="150" y="569" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M150 577L150 602" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="150" y="624" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">最终 RMSNorm → logits</text><line x1="610" y1="70" x2="610" y2="620" stroke="#e2e8f0" stroke-width="2"/><text x="785" y="92" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="middle">model.train()：每次前向重新抽一个掩码</text><rect x="652" y="112" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="676" y="138" font-size="17" fill="#172033" font-weight="normal" text-anchor="middle">x₁</text><path d="M676 152L676 176" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="652" y="178" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="676" y="204" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">×1.43</text><rect x="708" y="112" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="732" y="138" font-size="17" fill="#172033" font-weight="normal" text-anchor="middle">x₂</text><path d="M732 152L732 176" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="708" y="178" width="48" height="38" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="732" y="204" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="middle">0</text><rect x="764" y="112" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="788" y="138" font-size="17" fill="#172033" font-weight="normal" text-anchor="middle">x₃</text><path d="M788 152L788 176" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="764" y="178" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="788" y="204" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">×1.43</text><rect x="820" y="112" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="844" y="138" font-size="17" fill="#172033" font-weight="normal" text-anchor="middle">x₄</text><path d="M844 152L844 176" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="820" y="178" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="844" y="204" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">×1.43</text><rect x="876" y="112" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="900" y="138" font-size="17" fill="#172033" font-weight="normal" text-anchor="middle">x₅</text><path d="M900 152L900 176" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="876" y="178" width="48" height="38" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="900" y="204" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="middle">0</text><text x="785" y="244" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">以概率 p 置零，留下的乘 1/(1−p)</text><text x="785" y="268" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">p = 0.3 时 1/(1−p) ≈ 1.43，平均值不变</text><text x="785" y="330" font-size="16" fill="#0f766e" font-weight="bold" text-anchor="middle">model.eval()：原样通过</text><rect x="652" y="350" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="676" y="376" font-size="17" fill="#172033" font-weight="normal" text-anchor="middle">x₁</text><path d="M676 390L676 414" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow-64748b)"/><rect x="652" y="416" width="48" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="676" y="442" font-size="17" fill="#172033" font-weight="normal" text-anchor="middle">x₁</text><rect x="708" y="350" width="48" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="732" y="376" font-size=