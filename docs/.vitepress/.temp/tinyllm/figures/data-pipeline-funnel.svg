th="146.5" height="28" rx="5" fill="#2563eb" opacity="0.85"/><text x="505.0" y="296" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">936</text><text x="756" y="296" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">−1850：七言、长篇、杂言</text><text x="256" y="346" font-size="15" fill="#172033" font-weight="normal" text-anchor="end">繁转简后精确去重</text><rect x="432.6" y="326" width="144.8" height="28" rx="5" fill="#0f766e" opacity="0.85"/><text x="505.0" y="346" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">925</text><text x="756" y="346" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">−11：正文完全相同</text><text x="36" y="346" font-size="13" fill="#b45309" font-weight="bold" text-anchor="start">§3 去重</text><text x="256" y="396" font-size="15" fill="#172033" font-weight="normal" text-anchor="end">近重复去重</text><rect x="435.2" y="376" width="139.7" height="28" rx="5" fill="#0f766e" opacity="0.85"/><text x="505.0" y="396" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">892</text><text x="756" y="396" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">−33：重合度 ≥ 0.5</text><text x="36" y="460" font-size="13" fill="#b45309" font-weight="bold" text-anchor="start">§4 划分</text><text x="256" y="460" font-size="15" fill="#172033" font-weight="normal" text-anchor="end">按正文哈希划分</text><rect x="435.2" y="440" width="124.9" height="28" fill="#2563eb" opacity="0.85"/><rect x="560.1" y="440" width="8.1" height="28" fill="#b91c1c" opacity="0.85"/><rect x="568.3" y="440" width="6.6" height="28" fill="#7c3aed" opacity="0.85"/><text x="756" y="460" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start">训练 798 · 验证 52 · 测试 42</text><rect x="120" y="498" width="160" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="200" y="523" font-size="14.5" fill="#0f766e" font-weight="bold" text-anchor="middle">§5 泄漏检查</text><path d="M282 5