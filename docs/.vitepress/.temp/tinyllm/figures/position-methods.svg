<svg xmlns="http://www.w3.org/2000/svg" width="960" height="465" viewBox="0 0 960 465" role="img" aria-labelledby="title desc">
<title id="title">把位置放进模型的三种做法</title><desc id="desc">可学习绝对位置为每个位置查一行可训练向量，加到词向量上，只能处理表里有的位置；正弦位置编码用固定公式算出位置向量再相加，不用训练；RoPE 不加向量，而是在每一层注意力里把 q 和 k 按位置旋转，点积只依赖两者的相对距离。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="465" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">把位置放进模型的三种做法</text><rect x="35" y="64" width="270" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="170" y="94" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle">可学习绝对位置</text><rect x="35" y="124" width="270" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="170" y="154" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">位置 0、1、2… 各查一行</text><text x="170" y="184" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">可训练的向量表</text><text x="170" y="214" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">加到词向量上，只加一次</text><text x="170" y="266" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">表有几行，就只能处理几个位置</text><rect x="345" y="64" width="270" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="480" y="94" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle">正弦位置编码</text><rect x="345" y="124" width="270" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="154" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">位置 m 的向量由 sin/cos</text><text x="480" y="184" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">按固定公式算出</text><text x="480" y="214" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">加到词向量上，只加一次</text><text x="480" y="266" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">不用训练，任意位置都能算</text><rect x="655" y="64" width="270" height="46" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><text x="790" y="94" font-size="18" fill="#b45309" font-weight="bold" text-anchor="middle">RoPE 旋转位置</text><rect x="655" y="124" width="270" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="790" y="154" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">不加任何向量</text><text x="790" y="184" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">在每一层注意力里</text><text x="790" y="214" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">把 q、k 按位置转一个角度</text><text x="790" y="266" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">点积只依赖两者相隔几个位置</text><rect x="60" y="296" width="100" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="110" y="321" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">词向量</text><rect x="180" y="296" width="100" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="230" y="321" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">位置向量</text><circle cx="170" cy="376" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="170" y="382" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M110 336 L158 366" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M230 336 L182 366" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M170 391L170 418" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="170" y="440" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">进入第 1 层</text><rect x="370" y="296" width="100" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="420" y="321" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">词向量</text><rect x="490" y="296" width="100" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="540" y="321" font-size="14" fill="#172033" font-weight="normal" text-anchor="middle">位置向量</text><circle cx="480" cy="376" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="480" y="382" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M420 336 L468 366" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M540 336 L492 366" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><path d="M480 391L480 418" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="480" y="440" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">进入第 1 层</text><rect x="665" y="296" width="250" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="790" y="321" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">q = W_q·h,  k = W_k·h</text><path d="M790 336L790 362" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="665" y="364" width="250" height="40" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="790" y="389" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">q 转 m·θ，k 转 n·θ</text><path d="M790 404L790 418" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="790" y="440" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每一层、每个头都做</text></g></svg>
