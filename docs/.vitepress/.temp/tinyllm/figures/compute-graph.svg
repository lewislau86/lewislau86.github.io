<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">单参数计算图的前向与反向</title><desc id="desc">w=2 乘以 x=3 得 6，减 1 得 5，平方得损失 25；反向从 1 开始依次乘 10、1、3，得到 w 的梯度 30。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="450" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">一次前向记录计算图，backward() 沿原路返回并用链式法则相乘</text><rect x="30" y="130" width="180" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="120" y="165" font-size="22" fill="#2563eb" font-weight="bold" text-anchor="middle">w</text><text x="120" y="192" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">参数</text><text x="120" y="112" font-size="19" fill="#0f766e" font-weight="normal" text-anchor="middle">值 2</text><text x="120" y="260" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">∂L/∂w = 30</text><rect x="270" y="130" width="180" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="360" y="165" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">p = w·x</text><text x="360" y="192" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">乘以 x=3</text><text x="360" y="112" font-size="19" fill="#0f766e" font-weight="normal" text-anchor="middle">值 6</text><text x="360" y="260" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">∂L/∂p = 10</text><rect x="510" y="130" width="180" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="165" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">d = p − t</text><text x="600" y="192" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">减去 t=1</text><text x="600" y="112" font-size="19" fill="#0f766e" font-weight="normal" text-anchor="middle">值 5</text><text x="600" y="260" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">∂L/∂d = 10</text><rect x="750" y="130" width="180" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="840" y="165" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">L = d²</text><text x="840" y="192" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle">平方</text><text x="840" y="112" font-size="19" fill="#0f766e" font-weight="normal" text-anchor="middle">值 25</text><text x="840" y="260" font-size="19" fill="#b45309" font-weight="bold" text-anchor="middle">∂L/∂L = 1</text><path d="M212 150L268 150" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M268 186L212 186" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><text x="240.0" y="214" font-size="16" fill="#b45309" font-weight="normal" text-anchor="middle">× x = ×3</text><path d="M452 150L508 150" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M508 186L452 186" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><text x="480.0" y="214" font-size="16" fill="#b45309" font-weight="normal" text-anchor="middle">× 1</text><path d="M692 150L748 150" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M748 186L692 186" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><text x="720.0" y="214" font-size="16" fill="#b45309" font-weight="normal" text-anchor="middle">× 2d = ×10</text><text x="120" y="318" font-size="18" fill="#0f766e" font-weight="normal" text-anchor="start">前向（绿）：从左往右算数值</text><text x="120" y="346" font-size="18" fill="#b45309" font-weight="normal" text-anchor="start">反向（橙）：从 L=1 出发往左，每过一个运算就乘它的局部导数</text><rect x="120" y="368" width="720" height="56" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="404" font-size="20" fill="#b45309" font-weight="normal" text-anchor="middle">∂L/∂w = 1 × 10 × 1 × 3 = 30　　（梯度为正 → 把 w 调小，损失下降）</text></g></svg>
