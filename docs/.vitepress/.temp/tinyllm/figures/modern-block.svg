<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="title desc">
<title id="title">GPT-1 与 2026 年模型的 Block 结构对比</title><desc id="desc">左：GPT-1 由 12 个相同的 Block 组成，每个 Block 是完整注意力加稠密前馈层。右：2026 年的典型做法每 4 层为一组，前 3 层用便宜的线性注意力、第 4 层用完整注意力，每层后接 MoE 前馈层；MoE 由很多小专家组成，路由器为每个 token 只挑少数几个，另有所有 token 共用的共享专家。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="515" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">2018 年和 2026 年的 Block：零件换了，流水线没变</text><rect x="25" y="65" width="300" height="400" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><text x="175" y="92" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">GPT-1（2018）</text><text x="175" y="116" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">12 个相同的 Block</text><rect x="55" y="135" width="240" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="175" y="167" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">完整注意力</text><path d="M175 187L175 205" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="55" y="207" width="240" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="175" y="239" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">稠密前馈层</text><rect x="55" y="275" width="240" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="175" y="307" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">完整注意力</text><path d="M175 327L175 345" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="55" y="347" width="240" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="175" y="379" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">稠密前馈层</text><text x="175" y="430" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">每层看全部前文，参数全部参与计算</text><rect x="350" y="65" width="585" height="400" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="642" y="92" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">2026 年的典型做法（Kimi K3、Qwen3.5 的思路）</text><text x="642" y="116" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">每 4 层为一组，反复堆叠</text><rect x="372" y="135" width="125" height="52" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="434" y="160" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">线性注意力</text><text x="434" y="179" font-size="11.5" fill="#b45309" font-weight="normal" text-anchor="middle">前文压成固定状态</text><path d="M434 187L434 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="372" y="207" width="125" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="434" y="238" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">MoE 前馈层</text><path d="M499 233L510 233" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="512" y="135" width="125" height="52" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="574" y="160" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">线性注意力</text><text x="574" y="179" font-size="11.5" fill="#b45309" font-weight="normal" text-anchor="middle">前文压成固定状态</text><path d="M574 187L574 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="512" y="207" width="125" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="574" y="238" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">MoE 前馈层</text><path d="M639 233L650 233" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="652" y="135" width="125" height="52" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="714" y="160" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">线性注意力</text><text x="714" y="179" font-size="11.5" fill="#b45309" font-weight="normal" text-anchor="middle">前文压成固定状态</text><path d="M714 187L714 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="652" y="207" width="125" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="714" y="238" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">MoE 前馈层</text><path d="M779 233L790 233" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="792" y="135" width="125" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="854" y="160" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">完整注意力</text><text x="854" y="179" font-size="11.5" fill="#2563eb" font-weight="normal" text-anchor="middle">逐个回看全部前文</text><path d="M854 187L854 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="792" y="207" width="125" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="854" y="238" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">MoE 前馈层</text><rect x="372" y="290" width="545" height="140" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="644" y="314" font-size="15" fill="#7c3aed" font-weight="bold" text-anchor="middle">MoE：很多个小前馈层（专家），每个 token 只用其中几个</text><rect x="392" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="428" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="464" y="330" width="30" height="34" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/><rect x="500" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="536" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="572" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="608" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="644" y="330" width="30" height="34" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/><rect x="680" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="716" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="752" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="788" y="330" width="30" height="34" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/><rect x="824" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="860" y="330" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="392" y="376" width="135" height="38" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="459" y="400" font-size="14" fill="#172033" font-weight="bold" text-anchor="middle">共享专家</text><text x="545" y="400" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">路由器给每个 token 挑少数专家（紫框）；共享专家人人都用</text><text x="480" y="492" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">目标仍是预测下一个 token。变化都在“省”：注意力少算、前馈层少激活，才撑得起万亿参数和百万上下文。</text></g></svg>
