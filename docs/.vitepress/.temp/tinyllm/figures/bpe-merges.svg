<svg xmlns="http://www.w3.org/2000/svg" width="960" height="495" viewBox="0 0 960 495" role="img" aria-labelledby="title desc">
<title id="title">BPE 的两步合并</title><desc id="desc">语料 abab 出现 3 次、abac 2 次、ad 1 次。第 1 步 a+b 加权出现 8 次，合并为 ab；第 2 步 ab+ab 出现 3 次，合并为 abab。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="495" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">BPE 训练：统计加权的相邻对，反复合并最常见的一对</text><text x="40" y="100" font-size="17" fill="#64748b" font-weight="bold" text-anchor="start">第 0 步</text><text x="130" y="100" font-size="16" fill="#64748b" font-weight="normal" text-anchor="start">起点：每个字母是一个单位</text><rect x="60" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="77.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="98" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="115.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>b</text><rect x="136" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="153.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="174" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="191.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>b</text><text x="220" y="146" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 3</text><rect x="302" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="319.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="340" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="357.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>b</text><rect x="378" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="395.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="416" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="433.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>c</text><text x="462" y="146" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 2</text><rect x="544" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="561.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="582" y="118" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="599.0" y="146" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>d</text><text x="628" y="146" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 1</text><text x="40" y="225" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="start">第 1 步</text><text x="130" y="225" font-size="16" fill="#2563eb" font-weight="normal" text-anchor="start">合并 a + b → ab（加权出现 8 次）</text><rect x="60" y="243" width="52" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="86.0" y="271" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ab</text><rect x="116" y="243" width="52" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="142.0" y="271" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ab</text><text x="180" y="271" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 3</text><rect x="262" y="243" width="52" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="288.0" y="271" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ab</text><rect x="318" y="243" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="335.0" y="271" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="356" y="243" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="373.0" y="271" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>c</text><text x="402" y="271" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 2</text><rect x="484" y="243" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="501.0" y="271" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="522" y="243" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="539.0" y="271" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>d</text><text x="568" y="271" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 1</text><text x="40" y="350" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="start">第 2 步</text><text x="130" y="350" font-size="16" fill="#0f766e" font-weight="normal" text-anchor="start">合并 ab + ab → abab（加权出现 3 次）</text><rect x="60" y="368" width="88" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="104.0" y="396" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>abab</text><text x="160" y="396" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 3</text><rect x="242" y="368" width="52" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="268.0" y="396" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>ab</text><rect x="298" y="368" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="315.0" y="396" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="336" y="368" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="353.0" y="396" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>c</text><text x="382" y="396" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 2</text><rect x="464" y="368" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="481.0" y="396" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>a</text><rect x="502" y="368" width="34" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="519.0" y="396" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>d</text><text x="548" y="396" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start">× 1</text><text x="480" y="470" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">训练得到的是一份有顺序的合并规则；编码新文本时按这份顺序合并，不再重新统计。</text></g></svg>
