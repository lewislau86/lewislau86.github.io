<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">词嵌入查表</title><desc id="desc">输入 ID 2、3、4 分别取出 6 行 4 列嵌入矩阵的第 2、3、4 行，得到形状为 3×4 的向量序列。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="23" fill="#172033" font-weight="bold" text-anchor="middle">查表：token ID 就是嵌入矩阵的行号</text><text x="110" y="95" font-size="16" fill="#64748b" font-weight="bold" text-anchor="middle">输入 ID</text><rect x="70" y="115" width="80" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="110" y="144" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>2</text><rect x="70" y="175" width="80" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="110" y="204" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>3</text><rect x="70" y="235" width="80" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="110" y="264" font-size="18" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>4</text><text x="470" y="95" font-size="16" fill="#64748b" font-weight="bold" text-anchor="middle">嵌入矩阵 E：[V = 6, d = 4]（可训练参数）</text><text x="325" y="140" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>0</text><text x="363" y="140" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">&lt;pad&gt;</text><rect x="400" y="112" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="462" y="112" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="524" y="112" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="586" y="112" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="325" y="186" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>1</text><text x="363" y="186" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">&lt;eos&gt;</text><rect x="400" y="158" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="462" y="158" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="524" y="158" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="586" y="158" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="325" y="232" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>2</text><text x="363" y="232" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">我</text><rect x="400" y="204" width="58" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="462" y="204" width="58" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="524" y="204" width="58" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="586" y="204" width="58" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><path d="M152 137 C220 137 240 224 300 224" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M650 224 C720 224 730 137 768 137" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-2563eb)"/><text x="325" y="278" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>3</text><text x="363" y="278" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">在</text><rect x="400" y="250" width="58" height="40" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><rect x="462" y="250" width="58" height="40" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><rect x="524" y="250" width="58" height="40" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><rect x="586" y="250" width="58" height="40" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><path d="M152 197 C220 197 240 270 300 270" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M650 270 C720 270 730 197 768 197" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-0f766e)"/><text x="325" y="324" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>4</text><text x="363" y="324" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">学习</text><rect x="400" y="296" width="58" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><rect x="462" y="296" width="58" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><rect x="524" y="296" width="58" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><rect x="586" y="296" width="58" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><path d="M152 257 C220 257 240 316 300 316" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)"/><path d="M650 316 C720 316 730 257 768 257" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-b45309)"/><text x="325" y="370" font-size="14" fill="#64748b" font-weight="normal" text-anchor="end" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>5</text><text x="363" y="370" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">数学</text><rect x="400" y="342" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="462" y="342" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="524" y="342" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="586" y="342" width="58" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="840" y="95" font-size="16" fill="#64748b" font-weight="bold" text-anchor="middle">输出向量 [3, 4]</text><rect x="772" y="117" width="36" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="812" y="117" width="36" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="852" y="117" width="36" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="892" y="117" width="36" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="772" y="177" width="36" height="40" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><rect x="812" y="177" width="36" height="40" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><rect x="852" y="177" width="36" height="40" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><rect x="892" y="177" width="36" height="40" rx="4" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><rect x="772" y="237" width="36" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><rect x="812" y="237" width="36" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><rect x="852" y="237" width="36" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><rect x="892" y="237" width="36" height="40" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="420" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">nn.Embedding 只是按行取值，等价于 one-hot 向量乘 E，但不必真的构造 one-hot。</text><text x="480" y="448" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">ID 的大小没有含义：2 和 3 相邻，不代表“我”和“在”的向量相近。</text></g></svg>
