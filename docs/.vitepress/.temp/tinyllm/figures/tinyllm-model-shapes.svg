<svg xmlns="http://www.w3.org/2000/svg" width="960" height="672" viewBox="0 0 960 672" role="img" aria-labelledby="title desc">
<title id="title">完整 TinyLLM 的数据流、形状与参数分布</title><desc id="desc">左：11 个 token 的 ID 查嵌入表变成 [1, 11, 128]，穿过 4 个 Pre-Norm Block（注意力 4 头、SwiGLU 中间宽度 341）形状不变，最终 RMSNorm 后乘嵌入表的转置得到 [1, 11, 4096] 的 logits。右：共 1,311,360 个参数，嵌入表 524,288 个约占 40%，4 个 Block 合计 786,944 个；每个 Block 里 SwiGLU 约是注意力的两倍。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="672" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="38" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">完整 TinyLLM：一段 11 个 token 的输入走一遍（d=128，4 层，词表 4096）</text><text x="250" y="80" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>token ID  [1, 11]</text><path d="M250 88L250 110" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="100" y="112" width="300" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="250" y="141" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">词嵌入表 E：4096 × 128</text><path d="M250 158L250 180" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="250" y="198" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><rect x="60" y="212" width="380" height="236" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="428" y="236" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="end">× 4 层</text><text x="72" y="236" font-size="15" fill="#0f766e" font-weight="normal" text-anchor="start">Pre-Norm Block</text><rect x="90" y="254" width="320" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="250" y="279" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">RMSNorm → 因果注意力</text><text x="250" y="301" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">4 头 × 32 维，Q/K 加 RoPE</text><circle cx="250" cy="330" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="250" y="336" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">+</text><rect x="90" y="346" width="320" height="58" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="250" y="371" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle">RMSNorm → SwiGLU</text><text x="250" y="393" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">128 → 341 → 128</text><circle cx="250" cy="422" r="13" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="250" y="428" font-size="19" fill="#172033" font-weight="bold" text-anchor="middle">+</text><text x="422" y="340" font-size="13" fill="#64748b" font-weight="normal" text-anchor="end">残差相加</text><path d="M250 448L250 470" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="250" y="488" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[1, 11, 128]</text><rect x="100" y="500" width="300" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="250" y="526" font-size="17" fill="#7c3aed" font-weight="bold" text-anchor="middle">最终 RMSNorm</text><path d="M250 540L250 560" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="100" y="562" width="300" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="250" y="590" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle">乘 Eᵀ：输出层与嵌入共享</text><path d="M250 606L250 626" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="250" y="646" font-size="16" fill="#172033" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>logits  [1, 11, 4096]</text><path d="M400 135 H455 V584 H408" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)" stroke-dasharray="7 5"/><text x="464" y="360" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">同一块</text><text x="464" y="380" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">权重</text><text x="725.0" y="84" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">1,311,360 个参数都在哪</text><text x="560" y="110" font-size="15" fill="#172033" font-weight="normal" text-anchor="start">嵌入表（兼输出层）</text><rect x="560" y="120" width="131.9" height="22" rx="4" fill="#2563eb" opacity="0.85"/><text x="699.9355783308931" y="137" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">524,288（40.0%）</text><text x="560" y="188" font-size="15" fill="#172033" font-weight="normal" text-anchor="start">4 个 Block 合计</text><rect x="560" y="198" width="198.0" height="22" rx="4" fill="#0f766e" opacity="0.85"/><text x="766.0322108345534" y="215" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">786,944（60.0%）</text><text x="560" y="280" font-size="15" fill="#172033" font-weight="normal" text-anchor="start">每个 Block：注意力 4d²</text><rect x="560" y="290" width="16.5" height="22" rx="4" fill="#2563eb" opacity="0.85"/><text x="584.4919472913616" y="307" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">65,536（5.0%）</text><text x="560" y="358" font-size="15" fill="#172033" font-weight="normal" text-anchor="start">每个 Block：SwiGLU 3·d·8d/3</text><rect x="560" y="368" width="33.0" height="22" rx="4" fill="#0f766e" opacity="0.85"/><text x="600.9516837481699" y="385" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">130,944（10.0%）</text><text x="560" y="436" font-size="15" fill="#172033" font-weight="normal" text-anchor="start">每个 Block：两个 RMSNorm</text><rect x="560" y="446" width="3.0" height="22" rx="4" fill="#7c3aed" opacity="0.85"/><text x="571" y="463" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">256（0.0%）</text><text x="560" y="514" font-size="15" fill="#172033" font-weight="normal" text-anchor="start">最终 RMSNorm</text><rect x="560" y="524" width="3.0" height="22" rx="4" fill="#7c3aed" opacity="0.85"/><text x="571" y="541" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">128（0.0%）</text><line x1="560" y1="258" x2="890" y2="258" stroke="#e2e8f0" stroke-width="2"/><text x="560" y="640" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start">条长按占全部参数的比例画</text></g></svg>
