<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">KV cache 随生成步数增长</title><desc id="desc">prefill 时一次算出前两个 token 的 K、V；之后每个 decode 步只为新 token 计算一组 K、V 并接到缓存后面，新 token 的 Q 与全部 K 打分、对全部 V 加权求和。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="520" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">KV cache：每生成一步只算新 token 的 K、V，接到缓存后面</text><text x="40" y="104" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">prefill</text><rect x="200" y="84" width="62" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/><text x="231" y="108" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">K1</text><rect x="200" y="126" width="62" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/><text x="231" y="150" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">V1</text><text x="231" y="184" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">我</text><rect x="270" y="84" width="62" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/><text x="301" y="108" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">K2</text><rect x="270" y="126" width="62" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/><text x="301" y="150" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">V2</text><text x="301" y="184" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">在</text><rect x="380" y="104" width="70" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="415" y="130" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">Q2</text><path d="M378 124 H344" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-0f766e)"/><text x="470" y="120" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">新 Q 与所有 K 打分，</text><text x="470" y="142" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">再对所有 V 加权求和</text><text x="40" y="229" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">decode 第 1 步</text><rect x="200" y="209" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="231" y="233" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">K1</text><rect x="200" y="251" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="231" y="275" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">V1</text><text x="231" y="309" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">我</text><rect x="270" y="209" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="301" y="233" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">K2</text><rect x="270" y="251" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="301" y="275" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">V2</text><text x="301" y="309" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">在</text><rect x="340" y="209" width="62" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/><text x="371" y="233" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">K3</text><rect x="340" y="251" width="62" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/><text x="371" y="275" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">V3</text><text x="371" y="309" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">学</text><rect x="450" y="229" width="70" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="485" y="255" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">Q3</text><path d="M448 249 H414" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-0f766e)"/><text x="540" y="245" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">新 Q 与所有 K 打分，</text><text x="540" y="267" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">再对所有 V 加权求和</text><text x="40" y="354" font-size="16" fill="#172033" font-weight="bold" text-anchor="start">decode 第 2 步</text><rect x="200" y="334" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="231" y="358" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">K1</text><rect x="200" y="376" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="231" y="400" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">V1</text><text x="231" y="434" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">我</text><rect x="270" y="334" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="301" y="358" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">K2</text><rect x="270" y="376" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="301" y="400" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">V2</text><text x="301" y="434" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">在</text><rect x="340" y="334" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="371" y="358" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">K3</text><rect x="340" y="376" width="62" height="36" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="371" y="400" font-size="14" fill="#64748b" font-weight="bold" text-anchor="middle">V3</text><text x="371" y="434" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">学</text><rect x="410" y="334" width="62" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/><text x="441" y="358" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">K4</text><rect x="410" y="376" width="62" height="36" rx="5" fill="#fffbeb" stroke="#b45309"/><text x="441" y="400" font-size="14" fill="#b45309" font-weight="bold" text-anchor="middle">V4</text><text x="441" y="434" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">习</text><rect x="520" y="354" width="70" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="555" y="380" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">Q4</text><path d="M518 374 H484" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-0f766e)"/><text x="610" y="370" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">新 Q 与所有 K 打分，</text><text x="610" y="392" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="start">再对所有 V 加权求和</text><rect x="200" y="452" width="22" height="16" fill="#fffbeb" stroke="#b45309"/><text x="230" y="466" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">本步新算的</text><rect x="340" y="452" width="22" height="16" fill="#f1f5f9" stroke="#64748b"/><text x="370" y="466" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">从缓存直接读</text><text x="480" y="500" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">缓存的是 K、V 张量，注意力权重每一步都要用新的 Q 重新算；缓存大小随上下文长度线性增长。</text></g></svg>
