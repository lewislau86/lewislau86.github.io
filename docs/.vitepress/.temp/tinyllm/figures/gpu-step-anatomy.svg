<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">GPU 上一个训练步的流程与优化点</title><desc id="desc">CPU 按计划切出 batch 拷到显存；GPU 上依次做 BF16 前向、交叉熵、反向求梯度，重复 accum 次后裁剪梯度并用 AdamW 更新。七个红色圆圈标出优化点：数据预取、减少拷贝、FlashAttention 内核、torch.compile 算子融合、激活重计算、融合优化器、减少 CPU 与 GPU 的同步。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="520" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="38" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">GPU 上的一个训练步：本章先跑通，圆圈处是后面要优化的地方</text><rect x="30" y="64" width="900" height="74" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="62" y="106" font-size="17" fill="#64748b" font-weight="bold" text-anchor="middle">CPU</text><rect x="30" y="152" width="900" height="222" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="62" y="282" font-size="17" fill="#64748b" font-weight="bold" text-anchor="middle">GPU</text><rect x="135" y="80" width="170" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="220" y="108" font-size="16" fill="#b45309" font-weight="bold" text-anchor="middle">按计划切 batch</text><path d="M220 124L220 170" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><text x="232" y="150" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">拷到显存</text><rect x="100" y="172" width="240" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="220.0" y="202" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">前向：嵌入 → Block×L → logits</text><text x="220.0" y="226" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">BF16 autocast · SDPA 注意力</text><rect x="360" y="172" width="120" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="420.0" y="202" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle">交叉熵</text><text x="420.0" y="226" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">损失 ÷ accum</text><rect x="500" y="172" width="170" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="585.0" y="202" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle">反向：求梯度</text><text x="585.0" y="226" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">梯度累加到 .grad</text><rect x="690" y="172" width="220" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="800.0" y="202" font-size="15" fill="#7c3aed" font-weight="bold" text-anchor="middle">裁剪 → AdamW 更新</text><text x="800.0" y="226" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">fused 内核 · 学习率调度</text><path d="M340 207L358 207" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><path d="M480 207L498 207" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><path d="M670 207L688 207" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><path d="M585 242 V276 H220 V246" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)" stroke-dasharray="7 5"/><text x="400" y="296" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">重复 accum 次（梯度累积）再更新一次</text><path d="M800 242 V340 H95 V102 H131" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)" stroke-dasharray="7 5"/><text x="470" y="362" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">下一步：loss.item() 记录日志时，CPU 要等 GPU 算完</text><circle cx="220" cy="72" r="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="220" y="78" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">①</text><circle cx="206" cy="150" r="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="206" y="156" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">②</text><circle cx="110" cy="168" r="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="110" y="174" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">③</text><circle cx="330" cy="168" r="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="330" y="174" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">④</text><circle cx="660" cy="168" r="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="660" y="174" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">⑤</text><circle cx="900" cy="168" r="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="900" y="174" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">⑥</text><circle cx="800" cy="312" r="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="800" y="318" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="middle">⑦</text><text x="60" y="412" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">① 数据：多进程预取、锁页内存、异步拷贝</text><text x="510" y="412" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">② 拷贝：整条 token 流常驻显存，省掉每步拷贝</text><text x="60" y="440" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">③ 注意力：SDPA 选 FlashAttention 内核</text><text x="510" y="440" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">④ 编译：torch.compile 融合逐元素小算子</text><text x="60" y="468" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">⑤ 显存：激活重计算，换更大的 batch</text><text x="510" y="468" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">⑥ 优化器：fused AdamW（本章已开）</text><text x="60" y="496" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="start">⑦ 同步：日志每 N 步取一次，少让 CPU 等</text></g></svg>
