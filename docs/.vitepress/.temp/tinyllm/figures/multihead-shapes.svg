<svg xmlns="http://www.w3.org/2000/svg" width="960" height="495" viewBox="0 0 960 495" role="img" aria-labelledby="title desc">
<title id="title">多头注意力的形状变化</title><desc id="desc">输入 x 的形状是 B、T、D；线性层算出 Q、K、V；把最后一维切成 H 份并转置成 B、H、T、D/H；每个头各做一次因果注意力；再转置、reshape 拼回 B、T、D，最后经过输出投影。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="495" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">多头注意力的形状变化：拆开、各算各的、再拼回去</text><rect x="140" y="64" width="420" height="44" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="350" y="92" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">x</text><text x="700" y="92" font-size="17" fill="#64748b" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[B, T, D]</text><rect x="140" y="120" width="420" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="350" y="148" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">qkv(x) 拆成 Q、K、V</text><text x="700" y="148" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle">各 [B, T, D]</text><path d="M350 108L350 118" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="140" y="176" width="420" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="350" y="204" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">view：最后一维切成 H 份</text><text x="700" y="204" font-size="17" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[B, T, H, D/H]</text><path d="M350 164L350 174" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="140" y="232" width="420" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="350" y="260" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">transpose(1, 2)：头提到前面</text><text x="700" y="260" font-size="17" fill="#b45309" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[B, H, T, D/H]</text><path d="M350 220L350 230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="140" y="288" width="420" height="44" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="350" y="316" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">每个头各做一次因果注意力</text><text x="700" y="316" font-size="17" fill="#0f766e" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[B, H, T, D/H]</text><path d="M350 276L350 286" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="140" y="344" width="420" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="350" y="372" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">transpose 回来再 reshape</text><text x="700" y="372" font-size="17" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[B, T, D]</text><path d="M350 332L350 342" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><rect x="140" y="400" width="420" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="350" y="428" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">proj：各头结果混合一次</text><text x="700" y="428" font-size="17" fill="#7c3aed" font-weight="bold" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>[B, T, D]</text><path d="M350 388L350 398" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-64748b)"/><text x="480" y="470" font-size="14.5" fill="#64748b" font-weight="normal" text-anchor="middle">D = 8、H = 2 时：每个头只看 4 维，两个头可以各自关注不同的关系，计算量和一个 8 维的头相同。</text></g></svg>
