<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">模型参数里的知识与上下文中的资料</title><desc id="desc">左：训练时模型在截止某天的语料上反复练习预测下一个 token，规律被压缩进参数后冻结。右：使用时 Agent 先根据问题去搜索、读文件、调用工具或翻记忆，把资料和问题一起放进上下文，同一个参数不变的模型再逐个 token 生成回答。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="510" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">模型的“知识”在训练时就定格了；Agent 让它每次回答前先去查</text><rect x="30" y="70" width="360" height="380" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><text x="210" y="98" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">训练（只做一次，代价很大）</text><rect x="70" y="120" width="280" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="210" y="148" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">海量语料</text><text x="210" y="170" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">截止到某一天</text><path d="M210 180L210 210" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><rect x="70" y="214" width="280" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="210" y="242" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">反复练习：预测下一个 token</text><text x="210" y="264" font-size="13.5" fill="#2563eb" font-weight="normal" text-anchor="middle">第 1 章那个训练循环</text><path d="M210 274L210 304" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><rect x="70" y="308" width="280" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="210" y="338" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">参数（权重）</text><text x="210" y="362" font-size="13.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">语料里的规律被压缩进来，随后冻结</text><text x="210" y="425" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">之后发生的事、你的私人资料，它都没见过</text><rect x="430" y="70" width="500" height="380" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="680" y="98" font-size="17" fill="#172033" font-weight="bold" text-anchor="middle">使用（每次提问都重新来一遍）</text><rect x="455" y="120" width="140" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="525" y="155" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">你的问题</text><rect x="615" y="120" width="290" height="60" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="760" y="146" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">Agent 去查</text><text x="760" y="168" font-size="13.5" fill="#0f766e" font-weight="normal" text-anchor="middle">搜索 · 读文件 · 调工具 · 翻记忆</text><path d="M525 180 V214" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><path d="M760 180 C760 200 720 200 700 212" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><rect x="455" y="216" width="450" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="680" y="244" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">上下文：问题 + 查到的资料</text><text x="680" y="266" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">模型这一次能“看到”的全部文字</text><path d="M680 276L680 304" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><rect x="455" y="308" width="450" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="680" y="338" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">同一个模型，参数不变</text><text x="680" y="362" font-size="13.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">照旧一个 token 一个 token 往下接</text><path d="M350 343 H451" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow-7c3aed)"/><text x="400" y="335" font-size="12.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">拿来用</text><text x="680" y="425" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">资料越准、越相关，接出来的回答越可靠</text><text x="480" y="485" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">让模型更“懂”有两条路：改参数（重新训练、微调），或改上下文（检索、工具、记忆）。后者立刻生效，代价也小得多。</text></g></svg>
