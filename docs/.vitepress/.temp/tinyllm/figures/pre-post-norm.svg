<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">Pre-Norm 与 Post-Norm 的数据流</title><desc id="desc">左：Pre-Norm 先归一化再进入子层，残差直通路径不经过归一化；右：Post-Norm 先相加再归一化，直通路径也要经过归一化。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="490" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="24" fill="#172033" font-weight="bold" text-anchor="middle">同样三个零件，只是“归一化放在哪里”不同</text><text x="255" y="86" font-size="21" fill="#0f766e" font-weight="bold" text-anchor="middle">Pre-Norm（TinyLLM 采用）</text><text x="255" y="122" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">x</text><path d="M255 130L255 160" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="175" y="162" width="160" height="46" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="255" y="192" font-size="20" fill="#0f766e" font-weight="bold" text-anchor="middle">Norm</text><path d="M255 208L255 236" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="175" y="238" width="160" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="268" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">子层 F</text><path d="M255 284L255 318" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><circle cx="255" cy="338" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="255" y="346" font-size="24" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M255 140 H105 V338 H235" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow-0f766e)"/><text x="95" y="250" font-size="17" fill="#0f766e" font-weight="normal" text-anchor="end">直通路径</text><path d="M255 356L255 392" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><text x="255" y="418" font-size="20" fill="#172033" font-weight="bold" text-anchor="middle">输出 = x + F(Norm(x))</text><text x="255" y="452" font-size="17" fill="#0f766e" font-weight="normal" text-anchor="middle">直通路径上什么也没有，梯度可直达</text><text x="705" y="86" font-size="21" fill="#b45309" font-weight="bold" text-anchor="middle">Post-Norm（原始 Transformer）</text><text x="705" y="122" font-size="22" fill="#172033" font-weight="bold" text-anchor="middle">x</text><path d="M705 130L705 236" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="625" y="238" width="160" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="705" y="268" font-size="20" fill="#172033" font-weight="normal" text-anchor="middle">子层 F</text><path d="M705 284L705 318" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><circle cx="705" cy="338" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><text x="705" y="346" font-size="24" fill="#172033" font-weight="bold" text-anchor="middle">+</text><path d="M705 160 H555 V338 H685" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow-64748b)"/><path d="M705 356L705 374" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow-64748b)"/><rect x="625" y="376" width="160" height="46" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="705" y="406" font-size="20" fill="#b45309" font-weight="bold" text-anchor="middle">Norm</text><text x="705" y="452" font-size="17" fill="#b45309" font-weight="normal" text-anchor="middle">输出 = Norm(x + F(x))：直通路径也要穿过 Norm</text><line x1="480" y1="70" x2="480" y2="470" stroke="#e2e8f0" stroke-width="2"/></g></svg>
