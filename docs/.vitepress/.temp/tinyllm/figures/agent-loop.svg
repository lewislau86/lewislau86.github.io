<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Agent 循环</title><desc id="desc">上下文交给模型，模型预测出一段描述下一步动作的文字，例如读取某个文件；Agent 真的执行这个动作，把文件内容、搜索结果或报错信息追加进上下文；模型读到新资料后判断是否足够，够了就写最终回答，不够就再转一圈。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="520" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="40" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">Agent 循环：模型写下“下一步做什么”，Agent 去做，再把结果写回上下文</text><rect x="330" y="80" width="300" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480" y="110" font-size="18" fill="#172033" font-weight="bold" text-anchor="middle">上下文</text><text x="480" y="136" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">问题 + 之前每一轮的</text><text x="480" y="158" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">动作和结果，越积越多</text><rect x="660" y="230" width="270" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="795" y="262" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">模型：预测下一个 token</text><text x="795" y="286" font-size="13.5" fill="#7c3aed" font-weight="normal" text-anchor="middle">写出一段文字，例如</text><text x="795" y="306" font-size="13" fill="#7c3aed" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>read_file(&quot;test.log&quot;)</text><rect x="330" y="370" width="300" height="90" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="402" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">Agent：真的去执行</text><text x="480" y="426" font-size="13.5" fill="#0f766e" font-weight="normal" text-anchor="middle">读文件 · 搜索 · 运行代码 · 查数据库</text><rect x="30" y="230" width="270" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="165" y="262" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">执行结果</text><text x="165" y="286" font-size="13.5" fill="#2563eb" font-weight="normal" text-anchor="middle">文件内容、搜索结果、报错信息</text><text x="165" y="306" font-size="13.5" fill="#2563eb" font-weight="normal" text-anchor="middle">原样追加进上下文</text><path d="M632 140 C760 140 795 170 795 226" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-b45309)"/><path d="M795 322 C795 400 700 415 634 415" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow-7c3aed)"/><path d="M328 415 C200 415 165 380 165 324" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M165 228 C165 170 220 140 326 140" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-2563eb)"/><text x="728" y="128" font-size="18" fill="#b45309" font-weight="bold" text-anchor="middle">①</text><text x="818" y="405" font-size="18" fill="#7c3aed" font-weight="bold" text-anchor="middle">②</text><text x="232" y="438" font-size="18" fill="#0f766e" font-weight="bold" text-anchor="middle">③</text><text x="142" y="178" font-size="18" fill="#2563eb" font-weight="bold" text-anchor="middle">④</text><rect x="390" y="205" width="180" height="130" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><text x="480" y="240" font-size="15" fill="#172033" font-weight="bold" text-anchor="middle">模型判断</text><text x="480" y="262" font-size="14" fill="#64748b" font-weight="normal" text-anchor="middle">资料够了吗？</text><text x="480" y="292" font-size="14" fill="#0f766e" font-weight="normal" text-anchor="middle">够了 → 写最终回答</text><text x="480" y="314" font-size="14" fill="#b45309" font-weight="normal" text-anchor="middle">不够 → 再转一圈</text><text x="480" y="495" font-size="15" fill="#64748b" font-weight="normal" text-anchor="middle">模型自始至终只会预测下一个 token；“会查资料、会一步步做事”的能力，来自 Agent 把这个循环跑起来。</text></g></svg>
