<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">快速体验的八步流程</title><desc id="desc">上排是前向：文字“床前明月光”经①分词变成 5 个编号，②查词嵌入表得到 (1,5,96) 的向量，④加上位置向量，③经过 3 层带因果掩码的注意力 Block，输出层给词表里 1458 个字各打一个分。下排从右往左：⑤用交叉熵和正确答案比，随机参数下是 7.70，乱猜水位 7.29；⑥反向传播给 24 个参数张量算出梯度；AdamW 更新参数后同一批数据的损失降到 7.04。⑦换一批数据绕回开头，共重复 1000 步，训练损失降到 0.27，验证损失在第 100 步最低 6.32 后升到 8.78。⑧训练完后，按最后一个位置的分数抽一个字接回文字末尾，重复 40 次写出诗句。</desc>
<defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrow-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-172033" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
<rect width="960" height="530" rx="16" fill="#f8fafc"/>
<g font-family='"Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif' fill="#172033" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#172033" font-weight="bold" text-anchor="middle">八步在同一条链路上：前向算出损失，反向更新参数，重复之后拿来写诗</text><rect x="327" y="108" width="610" height="124" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><rect x="35" y="120" width="130" height="100" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="100.0" y="162" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">文字</text><text x="100.0" y="190" font-size="15" fill="#172033" font-weight="normal" text-anchor="middle">“床前明月光”</text><rect x="187" y="120" width="130" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="252.0" y="150" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">① 分词</text><text x="252.0" y="176" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">每个字一个编号</text><text x="252.0" y="202" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>(1, 5)</text><rect x="339" y="120" width="130" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="404.0" y="150" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">② 词嵌入</text><text x="404.0" y="176" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">编号当行号查表</text><text x="404.0" y="202" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>(1, 5, 96)</text><rect x="491" y="120" width="130" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="556.0" y="150" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">④ 加位置</text><text x="556.0" y="176" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">每个位置一行向量</text><text x="556.0" y="202" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>+ (5, 96)</text><rect x="643" y="120" width="130" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="708.0" y="150" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">③ 注意力</text><text x="708.0" y="176" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">因果掩码只看左边</text><text x="708.0" y="202" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle">3 层 Block</text><rect x="795" y="120" width="130" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="860.0" y="150" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">输出层</text><text x="860.0" y="176" font-size="13" fill="#2563eb" font-weight="normal" text-anchor="middle">给每个字打分</text><text x="860.0" y="202" font-size="14" fill="#2563eb" font-weight="normal" text-anchor="middle" font-family='"Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace'>(1, 5, 1458)</text><path d="M167 170.0L184 170.0" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M319 170.0L336 170.0" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M471 170.0L488 170.0" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M623 170.0L640 170.0" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><path d="M775 170.0L792 170.0" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-64748b)"/><text x="632" y="254" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">虚线框里是被训练的参数，共 474,720 个</text><rect x="755" y="330" width="170" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="840.0" y="360" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">⑤ 损失</text><text x="840.0" y="386" font-size="13.5" fill="#b45309" font-weight="normal" text-anchor="middle">交叉熵 7.70</text><text x="840.0" y="410" font-size="13" fill="#b45309" font-weight="normal" text-anchor="middle">乱猜水位 ln 1458 = 7.29</text><rect x="560" y="330" width="170" height="100" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="645.0" y="360" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">⑥ 反向传播</text><text x="645.0" y="386" font-size="13.5" fill="#b91c1c" font-weight="normal" text-anchor="middle">backward() 算梯度</text><text x="645.0" y="410" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">24 个张量，总范数 3.6</text><rect x="365" y="330" width="170" height="100" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="450.0" y="360" font-size="16" fill="#172033" font-weight="bold" text-anchor="middle">更新参数</text><text x="450.0" y="386" font-size="13.5" fill="#0f766e" font-weight="normal" text-anchor="middle">AdamW 挪一小步</text><text x="450.0" y="410" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="middle">同一批数据：7.70 → 7.04</text><path d="M860 222L860 327" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-b45309)"/><text x="848" y="290" font-size="13" fill="#b45309" font-weight="normal" text-anchor="end">和正确答案比</text><path d="M753 380.0L733 380.0" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arrow-b91c1c)"/><path d="M558 380.0L538 380.0" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><path d="M450 328L450 238" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)" stroke-dasharray="7 5"/><text x="462" y="300" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="start">改参数</text><path d="M363 380.0L130 380.0C100 380.0 100 360.0 100 340.0L100 223" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-0f766e)"/><text x="235" y="348.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="middle">⑦ 换一批诗句再走一遍</text><text x="235" y="404.0" font-size="13.5" fill="#0f766e" font-weight="normal" text-anchor="middle">共 1000 步</text><path d="M860 118C860 52 100 52 100 117" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow-7c3aed)" stroke-dasharray="7 5"/><text x="480" y="94" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">⑧ 训练完：按最后一个位置的分数抽一个字，接到文字末尾，重复 40 次</text><text x="480" y="478" font-size="14.5" fill="#172033" font-weight="normal" text-anchor="middle">⑦ 跑完：训练损失 7.33 → 0.27；验证损失第 100 步最低 6.32，之后升到 8.78——模型从“学”变成了“背”。</text><text x="480" y="506" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">圆圈编号是本页的步骤号；④ 画在 ③ 前面，是因为数据先加上位置、再进注意力。</text></g></svg>
