name: Check R10 system prompts experiment

on:
  push:
    branches: [master]
    paths: &paths
      - "docs/learn-agent-rust/system-prompts.md"
      - "docs/public/learn-agent-rust/code/system-prompts/**"
      - "docs/public/learn-agent-rust/outputs/r10-*"
      - "docs/public/learn-agent-rust/system-prompts.zip"
      - "docs/public/learn-agent-rust/figures/r10-*"
      - "scripts/data/learn-agent-rust/r10-results.json"
      - "scripts/verify-agent-prompts.py"
      - "scripts/learn-agent-rust-prompt-figures.py"
      - "scripts/learn_agent_rust_adk.py"
      - "scripts/fetch-adk-rust.py"
      - "scripts/learn-agent-rust-adk.json"
      - "scripts/snippets/adk-trace.rs"
      - ".github/workflows/check-agent-prompts.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the course toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/adk-rust
          key: agent-adk-prompts-${{ runner.os }}-${{ hashFiles('scripts/learn-agent-rust-adk.json', 'docs/public/learn-agent-rust/code/system-prompts/Cargo.lock') }}
      - name: Fetch the pinned ADK-Rust 3.0 source
        run: python3 scripts/fetch-adk-rust.py .cache/adk-rust
      - name: Verify scenarios, tests and the extracted archive
        run: python3 scripts/verify-agent-prompts.py --check
      - name: Check generated figures
        run: |
          python3 scripts/generate-learn-agent-rust-figures.py --lesson R10
          git diff --exit-code -- 'docs/public/learn-agent-rust/figures/r10-*.svg'
