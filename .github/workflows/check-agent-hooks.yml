name: Check R04 hook experiment

on:
  push:
    branches: [master]
    paths: &paths
      - "docs/learn-agent-rust/hooks.md"
      - "docs/public/learn-agent-rust/code/hooks/**"
      - "docs/public/learn-agent-rust/outputs/r04-*.txt"
      - "docs/public/learn-agent-rust/figures/r04-*.svg"
      - "docs/public/learn-agent-rust/hooks.zip"
      - "scripts/data/learn-agent-rust/r04-results.json"
      - "scripts/verify-agent-hooks.py"
      - "scripts/learn-agent-rust-hooks-figures.py"
      - "scripts/generate-learn-agent-rust-figures.py"
      - "scripts/learn_agent_rust_adk.py"
      - "scripts/fetch-adk-rust.py"
      - "scripts/learn-agent-rust-adk.json"
      - "scripts/snippets/adk-trace.rs"
      - ".github/workflows/check-agent-hooks.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the course toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/adk-rust
          key: agent-adk-hooks-${{ runner.os }}-${{ hashFiles('scripts/learn-agent-rust-adk.json', 'docs/public/learn-agent-rust/code/hooks/Cargo.lock') }}
      - name: Fetch the pinned ADK-Rust 3.0 source
        run: python3 scripts/fetch-adk-rust.py .cache/adk-rust
      - name: Verify callbacks, plugin order and extracted download
        run: python3 scripts/verify-agent-hooks.py --check
      - name: Check generated figures
        run: |
          python3 scripts/generate-learn-agent-rust-figures.py --lesson R04
          git diff --exit-code -- 'docs/public/learn-agent-rust/figures/r04-*.svg'
