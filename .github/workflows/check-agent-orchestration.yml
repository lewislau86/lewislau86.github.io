name: Check Agent graph orchestration

on:
  push:
    branches: [master]
    paths: &paths
      - 'docs/learn-agent-rust/**'
      - 'docs/public/learn-agent-rust/code/graph-*/**'
      - 'docs/public/learn-agent-rust/graph-*.zip'
      - 'docs/public/learn-agent-rust/outputs/g0*-*'
      - 'docs/public/learn-agent-rust/figures/g0*-*'
      - 'docs/public/learn-agent-rust/figures/graph-orchestration-layers.svg'
      - 'scripts/verify-agent-orchestration.py'
      - 'scripts/learn-agent-rust-orchestration-figures.py'
      - 'scripts/generate-learn-agent-rust-figures.py'
      - 'scripts/data/learn-agent-rust/g0*-results.json'
      - 'scripts/learn-agent-rust-lessons.json'
      - 'scripts/sync-learn-agent-rust-course.py'
      - 'scripts/review-learn-agent-rust.py'
      - '.github/workflows/check-agent-orchestration.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Verify real graph-flow labs and independently extracted packages
        run: python3 scripts/verify-agent-orchestration.py --check
      - name: Check navigation and teaching structure
        run: |
          python3 scripts/sync-learn-agent-rust-course.py --check
          python3 scripts/review-learn-agent-rust.py --check
      - name: Check generated figures
        run: |
          python3 scripts/generate-learn-agent-rust-figures.py --lesson G01
          git diff --exit-code -- 'docs/public/learn-agent-rust/figures/g0*.svg' 'docs/public/learn-agent-rust/figures/graph-orchestration-layers.svg'
