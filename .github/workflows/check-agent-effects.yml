name: Check P02 external side effects experiment

on:
  push:
    branches: [master]
    paths: &paths
      - "docs/learn-agent-rust/side-effect-reliability.md"
      - "docs/public/learn-agent-rust/code/side-effect-reliability/**"
      - "docs/public/learn-agent-rust/outputs/p02-*.txt"
      - "docs/public/learn-agent-rust/outputs/p02adk-*.txt"
      - "docs/public/learn-agent-rust/side-effect-reliability.zip"
      - "scripts/data/learn-agent-rust/p02-results.json"
      - "scripts/data/learn-agent-rust/p02adk-results.json"
      - "scripts/verify-agent-effects.py"
      - "scripts/verify-agent-effects-adk.py"
      - "scripts/learn_agent_rust_adk.py"
      - "scripts/fetch-adk-rust.py"
      - "scripts/learn-agent-rust-adk.json"
      - "scripts/snippets/adk-trace.rs"
      - ".github/workflows/check-agent-effects.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the course toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/adk-rust
          key: agent-adk-effects-${{ runner.os }}-${{ hashFiles('scripts/learn-agent-rust-adk.json', 'docs/public/learn-agent-rust/code/side-effect-reliability/**/Cargo.lock') }}
      - name: Fetch the pinned ADK-Rust 3.0 source
        run: python3 scripts/fetch-adk-rust.py .cache/adk-rust
      - name: Check effects, recovery windows, the ADK version and final archive
        run: python scripts/verify-agent-effects.py --check
