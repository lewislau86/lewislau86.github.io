name: Check tutorial code

# 网站能构建，不代表教程代码能复现。这个工作流和部署分开运行：
# - outputs：几秒钟，检查 notebook 是否和章节脚本一致、正文引用的输出是否出现在 notebook 里；
# - scripts：完整运行所有 TinyLLM 章节脚本（含小模型训练），大约十几分钟。
on:
  push:
    branches: [master]
    paths:
      - "docs/public/tinyllm/**"
      - "docs/tinyllm/**"
      - "scripts/**"
      - ".github/workflows/check-code.yml"
  pull_request:
    paths:
      - "docs/public/tinyllm/**"
      - "docs/tinyllm/**"
      - "scripts/**"
  schedule:
    - cron: "0 3 * * 1"   # 每周一跑一次，及早发现依赖升级带来的变化
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Notebook 与脚本一致，正文引用的输出都能在 notebook 里找到
        run: python scripts/check-tinyllm-outputs.py

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装依赖（CPU 版 PyTorch）
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers plotly
      - name: 从头运行每一章的脚本
        run: python scripts/build-tinyllm-code.py --check
