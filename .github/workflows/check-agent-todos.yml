name: Check R05 session todo experiment

on:
  push:
    branches: [master]
    paths:
      - "docs/learn-agent-rust/todo-planning.md"
      - "docs/public/learn-agent-rust/code/todo-planning/**"
      - "docs/public/learn-agent-rust/outputs/r05-*"
      - "docs/public/learn-agent-rust/todo-planning.zip"
      - "scripts/data/learn-agent-rust/r05-results.json"
      - "scripts/verify-learn-agent-rust-r05.py"
      - ".github/workflows/check-agent-todos.yml"
  pull_request:
    paths:
      - "docs/learn-agent-rust/todo-planning.md"
      - "docs/public/learn-agent-rust/code/todo-planning/**"
      - "docs/public/learn-agent-rust/outputs/r05-*"
      - "docs/public/learn-agent-rust/todo-planning.zip"
      - "scripts/data/learn-agent-rust/r05-results.json"
      - "scripts/verify-learn-agent-rust-r05.py"
      - ".github/workflows/check-agent-todos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  todos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify scenarios and tests from the published archive
        run: python scripts/verify-learn-agent-rust-r05.py --check
