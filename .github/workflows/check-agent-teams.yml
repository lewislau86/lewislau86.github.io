name: Check R15 agent teams experiment

on:
  push:
    branches: [master]
    paths:
      - "docs/learn-agent-rust/agent-teams.md"
      - "docs/public/learn-agent-rust/code/agent-teams/**"
      - "docs/public/learn-agent-rust/outputs/r15-*.txt"
      - "docs/public/learn-agent-rust/agent-teams.zip"
      - "scripts/data/learn-agent-rust/r15-results.json"
      - "scripts/verify-agent-teams.py"
      - "scripts/learn-agent-rust-teams-figures.py"
      - ".github/workflows/check-agent-teams.yml"
  pull_request:
    paths:
      - "docs/learn-agent-rust/agent-teams.md"
      - "docs/public/learn-agent-rust/code/agent-teams/**"
      - "docs/public/learn-agent-rust/outputs/r15-*.txt"
      - "docs/public/learn-agent-rust/agent-teams.zip"
      - "scripts/data/learn-agent-rust/r15-results.json"
      - "scripts/verify-agent-teams.py"
      - "scripts/learn-agent-rust-teams-figures.py"
      - ".github/workflows/check-agent-teams.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Install the course toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check scenarios, tests, Clippy and final download
        run: python scripts/verify-agent-teams.py --check
