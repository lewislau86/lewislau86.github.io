name: Check Agent retrieval and knowledge guide

on:
  push:
    branches: [master]
    paths: &paths
      - 'docs/learn-agent-rust/**'
      - 'docs/public/learn-agent-rust/code/retrieval-augmented-generation/**'
      - 'docs/public/learn-agent-rust/retrieval-augmented-generation.zip'
      - 'docs/public/learn-agent-rust/outputs/k01-*'
      - 'docs/public/learn-agent-rust/figures/k01-*'
      - 'docs/public/learn-agent-rust/figures/knowledge-capability-roles.svg'
      - 'scripts/verify-agent-rag.py'
      - 'scripts/learn-agent-rust-rag-figures.py'
      - 'scripts/generate-learn-agent-rust-figures.py'
      - 'scripts/data/learn-agent-rust/k01-results.json'
      - 'scripts/learn-agent-rust-lessons.json'
      - 'scripts/sync-learn-agent-rust-course.py'
      - '.github/workflows/check-agent-rag.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Verify source, fault paths and extracted learning package
        run: python3 scripts/verify-agent-rag.py --check
      - name: Check navigation and teaching structure
        run: |
          python3 scripts/sync-learn-agent-rust-course.py --check
          python3 scripts/review-learn-agent-rust.py --check
      - name: Check generated figures
        run: |
          python3 scripts/generate-learn-agent-rust-figures.py --lesson K01
          git diff --exit-code -- 'docs/public/learn-agent-rust/figures/k01-*.svg' 'docs/public/learn-agent-rust/figures/knowledge-capability-roles.svg'
