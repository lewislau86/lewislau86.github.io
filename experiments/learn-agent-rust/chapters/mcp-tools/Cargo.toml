[package]
name = "learn-agent-r19"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
