[package]
name = "learn-agent-p02-adk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adk-agent = { version = "3.0.0", default-features = false }
adk-core = { version = "3.0.0", default-features = false }
adk-model = { version = "3.0.0", default-features = false }
adk-runner = { version = "3.0.0", default-features = false }
adk-session = { version = "3.0.0", default-features = false, features = ["sqlite"] }
adk-tool = { version = "3.0.0", default-features = false }
futures = "0.3"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt"] }
