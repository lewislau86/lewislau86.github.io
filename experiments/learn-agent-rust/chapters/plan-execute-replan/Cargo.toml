[package]
name = "plan-execute-replan"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adk-agent = { version = "3.0.0", default-features = false }
adk-core = { version = "3.0.0", default-features = false }
adk-harness = { version = "3.0.0", default-features = false, features = ["runner"] }
adk-runner = { version = "3.0.0", default-features = false }
adk-session = { version = "3.0.0", default-features = false }
adk-tool = { version = "3.0.0", default-features = false }
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
