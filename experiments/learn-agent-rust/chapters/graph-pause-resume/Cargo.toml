[package]
name = "graph-resume-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adk-core = { version = "3.0.0", default-features = false }
adk-graph = { version = "3.0.0", default-features = false, features = ["sqlite"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
